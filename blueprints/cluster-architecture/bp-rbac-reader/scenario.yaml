id: bp-rbac-reader
title: Read-only ServiceAccount
domain: cluster-architecture
difficulty: 1
estimatedMinutes: 5
points: 5
tags: [rbac, serviceaccount, role, auth-can-i]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 10
variables:
  NS: { oneOf: [monitoring, audit, support] }
  SA: { oneOf: [viewer, auditor, observer] }
  RESOURCE: { oneOf: [pods, configmaps, services] }
setup:
  - node: controlplane
    run: kubectl create namespace ${NS}
checks:
  - id: can-read
    description: ${SA} can get, list and watch ${RESOURCE} in ${NS}
    type: kubectl
    run: for v in get list watch; do kubectl auth can-i $v ${RESOURCE} -n ${NS} --as=system:serviceaccount:${NS}:${SA}; done | tr '\n' ' '
    expect: { equals: "yes yes yes" }
    weight: 2
  - id: cannot-write
    description: ${SA} cannot create or delete ${RESOURCE}
    type: kubectl
    run: for v in create delete; do kubectl auth can-i $v ${RESOURCE} -n ${NS} --as=system:serviceaccount:${NS}:${SA}; done | tr '\n' ' '
    expect: { equals: "no no" }
    weight: 1
  - id: namespaced
    description: ${SA} cannot read ${RESOURCE} in other namespaces
    type: kubectl
    run: kubectl auth can-i list ${RESOURCE} -n default --as=system:serviceaccount:${NS}:${SA}
    expect: { equals: "no" }
    weight: 1
  - id: no-secrets
    description: ${SA} cannot read secrets
    type: kubectl
    run: kubectl auth can-i get secrets -n ${NS} --as=system:serviceaccount:${NS}:${SA}
    expect: { equals: "no" }
    weight: 1
hints:
  - "You need a ServiceAccount, a Role and a RoleBinding in ${NS}."
  - "kubectl -n ${NS} create role ${SA}-role --verb=get,list,watch --resource=${RESOURCE}"
  - "kubectl -n ${NS} create rolebinding ${SA}-binding --role=${SA}-role --serviceaccount=${NS}:${SA}"
