id: etcd-backup
title: Back up etcd with etcdctl
summary: Read etcd's endpoint and certificates from its manifest, check its health, take a snapshot and inspect it.
topic: etcd
estimatedMinutes: 6
setup:
  - node: controlplane
    run: install -d -m 755 /opt/backups && rm -f /opt/backups/etcd-snapshot.db
steps:
  - id: find-flags
    title: Find etcd's client URL and certificates
    explain: |
      etcd is a static Pod. Its manifest has the client URL (`--listen-client-urls` or `--advertise-client-urls`) and the files etcdctl needs: `--trusted-ca-file` (for `--cacert`), `--cert-file` (`--cert`) and `--key-file` (`--key`).
    command: sudo grep -E 'client-urls|cert-file|key-file|trusted-ca-file' /etc/kubernetes/manifests/etcd.yaml
    match: '^(grep|egrep|cat|less|more|head|vi|vim|view)\b.*etcd\.yaml|^kubectl\b.*etcd-controlplane'
  - id: health
    title: Check that etcdctl can reach etcd
    explain: |
      Every etcdctl call against a kubeadm etcd needs the endpoint and the three TLS flags. The keys are readable by root only, hence `sudo`. A health check first proves the flags are right.
    command: sudo ETCDCTL_API=3 etcdctl --endpoints=https://127.0.0.1:2379 --cacert=/etc/kubernetes/pki/etcd/ca.crt --cert=/etc/kubernetes/pki/etcd/server.crt --key=/etc/kubernetes/pki/etcd/server.key endpoint health
    match: '^etcdctl\b.*endpoint (health|status)\b'
  - id: save
    title: Take a snapshot to /opt/backups/etcd-snapshot.db
    explain: |
      `snapshot save <file>` streams the whole key space into one file. Same flags as the health check.
    command: sudo ETCDCTL_API=3 etcdctl --endpoints=https://127.0.0.1:2379 --cacert=/etc/kubernetes/pki/etcd/ca.crt --cert=/etc/kubernetes/pki/etcd/server.crt --key=/etc/kubernetes/pki/etcd/server.key snapshot save /opt/backups/etcd-snapshot.db
    match: '^etcdctl\b.*snapshot save\s+/opt/backups/etcd-snapshot\.db'
    check:
      id: snapshot-valid
      description: /opt/backups/etcd-snapshot.db is a valid etcd snapshot
      type: ssh
      node: controlplane
      run: ETCDCTL_API=3 etcdctl snapshot status /opt/backups/etcd-snapshot.db -w json 2>/dev/null | jq -r '.totalKey > 0'
      expect: { equals: 'true' }
  - id: status
    title: Inspect the snapshot
    explain: |
      `snapshot status` reads the file only, so it needs no endpoint or certificates. `-w table` shows the hash, revision, key count and size.
    command: sudo ETCDCTL_API=3 etcdctl snapshot status /opt/backups/etcd-snapshot.db -w table
    match: '^etcdctl\b.*snapshot status\s+/opt/backups/etcd-snapshot\.db'
