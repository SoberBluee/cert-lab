id: etcd-restore
title: Restore etcd from a snapshot
summary: Take a snapshot, change the cluster, restore the snapshot into a new data directory, point the etcd static Pod at it and restart the API server.
topic: etcd
estimatedMinutes: 12
setup:
  - node: controlplane
    run: |
      install -d -m 755 /opt/backups
      rm -rf /opt/backups/before.db /var/lib/etcd-restore
      command -v etcdutl >/dev/null || install -m 755 "/proc/$(pgrep -xo etcd)/root/usr/local/bin/etcdutl" /usr/local/bin/etcdutl
      kubectl delete deployment after-backup --ignore-not-found
steps:
  - id: save
    title: Take a snapshot to /opt/backups/before.db
    explain: |
      The endpoint and TLS flags come from `/etc/kubernetes/manifests/etcd.yaml`.
    command: sudo ETCDCTL_API=3 etcdctl --endpoints=https://127.0.0.1:2379 --cacert=/etc/kubernetes/pki/etcd/ca.crt --cert=/etc/kubernetes/pki/etcd/server.crt --key=/etc/kubernetes/pki/etcd/server.key snapshot save /opt/backups/before.db
    match: '^etcdctl\b.*snapshot save\s+/opt/backups/before\.db'
    check:
      id: snapshot-valid
      description: /opt/backups/before.db is a valid etcd snapshot
      type: ssh
      node: controlplane
      run: ETCDCTL_API=3 etcdctl snapshot status /opt/backups/before.db -w json 2>/dev/null | jq -r '.totalKey > 0'
      expect: { equals: 'true' }
  - id: change
    title: Change the cluster after the backup
    explain: |
      This Deployment is not in the snapshot, so it disappears once the snapshot is restored.
    command: kubectl create deployment after-backup --image=nginx
    match: '^kubectl create deploy(ment)?\s+after-backup\b'
  - id: restore
    title: Restore the snapshot into a new data directory
    explain: |
      `etcdutl snapshot restore` writes a fresh etcd data directory from the file. It never touches the running etcd, and `--data-dir` must not exist yet. It reads the file only, so no endpoint or certificates are needed.

      Use `etcdutl`, not `etcdctl`: restoring with `etcdctl` is deprecated, and on this cluster the node's older etcdctl writes a directory that etcd cannot start from.
    command: sudo etcdutl snapshot restore /opt/backups/before.db --data-dir /var/lib/etcd-restore
    match: '^etcdutl\b(?=.*snapshot restore\s+/opt/backups/before\.db)(?=.*--data-dir[= ]/var/lib/etcd-restore/?(\s|$))'
    check:
      id: restored
      description: /var/lib/etcd-restore holds a restored etcd member
      type: ssh
      node: controlplane
      run: test -d /var/lib/etcd-restore/member && echo restored || echo missing
      expect: { equals: restored }
  - id: point-manifest
    title: Point the etcd Pod at the restored directory
    explain: |
      In `/etc/kubernetes/manifests/etcd.yaml`, change the `etcd-data` volume's `hostPath.path` from `/var/lib/etcd` to `/var/lib/etcd-restore`. The container still sees it as `/var/lib/etcd`, so `--data-dir` can stay. Editing with vim works as well as sed. The kubelet restarts etcd when the file changes.
    command: |-
      sudo sed -i 's#path: /var/lib/etcd$#path: /var/lib/etcd-restore#' /etc/kubernetes/manifests/etcd.yaml
    check:
      id: manifest-points
      description: the etcd manifest mounts /var/lib/etcd-restore
      type: ssh
      node: controlplane
      run: grep -cE 'path:\s*/var/lib/etcd-restore/?\s*$' /etc/kubernetes/manifests/etcd.yaml || true
      expect: { gte: 1 }
  - id: etcd-running
    title: Wait for etcd to run from the restored directory
    explain: |
      The kubelet replaces the etcd Pod within about 20 seconds of the file changing. `crictl` talks to the container runtime directly, so it works while `kubectl` does not. Repeat until the CREATED time of the etcd container is only seconds old.
    command: sudo crictl ps --name etcd
    match: '^crictl ps\b.*etcd'
    check:
      id: etcd-restored-dir
      description: etcd runs from /var/lib/etcd-restore
      type: ssh
      node: controlplane
      run: |-
        id=$(crictl ps -q --name '^etcd$' | head -1); [ -n "$id" ] && crictl inspect "$id" | grep -q /var/lib/etcd-restore && echo restored || echo waiting
      expect: { equals: restored }
      retrySeconds: 60
  - id: restart-apiserver
    title: Restart the API server
    explain: |
      The API server keeps an in-memory cache of what it read from etcd, and it does not notice a restore. It reconnects to the new etcd and answers again, but its lists keep showing objects that are no longer in etcd. Stopping its container makes the kubelet start a fresh one, which reads everything from the restored etcd.

      Do this after etcd runs from the restored directory: a restart before that only reloads the old data. The Kubernetes docs stop the API servers before a restore and start them afterwards, which has the same effect.
    command: sudo crictl stop $(sudo crictl ps -q --name kube-apiserver)
    match: '^crictl stop\b'
    check:
      id: apiserver-fresh
      description: kube-apiserver started after etcd
      type: ssh
      node: controlplane
      run: |-
        c() { crictl ps --name "$1" -o json | jq -r '.containers[0].createdAt // 0'; }; [ "$(c kube-apiserver)" -gt "$(c '^etcd$')" ] && echo fresh || echo stale
      expect: { equals: fresh }
      retrySeconds: 60
  - id: wait
    title: Wait for the API server to come back
    explain: |
      The new API server reads everything from etcd before it answers. `kubectl` errors for a minute or so; repeat the command until it lists the nodes. `sudo crictl ps` shows the containers meanwhile.
    command: kubectl get nodes
    match: '^kubectl get (no|node|nodes)\b'
    check:
      id: api-back
      description: the API server is ready again
      type: ssh
      node: controlplane
      run: curl -sk --max-time 5 https://127.0.0.1:6443/readyz || true
      expect: { equals: ok }
  - id: verify
    title: Confirm the cluster is back to the snapshot
    explain: |
      The Deployment created after the backup is gone. Check with a list: the API server answers lists from its cache, so without the restart this would still show `after-backup`, even though `kubectl get deployment after-backup` already says **NotFound**.
    command: kubectl get deployments
    match: '^kubectl get (deploy|deployment|deployments)\b'
    check:
      id: deployment-gone
      description: Deployment after-backup is no longer listed
      type: kubectl
      run: kubectl get deployments -o name
      expect: { notContains: after-backup }
