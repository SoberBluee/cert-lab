id: aws-rds-multi-az
title: Highly available MySQL with RDS Multi-AZ
track: aws
domain: resilient-architectures
difficulty: 2
estimatedMinutes: 15
points: 10
tags: [rds, multi-az, security-groups, db-subnet-group]
base: floci
settleSeconds: 5
variables:
  DB_ID: { oneOf: [orders-db, catalog-db, billing-db] }
setup:
  - script: setup/network.sh
tasks:
  - id: q1
    title: Network for the database
    points: 4
    checks:
      - id: q1-db-sg
        description: db-sg in data-vpc allows MySQL (3306) from app-sg and nothing else
        type: aws
        weight: 2
        run: |
          vpc=$(aws ec2 describe-vpcs --filters Name=tag:Name,Values=data-vpc --query 'Vpcs[0].VpcId' --output text)
          app=$(aws ec2 describe-security-groups --filters Name=vpc-id,Values=$vpc Name=group-name,Values=app-sg --query 'SecurityGroups[0].GroupId' --output text)
          aws ec2 describe-security-groups --filters Name=vpc-id,Values=$vpc Name=group-name,Values=db-sg \
            --query 'SecurityGroups[].IpPermissions[].[IpProtocol,FromPort,ToPort,join(`,`,UserIdGroupPairs[].GroupId),join(`,`,IpRanges[].CidrIp)]' \
            --output text | sed "s/$app/app-sg/g" | xargs
        expect: { equals: "tcp 3306 3306 app-sg" }
      - id: q1-subnet-group
        description: DB subnet group db-subnets holds db-a and db-b
        type: aws
        weight: 2
        run: |
          ids=$(aws rds describe-db-subnet-groups --db-subnet-group-name db-subnets --query 'DBSubnetGroups[0].Subnets[].SubnetIdentifier' --output text 2>&1) || { echo "$ids"; exit; }
          aws ec2 describe-subnets --subnet-ids $ids --query 'Subnets[].[Tags[?Key==`Name`]|[0].Value]' --output text | sort | xargs
        expect: { equals: "db-a db-b" }
    hints:
      - "Reference the application tier by its security group, not a CIDR: aws ec2 authorize-security-group-ingress --group-id <db-sg> --protocol tcp --port 3306 --source-group <app-sg>"
      - "aws rds create-db-subnet-group --db-subnet-group-name db-subnets --db-subnet-group-description ... --subnet-ids <db-a> <db-b>"
  - id: q2
    title: Multi-AZ MySQL instance
    points: 6
    checks:
      - id: q2-engine
        description: ${DB_ID} runs MySQL on db.t3.micro with 20 GiB
        type: aws
        run: aws rds describe-db-instances --db-instance-identifier ${DB_ID} --query 'DBInstances[0].[Engine,DBInstanceClass,AllocatedStorage]' --output text 2>&1 | xargs
        expect: { equals: "mysql db.t3.micro 20" }
      - id: q2-multi-az
        description: ${DB_ID} is a Multi-AZ deployment
        type: aws
        weight: 2
        run: aws rds describe-db-instances --db-instance-identifier ${DB_ID} --query 'DBInstances[0].MultiAZ' --output text 2>&1
        expect: { equals: "True" }
      - id: q2-private
        description: ${DB_ID} is not publicly accessible
        type: aws
        run: aws rds describe-db-instances --db-instance-identifier ${DB_ID} --query 'DBInstances[0].PubliclyAccessible' --output text 2>&1
        expect: { equals: "False" }
      - id: q2-network
        description: ${DB_ID} uses db-subnets and only db-sg
        type: aws
        weight: 2
        run: |
          sg=$(aws ec2 describe-security-groups --filters Name=group-name,Values=db-sg --query 'SecurityGroups[0].GroupId' --output text)
          aws rds describe-db-instances --db-instance-identifier ${DB_ID} \
            --query 'DBInstances[0].[DBSubnetGroup.DBSubnetGroupName,join(`,`,VpcSecurityGroups[].VpcSecurityGroupId)]' --output text 2>&1 \
            | sed "s/$sg/db-sg/g" | xargs
        expect: { equals: "db-subnets db-sg" }
    hints:
      - "--multi-az keeps a synchronous standby in a second Availability Zone; RDS fails over to it automatically."
      - "--db-subnet-group-name and --vpc-security-group-ids decide where the instance lives and who can reach it; add --no-publicly-accessible."
