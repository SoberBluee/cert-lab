id: aws-dynamodb-access-patterns
title: Model a DynamoDB table for its access patterns
track: aws
domain: high-performing-architectures
difficulty: 2
estimatedMinutes: 12
points: 10
tags: [dynamodb, gsi, on-demand, ttl, point-in-time-recovery]
base: floci
settleSeconds: 5
variables:
  TABLE: { oneOf: [orders, purchases, bookings] }
tasks:
  - id: q1
    title: Table and index
    points: 6
    checks:
      - id: q1-key
        description: ${TABLE} has the partition key orderId, a string
        type: aws
        weight: 2
        run: |
          aws dynamodb describe-table --table-name ${TABLE} \
            --query 'Table.[join(`,`,KeySchema[].join(`:`,[AttributeName,KeyType])),AttributeDefinitions[?AttributeName==`orderId`]|[0].AttributeType]' \
            --output text 2>&1 | xargs
        expect: { equals: "orderId:HASH S" }
      - id: q1-on-demand
        description: ${TABLE} uses on-demand capacity
        type: aws
        weight: 2
        run: aws dynamodb describe-table --table-name ${TABLE} --query 'Table.BillingModeSummary.BillingMode' --output text 2>&1
        expect: { equals: "PAY_PER_REQUEST" }
      - id: q1-gsi
        description: Index by-customer is keyed on customerId and createdAt and projects every attribute
        type: aws
        weight: 2
        run: |
          aws dynamodb describe-table --table-name ${TABLE} \
            --query 'Table.GlobalSecondaryIndexes[?IndexName==`by-customer`]|[0].[join(`,`,KeySchema[].join(`:`,[AttributeName,KeyType])),Projection.ProjectionType]' \
            --output text 2>&1 | xargs
        expect: { equals: "customerId:HASH,createdAt:RANGE ALL" }
    hints:
      - "Every key attribute, of the table and of its indexes, needs an --attribute-definitions entry; other attributes do not."
      - "--billing-mode PAY_PER_REQUEST, and no --provisioned-throughput."
      - "--global-secondary-indexes 'IndexName=by-customer,KeySchema=[{AttributeName=customerId,KeyType=HASH},{AttributeName=createdAt,KeyType=RANGE}],Projection={ProjectionType=ALL}'"
  - id: q2
    title: Expire old orders and allow recovery
    points: 4
    checks:
      - id: q2-ttl
        description: Items of ${TABLE} expire on the expiresAt attribute
        type: aws
        weight: 2
        run: aws dynamodb describe-time-to-live --table-name ${TABLE} --query 'TimeToLiveDescription.[TimeToLiveStatus,AttributeName]' --output text 2>&1 | xargs
        expect: { matches: "^(ENABLED|ENABLING) expiresAt$" }
      - id: q2-pitr
        description: Point-in-time recovery is on for ${TABLE}
        type: aws
        weight: 2
        run: aws dynamodb describe-continuous-backups --table-name ${TABLE} --query 'ContinuousBackupsDescription.PointInTimeRecoveryDescription.PointInTimeRecoveryStatus' --output text 2>&1
        expect: { equals: "ENABLED" }
    hints:
      - "aws dynamodb update-time-to-live --table-name ${TABLE} --time-to-live-specification Enabled=true,AttributeName=expiresAt"
      - "aws dynamodb update-continuous-backups --table-name ${TABLE} --point-in-time-recovery-specification PointInTimeRecoveryEnabled=true"
