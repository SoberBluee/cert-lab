id: quick-lab-b2ksxq
title: "Quick lab: Storage"
domain: storage
difficulty: 2
estimatedMinutes: 8
points: 5
tags: [ troubleshooting, pvc, pv, storageclass ]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 30
draft: true
variables:
  Q1_NS: { oneOf: [ files, backups, media-store, storage, volumes, data-lab, persist, blobs, objects, disk ] }
  Q1_CLAIM: { oneOf: [ archive, assets, cache-data, uploads, snapshots, media, logs-vol, db-data, scratch, shared ] }
  Q1_FAULT: { oneOf: [ storageclass-mismatch, access-mode-mismatch, claim-too-large, pv-released-claimref, pod-node-pin, pv-node-label-lost, pod-claim-name ], hidden: true }
tasks:
  - id: q1
    title: Pod ${Q1_CLAIM}-app stuck
    points: 5
    setup:
      - node: controlplane
        script: setup/q1.sh
        timeoutSeconds: 400
        lane: q1
    checks:
      - id: q1-bound
        description: PVC ${Q1_CLAIM} is Bound to ${Q1_CLAIM}-pv
        type: kubectl
        run: kubectl -n ${Q1_NS} get pvc ${Q1_CLAIM} -o jsonpath='{.status.phase}/{.spec.volumeName}'
        expect: { equals: "Bound/${Q1_CLAIM}-pv" }
        weight: 2
        retrySeconds: 30
      - id: q1-pod-running
        description: Pod ${Q1_CLAIM}-app is Running with the claim at /data
        type: kubectl
        run: kubectl -n ${Q1_NS} get pod ${Q1_CLAIM}-app -o jsonpath='{.status.phase} {.spec.volumes[*].persistentVolumeClaim.claimName} {.spec.containers[0].volumeMounts[*].mountPath}'
        expect: { matches: "^Running ${Q1_CLAIM} .*/data" }
        weight: 2
        retrySeconds: 60
      - id: q1-pv-kept
        description: PV ${Q1_CLAIM}-pv keeps its class, capacity and access mode
        type: kubectl
        run: kubectl get pv ${Q1_CLAIM}-pv -o jsonpath='{.spec.storageClassName} {.spec.capacity.storage} {.spec.accessModes[0]}'
        expect: { equals: manual 1Gi ReadWriteOnce }
        weight: 1
    hints:
      - "kubectl -n ${Q1_NS} describe pod ${Q1_CLAIM}-app: is the Pod waiting for its claim to bind, or for a node it can run on? The Events say which."
      - "kubectl -n ${Q1_NS} describe pvc ${Q1_CLAIM} and kubectl get pv ${Q1_CLAIM}-pv -o yaml: class, access modes, size and the volume's status (and any claimRef) must all fit."
      - "A bound volume can still pin its Pod: compare the volume's node affinity with where the Pod is allowed to run (kubectl get pod ${Q1_CLAIM}-app -o yaml)."
      - "Most of a claim's spec cannot be edited: delete the Pod and the claim, then create them again."
    recipe: { category: storage }
