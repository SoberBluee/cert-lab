id: quick-lab-7o2m6n
title: "Quick lab: Gateway API with TLS"
domain: services-networking
difficulty: 3
estimatedMinutes: 12
points: 6
tags: [ gateway-api, httproute, tls, ingress, migration ]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 30
draft: true
variables:
  Q1_NS: { oneOf: [ shop, store, portal, checkout, accounts, tickets, docs-site, payments, support, members ] }
tasks:
  - id: q1
    title: Migrate an Ingress to Gateway API
    points: 6
    setup:
      - node: controlplane
        script: setup/q1.sh
        lane: q1
    checks:
      - id: q1-ingress-gone
        description: Ingress shop is deleted
        type: kubectl
        run: kubectl -n ${Q1_NS} get ingress shop >/dev/null 2>&1 && echo present || echo gone
        expect: { equals: gone }
        weight: 1
      - id: q1-root
        description: https://shop.${Q1_NS}.lab/ returns the web page with the shop certificate
        type: kubectl
        run: curl -sk -m 5 --resolve shop.${Q1_NS}.lab:30443:$(getent hosts controlplane | awk '{print $1}') https://shop.${Q1_NS}.lab:30443/ | grep -q 'Welcome to nginx' && echo | openssl s_client -connect $(getent hosts controlplane | awk '{print $1}'):30443 -servername shop.${Q1_NS}.lab 2>/dev/null | openssl x509 -noout -subject 2>/dev/null | grep -q 'shop.${Q1_NS}.lab' && echo ok || echo fail
        expect: { equals: ok }
        weight: 2
        retrySeconds: 60
      - id: q1-api
        description: https://shop.${Q1_NS}.lab/api/ returns the api
        type: kubectl
        run: curl -sk -m 5 --resolve shop.${Q1_NS}.lab:30443:$(getent hosts controlplane | awk '{print $1}') https://shop.${Q1_NS}.lab:30443/api/
        expect: { contains: shop-api }
        weight: 2
        retrySeconds: 60
      - id: q1-objects
        description: Gateway shop-gw listens with HTTPS on 8443, and HTTPRoute shop is attached to it
        type: kubectl
        run: echo "$(kubectl -n ${Q1_NS} get gateway shop-gw -o jsonpath='{.spec.listeners[0].protocol} {.spec.listeners[0].port}') $(kubectl -n ${Q1_NS} get httproute shop -o jsonpath='{.spec.parentRefs[0].name}')"
        expect: { equals: HTTPS 8443 shop-gw }
        weight: 1
    hints:
      - kubectl -n <ns> get ingress shop -o yaml shows every host, path, backend and the TLS Secret to carry over.
      - An Ingress path with pathType Prefix becomes an HTTPRoute match with path type PathPrefix; TLS moves to the Gateway listener.
      - kubectl describe httproute shows whether the route is Accepted by its parent and whether its backends resolve.
    recipe: { builder: gateway, parts: [] }
