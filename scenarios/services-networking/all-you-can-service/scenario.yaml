        run: "[ ! -f /var/tmp/cka-q8.uid ] || [ \"$(kubectl -n ${Q8_NS} get deployment ${Q8_APP} -o jsonpath='{.metadata.uid}')\" = \"$(cat /var/tmp/cka-q8.uid)\" ] || { echo recreated; exit 0; }; echo \"$(kubectl -n ${Q8_NS} get deployment ${Q8_APP} -o jsonpath='{.spec.replicas} {.spec.template.spec.containers[0].image}') $([ -n \"$(kubectl -n ${Q8_NS} get deployment ${Q8_APP} -o jsonpath='{.spec.template.spec.containers[0].readinessProbe}')\" ] && echo probe || echo none)\""
        expect: { equals: 2 nginx:1.27-alpine probe }
        weight: 1
    hints:
      - "Split the path into hops and test each one from client: does the name resolve, does the Service IP answer, does a Pod IP answer? kubectl -n ${Q8_NS} get svc,endpointslices,pods -o wide gives you the addresses."
      - "kubectl -n ${Q8_NS} describe svc ${Q8_APP} and kubectl -n ${Q8_NS} get endpointslices: an empty or not-ready endpoint list sends you to the Pods; a healthy one sends you further along the path."
      - "Compare what the Service selects and forwards to with what the Pods really carry and listen on: kubectl -n ${Q8_NS} get pods --show-labels and kubectl -n ${Q8_NS} get deployment ${Q8_APP} -o yaml."
      - "When the namespace looks right, look at what sits between the client and the Pods: NetworkPolicies, and the node component that turns Service IPs into Pod IPs (kubectl -n kube-system get ds,pods)."
