id: troubleshooting-3
title: Troubleshooting 3
domain: services-networking
difficulty: 3
estimatedMinutes: 62
points: 44
tags: [ troubleshooting, service, endpoints, networkpolicy, rbac, serviceaccount, role, rolebinding, dns, coredns, ingress, gateway-api, httproute, node, kubelet, containerd, pvc, pv, storageclass ]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 60
variables:
  Q1_NS: { oneOf: [ store, edge, api ] }
  Q1_APP: { oneOf: [ web, backend, gateway ] }
  Q1_FAULT: { oneOf: [ selector-mismatch, target-port, named-port, network-policy, not-ready, selector-extra-label, service-port, service-protocol, kube-proxy-down ], hidden: true }
  Q2_NS: { oneOf: [ monitoring, audit, reports ] }
  Q2_APP: { oneOf: [ inventory, watcher, auditor ] }
  Q2_FAULT: { oneOf: [ role-verb, role-resource, binding-subject-ns, binding-role-ref, wrong-sa, automount-off ], hidden: true }
  Q3_NS: { oneOf: [ secure, payments, vault ] }
  Q3_APP: { oneOf: [ api, ledger, billing ] }
  Q3_FAULT: { oneOf: [ dns-egress-port, dns-namespace-selector, ingress-port, ingress-from-label, egress-to-label, egress-port, ingress-namespace-and, ingress-pod-selector ], hidden: true }
  Q4_NS: { oneOf: [ shop, intranet, search ] }
  Q4_FAULT: { oneOf: [ corefile-typo, scaled-to-zero, cluster-domain, kube-dns-selector, client-dns-policy, corefile-loop, coredns-rbac, kube-dns-target-port, corefile-key, coredns-image, coredns-config-volume, coredns-memory-limit ], hidden: true }
  Q5_NS: { oneOf: [ shop, media, portal ] }
  Q5_APP: { oneOf: [ web, store, blog ] }
  Q5_FAULT: { oneOf: [ ingress-service-name, ingress-service-port, ingress-class, ingress-path, route-parent, route-section, route-backend-port, ingress-host-typo, route-hostname-typo, route-parent-namespace ], hidden: true }
  Q6_NS: { oneOf: [ ops, infra, platform ] }
  Q6_FAULT: { oneOf: [ kubelet-stopped, containerd-stopped, kubelet-binary-path, cordoned, stray-taint, kubelet-config-invalid, kubelet-client-ca, kubelet-api-port, kubelet-extra-args, cni-config-removed, containerd-config-invalid ], hidden: true }
  Q6_NODE: { oneOf: [ worker-1, worker-2 ], hidden: true }
  Q7_NS: { oneOf: [ files, backups, media-store ] }
  Q7_CLAIM: { oneOf: [ archive, assets, cache-data ] }
  Q7_FAULT: { oneOf: [ storageclass-mismatch, access-mode-mismatch, claim-too-large ], hidden: true }
solution:
  - node: worker-1
    script: setup/q6-solution.sh
  - node: worker-2
    script: setup/q6-solution-2.sh
  - node: controlplane
    script: solution.sh
tasks:
  - id: q1
    title: Service ${Q1_APP} unreachable
    points: 6
    setup:
      - node: controlplane
        script: setup/q1.sh
        timeoutSeconds: 400
        lane: q1
    checks:
      - id: q1-reachable
        description: client gets the nginx page from http://${Q1_APP}
        type: kubectl
        run: kubectl -n ${Q1_NS} exec client -- wget -qO- -T 3 http://${Q1_APP}
        expect: { contains: nginx }
        weight: 3
        retrySeconds: 30
      - id: q1-endpoints
        description: Service ${Q1_APP} has 2 ready endpoints
        type: kubectl
        run: kubectl -n ${Q1_NS} get endpointslices -l kubernetes.io/service-name=${Q1_APP} -o jsonpath='{range .items[*].endpoints[*]}{.conditions.ready}{"\n"}{end}' | grep -c true
        expect: { equals: "2" }
        weight: 1
        retrySeconds: 30
      - id: q1-spec-service
        description: Service ${Q1_APP} matches the spec
        type: kubectl
        run: kubectl -n ${Q1_NS} get svc ${Q1_APP} -o jsonpath='{.spec.type} {.spec.selector.app} {.spec.ports[0].port} {.spec.ports[0].targetPort}'
        expect: { equals: "ClusterIP ${Q1_APP} 80 http" }
        weight: 1
      - id: q1-spec-deployment
        description: Deployment ${Q1_APP} matches the spec
        type: kubectl
        run: kubectl -n ${Q1_NS} get deployment ${Q1_APP} -o jsonpath='{.spec.replicas} {.spec.template.metadata.labels.app} {.spec.template.spec.containers[0].ports[0].name} {.spec.template.spec.containers[0].ports[0].containerPort}'
        expect: { equals: "2 ${Q1_APP} http 80" }
        weight: 1
    hints:
      - "kubectl -n ${Q1_NS} get svc,endpointslices,pods -o wide: does the Service have endpoints, and are they ready?"
      - Compare the Service selector and targetPort with the Pods' labels and named ports (kubectl -n ${Q1_NS} get pods --show-labels).
      - Can the client reach a Pod IP directly? kubectl -n ${Q1_NS} exec client -- wget -qO- -T 3 http://<pod-ip>
      - "kubectl -n ${Q1_NS} get networkpolicy: anything selecting the ${Q1_APP} Pods?"
  - id: q2
    title: ${Q2_APP} cannot list Pods
    points: 6
    setup:
      - node: controlplane
        script: setup/q2.sh
        timeoutSeconds: 400
        lane: q2
    checks:
      - id: q2-can-list
        description: ${Q2_APP}-sa may list Pods in ${Q2_NS}
        type: kubectl
        run: kubectl auth can-i list pods -n ${Q2_NS} --as=system:serviceaccount:${Q2_NS}:${Q2_APP}-sa
        expect: { equals: yes }
        weight: 2
      - id: q2-logs-200
        description: ${Q2_APP}'s latest call returned 200
        type: kubectl
        run: kubectl -n ${Q2_NS} logs deployment/${Q2_APP} --tail=1
        expect: { equals: "200" }
        weight: 2
        retrySeconds: 60
      - id: q2-spec
        description: ${Q2_APP} runs as ${Q2_APP}-sa, and RoleBinding ${Q2_APP}-reader grants Role ${Q2_APP}-reader to it
        type: kubectl
        run: echo "$(kubectl -n ${Q2_NS} get deployment ${Q2_APP} -o jsonpath='{.spec.template.spec.serviceAccountName}') $(kubectl -n ${Q2_NS} get rolebinding ${Q2_APP}-reader -o jsonpath='{.roleRef.kind}/{.roleRef.name} {.subjects[*].namespace}/{.subjects[*].name}')"
        expect: { equals: "${Q2_APP}-sa Role/${Q2_APP}-reader ${Q2_NS}/${Q2_APP}-sa" }
        weight: 1
      - id: q2-least-privilege
        description: ${Q2_APP}-sa cannot delete Pods or read Secrets
        type: kubectl
        run: echo "$(kubectl auth can-i delete pods -n ${Q2_NS} --as=system:serviceaccount:${Q2_NS}:${Q2_APP}-sa) $(kubectl auth can-i get secrets -n ${Q2_NS} --as=system:serviceaccount:${Q2_NS}:${Q2_APP}-sa)"
        expect: { equals: no no }
        weight: 1
    hints:
      - "kubectl -n ${Q2_NS} logs deployment/${Q2_APP}: 401, 403 or a missing token point at different problems."
      - kubectl auth can-i list pods -n ${Q2_NS} --as=system:serviceaccount:${Q2_NS}:${Q2_APP}-sa tells you whether RBAC allows the call at all.
      - "kubectl -n ${Q2_NS} get role,rolebinding -o yaml: check the verbs, the resource names, the roleRef and the subject's namespace."
      - kubectl -n ${Q2_NS} get pod -l app=${Q2_APP} -o yaml | grep -i serviceaccount, and kubectl -n ${Q2_NS} get sa ${Q2_APP}-sa -o yaml.
  - id: q3
    title: Frontend cannot reach ${Q3_APP}
    points: 7
    setup:
      - node: controlplane
        script: setup/q3.sh
        timeoutSeconds: 400
        lane: q3
    checks:
      - id: q3-reachable
        description: client gets the nginx page from http://${Q3_APP}
        type: kubectl
        run: kubectl -n ${Q3_NS} exec client -- wget -qO- -T 3 http://${Q3_APP}
        expect: { contains: nginx }
        weight: 3
        retrySeconds: 30
      - id: q3-stranger-blocked
        description: stranger still cannot reach ${Q3_APP}
        type: kubectl
        run: kubectl -n ${Q3_NS} exec stranger -- wget -qO- -T 3 http://${Q3_APP} >/dev/null 2>&1 && echo open || echo blocked
        expect: { equals: blocked }
        weight: 2
      - id: q3-default-deny
        description: default-deny still selects every Pod for ingress and egress
        type: kubectl
        run: kubectl -n ${Q3_NS} get networkpolicy default-deny -o jsonpath='{.spec.podSelector.matchLabels}|{.spec.policyTypes[*]}|{.spec.ingress}{.spec.egress}'
        expect: { equals: "|Ingress Egress|" }
        weight: 1
      - id: q3-ingress-rule
        description: ${Q3_APP}-ingress allows role=frontend on port 80
        type: kubectl
        run: kubectl -n ${Q3_NS} get networkpolicy ${Q3_APP}-ingress -o jsonpath='{.spec.ingress[0].from[0].podSelector.matchLabels.role} {.spec.ingress[0].ports[0].port}'
        expect: { equals: frontend 80 }
        weight: 1
    hints:
      - "kubectl -n ${Q3_NS} get networkpolicy, then kubectl -n ${Q3_NS} describe networkpolicy <name> for each: which Pods does it select, and what does it allow?"
      - "Separate DNS from the connection: kubectl -n ${Q3_NS} exec client -- nslookup ${Q3_APP}, then wget the Service IP or a Pod IP directly."
      - "Compare every selector with the real labels: kubectl -n ${Q3_NS} get pods --show-labels and kubectl get ns kube-system --show-labels; kubectl -n kube-system get pods -l k8s-app=kube-dns."
      - A connection needs egress allowed at the client and ingress allowed at the server. Check both sides, including the ports.
  - id: q4
    title: Name resolution broken
    points: 7
    setup:
      - node: controlplane
        script: setup/q4.sh
        timeoutSeconds: 400
    setupStage: 1
    checks:
      - id: q4-short-name
        description: client gets the nginx page from http://web
        type: kubectl
        run: kubectl -n ${Q4_NS} exec client -- wget -qO- -T 3 http://web
        expect: { contains: nginx }
        weight: 2
        retrySeconds: 60
      - id: q4-fqdn
        description: client resolves web.${Q4_NS}.svc.cluster.local to the Service IP
        type: kubectl
        run: ip=$(kubectl -n ${Q4_NS} get svc web -o jsonpath='{.spec.clusterIP}'); kubectl -n ${Q4_NS} exec client -- nslookup -type=a web.${Q4_NS}.svc.cluster.local 2>/dev/null | grep -qw "$ip" && echo resolves || echo fails
        expect: { equals: resolves }
        weight: 2
        retrySeconds: 60
      - id: q4-coredns-ready
        description: CoreDNS runs 2 ready replicas
        type: kubectl
        run: kubectl -n kube-system get deployment coredns -o jsonpath='{.status.readyReplicas}'
        expect: { equals: "2" }
        weight: 1
        retrySeconds: 60
      - id: q4-corefile
        description: The Corefile serves cluster.local and forwards to /etc/resolv.conf
        type: kubectl
        run: kubectl -n kube-system get configmap coredns -o jsonpath='{.data.Corefile}' | grep -cE 'kubernetes cluster\.local |forward \. /etc/resolv\.conf'
        expect: { equals: "2" }
        weight: 1
      - id: q4-kube-dns-service
        description: Service kube-dns selects the CoreDNS Pods
        type: kubectl
        run: kubectl -n kube-system get svc kube-dns -o jsonpath='{.spec.selector.k8s-app}'
        expect: { equals: kube-dns }
        weight: 1
    hints:
      - Is it DNS? kubectl -n ${Q4_NS} exec client -- nslookup web.${Q4_NS}.svc.cluster.local, then the same against a CoreDNS Pod IP with nslookup <name> <pod-ip>.
      - "kubectl -n kube-system get deployment,pods,svc,endpointslices -l k8s-app=kube-dns: does CoreDNS run, and does kube-dns have endpoints?"
      - kubectl -n kube-system get configmap coredns -o yaml shows the Corefile; kubectl -n kube-system logs -l k8s-app=kube-dns shows why CoreDNS will not start.
      - "kubectl -n ${Q4_NS} exec client -- cat /etc/resolv.conf: does the Pod use the cluster DNS (10.96.0.10) and the cluster search domains?"
      - Pods stuck or unready? kubectl -n kube-system describe pod -l k8s-app=kube-dns shows mount and probe errors; kubectl auth can-i list endpointslices --as=system:serviceaccount:kube-system:coredns checks its RBAC.
  - id: q5
    title: ${Q5_APP} unreachable through the ingress
    points: 7
    setup:
      - node: controlplane
        script: setup/q5.sh
        timeoutSeconds: 400
        lane: q5
    checks:
      - id: q5-ingress-serves
        description: www.${Q5_NS}.lab returns the nginx welcome page
        type: kubectl
        run: 'curl -s -m 5 -H "Host: www.${Q5_NS}.lab" http://controlplane:30080/'
        expect: { contains: Welcome to nginx }
        weight: 2
        retrySeconds: 30
      - id: q5-route-serves
        description: api.${Q5_NS}.lab returns the nginx welcome page
        type: kubectl
        run: 'curl -s -m 5 -H "Host: api.${Q5_NS}.lab" http://controlplane:30080/'
        expect: { contains: Welcome to nginx }
        weight: 2
        retrySeconds: 30
      - id: q5-spec-ingress
        description: Ingress ${Q5_APP} still serves host www.${Q5_NS}.lab
        type: kubectl
        run: kubectl -n ${Q5_NS} get ingress ${Q5_APP} -o jsonpath='{.spec.rules[0].host}'
        expect: { equals: "www.${Q5_NS}.lab" }
        weight: 1
      - id: q5-spec-route
        description: HTTPRoute ${Q5_APP} still serves host api.${Q5_NS}.lab
        type: kubectl
        run: kubectl -n ${Q5_NS} get httproute ${Q5_APP} -o jsonpath='{.spec.hostnames[0]}'
        expect: { equals: "api.${Q5_NS}.lab" }
        weight: 1
      - id: q5-spec-backend
        description: Deployment and Service ${Q5_APP} match the spec
        type: kubectl
        run: echo $(kubectl -n ${Q5_NS} get deployment ${Q5_APP} -o jsonpath='{.spec.replicas} {.spec.template.metadata.labels.app}') $(kubectl -n ${Q5_NS} get svc ${Q5_APP} -o jsonpath='{.spec.selector.app} {.spec.ports[0].port}')
        expect: { equals: "2 ${Q5_APP} ${Q5_APP} 80" }
        weight: 1
    hints:
      - "curl -v both hosts: Traefik answers 404 when no router matches the request, and 5xx when a router matches but its backend is broken."
      - "kubectl -n ${Q5_NS} describe ingress ${Q5_APP}: check the class, the path and the backend Service and port against kubectl -n ${Q5_NS} get svc ${Q5_APP}."
      - "kubectl -n ${Q5_NS} describe httproute ${Q5_APP}: the Accepted and ResolvedRefs conditions under Status say why a route is not used."
      - kubectl get ingressclass,gatewayclass and kubectl -n traefik get gateway traefik-gateway -o yaml show the class names and listener names that exist.
  - id: q6
    title: Unhealthy worker
    points: 6
    setup:
      - node: controlplane
        script: setup/q6.sh
      - node: worker-1
        script: setup/q6-2.sh
      - node: worker-2
        script: setup/q6-3.sh
      - node: controlplane
        script: setup/q6-4.sh
        timeoutSeconds: 300
    setupStage: 1
    checks:
      - id: q6-all-ready
        description: every node is Ready
        type: kubectl
        run: kubectl get nodes -o jsonpath='{range .items[*]}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}' | sort -u | tr '\n' ' '
        expect: { equals: "True" }
        weight: 2
        retrySeconds: 90
      - id: q6-schedulable
        description: no worker is cordoned or carries a NoSchedule taint
        type: kubectl
        run: kubectl get nodes -l '!node-role.kubernetes.io/control-plane' -o jsonpath='{range .items[*]}{.spec.unschedulable} {range .spec.taints[*]}{.key}={.effect} {end}{"\n"}{end}' | tr ' ' '\n' | grep -vE '^$|^dedicated=' | grep -cE 'true|NoSchedule|NoExecute' || true
        expect: { equals: "0" }
        weight: 1
        retrySeconds: 30
      - id: q6-services-worker-1
        description: kubelet and containerd are running and enabled on worker-1
        type: ssh
        node: worker-1
        run: echo $(systemctl is-active kubelet containerd) $(systemctl is-enabled kubelet containerd) | tr ' ' '\n' | sort -u | tr '\n' ' '
        expect: { equals: active enabled }
        weight: 1
      - id: q6-services-worker-2
        description: kubelet and containerd are running and enabled on worker-2
        type: ssh
        node: worker-2
        run: echo $(systemctl is-active kubelet containerd) $(systemctl is-enabled kubelet containerd) | tr ' ' '\n' | sort -u | tr '\n' ' '
        expect: { equals: active enabled }
        weight: 1
      - id: q6-probe
        description: node-probe has a ready Pod on every worker
        type: kubectl
        run: kubectl -n ${Q6_NS} get daemonset node-probe -o jsonpath='{.status.numberReady}/{.status.desiredNumberScheduled}/{.status.updatedNumberScheduled}'
        expect: { equals: 2/2/2 }
        weight: 1
        retrySeconds: 90
    hints:
      - "kubectl get nodes, then kubectl describe node <node>: look at Conditions, Taints and Unschedulable."
      - kubectl -n ${Q6_NS} get pods -o wide shows which worker is missing its probe Pod.
      - "On the node: systemctl status kubelet containerd, and journalctl -u kubelet -n 50."
      - systemctl cat kubelet shows the unit and its drop-ins, including the exact command line.
      - journalctl -u kubelet shows why it exits or cannot register. Its config is /var/lib/kubelet/config.yaml, its kubeconfig /etc/kubernetes/kubelet.conf, and extra flags come from /etc/default/kubelet.
  - id: q7
    title: Pod ${Q7_CLAIM}-app stuck
    points: 5
    setup:
      - node: controlplane
        script: setup/q7.sh
        timeoutSeconds: 400
        lane: q7
    checks:
      - id: q7-bound
        description: PVC ${Q7_CLAIM} is Bound to ${Q7_CLAIM}-pv
        type: kubectl
        run: kubectl -n ${Q7_NS} get pvc ${Q7_CLAIM} -o jsonpath='{.status.phase}/{.spec.volumeName}'
        expect: { equals: "Bound/${Q7_CLAIM}-pv" }
        weight: 2
        retrySeconds: 30
      - id: q7-spec-claim
        description: PVC ${Q7_CLAIM} matches the spec
        type: kubectl
        run: kubectl -n ${Q7_NS} get pvc ${Q7_CLAIM} -o jsonpath='{.spec.storageClassName} {.spec.accessModes[0]} {.spec.resources.requests.storage}'
        expect: { equals: manual ReadWriteOnce 500Mi }
        weight: 1
      - id: q7-pod-running
        description: Pod ${Q7_CLAIM}-app is Running with the claim at /data
        type: kubectl
        run: kubectl -n ${Q7_NS} get pod ${Q7_CLAIM}-app -o jsonpath='{.status.phase} {.spec.volumes[*].persistentVolumeClaim.claimName} {.spec.containers[0].volumeMounts[*].mountPath}'
        expect: { matches: "^Running ${Q7_CLAIM} .*/data" }
        weight: 1
        retrySeconds: 60
      - id: q7-pv-kept
        description: PV ${Q7_CLAIM}-pv is unchanged
        type: kubectl
        run: kubectl get pv ${Q7_CLAIM}-pv -o jsonpath='{.spec.storageClassName} {.spec.capacity.storage} {.spec.accessModes[0]}'
        expect: { equals: manual 1Gi ReadWriteOnce }
        weight: 1
    hints:
      - "kubectl -n ${Q7_NS} describe pod ${Q7_CLAIM}-app, then kubectl -n ${Q7_NS} describe pvc ${Q7_CLAIM}: what are the Events waiting for?"
      - "Put kubectl get pv ${Q7_CLAIM}-pv next to kubectl -n ${Q7_NS} get pvc ${Q7_CLAIM} -o yaml: class, access mode and size must all fit."
      - "Most of a claim's spec cannot be edited: delete the Pod and the claim, then create them again."
