        weight: 1
      - id: q4-spec-deployment
        description: Deployment ${Q4_APP} matches the spec
        type: kubectl
        run: kubectl -n ${Q4_NS} get deployment ${Q4_APP} -o jsonpath='{.spec.replicas} {.spec.template.metadata.labels.app} {.spec.template.spec.containers[0].ports[0].name} {.spec.template.spec.containers[0].ports[0].containerPort}'
        expect: { equals: "2 ${Q4_APP} http 80" }
        weight: 1
    hints:
      - "kubectl -n ${Q4_NS} get svc,endpointslices,pods -o wide: does the Service have endpoints, and are they ready?"
      - Compare the Service selector and targetPort with the Pods' labels and named ports (kubectl -n ${Q4_NS} get pods --show-labels).
      - Can the client reach a Pod IP directly? kubectl -n ${Q4_NS} exec client -- wget -qO- -T 3 http://<pod-ip>
      - "kubectl -n ${Q4_NS} get networkpolicy: anything selecting the ${Q4_APP} Pods?"
  - id: q5
    title: Frontend cannot reach ${Q5_APP}
    points: 7
    setup:
      - node: controlplane
        script: setup/q5.sh
        timeoutSeconds: 400
        lane: q5
    checks:
      - id: q5-reachable
        description: client gets the nginx page from http://${Q5_APP}
        type: kubectl
        run: kubectl -n ${Q5_NS} exec client -- wget -qO- -T 3 http://${Q5_APP}
        expect: { contains: nginx }
        weight: 3
        retrySeconds: 30
      - id: q5-stranger-blocked
        description: stranger still cannot reach ${Q5_APP}
        type: kubectl
        run: kubectl -n ${Q5_NS} exec stranger -- wget -qO- -T 3 http://${Q5_APP} >/dev/null 2>&1 && echo open || echo blocked
        expect: { equals: blocked }
        weight: 2
      - id: q5-default-deny
        description: default-deny still selects every Pod for ingress and egress
        type: kubectl
        run: kubectl -n ${Q5_NS} get networkpolicy default-deny -o jsonpath='{.spec.podSelector.matchLabels}|{.spec.policyTypes[*]}|{.spec.ingress}{.spec.egress}'
        expect: { equals: "|Ingress Egress|" }
        weight: 1
      - id: q5-ingress-rule
        description: ${Q5_APP}-ingress allows role=frontend on port 80
        type: kubectl
        run: kubectl -n ${Q5_NS} get networkpolicy ${Q5_APP}-ingress -o jsonpath='{.spec.ingress[0].from[0].podSelector.matchLabels.role} {.spec.ingress[0].ports[0].port}'
        expect: { equals: frontend 80 }
        weight: 1
    hints:
      - "kubectl -n ${Q5_NS} get networkpolicy, then kubectl -n ${Q5_NS} describe networkpolicy <name> for each: which Pods does it select, and what does it allow?"
      - "Separate DNS from the connection: kubectl -n ${Q5_NS} exec client -- nslookup ${Q5_APP}, then wget the Service IP or a Pod IP directly."
      - "Compare every selector with the real labels: kubectl -n ${Q5_NS} get pods --show-labels and kubectl get ns kube-system --show-labels; kubectl -n kube-system get pods -l k8s-app=kube-dns."
      - A connection needs egress allowed at the client and ingress allowed at the server. Check both sides, including the ports.
  - id: q6
    title: Name resolution broken
    points: 7
    setup:
      - node: controlplane
        script: setup/q6.sh
