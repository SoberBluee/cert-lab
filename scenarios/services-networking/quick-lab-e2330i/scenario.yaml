id: quick-lab-e2330i
title: Unreachable Services and blocked frontend traffic
domain: services-networking
difficulty: 3
estimatedMinutes: 18
points: 13
tags: [ troubleshooting, service, endpoints, networkpolicy, dns ]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 30
variables:
  Q1_NS: { oneOf: [ store, edge, api ] }
  Q1_APP: { oneOf: [ web, backend, gateway ] }
  Q1_FAULT: { oneOf: [ selector-mismatch, target-port, named-port, network-policy, not-ready, selector-extra-label, service-port, service-protocol, kube-proxy-down ], hidden: true }
  Q2_NS: { oneOf: [ secure, payments, vault ] }
  Q2_APP: { oneOf: [ api, ledger, billing ] }
  Q2_FAULT: { oneOf: [ dns-egress-port, dns-namespace-selector, ingress-port, ingress-from-label, egress-to-label, egress-port, ingress-namespace-and, ingress-pod-selector ], hidden: true }
tasks:
  - id: q1
    title: Service ${Q1_APP} unreachable
    points: 6
    setup:
      - node: controlplane
        script: setup/q1.sh
        timeoutSeconds: 400
        lane: q1
    checks:
      - id: q1-reachable
        description: client gets the nginx page from http://${Q1_APP}
        type: kubectl
        run: kubectl -n ${Q1_NS} exec client -- wget -qO- -T 3 http://${Q1_APP}
        expect: { contains: nginx }
        weight: 3
        retrySeconds: 30
      - id: q1-endpoints
        description: Service ${Q1_APP} has 2 ready endpoints
        type: kubectl
        run: kubectl -n ${Q1_NS} get endpointslices -l kubernetes.io/service-name=${Q1_APP} -o jsonpath='{range .items[*].endpoints[*]}{.conditions.ready}{"\n"}{end}' | grep -c true
        expect: { equals: "2" }
        weight: 1
        retrySeconds: 30
      - id: q1-spec-service
        description: Service ${Q1_APP} is a ClusterIP Service on port 80
        type: kubectl
        run: kubectl -n ${Q1_NS} get svc ${Q1_APP} -o jsonpath='{.spec.type} {.spec.ports[0].port}'
        expect: { equals: ClusterIP 80 }
        weight: 1
      - id: q1-spec-deployment
        description: Deployment ${Q1_APP} is the original one, with 2 replicas, its image and a readiness probe
        type: kubectl
        run: "[ ! -f /var/tmp/cka-q1.uid ] || [ \"$(kubectl -n ${Q1_NS} get deployment ${Q1_APP} -o jsonpath='{.metadata.uid}')\" = \"$(cat /var/tmp/cka-q1.uid)\" ] || { echo recreated; exit 0; }; echo \"$(kubectl -n ${Q1_NS} get deployment ${Q1_APP} -o jsonpath='{.spec.replicas} {.spec.template.spec.containers[0].image}') $([ -n \"$(kubectl -n ${Q1_NS} get deployment ${Q1_APP} -o jsonpath='{.spec.template.spec.containers[0].readinessProbe}')\" ] && echo probe || echo none)\""
        expect: { equals: 2 nginx:1.27-alpine probe }
        weight: 1
    hints:
      - "Split the path into hops and test each one from client: does the name resolve, does the Service IP answer, does a Pod IP answer? kubectl -n ${Q1_NS} get svc,endpointslices,pods -o wide gives you the addresses."
      - "kubectl -n ${Q1_NS} describe svc ${Q1_APP} and kubectl -n ${Q1_NS} get endpointslices: an empty or not-ready endpoint list sends you to the Pods; a healthy one sends you further along the path."
      - "Compare what the Service selects and forwards to with what the Pods really carry and listen on: kubectl -n ${Q1_NS} get pods --show-labels and kubectl -n ${Q1_NS} get deployment ${Q1_APP} -o yaml."
      - "When the namespace looks right, look at what sits between the client and the Pods: NetworkPolicies, and the node component that turns Service IPs into Pod IPs (kubectl -n kube-system get ds,pods)."
  - id: q2
    title: Frontend cannot reach ${Q2_APP}
    points: 7
    setup:
      - node: controlplane
        script: setup/q2.sh
        timeoutSeconds: 400
        lane: q2
    checks:
      - id: q2-reachable
        description: client gets the nginx page from http://${Q2_APP}
        type: kubectl
        run: kubectl -n ${Q2_NS} exec client -- wget -qO- -T 3 http://${Q2_APP}
        expect: { contains: nginx }
        weight: 3
        retrySeconds: 30
      - id: q2-stranger-blocked
        description: stranger still cannot reach ${Q2_APP}
        type: kubectl
        run: kubectl -n ${Q2_NS} exec stranger -- wget -qO- -T 3 http://${Q2_APP} >/dev/null 2>&1 && echo open || echo blocked
        expect: { equals: blocked }
        weight: 2
      - id: q2-default-deny
        description: default-deny still selects every Pod for ingress and egress
        type: kubectl
        run: kubectl -n ${Q2_NS} get networkpolicy default-deny -o jsonpath='{.spec.podSelector.matchLabels}|{.spec.policyTypes[*]}|{.spec.ingress}{.spec.egress}'
        expect: { equals: "|Ingress Egress|" }
        weight: 1
      - id: q2-ingress-rule
        description: ${Q2_APP}-ingress allows role=frontend on port 80
        type: kubectl
        run: kubectl -n ${Q2_NS} get networkpolicy ${Q2_APP}-ingress -o jsonpath='{.spec.ingress[0].from[0].podSelector.matchLabels.role} {.spec.ingress[0].ports[0].port}'
        expect: { equals: frontend 80 }
        weight: 1
    hints:
      - "kubectl -n ${Q2_NS} get networkpolicy, then kubectl -n ${Q2_NS} describe networkpolicy <name> for each: which Pods does it select, and what does it let in or out?"
      - "Separate name resolution from the connection: kubectl -n ${Q2_NS} exec client -- nslookup ${Q2_APP}, then wget the Service IP and a Pod IP directly."
      - A connection needs egress allowed at the client and ingress allowed at the server, on the port the Pod listens on. Check both ends.
      - "Compare every selector with the real labels: kubectl get pods -A --show-labels and kubectl get ns --show-labels."
