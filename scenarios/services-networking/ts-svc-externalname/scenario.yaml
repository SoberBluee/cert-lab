id: ts-svc-externalname
title: Service type flipped to ExternalName
domain: services-networking
difficulty: 2
estimatedMinutes: 8
points: 6
tags: [troubleshooting, service, externalname]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 20
variables:
  NS: { oneOf: [ store, edge, api ] }
  APP: { oneOf: [ web, backend, gateway ] }
setup:
  - node: controlplane
    script: setup/break.sh
    timeoutSeconds: 300
checks:
  - id: reachable
    description: client reaches Service ${APP}
    type: kubectl
    run: kubectl -n ${NS} exec client -- wget -qO- -T 3 http://${APP} | grep -q nginx && echo ok || echo fail
    expect: { equals: "ok" }
    weight: 3
    retrySeconds: 60
  - id: type
    description: Service ${APP} is ClusterIP
    type: kubectl
    run: kubectl -n ${NS} get svc ${APP} -o jsonpath='{.spec.type}'
    expect: { equals: "ClusterIP" }
    weight: 2
  - id: selector
    description: Service selects app=${APP} on port 80, forwarding to the container port
    type: kubectl
    run: kubectl -n ${NS} get svc ${APP} -o jsonpath='{.spec.selector.app}/{.spec.ports[0].port}/{.spec.ports[0].targetPort}'
    expect: { matches: "^${APP}/80/(http|80)$" }
    weight: 1
hints:
  - "Split the path into hops and test each one from client: does the name resolve, does the Service IP answer, does a Pod IP answer?"
  - "kubectl -n ${NS} get svc ${APP} -o yaml: compare every field with what a Service in front of a Deployment needs."
  - "Some Service fields cannot be changed in place: delete and recreate the Service if you must."
