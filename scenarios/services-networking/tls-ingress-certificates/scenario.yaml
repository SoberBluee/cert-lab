id: tls-ingress-certificates
title: Serve HTTPS from an Ingress
domain: services-networking
difficulty: 2
estimatedMinutes: 14
points: 14
tags: [ ingress, tls, tls-secret, openssl, certificates ]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 30
variables:
  Q1_NS: { oneOf: [ shop, tickets, members ] }
  Q1_SUB: { oneOf: [ www, secure, app ] }
  Q2_NS: { oneOf: [ blog, wiki, status ] }
  Q2_SUB: { oneOf: [ news, read, public ] }
tasks:
  - id: q1
    title: Add HTTPS to ${Q1_SUB}.${Q1_NS}.lab
    points: 8
    tags: [ ingress, tls-secret, openssl ]
    setup:
      - node: controlplane
        script: setup/q1.sh
        timeoutSeconds: 300
    checks:
      - id: q1-san
        description: the certificate has ${Q1_SUB}.${Q1_NS}.lab as a subject alternative name
        type: kubectl
        run: openssl x509 -in /opt/course/tls/${Q1_NS}/tls.crt -noout -ext subjectAltName 2>/dev/null
        expect: { contains: "DNS:${Q1_SUB}.${Q1_NS}.lab" }
        weight: 1
      - id: q1-days
        description: the certificate is valid for 90 days
        type: kubectl
        run: >-
          echo $(( ($(date -d "$(openssl x509 -in /opt/course/tls/${Q1_NS}/tls.crt -noout -enddate | cut -d= -f2)" +%s) - $(date +%s)) / 86400 ))
        expect: { gte: 88, lte: 90 }
        weight: 1
      - id: q1-key
        description: tls.key is the key of tls.crt
        type: kubectl
        run: >-
          [ -s /opt/course/tls/${Q1_NS}/tls.key ] && [ -s /opt/course/tls/${Q1_NS}/tls.crt ] &&
          [ "$(openssl x509 -in /opt/course/tls/${Q1_NS}/tls.crt -noout -pubkey | sha256sum)" = "$(openssl pkey -in /opt/course/tls/${Q1_NS}/tls.key -pubout | sha256sum)" ] && echo match || echo mismatch
        expect: { equals: match }
        weight: 1
      - id: q1-secret
        description: web-tls is a TLS Secret holding that certificate
        type: kubectl
        run: >-
          [ "$(kubectl -n ${Q1_NS} get secret web-tls -o jsonpath='{.type}')" = kubernetes.io/tls ] &&
          [ "$(kubectl -n ${Q1_NS} get secret web-tls -o jsonpath='{.data.tls\.crt}' | base64 -d | openssl x509 -noout -fingerprint -sha256)" = "$(openssl x509 -in /opt/course/tls/${Q1_NS}/tls.crt -noout -fingerprint -sha256)" ] && echo same || echo different
        expect: { equals: same }
        weight: 1
      - id: q1-ingress
        description: Ingress web terminates TLS for the host with web-tls
        type: kubectl
        run: kubectl -n ${Q1_NS} get ingress web -o jsonpath='{.spec.tls[0].hosts[0]} {.spec.tls[0].secretName}'
        expect: { equals: "${Q1_SUB}.${Q1_NS}.lab web-tls" }
        weight: 1
      - id: q1-serves
        description: HTTPS returns the nginx page with that certificate
        type: kubectl
        run: >-
          [ "$(openssl s_client -servername ${Q1_SUB}.${Q1_NS}.lab -connect controlplane:30443 </dev/null 2>/dev/null | openssl x509 -noout -fingerprint -sha256)" = "$(openssl x509 -in /opt/course/tls/${Q1_NS}/tls.crt -noout -fingerprint -sha256)" ] &&
          curl -sk -m 5 --resolve ${Q1_SUB}.${Q1_NS}.lab:30443:$(getent hosts controlplane | awk '{print $1}') https://${Q1_SUB}.${Q1_NS}.lab:30443/ | grep -q 'Welcome to nginx' && echo ok || echo fail
        expect: { equals: ok }
        weight: 3
        retrySeconds: 60
    hints:
      - "openssl req -x509 can do it in one command. -addext \"subjectAltName=DNS:<host>\" sets the name that clients actually check; the CN alone is not enough."
      - kubectl -n ${Q1_NS} create secret tls --help, then kubectl explain ingress.spec.tls.
      - "openssl s_client -servername <host> -connect controlplane:30443 </dev/null | openssl x509 -noout -subject shows which certificate is really served."
  - id: q2
    title: ${Q2_SUB}.${Q2_NS}.lab serves the wrong certificate
    points: 6
    tags: [ ingress, tls-secret ]
    setup:
      - node: controlplane
        script: setup/q2.sh
        timeoutSeconds: 300
    checks:
      - id: q2-serves
        description: HTTPS serves the certificate from cert-store
        type: kubectl
        run: >-
          [ "$(openssl s_client -servername ${Q2_SUB}.${Q2_NS}.lab -connect controlplane:30443 </dev/null 2>/dev/null | openssl x509 -noout -fingerprint -sha256)" = "$(kubectl -n cert-store get secret site-tls -o jsonpath='{.data.tls\.crt}' | base64 -d | openssl x509 -noout -fingerprint -sha256)" ] && echo same || echo different
        expect: { equals: same }
        weight: 4
        retrySeconds: 60
      - id: q2-store
        description: Secret site-tls in cert-store was not changed
        type: kubectl
        run: >-
          [ "$(kubectl -n cert-store get secret site-tls -o jsonpath='{.metadata.uid}/{.metadata.resourceVersion}')" = "$(cat /var/tmp/cka-q2.secret)" ] && echo same || echo changed
        expect: { equals: same }
        weight: 1
      - id: q2-ingress
        description: Ingress web still terminates TLS for the host
        type: kubectl
        run: kubectl -n ${Q2_NS} get ingress web -o jsonpath='{.spec.tls[0].hosts[0]}'
        expect: { equals: "${Q2_SUB}.${Q2_NS}.lab" }
        weight: 1
    hints:
      - "kubectl -n traefik logs deployment/traefik | grep -i tls: the controller says what it could not load."
      - "An Ingress and the Secret it names: can they live in different namespaces?"
