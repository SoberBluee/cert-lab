id: coredns-upstream
title: "CoreDNS: change the upstream resolver"
domain: services-networking
difficulty: 2
estimatedMinutes: 8
points: 6
tags: [ coredns, dns, corefile ]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 30
variables:
  Q1_NS: { oneOf: [ lookup, resolver, names, dns-lab, records, zones, directory, catalog, registry, gateway-ns ] }
  Q1_ZONE: { oneOf: [ corp.internal, office.internal, hq.internal, branch.internal ] }
  Q1_IP: { oneOf: [ 198.51.100.20, 198.51.100.37, 198.51.100.54, 198.51.100.71 ] }
tasks:
  - id: q1
    title: Change the upstream DNS server
    points: 6
    setup:
      - node: controlplane
        script: setup/q1.sh
        timeoutSeconds: 600
        lane: q1
    checks:
      - id: q1-upstream
        description: intranet.${Q1_ZONE} resolves to ${Q1_IP} through the company server
        type: kubectl
        run: kubectl -n ${Q1_NS} exec dns-test -- nslookup intranet.${Q1_ZONE} 2>/dev/null | grep -qw '${Q1_IP}' && echo resolved || echo unresolved
        expect: { equals: resolved }
        weight: 3
        retrySeconds: 90
      - id: q1-cluster-local
        description: web.${Q1_NS}.svc.cluster.local still resolves to the ClusterIP of web
        type: kubectl
        run: ip=$(kubectl -n ${Q1_NS} get service web -o jsonpath='{.spec.clusterIP}'); [ -n "$ip" ] && kubectl -n ${Q1_NS} exec dns-test -- nslookup web.${Q1_NS}.svc.cluster.local 2>/dev/null | grep -qw "$ip" && echo resolved || echo unresolved
        expect: { equals: resolved }
        weight: 1
        retrySeconds: 90
      - id: q1-forward
        description: CoreDNS forwards to the company server and no longer to /etc/resolv.conf
        type: kubectl
        run: ip=$(kubectl -n corp-dns get service resolver -o jsonpath='{.spec.clusterIP}'); c=$(kubectl -n kube-system get configmap coredns -o jsonpath='{.data.Corefile}'); [ -n "$ip" ] && grep -E '^ *forward \. ' <<< "$c" | grep -qw "$ip" && ! grep -qE 'forward \. /etc/resolv\.conf' <<< "$c" && echo yes || echo no
        expect: { equals: yes }
        weight: 1
      - id: q1-coredns
        description: CoreDNS runs 2 ready replicas
        type: kubectl
        run: kubectl -n kube-system get deployment coredns -o jsonpath='{.status.readyReplicas}'
        expect: { equals: "2" }
        weight: 1
        retrySeconds: 60
    hints:
      - "In the .:53 server block, the forward plugin says where names outside the cluster go: forward . /etc/resolv.conf asks the node's resolvers."
      - "kubectl -n corp-dns get service resolver gives the address to forward to: the forward plugin takes IP addresses, not names."
      - CoreDNS reloads a changed Corefile after a while; kubectl -n kube-system rollout restart deployment/coredns applies it at once, and kubectl -n kube-system logs deploy/coredns shows a Corefile that does not parse.
    recipe: { builder: coredns, parts: [] }
