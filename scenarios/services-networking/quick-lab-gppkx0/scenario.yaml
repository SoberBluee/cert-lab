  - id: q12
    title: Identity of kubeconfig user ${Q12_USER}
    points: 6
    context: k8s-blue
    setup:
      - node: controlplane
        script: setup/q12.sh
        lane: q12
    checks:
      - type: ssh
        node: controlplane
        id: q12-username
        description: username holds the Common Name of ${Q12_USER}'s client certificate
        run: want=$(kubectl --kubeconfig /var/tmp/cka-kc-identity-kubeconfig config view --raw -o jsonpath='{.users[?(@.name=="${Q12_USER}")].user.client-certificate-data}' | base64 -d | openssl x509 -noout -subject -nameopt RFC2253 | sed 's/^subject=//' | tr ',' '\n' | sed -n 's/^CN=//p'); [ -n "$want" ] && [ "$(tr -d '[:space:]' < /opt/course/kc/identity/username 2>/dev/null)" = "$want" ] && echo ok || echo "want $want"
        expect: { equals: ok }
        weight: 1
      - type: ssh
        node: controlplane
        id: q12-groups
        description: groups lists the Organizations of ${Q12_USER}'s client certificate
        run: want=$(kubectl --kubeconfig /var/tmp/cka-kc-identity-kubeconfig config view --raw -o jsonpath='{.users[?(@.name=="${Q12_USER}")].user.client-certificate-data}' | base64 -d | openssl x509 -noout -subject -nameopt RFC2253 | sed 's/^subject=//' | tr ',' '\n' | sed -n 's/^O=//p' | sort); have=$(sed -E 's/[[:space:]]+/ /g; s/^ //; s/ $//; /^$/d' /opt/course/kc/identity/groups 2>/dev/null | sort); [ -n "$want" ] && [ "$have" = "$want" ] && echo same || echo different
        expect: { equals: same }
        weight: 2
      - type: ssh
        node: controlplane
        id: q12-expiry
        description: expiry holds the date ${Q12_USER}'s client certificate expires
        run: want=$(kubectl --kubeconfig /var/tmp/cka-kc-identity-kubeconfig config view --raw -o jsonpath='{.users[?(@.name=="${Q12_USER}")].user.client-certificate-data}' | base64 -d | openssl x509 -noout -enddate | cut -d= -f2); [ -n "$want" ] && grep -qF "$want" /opt/course/kc/identity/expiry 2>/dev/null && echo ok || echo "want $want"
        expect: { equals: ok }
        weight: 1
      - type: ssh
        node: controlplane
        id: q12-key
        description: ${Q12_USER}.key is the private key of ${Q12_USER}'s client certificate
        run: k=$(openssl pkey -in /opt/course/kc/identity/${Q12_USER}.key -pubout 2>/dev/null); c=$(kubectl --kubeconfig /var/tmp/cka-kc-identity-kubeconfig config view --raw -o jsonpath='{.users[?(@.name=="${Q12_USER}")].user.client-certificate-data}' | base64 -d | openssl x509 -noout -pubkey 2>/dev/null); [ -n "$k" ] && [ "$k" = "$c" ] && echo matches || echo different
        expect: { equals: matches }
        weight: 2
    hints:
      - kubectl config view hides certificates and keys; --raw shows client-certificate-data and client-key-data, which base64 -d turns into PEM.
      - "openssl x509 -in <cert> -noout -subject -enddate: the subject's CN is the user name the API server sees, each O one of its groups."
      - kubectl --context <context> auth whoami shows the user name and groups the API server derives from the certificate.
    recipe: { builder: kubeconfig, parts: [] }
  - id: q13
    title: DaemonSet ${Q13_DS} is not running everywhere
    points: 8
    context: k8s-alpha
    setup:
      - node: controlplane
        script: setup/q13.sh
        timeoutSeconds: 400
        lane: q13
    checks:
      - id: q13-everywhere
        description: ${Q13_DS} has a ready Pod on every node, controlplane included
        type: kubectl
        run: n=$(kubectl get nodes --no-headers | wc -l | tr -d ' '); s=$(kubectl -n ${Q13_NS} get daemonset ${Q13_DS} -o jsonpath='{.status.desiredNumberScheduled}/{.status.numberReady}'); [ "$s" = "$n/$n" ] && echo everywhere || echo "$s of $n nodes"
        expect: { equals: everywhere }
        weight: 3
        retrySeconds: 90
      - id: q13-current
        description: every Pod of ${Q13_DS} runs its current template, and template changes roll out on their own
        type: kubectl
        run: kubectl -n ${Q13_NS} get daemonset ${Q13_DS} -o jsonpath='{.spec.updateStrategy.type} {.status.updatedNumberScheduled}/{.status.desiredNumberScheduled}'
        expect: { matches: "^RollingUpdate ([1-9][0-9]*)/\\1$" }
        weight: 1
        retrySeconds: 60
      - id: q13-spec
        description: ${Q13_DS} keeps image nginx:1.27-alpine, its resource requests and a readiness probe
        type: kubectl
        run: c='{.spec.template.spec.containers[0]'; echo "$(kubectl -n ${Q13_NS} get daemonset ${Q13_DS} -o jsonpath="$c.image} $c.resources.requests.cpu} $c.resources.requests.memory}") $([ -n "$(kubectl -n ${Q13_NS} get daemonset ${Q13_DS} -o jsonpath="$c.readinessProbe}")" ] && echo readiness)"
        expect: { equals: nginx:1.27-alpine 10m 16Mi readiness }
        weight: 1
      - id: q13-control-plane-taint
        description: controlplane keeps its NoSchedule taint
        type: kubectl
        run: kubectl get node controlplane -o jsonpath='{.spec.taints[?(@.key=="node-role.kubernetes.io/control-plane")].effect}'
        expect: { equals: NoSchedule }
        weight: 1
      - id: q13-others
        description: every other DaemonSet of ${Q13_NS} still runs all its Pods
        type: kubectl
        run: ok=yes; for d in $(cat /var/tmp/cka-q13.others); do r=$(kubectl -n ${Q13_NS} get daemonset "$d" -o jsonpath='{.status.numberReady}' 2>/dev/null); w=$(kubectl -n ${Q13_NS} get daemonset "$d" -o jsonpath='{.status.desiredNumberScheduled}' 2>/dev/null); [ -n "$w" ] && [ "$r" = "$w" ] || ok=no; done; echo $ok
        expect: { equals: yes }
        weight: 1
        retrySeconds: 60
      - id: q13-same-daemonset
        description: ${Q13_DS} was not deleted or recreated
        type: kubectl
        run: "[ \"$(kubectl -n ${Q13_NS} get daemonset ${Q13_DS} -o jsonpath='{.metadata.uid}')\" = \"$(cat /var/tmp/cka-q13.uid)\" ] && echo same || echo recreated"
        expect: { equals: same }
        weight: 1
    hints:
      - "kubectl -n ${Q13_NS} get daemonset ${Q13_DS}: compare DESIRED with the number of nodes, and READY and UP-TO-DATE with DESIRED."
      - kubectl -n ${Q13_NS} get pods -l app=${Q13_DS} -o wide shows which nodes have a Pod; kubectl -n ${Q13_NS} describe pod <pod> says why one is Pending, not ready or failing.
      - "kubectl describe node <node> | grep Taints, then kubectl -n ${Q13_NS} get daemonset ${Q13_DS} -o yaml: tolerations, affinity, ports and the update strategy decide where Pods may run and when they are replaced."
      - kubectl -n ${Q13_NS} rollout status daemonset/${Q13_DS} and kubectl -n ${Q13_NS} rollout history daemonset/${Q13_DS} show whether the Pods run the current template.
    recipe: { category: daemonsets }
