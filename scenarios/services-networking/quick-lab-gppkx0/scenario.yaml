        description: ${Q17_STS}-2.${Q17_STS}-hl.${Q17_NS}.svc.cluster.local resolves to the IP of Pod ${Q17_STS}-2
        type: kubectl
        run: ip=$(kubectl -n ${Q17_NS} get pod ${Q17_STS}-2 -o jsonpath='{.status.podIP}'); [ -n "$ip" ] && kubectl -n ${Q17_NS} exec ${Q17_STS}-0 -- nslookup ${Q17_STS}-2.${Q17_STS}-hl.${Q17_NS}.svc.cluster.local 2>/dev/null | grep -qw "$ip" && echo resolved || echo unresolved
        expect: { equals: resolved }
        weight: 2
        retrySeconds: 60
      - id: q17-claims
        description: every Pod has its own Bound claim of StorageClass local-path, mounted at /data
        type: kubectl
        run: echo "$(kubectl -n ${Q17_NS} get pvc data-${Q17_STS}-0 data-${Q17_STS}-1 data-${Q17_STS}-2 -o jsonpath='{range .items[*]}{.status.phase}/{.spec.storageClassName} {end}' 2>/dev/null)$(kubectl -n ${Q17_NS} get statefulset ${Q17_STS} -o jsonpath='{.spec.template.spec.containers[0].volumeMounts[?(@.name=="data")].mountPath}')"
        expect: { equals: Bound/local-path Bound/local-path Bound/local-path /data }
        weight: 1
        retrySeconds: 60
      - id: q17-spec
        description: ${Q17_STS} keeps image nginx:1.27-alpine and a readiness probe
        type: kubectl
        run: c='{.spec.template.spec.containers[0]'; echo "$(kubectl -n ${Q17_NS} get statefulset ${Q17_STS} -o jsonpath="$c.image}") $([ -n "$(kubectl -n ${Q17_NS} get statefulset ${Q17_STS} -o jsonpath="$c.readinessProbe}")" ] && echo readiness)"
        expect: { equals: nginx:1.27-alpine readiness }
        weight: 1
      - id: q17-data-kept
        description: claim data-${Q17_STS}-0 was not deleted once Bound
        type: kubectl
        run: r=$(cat /var/tmp/cka-q17.uid); { [ "$r" = none ] || [ "$(kubectl -n ${Q17_NS} get pvc data-${Q17_STS}-0 -o jsonpath='{.metadata.uid}' 2>/dev/null)" = "$r" ]; } && echo kept || echo deleted
        expect: { equals: kept }
        weight: 1
    hints:
      - "kubectl -n ${Q17_NS} get statefulset,pods,pvc -o wide: how many Pods exist, are they ready, and are their claims Bound? A StatefulSet creates its Pods one at a time, each only once the one before it is ready."
      - "kubectl -n ${Q17_NS} describe pod <pod> and kubectl -n ${Q17_NS} describe pvc <claim>: the Events say why a Pod is Pending or not ready, or why a claim waits."
      - "From inside a Pod: kubectl -n ${Q17_NS} exec ${Q17_STS}-0 -- nslookup ${Q17_STS}-0.${Q17_STS}-hl.${Q17_NS}.svc.cluster.local. Per-Pod names need a headless Service with endpoints, named by the StatefulSet's spec.serviceName."
      - "kubectl explain statefulset.spec: serviceName, podManagementPolicy and volumeClaimTemplates cannot be changed on an existing StatefulSet. Delete it (its claims stay) and create it again."
    recipe: { category: statefulsets }
