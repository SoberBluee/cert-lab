        retrySeconds: 90
      - id: q15-cluster-local
        description: web.${Q15_NS}.svc.cluster.local still resolves to the ClusterIP of web
        type: kubectl
        run: ip=$(kubectl -n ${Q15_NS} get service web -o jsonpath='{.spec.clusterIP}'); [ -n "$ip" ] && kubectl -n ${Q15_NS} exec dns-test -- nslookup web.${Q15_NS}.svc.cluster.local 2>/dev/null | grep -qw "$ip" && echo resolved || echo unresolved
        expect: { equals: resolved }
        weight: 2
        retrySeconds: 90
    hints:
      - "CoreDNS reads its Corefile from ConfigMap kube-system/coredns: kubectl -n kube-system get configmap coredns -o yaml > <file> saves it."
      - "The kubernetes plugin line (kubernetes cluster.local in-addr.arpa ip6.arpa) lists the zones CoreDNS answers for Services and Pods: add the new domain next to cluster.local."
      - CoreDNS reloads a changed Corefile after a while; kubectl -n kube-system rollout restart deployment/coredns applies it at once, and kubectl -n kube-system logs deploy/coredns shows a Corefile that does not parse.
