id: all-you-can-dns
title: All you can DNS
domain: services-networking
difficulty: 2
estimatedMinutes: 100
points: 70
tags: [ troubleshooting, dns, coredns, service ]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 20
variables:
  Q1_NS: { oneOf: [ shop, intranet, search, portal, corp, dns-lab, lookup, resolve, cache-ns, edge-dns ] }
  Q1_FAULT: { oneOf: [ corefile-typo ], hidden: true }
  Q2_NS: { oneOf: [ shop, intranet, search, portal, corp, dns-lab, lookup, resolve, cache-ns, edge-dns ] }
  Q2_FAULT: { oneOf: [ coredns-ready-port ], hidden: true }
  Q3_NS: { oneOf: [ shop, intranet, search, portal, corp, dns-lab, lookup, resolve, cache-ns, edge-dns ] }
  Q3_FAULT: { oneOf: [ coredns-ready-port ], hidden: true }
  Q4_NS: { oneOf: [ shop, intranet, search, portal, corp, dns-lab, lookup, resolve, cache-ns, edge-dns ] }
  Q4_FAULT: { oneOf: [ coredns-hosts-plugin ], hidden: true }
  Q5_NS: { oneOf: [ shop, intranet, search, portal, corp, dns-lab, lookup, resolve, cache-ns, edge-dns ] }
  Q5_FAULT: { oneOf: [ kube-dns-target-port ], hidden: true }
  Q6_NS: { oneOf: [ shop, intranet, search, portal, corp, dns-lab, lookup, resolve, cache-ns, edge-dns ] }
  Q6_FAULT: { oneOf: [ coredns-config-volume, coredns-hosts-plugin ], hidden: true }
  Q7_NS: { oneOf: [ shop, intranet, search, portal, corp, dns-lab, lookup, resolve, cache-ns, edge-dns ] }
  Q7_FAULT: { oneOf: [ coredns-memory-limit ], hidden: true }
  Q8_NS: { oneOf: [ shop, intranet, search, portal, corp, dns-lab, lookup, resolve, cache-ns, edge-dns ] }
  Q8_FAULT: { oneOf: [ coredns-rbac ], hidden: true }
  Q9_NS: { oneOf: [ shop, intranet, search, portal, corp, dns-lab, lookup, resolve, cache-ns, edge-dns ] }
  Q9_FAULT: { oneOf: [ kube-dns-selector ], hidden: true }
  Q10_NS: { oneOf: [ shop, intranet, search, portal, corp, dns-lab, lookup, resolve, cache-ns, edge-dns ] }
  Q10_FAULT: { oneOf: [ client-dns-policy ], hidden: true }
tasks:
  - id: q1
    title: Name resolution broken
    recipe: { category: dns }
    points: 7
    setup:
      - node: controlplane
        script: setup/q1.sh
        timeoutSeconds: 400
    setupStage: 1
    checks:
      - id: q1-short-name
        description: client gets the nginx page from http://web
        type: kubectl
        run: kubectl -n ${Q1_NS} exec client -- wget -qO- -T 3 http://web
        expect: { contains: nginx }
        weight: 2
        retrySeconds: 60
      - id: q1-fqdn
        description: client resolves web.${Q1_NS}.svc.cluster.local to the Service IP
        type: kubectl
        run: ip=$(kubectl -n ${Q1_NS} get svc web -o jsonpath='{.spec.clusterIP}'); kubectl -n ${Q1_NS} exec client -- nslookup -type=a web.${Q1_NS}.svc.cluster.local 2>/dev/null | grep -qw "$ip" && echo resolves || echo fails
        expect: { equals: resolves }
        weight: 2
        retrySeconds: 60
      - id: q1-coredns-ready
        description: CoreDNS runs 2 ready replicas
        type: kubectl
        run: kubectl -n kube-system get deployment coredns -o jsonpath='{.status.readyReplicas}'
        expect: { equals: "2" }
        weight: 1
        retrySeconds: 60
      - id: q1-corefile
        description: The Corefile serves cluster.local and forwards to /etc/resolv.conf
        type: kubectl
        run: kubectl -n kube-system get configmap coredns -o jsonpath='{.data.Corefile}' | grep -cE 'kubernetes cluster\.local |forward \. /etc/resolv\.conf'
        expect: { equals: "2" }
        weight: 1
      - id: q1-kube-dns-service
        description: Service kube-dns selects the CoreDNS Pods
        type: kubectl
        run: kubectl -n kube-system get svc kube-dns -o jsonpath='{.spec.selector.k8s-app}'
        expect: { equals: kube-dns }
        weight: 1
    hints:
      - "Is it DNS at all? From client, compare nslookup web with nslookup web.${Q1_NS}.svc.cluster.local, and both with a lookup sent straight to a CoreDNS Pod IP: nslookup <name> <pod-ip>."
      - "Work outwards from the client: kubectl -n ${Q1_NS} exec client -- cat /etc/resolv.conf, then kubectl -n kube-system get svc,endpointslices -l k8s-app=kube-dns, then the CoreDNS Pods."
      - "CoreDNS Pods that are missing, crashing or never ready say why: kubectl -n kube-system get deploy,pods -l k8s-app=kube-dns, then describe and logs."
      - CoreDNS reads its configuration from a ConfigMap and needs permission to watch the cluster; both are in kube-system.
