id: kk2-configmap-volume
title: NodePort site is down
domain: troubleshooting
difficulty: 2
estimatedMinutes: 8
points: 5
tags: [troubleshooting, configmap, volumes, nodeport, deployment]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 60
variables:
  NS: { oneOf: [ web, shop, site ] }
  APP: { oneOf: [ nginx-site, static-web, brochure ] }
  NODEPORT: { oneOf: [ 30082, 30092, 30102 ] }
setup:
  - node: controlplane
    script: setup/break.sh
    timeoutSeconds: 300
checks:
  - id: ready
    description: Deployment ${APP} has 1 ready replica
    type: kubectl
    run: kubectl -n ${NS} get deployment ${APP} -o jsonpath='{.status.readyReplicas}'
    expect: { equals: "1" }
    weight: 2
    retrySeconds: 90
  - id: curl
    description: curl http://controlplane:${NODEPORT}/ returns the page
    type: kubectl
    run: curl -s -m 5 http://controlplane:${NODEPORT}/
    expect: { contains: "${APP} is up" }
    weight: 2
    retrySeconds: 60
  - id: cm
    description: the Pod mounts ConfigMap ${APP}-config
    type: kubectl
    run: kubectl -n ${NS} get deployment ${APP} -o jsonpath='{.spec.template.spec.volumes[?(@.name=="nginx-config-volume")].configMap.name}'
    expect: { equals: "${APP}-config" }
    weight: 1
hints:
  - "kubectl -n ${NS} describe pod <pod> Events: FailedMount usually names a missing ConfigMap."
  - "Compare the volume configMap.name with kubectl -n ${NS} get configmap."
