id: kk2-probe-template
title: Fix and apply a broken probe template
domain: troubleshooting
difficulty: 2
estimatedMinutes: 8
points: 5
tags: [troubleshooting, probes, pod, liveness]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 60
variables:
  POD: { oneOf: [ red-probe, amber-probe, health-probe ] }
setup:
  - node: controlplane
    script: setup/break.sh
checks:
  - id: running
    description: Pod ${POD} is Running with 0 restarts
    type: kubectl
    run: kubectl get pod ${POD} -o jsonpath='{.status.phase}/{.status.containerStatuses[0].restartCount}'
    expect: { equals: "Running/0" }
    weight: 2
    retrySeconds: 90
  - id: probe-exec
    description: the liveness probe is exec (not httpGet)
    type: kubectl
    run: kubectl get pod ${POD} -o jsonpath='{.spec.containers[0].livenessProbe.exec.command[0]}/{.spec.containers[0].livenessProbe.httpGet}'
    expect: { equals: "cat/" }
    weight: 1
  # The outcome, not one fix: a probe that fires before /healthcheck exists restarts the container within seconds.
  - id: stable
    description: the container of ${POD} has run for 20 seconds or more without a restart
    type: kubectl
    run: |
      s=$(kubectl get pod ${POD} -o jsonpath='{.status.containerStatuses[0].state.running.startedAt}')
      r=$(kubectl get pod ${POD} -o jsonpath='{.status.containerStatuses[0].restartCount}')
      [ -n "$s" ] && [ "$r" = 0 ] && echo $(( $(date +%s) - $(date -d "$s" +%s) ))
    expect: { gte: 20 }
    weight: 1
    retrySeconds: 90
  - id: args
    description: the container args were not changed
    type: kubectl
    run: kubectl get pod ${POD} -o jsonpath='{.spec.containers[0].args[*]}'
    expect: { equals: "-c sleep 3 ; touch /healthcheck; sleep 30; sleep 30000" }
    weight: 1
hints:
  - "kubectl apply -f /opt/course/${POD}.yaml shows the validation error; fix the probe type first."
  - "After the Pod starts, watch restarts and kubectl describe pod / get events for Unhealthy liveness failures."
  - "Do not change the args: section. Compare when the probe first runs with when the args create the file it reads."
