  - id: q12
    title: Autoscaler ${Q12_APP} not working
    points: 7
    context: k8s-beta
    setup:
      - node: controlplane
        script: setup/q12.sh
        timeoutSeconds: 800
    setupStage: 1
    checks:
      - id: q12-hpa-spec
        description: the autoscaler targets Deployment ${Q12_APP} between 2 and 6 replicas at 50% CPU
        type: kubectl
        run: kubectl -n ${Q12_NS} get hpa ${Q12_APP} -o jsonpath='{.spec.scaleTargetRef.kind}/{.spec.scaleTargetRef.name}/{.spec.minReplicas}/{.spec.maxReplicas}/{.spec.metrics[?(@.resource.name=="cpu")].resource.target.averageUtilization}'
        expect: { equals: "Deployment/${Q12_APP}/2/6/50" }
        weight: 1
      - id: q12-hpa-active
        description: the autoscaler reads current metrics (ScalingActive)
        type: kubectl
        run: kubectl -n ${Q12_NS} get hpa ${Q12_APP} -o jsonpath='{.status.conditions[?(@.type=="ScalingActive")].status}'
        expect: { equals: "True" }
        weight: 2
        retrySeconds: 120
      - id: q12-hpa-metric
        description: it reports the current CPU utilization
        type: kubectl
        run: kubectl -n ${Q12_NS} get hpa ${Q12_APP} -o jsonpath='{.status.currentMetrics[?(@.resource.name=="cpu")].resource.current.averageUtilization}' | grep -qE '^[0-9]+$' && echo yes || echo no
        expect: { equals: yes }
        weight: 1
        retrySeconds: 120
      - id: q12-ready
        description: ${Q12_APP} has at least 2 ready replicas
        type: kubectl
        run: kubectl -n ${Q12_NS} get deployment ${Q12_APP} -o jsonpath='{.status.readyReplicas}'
        expect: { gte: 2 }
        weight: 1
        retrySeconds: 60
      - id: q12-spec
        description: ${Q12_APP} keeps its image and has a CPU request
        type: kubectl
        run: kubectl -n ${Q12_NS} get deployment ${Q12_APP} -o jsonpath='{.spec.template.spec.containers[0].image} {.spec.template.spec.containers[0].resources.requests.cpu}'
        expect: { matches: ^nginx:1\.27-alpine \S+$ }
        weight: 1
      - id: q12-same-deployment
        description: ${Q12_APP} was not deleted or recreated
        type: kubectl
        run: "[ \"$(kubectl -n ${Q12_NS} get deployment ${Q12_APP} -o jsonpath='{.metadata.uid}')\" = \"$(cat /var/tmp/cka-q12.uid)\" ] && echo same || echo recreated"
        expect: { equals: same }
        weight: 1
    hints:
      - "kubectl -n ${Q12_NS} get hpa ${Q12_APP}: TARGETS shows <unknown> when the autoscaler cannot read metrics; MINPODS and MAXPODS show its range."
      - "kubectl -n ${Q12_NS} describe hpa ${Q12_APP}: the Conditions and Events say why it cannot scale."
      - "kubectl top pods -n ${Q12_NS}: when this fails, the problem is the metrics pipeline (kubectl get apiservice, then the Deployment and Service behind it), not the autoscaler."
    recipe: { category: hpa }
  - id: q13
    title: Unhealthy worker
    points: 6
    context: k8s-gamma
    setup:
      - node: controlplane
        script: setup/q13.sh
      - node: worker-1
        script: setup/q13-2.sh
      - node: worker-2
        script: setup/q13-3.sh
      - node: controlplane
        script: setup/q13-4.sh
        timeoutSeconds: 300
    setupStage: 2
    checks:
      - id: q13-all-ready
        description: every node is Ready
        type: kubectl
        run: kubectl get nodes -o jsonpath='{range .items[*]}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}' | sort -u | tr '\n' ' '
        expect: { equals: "True" }
        weight: 2
        retrySeconds: 90
      - id: q13-schedulable
        description: no worker is cordoned or carries a NoSchedule taint
        type: kubectl
        run: kubectl get nodes -l '!node-role.kubernetes.io/control-plane' -o jsonpath='{range .items[*]}{.spec.unschedulable} {range .spec.taints[*]}{.key}={.effect} {end}{"\n"}{end}' | tr ' ' '\n' | grep -vE '^$|^dedicated=' | grep -cE 'true|NoSchedule|NoExecute' || true
        expect: { equals: "0" }
        weight: 1
        retrySeconds: 30
      - id: q13-services-worker-1
        description: kubelet and containerd are running and enabled on worker-1
        type: ssh
        node: worker-1
        run: echo $(systemctl is-active kubelet containerd) $(systemctl is-enabled kubelet containerd) | tr ' ' '\n' | sort -u | tr '\n' ' '
        expect: { equals: active enabled }
        weight: 1
      - id: q13-services-worker-2
        description: kubelet and containerd are running and enabled on worker-2
        type: ssh
        node: worker-2
        run: echo $(systemctl is-active kubelet containerd) $(systemctl is-enabled kubelet containerd) | tr ' ' '\n' | sort -u | tr '\n' ' '
        expect: { equals: active enabled }
        weight: 1
      - id: q13-probe
        description: node-probe has a ready Pod on every worker
        type: kubectl
        run: kubectl -n ${Q13_NS} get daemonset node-probe -o jsonpath='{.status.numberReady}/{.status.desiredNumberScheduled}/{.status.updatedNumberScheduled}'
        expect: { equals: 2/2/2 }
        weight: 1
        retrySeconds: 90
    hints:
      - "kubectl get nodes, then kubectl describe node <node>: Conditions, Taints and Unschedulable tell you whether the node is down or only refuses Pods."
      - kubectl -n ${Q13_NS} get pods -o wide shows which worker is missing its probe Pod.
      - "On a NotReady node: systemctl status kubelet containerd, then journalctl -u kubelet -n 50 (and -u containerd). Fix one error, restart, and read the log again."
      - systemctl cat kubelet shows the unit, its drop-ins and the files the kubelet reads. Compare paths and settings with what exists on the node and with a healthy worker.
      - systemctl is-enabled tells you whether a service comes back after a reboot.
    recipe: { category: nodes }
  - id: q14
    title: Deployment ${Q14_NAME}
    points: 13
    context: k8s-delta
    setup:
      - node: controlplane
        script: setup/q14.sh
        lane: q14
    checks:
      - id: q14-ready
        description: Deployment ${Q14_NAME} has ${Q14_REPLICAS} ready replicas
        type: kubectl
        run: kubectl -n ${Q14_NS} get deployment ${Q14_NAME} -o jsonpath='{.status.readyReplicas}'
        expect: { equals: "${Q14_REPLICAS}" }
        weight: 2
        retrySeconds: 30
      - id: q14-expose-service
        description: Service ${Q14_NAME} is a ${Q14_EXPOSE_TYPE} mapping port ${Q14_EXPOSE_PORT} to 80
        type: kubectl
        run: kubectl -n ${Q14_NS} get svc ${Q14_NAME} -o jsonpath='{.spec.type}/{.spec.ports[0].port}/{.spec.ports[0].targetPort}'
        expect: { equals: "${Q14_EXPOSE_TYPE}/${Q14_EXPOSE_PORT}/80" }
        weight: 1
      - id: q14-expose-reachable
        description: Service ${Q14_NAME} answers HTTP 200 on port ${Q14_EXPOSE_PORT}
        type: kubectl
        run: curl -s -m 5 -o /dev/null -w '%{http_code}' "http://$(kubectl -n ${Q14_NS} get svc ${Q14_NAME} -o jsonpath='{.spec.clusterIP}'):${Q14_EXPOSE_PORT}/"
        expect: { equals: "200" }
        weight: 2
        retrySeconds: 30
      - id: q14-place-selector
        description: the Pods select disk=${Q14_PLACE_DISK}
        type: kubectl
        run: kubectl -n ${Q14_NS} get deployment/${Q14_NAME} -o jsonpath='{.spec.template.spec.nodeSelector.disk}'
        expect: { equals: "${Q14_PLACE_DISK}" }
        weight: 1
      - id: q14-place-nodes
        description: every Pod runs on ${Q14_PLACE_NODE}
        type: kubectl
        run: kubectl -n ${Q14_NS} get pods -l app=${Q14_NAME} --field-selector=status.phase=Running -o jsonpath='{range .items[*]}{.spec.nodeName}{"\n"}{end}' | sort -u | tr '\n' ' '
        expect: { equals: "${Q14_PLACE_NODE}" }
        weight: 1
      - id: q14-sa-spec
        description: the Pods use ${Q14_SA_SA} with automountServiceAccountToken false
        type: kubectl
        run: kubectl -n ${Q14_NS} get deployment/${Q14_NAME} -o jsonpath='{.spec.template.spec.serviceAccountName}/{.spec.template.spec.automountServiceAccountToken}'
        expect: { equals: "${Q14_SA_SA}/false" }
        weight: 1
      - id: q14-sa-no-token
        description: no token is mounted in the Pods
        type: kubectl
        run: kubectl -n ${Q14_NS} exec deployment/${Q14_NAME} -- sh -c 'ls /var/run/secrets/kubernetes.io/serviceaccount 2>/dev/null | wc -l'
        expect: { equals: "0" }
        weight: 1
        retrySeconds: 30
      - id: q14-set-resources
        description: request ${Q14_SETRES_CPU} CPU, limit ${Q14_SETRES_MEMORY} memory
        type: kubectl
        run: kubectl -n ${Q14_NS} get deployment/${Q14_NAME} -o jsonpath='{.spec.template.spec.containers[0].resources.requests.cpu}/{.spec.template.spec.containers[0].resources.limits.memory}'
        expect: { equals: "${Q14_SETRES_CPU}/${Q14_SETRES_MEMORY}" }
        weight: 2
      - id: q14-update-image
        description: ${Q14_NAME} runs ${Q14_UPDATE_IMAGE}
        type: kubectl
        run: kubectl -n ${Q14_NS} get deployment/${Q14_NAME} -o jsonpath='{.spec.template.spec.containers[0].image}'
        expect: { equals: "${Q14_UPDATE_IMAGE}" }
        weight: 1
      - id: q14-update-revision
        description: ${Q14_NAME} was updated in place (revision 2 or later)
        type: kubectl
        run: kubectl -n ${Q14_NS} get deployment ${Q14_NAME} -o jsonpath='{.metadata.annotations.deployment\.kubernetes\.io/revision}'
        expect: { gte: 2 }
        weight: 1
    hints:
      - kubectl -n ${Q14_NS} create deployment ${Q14_NAME} --image=${Q14_IMAGE} --replicas=${Q14_REPLICAS} --dry-run=client -o yaml gives you a manifest to start from.
      - kubectl -n ${Q14_NS} expose deployment ${Q14_NAME} --type=${Q14_EXPOSE_TYPE} --port=${Q14_EXPOSE_PORT} --target-port=80
      - kubectl get nodes -L disk shows which node has the label. Set spec.template.spec.nodeSelector.
      - "kubectl -n ${Q14_NS} create serviceaccount ${Q14_SA_SA}; then serviceAccountName and automountServiceAccountToken: false in the Pod spec."
      - kubectl -n ${Q14_NS} set resources deployment/${Q14_NAME} --requests=cpu=${Q14_SETRES_CPU} --limits=memory=${Q14_SETRES_MEMORY}
      - kubectl -n ${Q14_NS} set image deployment/${Q14_NAME} <container>=${Q14_UPDATE_IMAGE}, then kubectl rollout status.
    recipe: { builder: deployment, parts: [ expose, node-selector, service-account, set-resources, update-image ] }
  - id: q15
    title: Pods of ${Q15_APP} keep restarting
    points: 7
    context: k8s-ops
    setup:
      - node: controlplane
        script: setup/q15.sh
        timeoutSeconds: 400
        lane: q15
    checks:
      - id: q15-ready
        description: ${Q15_APP} has 2 up-to-date, ready replicas
        type: kubectl
        run: kubectl -n ${Q15_NS} get deployment ${Q15_APP} -o jsonpath='{.status.readyReplicas}/{.status.updatedReplicas}/{.status.replicas}'
        expect: { equals: 2/2/2 }
        weight: 2
        retrySeconds: 90
      - id: q15-stable
        description: ${Q15_APP}'s Pods do not restart over 40 seconds
        type: kubectl
        run: r() { kubectl -n ${Q15_NS} get pods -l app=${Q15_APP} --field-selector=status.phase=Running -o jsonpath='{range .items[*]}{.metadata.name}={.status.containerStatuses[0].restartCount} {end}'; }; a=$(r); sleep 40; b=$(r); [ -n "$a" ] && [ "$a" = "$b" ] && echo stable || echo restarting
        expect: { equals: stable }
        weight: 2
        retrySeconds: 90
      - id: q15-liveness
        description: ${Q15_APP}'s container keeps a liveness probe
        type: kubectl
        run: "[ -n \"$(kubectl -n ${Q15_NS} get deployment ${Q15_APP} -o jsonpath='{.spec.template.spec.containers[0].livenessProbe}')\" ] && echo probe || echo none"
        expect: { equals: probe }
        weight: 1
      - id: q15-kept
        description: ${Q15_APP} keeps its image, command and arguments
        type: kubectl
        run: c=$(kubectl -n ${Q15_NS} get deployment ${Q15_APP} -o jsonpath='{.spec.template.spec.containers[0].command}|{.spec.template.spec.containers[0].args}'); i=$(kubectl -n ${Q15_NS} get deployment ${Q15_APP} -o jsonpath='{.spec.template.spec.containers[0].image}'); [ "$c" = "$(cat /var/tmp/cka-q15.cmd)" ] && [ "$i" = "nginx:1.27-alpine" ] && echo kept || echo changed
        expect: { equals: kept }
        weight: 1
      - id: q15-same-deployment
        description: ${Q15_APP} was not deleted or recreated
        type: kubectl
        run: "[ \"$(kubectl -n ${Q15_NS} get deployment ${Q15_APP} -o jsonpath='{.metadata.uid}')\" = \"$(cat /var/tmp/cka-q15.uid)\" ] && echo same || echo recreated"
        expect: { equals: same }
        weight: 1
    hints:
      - "kubectl -n ${Q15_NS} get pods -l app=${Q15_APP}: the RESTARTS and STATUS columns show how often and how the containers die."
      - "kubectl -n ${Q15_NS} describe pod <pod>: Last State gives the exit reason and code, and the Events show kills and probe failures."
      - kubectl -n ${Q15_NS} logs <pod> --previous shows what the container said before it exited or was killed.
      - "A container can be killed by the kubelet even though the app is fine: compare what each probe checks, and when, with what the app does and how long it takes to start."
    recipe: { category: restarts }
  - id: q16
    title: Frontend cannot reach ${Q16_APP}
    points: 7
    context: k8s-infra
    setup:
      - node: controlplane
        script: setup/q16.sh
        timeoutSeconds: 800
        lane: q16
    checks:
      - id: q16-reachable
        description: client gets the nginx page from http://${Q16_APP}
        type: kubectl
        run: kubectl -n ${Q16_NS} exec client -- wget -qO- -T 3 http://${Q16_APP}
        expect: { contains: nginx }
        weight: 3
        retrySeconds: 30
      - id: q16-stranger-blocked
        description: stranger still cannot reach ${Q16_APP}
        type: kubectl
        run: kubectl -n ${Q16_NS} exec stranger -- wget -qO- -T 3 http://${Q16_APP} >/dev/null 2>&1 && echo open || echo blocked
        expect: { equals: blocked }
        weight: 2
      - id: q16-default-deny
        description: default-deny still selects every Pod for ingress and egress
        type: kubectl
        run: kubectl -n ${Q16_NS} get networkpolicy default-deny -o jsonpath='{.spec.podSelector.matchLabels}|{.spec.policyTypes[*]}|{.spec.ingress}{.spec.egress}'
        expect: { equals: "|Ingress Egress|" }
        weight: 1
      - id: q16-ingress-rule
        description: ${Q16_APP}-ingress allows role=frontend on port 80
        type: kubectl
        run: kubectl -n ${Q16_NS} get networkpolicy ${Q16_APP}-ingress -o jsonpath='{.spec.ingress[0].from[0].podSelector.matchLabels.role} {.spec.ingress[0].ports[0].port}'
        expect: { equals: frontend 80 }
        weight: 1
    hints:
      - "kubectl -n ${Q16_NS} get networkpolicy, then kubectl -n ${Q16_NS} describe networkpolicy <name> for each: which Pods does it select, and what does it let in or out?"
      - "Separate name resolution from the connection: kubectl -n ${Q16_NS} exec client -- nslookup ${Q16_APP}, then wget the Service IP and a Pod IP directly."
      - A connection needs egress allowed at the client and ingress allowed at the server, on the port the Pod listens on. Check both ends.
      - "Compare every selector with the real labels: kubectl get pods -A --show-labels and kubectl get ns --show-labels."
    recipe: { category: netpol }
  - id: q17
    title: ${Q17_APP} unreachable through the ingress
    points: 7
    context: k8s-prod
    setup:
      - node: controlplane
        script: setup/q17.sh
        timeoutSeconds: 400
    setupStage: 1
    checks:
      - id: q17-ingress-serves
        description: www.${Q17_NS}.lab returns the nginx welcome page
        type: kubectl
        run: 'curl -s -m 5 -H "Host: www.${Q17_NS}.lab" http://controlplane:30080/'
        expect: { contains: Welcome to nginx }
        weight: 2
        retrySeconds: 30
      - id: q17-route-serves
        description: api.${Q17_NS}.lab returns the nginx welcome page
        type: kubectl
        run: 'curl -s -m 5 -H "Host: api.${Q17_NS}.lab" http://controlplane:30080/'
        expect: { contains: Welcome to nginx }
        weight: 2
        retrySeconds: 30
      - id: q17-spec-ingress
        description: Ingress ${Q17_APP} still serves host www.${Q17_NS}.lab
        type: kubectl
        run: kubectl -n ${Q17_NS} get ingress ${Q17_APP} -o jsonpath='{.spec.rules[0].host}'
        expect: { equals: "www.${Q17_NS}.lab" }
        weight: 1
      - id: q17-spec-route
        description: HTTPRoute ${Q17_APP} still serves host api.${Q17_NS}.lab
        type: kubectl
        run: kubectl -n ${Q17_NS} get httproute ${Q17_APP} -o jsonpath='{.spec.hostnames[0]}'
        expect: { equals: "api.${Q17_NS}.lab" }
        weight: 1
      - id: q17-spec-backend
        description: Deployment and Service ${Q17_APP} are unchanged
        type: kubectl
        run: echo $(kubectl -n ${Q17_NS} get deployment ${Q17_APP} -o jsonpath='{.spec.replicas} {.spec.template.metadata.labels.app}') $(kubectl -n ${Q17_NS} get svc ${Q17_APP} -o jsonpath='{.spec.selector.app} {.spec.ports[0].port}')
        expect: { equals: "2 ${Q17_APP} ${Q17_APP} 80" }
        weight: 1
    hints:
      - "curl -v both hosts: Traefik answers 404 when no router matches the request, and 5xx when a router matches but its backend is broken."
      - "kubectl -n ${Q17_NS} describe ingress ${Q17_APP} and kubectl -n ${Q17_NS} describe httproute ${Q17_APP}: read the Status conditions and the Events, then compare every name, host, path and port with what really exists."
      - kubectl get ingressclass,gatewayclass and kubectl get gateway -A -o yaml show which classes, Gateways and listeners exist and what they accept.
      - "When every host fails at once, suspect the controller rather than the objects: kubectl -n traefik get deploy,pods,svc, and the controller each IngressClass names."
    recipe: { category: ingress }
