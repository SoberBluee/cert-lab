  - id: q11
    title: Helm release ${Q11_REL}
    points: 5
    context: k8s-green
    setup:
      - node: controlplane
        script: setup/q11.sh
        lane: q11
    checks:
      - type: kubectl
        id: q11-ready
        description: 2 replica(s) of ${Q11_REL} are ready
        run: kubectl -n ${Q11_NS} get deployment -l app.kubernetes.io/instance=${Q11_REL} -o jsonpath='{.items[0].status.readyReplicas}'
        expect: { equals: "2" }
        weight: 1
        retrySeconds: 90
      - id: q11-manifest
        description: /opt/course/helm/${Q11_REL}-manifest.yaml holds the release's Deployment
        type: ssh
        node: controlplane
        run: "grep -q 'kind: Deployment' \"/opt/course/helm/${Q11_REL}-manifest.yaml\" 2>/dev/null && grep -q 'app.kubernetes.io/instance: ${Q11_REL}' \"/opt/course/helm/${Q11_REL}-manifest.yaml\" && echo ok || echo missing"
        expect: { equals: ok }
        weight: 1
      - type: kubectl
        id: q11-upgraded
        description: release ${Q11_REL} is deployed from chart webapp-2.0.0
        run: helm -n ${Q11_NS} list -o json | jq -r '.[] | select(.name == "${Q11_REL}") | .status + "/" + .chart'
        expect: { equals: deployed/webapp-2.0.0 }
