id: ts-exam-2-easy-to-hard
title: "Troubleshooting exam 2: easy to hard"
domain: troubleshooting
difficulty: 3
estimatedMinutes: 57
points: 40
tags: [ troubleshooting, configmap, secret, volumes, security-context, rbac, serviceaccount, role, rolebinding, cronjob, job, networkpolicy, dns, node, kubelet, kubeconfig, systemd, kube-apiserver, static-pod, certificates ]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 60
draft: false
variables:
  Q1_NS: { oneOf: [ brochure, docs, landing ] }
  Q1_APP: { oneOf: [ site, welcome, promo ] }
  Q1_FAULT: { oneOf: [ configmap-volume-missing, secret-items-key, mount-path, run-as-non-root, readonly-root ], hidden: true }
  Q2_NS: { oneOf: [ monitoring, audit, reports ] }
  Q2_APP: { oneOf: [ inventory, watcher, auditor ] }
  Q2_FAULT: { oneOf: [ role-verb, role-resource, binding-subject-ns, binding-role-ref, wrong-sa, automount-off ], hidden: true }
  Q3_NS: { oneOf: [ batch, nightly, reports ] }
  Q3_APP: { oneOf: [ report, cleanup, export ] }
  Q3_FAULT: { oneOf: [ suspended, never-schedule, deadline, backoff-zero-command, image-registry ], hidden: true }
  Q4_NS: { oneOf: [ secure, payments, vault ] }
  Q4_APP: { oneOf: [ api, ledger, billing ] }
  Q4_FAULT: { oneOf: [ dns-egress-port, dns-namespace-selector, ingress-port, ingress-from-label, egress-to-label ], hidden: true }
  Q5_NS: { oneOf: [ fleet, edge, infra ] }
  Q5_FAULT: { oneOf: [ kubelet-kubeconfig-server, kubelet-client-ca, runtime-endpoint, kubelet-config-flag ], hidden: true }
  Q5_NODE: { oneOf: [ worker-1, worker-2 ], hidden: true }
  Q6_NS: { oneOf: [ ops, core, mgmt ] }
  Q6_FAULT: { oneOf: [ kubeconfig-server-port, kubeconfig-wrong-ca, apiserver-client-ca, apiserver-secure-port, apiserver-manifest-yaml ], hidden: true }
solution:
  - node: controlplane
    script: setup/q6-solution.sh
    timeoutSeconds: 900
  - node: worker-1
    script: setup/q5-solution.sh
  - node: worker-2
    script: setup/q5-solution-2.sh
  - node: controlplane
    script: solution.sh
tasks:
  - id: q1
    title: Deployment ${Q1_APP} does not serve its page
    points: 6
    setup:
      - node: controlplane
        script: setup/q1.sh
        timeoutSeconds: 400
        lane: q1
    checks:
      - id: q1-ready
        description: ${Q1_APP} has 2 ready replicas
        type: kubectl
        run: kubectl -n ${Q1_NS} get deployment ${Q1_APP} -o jsonpath='{.status.readyReplicas}/{.status.updatedReplicas}/{.status.replicas}'
        expect: { equals: 2/2/2 }
        weight: 2
        retrySeconds: 60
      - id: q1-page
        description: ${Q1_APP} serves the page from ${Q1_APP}-content
        type: kubectl
        run: kubectl -n ${Q1_NS} exec deployment/${Q1_APP} -- wget -qO- -T 3 http://localhost:80/
        expect: { contains: "${Q1_APP} is up" }
        weight: 2
        retrySeconds: 30
      - id: q1-token
        description: the token from ${Q1_APP}-secret is readable at /etc/${Q1_APP}/token
        type: kubectl
        run: kubectl -n ${Q1_NS} exec deployment/${Q1_APP} -- cat /etc/${Q1_APP}/token
        expect: { equals: "s3cr3t-${Q1_APP}" }
        weight: 1
        retrySeconds: 30
      - id: q1-spec-volumes
        description: the volumes still come from a ConfigMap and the Secret
        type: kubectl
        run: kubectl -n ${Q1_NS} get deployment ${Q1_APP} -o jsonpath='{.spec.template.spec.containers[0].image} {.spec.template.spec.volumes[?(@.configMap)].configMap.name} {.spec.template.spec.volumes[?(@.secret)].secret.secretName}'
        expect: { matches: "^nginx:1.27-alpine \\S+ ${Q1_APP}-secret$" }
        weight: 1
    hints:
      - "kubectl -n ${Q1_NS} get pods -l app=${Q1_APP}: are the Pods Pending, ContainerCreating, crashing, or running but not ready?"
      - "kubectl -n ${Q1_NS} describe pod <pod>: the Events name mount and container start errors."
      - kubectl -n ${Q1_NS} logs <pod> (or --previous) shows why nginx exits; kubectl -n ${Q1_NS} exec deploy/${Q1_APP} -- ls -l /usr/share/nginx/html /etc/${Q1_APP} shows what a running container really sees.
      - Compare the volumes and volumeMounts of the Deployment with the ConfigMaps and Secrets that exist and the keys they hold; check the ConfigMap content too, not only its name.
  - id: q2
    title: ${Q2_APP} cannot list Pods
    points: 6
    setup:
      - node: controlplane
        script: setup/q2.sh
        timeoutSeconds: 400
        lane: q2
    checks:
      - id: q2-can-list
        description: ${Q2_APP}-sa may list Pods in ${Q2_NS}
        type: kubectl
        run: kubectl auth can-i list pods -n ${Q2_NS} --as=system:serviceaccount:${Q2_NS}:${Q2_APP}-sa
        expect: { equals: yes }
        weight: 2
      - id: q2-logs-200
        description: ${Q2_APP}'s latest call returned 200
        type: kubectl
        run: kubectl -n ${Q2_NS} logs deployment/${Q2_APP} --tail=1
        expect: { equals: "200" }
        weight: 2
        retrySeconds: 60
      - id: q2-spec
        description: ${Q2_APP} runs as ${Q2_APP}-sa, and RoleBinding ${Q2_APP}-reader grants Role ${Q2_APP}-reader to it
        type: kubectl
        run: echo "$(kubectl -n ${Q2_NS} get deployment ${Q2_APP} -o jsonpath='{.spec.template.spec.serviceAccountName}') $(kubectl -n ${Q2_NS} get rolebinding ${Q2_APP}-reader -o jsonpath='{.roleRef.kind}/{.roleRef.name} {.subjects[*].namespace}/{.subjects[*].name}')"
        expect: { equals: "${Q2_APP}-sa Role/${Q2_APP}-reader ${Q2_NS}/${Q2_APP}-sa" }
        weight: 1
      - id: q2-least-privilege
        description: ${Q2_APP}-sa cannot delete Pods or read Secrets
        type: kubectl
        run: echo "$(kubectl auth can-i delete pods -n ${Q2_NS} --as=system:serviceaccount:${Q2_NS}:${Q2_APP}-sa) $(kubectl auth can-i get secrets -n ${Q2_NS} --as=system:serviceaccount:${Q2_NS}:${Q2_APP}-sa)"
        expect: { equals: no no }
        weight: 1
    hints:
      - "kubectl -n ${Q2_NS} logs deployment/${Q2_APP}: a 401, a 403 and a missing token point at different problems. A 403 names the account the API saw."
      - kubectl auth can-i list pods -n ${Q2_NS} --as=system:serviceaccount:${Q2_NS}:<account> answers for any account, without the Pod.
      - "Follow the chain from the Pod to the permission: which ServiceAccount the Pod runs as, which RoleBinding names that exact account, which Role the binding points at, and what that Role allows."
  - id: q3
    title: CronJob ${Q3_APP} never succeeds
    points: 6
    setup:
      - node: controlplane
        script: setup/q3.sh
        timeoutSeconds: 400
        lane: q3
    checks:
      - id: q3-succeeded
        description: a Job of ${Q3_APP} has completed
        type: kubectl
        run: kubectl -n ${Q3_NS} get cronjob ${Q3_APP} -o jsonpath='{.status.lastSuccessfulTime}'
        expect: { notEmpty: true }
        weight: 3
        retrySeconds: 150
      - id: q3-spec
        description: ${Q3_APP} runs every minute, is not suspended and keeps image busybox:1.36
        type: kubectl
        run: kubectl -n ${Q3_NS} get cronjob ${Q3_APP} -o jsonpath='{.spec.schedule}|{.spec.suspend}|{.spec.jobTemplate.spec.template.spec.containers[0].image}'
        expect: { matches: ^(\* \* \* \* \*|\*/1 \* \* \* \*)\|false\|busybox:1\.36$ }
        weight: 1
      - id: q3-output
        description: the newest successful Job of ${Q3_APP} printed "report done"
        type: kubectl
        run: j=$(kubectl -n ${Q3_NS} get jobs -o jsonpath='{range .items[?(@.status.succeeded==1)]}{.metadata.creationTimestamp} {.metadata.name}{"\n"}{end}' | sort | tail -1 | cut -d' ' -f2); [ -n "$j" ] && kubectl -n ${Q3_NS} logs "job/$j" 2>/dev/null || echo none
        expect: { contains: report done }
        weight: 1
        retrySeconds: 150
      - id: q3-same-cronjob
        description: ${Q3_APP} was not deleted or recreated
        type: kubectl
        run: "[ \"$(kubectl -n ${Q3_NS} get cronjob ${Q3_APP} -o jsonpath='{.metadata.uid}')\" = \"$(cat /var/tmp/cka-q3.uid)\" ] && echo same || echo recreated"
        expect: { equals: same }
        weight: 1
    hints:
      - "kubectl -n ${Q3_NS} get cronjob ${Q3_APP}: look at SUSPEND, SCHEDULE and LAST SCHEDULE. Has it created any Job at all?"
      - "kubectl -n ${Q3_NS} get jobs,pods: why did the Jobs fail? kubectl -n ${Q3_NS} describe job <job> shows the reason."
      - kubectl -n ${Q3_NS} logs <pod> and kubectl -n ${Q3_NS} describe pod <pod> show what the container did, or why it never started.
      - "To test a fix without waiting for the next minute: kubectl -n ${Q3_NS} create job test-run --from=cronjob/${Q3_APP}"
  - id: q4
    title: Frontend cannot reach ${Q4_APP}
    points: 7
    setup:
      - node: controlplane
        script: setup/q4.sh
        timeoutSeconds: 400
        lane: q4
    checks:
      - id: q4-reachable
        description: client gets the nginx page from http://${Q4_APP}
        type: kubectl
        run: kubectl -n ${Q4_NS} exec client -- wget -qO- -T 3 http://${Q4_APP}
        expect: { contains: nginx }
        weight: 3
        retrySeconds: 30
      - id: q4-stranger-blocked
        description: stranger still cannot reach ${Q4_APP}
        type: kubectl
        run: kubectl -n ${Q4_NS} exec stranger -- wget -qO- -T 3 http://${Q4_APP} >/dev/null 2>&1 && echo open || echo blocked
        expect: { equals: blocked }
        weight: 2
      - id: q4-default-deny
        description: default-deny still selects every Pod for ingress and egress
        type: kubectl
        run: kubectl -n ${Q4_NS} get networkpolicy default-deny -o jsonpath='{.spec.podSelector.matchLabels}|{.spec.policyTypes[*]}|{.spec.ingress}{.spec.egress}'
        expect: { equals: "|Ingress Egress|" }
        weight: 1
      - id: q4-ingress-rule
        description: ${Q4_APP}-ingress allows role=frontend on port 80
        type: kubectl
        run: kubectl -n ${Q4_NS} get networkpolicy ${Q4_APP}-ingress -o jsonpath='{.spec.ingress[0].from[0].podSelector.matchLabels.role} {.spec.ingress[0].ports[0].port}'
        expect: { equals: frontend 80 }
        weight: 1
    hints:
      - "kubectl -n ${Q4_NS} get networkpolicy, then kubectl -n ${Q4_NS} describe networkpolicy <name> for each: which Pods does it select, and what does it let in or out?"
      - "Separate name resolution from the connection: kubectl -n ${Q4_NS} exec client -- nslookup ${Q4_APP}, then wget the Service IP and a Pod IP directly."
      - A connection needs egress allowed at the client and ingress allowed at the server, on the port the Pod listens on. Check both ends.
      - "Compare every selector with the real labels: kubectl get pods -A --show-labels and kubectl get ns --show-labels."
  - id: q5
    title: Worker after a configuration change
    points: 7
    setup:
      - node: controlplane
        script: setup/q5.sh
      - node: worker-1
        script: setup/q5-2.sh
      - node: worker-2
        script: setup/q5-3.sh
      - node: controlplane
        script: setup/q5-4.sh
        timeoutSeconds: 300
    setupStage: 1
    checks:
      - id: q5-all-ready
        description: every node is Ready
        type: kubectl
        run: kubectl get nodes -o jsonpath='{range .items[*]}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}' | sort -u | xargs
        expect: { equals: "True" }
        weight: 3
        retrySeconds: 90
      - id: q5-kubelet-worker-1
        description: the kubelet is running and enabled on worker-1
        type: ssh
        node: worker-1
        run: echo $(systemctl is-active kubelet) $(systemctl is-enabled kubelet)
        expect: { equals: active enabled }
        weight: 1
      - id: q5-kubelet-worker-2
        description: the kubelet is running and enabled on worker-2
        type: ssh
        node: worker-2
        run: echo $(systemctl is-active kubelet) $(systemctl is-enabled kubelet)
        expect: { equals: active enabled }
        weight: 1
      - id: q5-agent
        description: node-agent has a ready Pod on every worker
        type: kubectl
        run: kubectl -n ${Q5_NS} get daemonset node-agent -o jsonpath='{.status.numberReady}/{.status.desiredNumberScheduled}'
        expect: { equals: 2/2 }
        weight: 2
        retrySeconds: 90
    hints:
      - "kubectl get nodes, then kubectl describe node <node>: which node is unhealthy, which condition, and since when?"
      - "On that node: systemctl status kubelet and journalctl -u kubelet -n 50. Is the kubelet crash-looping, or running but unable to do its job?"
      - systemctl cat kubelet shows the unit and drop-ins, and so every file and flag the kubelet starts with. Check each path and value against what exists on the node and against a healthy worker.
      - After editing a file, restart the kubelet (and run systemctl daemon-reload if you changed the unit).
  - id: q6
    title: kubectl stopped working
    points: 8
    setup:
      - node: controlplane
        script: setup/q6.sh
        timeoutSeconds: 400
    setupStage: 2
    checks:
      - id: q6-api-ready
        description: the API server reports ready
        type: kubectl
        run: kubectl get --raw /readyz
        expect: { equals: ok }
        weight: 2
        retrySeconds: 120
      - id: q6-user-kubectl
        description: kubectl works with /root/.kube/config and /home/ubuntu/.kube/config
        type: kubectl
        run: for f in /root/.kube/config /home/ubuntu/.kube/config; do kubectl --kubeconfig "$f" get --raw /readyz 2>/dev/null || echo fail; echo; done | xargs
        expect: { equals: ok ok }
        weight: 2
        retrySeconds: 60
      - id: q6-components
        description: node controlplane and its etcd, kube-apiserver, kube-controller-manager and kube-scheduler are Ready
        type: kubectl
        run: "{ kubectl get node controlplane -o jsonpath='controlplane={.status.conditions[?(@.type==\"Ready\")].status}{\"\\n\"}'; kubectl -n kube-system get pods -l tier=control-plane -o jsonpath='{range .items[*]}{.metadata.name}={.status.conditions[?(@.type==\"Ready\")].status}{\"\\n\"}{end}' | sort; } | xargs"
        expect: { equals: controlplane=True etcd-controlplane=True kube-apiserver-controlplane=True kube-controller-manager-controlplane=True kube-scheduler-controlplane=True }
        weight: 2
        retrySeconds: 120
      - id: q6-web-ready
        description: web runs 2 ready replicas
        type: kubectl
        run: kubectl -n ${Q6_NS} get deployment web -o jsonpath='{.spec.replicas}/{.status.readyReplicas}'
        expect: { equals: 2/2 }
        weight: 1
        retrySeconds: 120
      - id: q6-manifests
        description: /etc/kubernetes/manifests holds only the four control plane manifests
        type: ssh
        node: controlplane
        run: ls /etc/kubernetes/manifests | sort | xargs
        expect: { equals: etcd.yaml kube-apiserver.yaml kube-controller-manager.yaml kube-scheduler.yaml }
        weight: 1
    hints:
      - 'Read the exact kubectl error: "connection refused", "x509: certificate signed by unknown authority" and a hang point at different places.'
      - Is the API server up at all? curl -k https://127.0.0.1:6443/readyz, ss -ltnp | grep 6443, and crictl ps -a | grep kube-apiserver (as root).
      - "If the kube-apiserver container is missing or keeps exiting: crictl logs <container-id>, journalctl -u kubelet | grep -i apiserver, and compare the flags in /etc/kubernetes/manifests/kube-apiserver.yaml with the files in /etc/kubernetes/pki."
      - "If the API server is healthy, the kubeconfig is wrong: compare the server and certificate-authority-data in ~/.kube/config with /etc/kubernetes/admin.conf (kubectl config view --raw)."
