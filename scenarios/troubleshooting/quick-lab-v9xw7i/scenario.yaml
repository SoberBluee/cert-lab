id: quick-lab-v9xw7i
title: "Quick lab: Node drain"
domain: troubleshooting
difficulty: 2
estimatedMinutes: 10
points: 8
tags: [ troubleshooting, drain, pdb, disruption ]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 60
draft: true
variables:
  Q1_NS: { oneOf: [ maintain, fleet, ops, upgrade, rolling, cluster-ops, node-ops, infra, platform, sre ] }
  Q1_APP: { oneOf: [ checkout, cart, orders, payments, inventory, shipping, notify, search, catalog, loyalty ] }
  Q1_FAULT: { oneOf: [ pdb-min-available, pdb-max-unavailable-0, pinned-node-selector, replica-anti-affinity, bare-pod, emptydir-pod ], hidden: true }
  Q1_NODE: { oneOf: [ worker-1, worker-2 ], hidden: true }
tasks:
  - id: q1
    title: Node drain is stuck
    points: 8
    setup:
      - node: controlplane
        script: setup/q1.sh
        timeoutSeconds: 400
    checks:
      - id: q1-cordoned
        description: exactly one worker is cordoned
        type: kubectl
        run: kubectl get nodes -l '!node-role.kubernetes.io/control-plane' -o jsonpath='{range .items[*]}{.spec.unschedulable}{"\n"}{end}' | grep -c '^true$' || true
        expect: { equals: "1" }
        weight: 2
      - id: q1-right-node
        description: the cordoned worker is the one labelled maintenance=due
        type: kubectl
        run: kubectl get nodes -l maintenance=due -o jsonpath='{range .items[*]}{.spec.unschedulable}{end}'
        expect: { equals: "true" }
        weight: 2
      - id: q1-empty
        description: no Pod of ${Q1_NS} remains on a cordoned worker
        type: kubectl
        run: kubectl -n ${Q1_NS} get pods -o jsonpath='{range .items[*]}{.spec.nodeName}{"\n"}{end}' | sort -u | xargs -I{} kubectl get node {} -o jsonpath='{.spec.unschedulable}{"\n"}' | grep -c '^true$' || true
        expect: { equals: "0" }
        weight: 2
        retrySeconds: 60
      - id: q1-ready
        description: ${Q1_APP} still has 2 ready replicas
        type: kubectl
        run: kubectl -n ${Q1_NS} get deployment ${Q1_APP} -o jsonpath='{.status.readyReplicas}'
        expect: { equals: "2" }
        weight: 2
        retrySeconds: 120
    hints:
      - kubectl get nodes -l maintenance=due names the worker; kubectl -n ${Q1_NS} get pods -o wide shows what runs on it.
      - "kubectl drain <node> --ignore-daemonsets reports every Pod it will not evict, and why: read each line. Some blockers only need a flag; others need a change."
      - "Evictions respect PodDisruptionBudgets: kubectl -n ${Q1_NS} get pdb shows ALLOWED DISRUPTIONS."
      - "An evicted Pod is recreated by its controller: if a replacement stays Pending, kubectl -n ${Q1_NS} describe pod says what keeps it off the other nodes."
    recipe: { category: drain }
