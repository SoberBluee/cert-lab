id: worker-node-configuration-test
title: Worker node configuration test
domain: troubleshooting
difficulty: 3
estimatedMinutes: 12
points: 7
tags: [ troubleshooting, node, kubelet, kubeconfig, systemd ]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 60
variables:
  Q1_NS: { oneOf: [ fleet, edge, infra, nodes, config, workers, daemon, system, host-ops, platform ] }
  Q1_FAULT: { oneOf: [ kubelet-kubeconfig-server, kubelet-client-ca, runtime-endpoint, kubelet-config-flag, kubelet-kubeconfig-flag, kubelet-serving-cert, kubelet-max-pods, kubelet-eviction-hard, kubelet-cgroup-driver, kubelet-resolv-empty, kubelet-hairpin-mode ], hidden: true }
  Q1_NODE: { oneOf: [ worker-1, worker-2 ], hidden: true }
solution:
  - node: worker-1
    script: setup/q1-solution.sh
  - node: worker-2
    script: setup/q1-solution-2.sh
  - node: controlplane
    script: solution.sh
tasks:
  - id: q1
    title: Worker after a configuration change
    points: 7
    setup:
      - node: controlplane
        script: setup/q1.sh
      - node: worker-1
        script: setup/q1-2.sh
      - node: worker-2
        script: setup/q1-3.sh
      - node: controlplane
        script: setup/q1-4.sh
        timeoutSeconds: 300
    checks:
      - id: q1-all-ready
        description: every node is Ready
        type: kubectl
        run: kubectl get nodes -o jsonpath='{range .items[*]}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}' | sort -u | xargs
        expect: { equals: "True" }
        weight: 2
        retrySeconds: 90
      - id: q1-memory-pressure
        description: no node is under MemoryPressure
        type: kubectl
        run: kubectl get nodes -o jsonpath='{range .items[*]}{.status.conditions[?(@.type=="MemoryPressure")].status}{"\n"}{end}' | sort -u | xargs
        expect: { equals: "False" }
        weight: 2
        retrySeconds: 90
      - id: q1-kubelet-worker-1
        description: the kubelet is running and enabled on worker-1
        type: ssh
        node: worker-1
        run: echo $(systemctl is-active kubelet) $(systemctl is-enabled kubelet)
        expect: { equals: active enabled }
        weight: 1
      - id: q1-kubelet-worker-2
        description: the kubelet is running and enabled on worker-2
        type: ssh
        node: worker-2
        run: echo $(systemctl is-active kubelet) $(systemctl is-enabled kubelet)
        expect: { equals: active enabled }
        weight: 1
      - id: q1-agent
        description: node-agent has a ready Pod on every worker
        type: kubectl
        run: kubectl -n ${Q1_NS} get daemonset node-agent -o jsonpath='{.status.numberReady}/{.status.desiredNumberScheduled}'
        expect: { equals: 2/2 }
        weight: 1
        retrySeconds: 90
    hints:
      - "kubectl get nodes, then kubectl describe node <node>: which node is unhealthy, which condition, and since when?"
      - "On that node: systemctl status kubelet and journalctl -u kubelet -n 50. Is the kubelet crash-looping, or running but unable to do its job? If it cannot reach the container runtime, check containerd the same way."
      - systemctl cat kubelet shows the unit and drop-ins, and so every file and flag the kubelet starts with. Check each path and value against what exists on the node and against a healthy worker.
      - After editing a file, restart the kubelet (and run systemctl daemon-reload if you changed the unit).
