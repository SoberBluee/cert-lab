id: quick-lab-qyp6xr
title: "Quick lab: Resource usage, logs and events"
domain: troubleshooting
difficulty: 1
estimatedMinutes: 6
points: 6
tags: [ kubectl-top, logs, sort-by, metrics-server, qos, crictl, events, api-resources ]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 30
draft: true
variables:
  Q1_NS: { oneOf: [ perf, telemetry, insights, observe, usage, capacity, watchtower, signals, probe-ns, stats ] }
tasks:
  - id: q1
    title: API resources and Roles
    points: 6
    setup:
      - node: controlplane
        script: setup/q1.sh
        lane: q1
    checks:
      - type: ssh
        node: controlplane
        id: q1-namespaced
        description: namespaced.txt lists exactly the namespaced resource types
        run: want=$(kubectl api-resources --namespaced=true -o name 2>/dev/null | sed 's/\..*//' | sort -u | xargs); have=$(awk 'NF && $1 != "NAME" {print $1}' /opt/course/api-resources/namespaced.txt 2>/dev/null | sed 's/\..*//' | sort -u | xargs); [ -n "$want" ] && [ "$have" = "$want" ] && echo match || echo differs
        expect: { equals: match }
        weight: 3
      - type: ssh
        node: controlplane
        id: q1-crowded
        description: crowded.txt names the ${Q1_NS}- namespace with the most Roles, and how many it has
        run: want=$(for ns in $(kubectl get namespaces -o name | sed 's|^namespace/||' | grep '^${Q1_NS}-'); do echo "$ns $(kubectl -n "$ns" get roles --no-headers 2>/dev/null | wc -l)"; done | sort -k2 -n | tail -1); [ -n "$want" ] && [ "$(awk 'NF {print $1, $2; exit}' /opt/course/api-resources/crowded.txt 2>/dev/null)" = "$want" ] && echo right || echo wrong
        expect: { equals: right }
        weight: 3
    hints:
      - kubectl api-resources lists every resource type the API server serves; --namespaced=true keeps the namespaced ones, and -o name prints only their names.
      - kubectl -n <namespace> get roles --no-headers | wc -l counts the Roles of one namespace; loop over the namespaces.
    recipe: { builder: observe, parts: [] }
