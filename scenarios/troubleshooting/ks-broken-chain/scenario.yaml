id: ks-broken-chain
title: "Killer-style: trace a broken request chain end to end"
domain: troubleshooting
difficulty: 3
estimatedMinutes: 20
points: 11
tags: [killer-style, multi-step, networkpolicy, dns, service, targetport, secret, crashloop, nodeport, re-rollable]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 30
variables:
  NS: { oneOf: [shop, orders, billing] }
  APP: { oneOf: [catalog, ledger, checkout] }
  NODEPORT: { range: [30200, 30999] }
  TOKEN: { random: 8 }
  DNS_FAULT: { oneOf: [no-dns, dns-port, api-port], hidden: true }
  API_FAULT: { oneOf: [secret-key, secret-name, image-tag], hidden: true }
  SVC_FAULT: { oneOf: [target-port, selector, port], hidden: true }
setup:
  - node: controlplane
    script: setup/break.sh
    timeoutSeconds: 400
checks:
  - id: end-to-end
    description: http://<controlplane>:${NODEPORT}/ returns the API payload through ${APP}-web
    type: kubectl
    run: curl -s -m 5 "http://$(kubectl get node controlplane -o jsonpath='{.status.addresses[?(@.type=="InternalIP")].address}'):${NODEPORT}/"
    expect: { contains: "api ok: ${TOKEN}" }
    weight: 3
    retrySeconds: 90
  - id: policy-kept
    description: ${APP}-web is ready and NetworkPolicy ${APP}-web-egress still selects it and restricts egress
    type: kubectl
    run: |
      [ "$(kubectl -n ${NS} get deployment ${APP}-web -o jsonpath='{.status.readyReplicas}')" = 1 ] || exit 1
      kubectl -n ${NS} get networkpolicy ${APP}-web-egress -o jsonpath='{.spec.podSelector.matchLabels.app}/{.spec.policyTypes[*]}'
    expect: { equals: "${APP}-web/Egress" }
    weight: 1
    retrySeconds: 60
  - id: egress-restricted
    description: ${APP}-web is ready but still cannot reach ${APP}-admin
    type: kubectl
    run: |
      [ "$(kubectl -n ${NS} get deployment ${APP}-web -o jsonpath='{.status.readyReplicas}')" = 1 ] || exit 1
      kubectl -n ${NS} exec deploy/${APP}-web -- wget -qO- -T 3 http://${APP}-admin >/dev/null 2>&1 && echo reachable || echo blocked
    expect: { equals: "blocked" }
    weight: 2
    retrySeconds: 60
  - id: secret-unchanged
    description: ${APP}-api is ready and Secret ${APP}-api-creds was not modified
    type: kubectl
    run: |
      [ "$(kubectl -n ${NS} get deployment ${APP}-api -o jsonpath='{.status.readyReplicas}')" = 1 ] || exit 1
      kubectl -n ${NS} get secret ${APP}-api-creds -o json | jq -r '(.data | keys | join(",")) + "/" + (.data.token | @base64d)'
    expect: { equals: "token/${TOKEN}" }
    retrySeconds: 60
    weight: 1
  - id: cause-egress
    description: causes.txt names what was wrong in the egress NetworkPolicy
    type: script
    node: controlplane
    script: checks/cause.sh
    args: [egress]
    expect: { equals: "found" }
    weight: 1
  - id: cause-api
    description: causes.txt names why the API Pods could not start
    type: script
    node: controlplane
    script: checks/cause.sh
    args: [api]
    expect: { equals: "found" }
    weight: 1
  - id: cause-service
    description: causes.txt names what was wrong with Service ${APP}-api
    type: script
    node: controlplane
    script: checks/cause.sh
    args: [service]
    expect: { equals: "found" }
    weight: 1
  - id: causes-lines
    description: causes.txt has exactly three non-empty lines
    type: ssh
    node: controlplane
    run: grep -c . /opt/course/chain/causes.txt 2>/dev/null || echo 0
    expect: { equals: "3" }
    weight: 1
hints:
  - "Start at the edge and walk inwards: NodePort Service, frontend Pods and their logs, then the Service they call, its endpoints, and the Pods behind it."
  - "nginx resolves proxy_pass hosts when it starts. 'host not found in upstream' with an existing Service means DNS itself is unreachable from that Pod. If nginx runs but times out, compare the egress rule's port with the port the API container listens on (a NetworkPolicy sees the Pod port)."
  - "kubectl describe pod on an API Pod says why it does not start. kubectl get endpointslices and the Service's selector, port and targetPort show whether the Service reaches it, on the port nginx calls (80)."
