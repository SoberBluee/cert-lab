id: ts-exam-easy-to-hard
title: "Troubleshooting exam: easy to hard"
domain: troubleshooting
difficulty: 3
estimatedMinutes: 54
points: 40
tags: [ troubleshooting, pods, deployment, service, endpoints, networkpolicy, pvc, pv, storageclass, ingress, gateway-api, httproute, node, kubelet, containerd, control-plane, static-pod, etcd ]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 60
draft: false
variables:
  Q1_NS: { oneOf: [ retail, media, portal ] }
  Q1_APP: { oneOf: [ storefront, ledger, checkout ] }
  Q1_FAULT: { oneOf: [ image-pull, bad-command, configmap-key ], hidden: true }
  Q2_NS: { oneOf: [ store, edge, api ] }
  Q2_APP: { oneOf: [ web, backend, gateway ] }
  Q2_FAULT: { oneOf: [ selector-mismatch, target-port ], hidden: true }
  Q3_NS: { oneOf: [ files, backups, media-store ] }
  Q3_CLAIM: { oneOf: [ archive, assets, cache-data ] }
  Q3_FAULT: { oneOf: [ storageclass-mismatch, access-mode-mismatch, claim-too-large ], hidden: true }
  Q4_NS: { oneOf: [ shop, media, portal ] }
  Q4_APP: { oneOf: [ web, store, blog ] }
  Q4_FAULT: { oneOf: [ ingress-service-port, ingress-path, route-section, route-backend-port ], hidden: true }
  Q5_NS: { oneOf: [ ops, infra, platform ] }
  Q5_FAULT: { oneOf: [ kubelet-stopped, containerd-stopped, kubelet-binary-path ], hidden: true }
  Q5_NODE: { oneOf: [ worker-1, worker-2 ], hidden: true }
  Q6_NS: { oneOf: [ ops, core, platform ] }
  Q6_FAULT: { oneOf: [ apiserver-etcd-port, apiserver-etcd-certfile, etcd-cert-path, scheduler-command, controller-manager-kubeconfig, kubelet-client-cert ], hidden: true }
solution:
  - node: controlplane
    script: setup/q6-solution.sh
    timeoutSeconds: 900
  - node: worker-1
    script: setup/q5-solution.sh
  - node: worker-2
    script: setup/q5-solution-2.sh
  - node: controlplane
    script: solution.sh
tasks:
  - id: q1
    title: Unhealthy Deployment ${Q1_APP}
    recipe: { category: pods }
    points: 8
    setup:
      - node: controlplane
        script: setup/q1.sh
        timeoutSeconds: 400
        lane: q1
    checks:
      - id: q1-ready
        description: ${Q1_APP} has 2 ready replicas
        type: kubectl
        run: kubectl -n ${Q1_NS} get deployment ${Q1_APP} -o jsonpath='{.status.readyReplicas}/{.status.updatedReplicas}/{.status.replicas}'
        expect: { equals: 2/2/2 }
        weight: 2
        retrySeconds: 60
      - id: q1-stable
        description: ${Q1_APP}'s Pods do not restart over 20 seconds
        type: kubectl
        run: r() { kubectl -n ${Q1_NS} get pods -l app=${Q1_APP} --field-selector=status.phase=Running -o jsonpath='{range .items[*]}{.metadata.name}={.status.containerStatuses[0].restartCount} {end}'; }; a=$(r); sleep 20; b=$(r); [ -n "$a" ] && [ "$a" = "$b" ] && echo stable || echo restarting
        expect: { equals: stable }
        weight: 1
        retrySeconds: 60
      - id: q1-serves
        description: ${Q1_APP} serves HTTP on port 80
        type: kubectl
        run: kubectl -n ${Q1_NS} exec deployment/${Q1_APP} -- wget -qO- -T 3 http://localhost:80/
        expect: { contains: nginx }
        weight: 1
      - id: q1-spec-resources
        description: ${Q1_APP} keeps its image, and requests and limits for CPU and memory
        type: kubectl
        run: kubectl -n ${Q1_NS} get deployment ${Q1_APP} -o jsonpath='{.spec.template.spec.containers[0].image} {.spec.template.spec.containers[0].resources.requests.cpu} {.spec.template.spec.containers[0].resources.requests.memory} {.spec.template.spec.containers[0].resources.limits.cpu} {.spec.template.spec.containers[0].resources.limits.memory}'
        expect: { matches: ^nginx:1\.27-alpine \S+ \S+ \S+ \S+$ }
        weight: 1
      - id: q1-spec-probes
        description: ${Q1_APP} keeps a readiness and a liveness probe
        type: kubectl
        run: c='{.spec.template.spec.containers[0]'; r=$(kubectl -n ${Q1_NS} get deployment ${Q1_APP} -o jsonpath="$c.readinessProbe}"); l=$(kubectl -n ${Q1_NS} get deployment ${Q1_APP} -o jsonpath="$c.livenessProbe}"); echo "$([ -n "$r" ] && echo readiness) $([ -n "$l" ] && echo liveness)"
        expect: { equals: readiness liveness }
        weight: 1
      - id: q1-spec-config
        description: the running Pods read APP_MODE=production from ConfigMap ${Q1_APP}-config
        type: kubectl
        run: echo "$(kubectl -n ${Q1_NS} get deployment ${Q1_APP} -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="APP_MODE")].valueFrom.configMapKeyRef.name}') $(kubectl -n ${Q1_NS} exec deployment/${Q1_APP} -- printenv APP_MODE 2>/dev/null)"
        expect: { equals: "${Q1_APP}-config production" }
        weight: 1
        retrySeconds: 30
      - id: q1-same-deployment
        description: ${Q1_APP} was not deleted or recreated
        type: kubectl
        run: "[ \"$(kubectl -n ${Q1_NS} get deployment ${Q1_APP} -o jsonpath='{.metadata.uid}')\" = \"$(cat /var/tmp/cka-q1.uid)\" ] && echo same || echo recreated"
        expect: { equals: same }
        weight: 1
    hints:
      - "kubectl -n ${Q1_NS} get deployment,replicaset,pods -l app=${Q1_APP} -o wide: are Pods missing, Pending, crashing, running but not ready, or is an old and a new ReplicaSet stuck side by side?"
      - "kubectl -n ${Q1_NS} describe pod <pod>: the container state, the last termination reason and the Events usually name the problem."
      - kubectl -n ${Q1_NS} logs <pod> --previous shows why a crashed container exited; kubectl -n ${Q1_NS} rollout status deployment/${Q1_APP} shows whether a rollout is progressing.
      - "kubectl -n ${Q1_NS} get deployment ${Q1_APP} -o yaml: read the strategy, the Pod template and its references (images, probes, resources, ConfigMap keys) critically."
  - id: q2
    title: Service ${Q2_APP} unreachable
    recipe: { category: services }
    points: 6
    setup:
      - node: controlplane
        script: setup/q2.sh
        timeoutSeconds: 400
        lane: q2
    checks:
      - id: q2-reachable
        description: client gets the nginx page from http://${Q2_APP}
        type: kubectl
        run: kubectl -n ${Q2_NS} exec client -- wget -qO- -T 3 http://${Q2_APP}
        expect: { contains: nginx }
        weight: 3
        retrySeconds: 30
      - id: q2-endpoints
        description: Service ${Q2_APP} has 2 ready endpoints
        type: kubectl
        run: kubectl -n ${Q2_NS} get endpointslices -l kubernetes.io/service-name=${Q2_APP} -o jsonpath='{range .items[*].endpoints[*]}{.conditions.ready}{"\n"}{end}' | grep -c true
        expect: { equals: "2" }
        weight: 1
        retrySeconds: 30
      - id: q2-spec-service
        description: Service ${Q2_APP} is a ClusterIP Service on port 80
        type: kubectl
        run: kubectl -n ${Q2_NS} get svc ${Q2_APP} -o jsonpath='{.spec.type} {.spec.ports[0].port}'
        expect: { equals: ClusterIP 80 }
        weight: 1
      - id: q2-spec-deployment
        description: Deployment ${Q2_APP} is the original one, with 2 replicas, its image and a readiness probe
        type: kubectl
        run: "[ ! -f /var/tmp/cka-q2.uid ] || [ \"$(kubectl -n ${Q2_NS} get deployment ${Q2_APP} -o jsonpath='{.metadata.uid}')\" = \"$(cat /var/tmp/cka-q2.uid)\" ] || { echo recreated; exit 0; }; echo \"$(kubectl -n ${Q2_NS} get deployment ${Q2_APP} -o jsonpath='{.spec.replicas} {.spec.template.spec.containers[0].image}') $([ -n \"$(kubectl -n ${Q2_NS} get deployment ${Q2_APP} -o jsonpath='{.spec.template.spec.containers[0].readinessProbe}')\" ] && echo probe || echo none)\""
        expect: { equals: 2 nginx:1.27-alpine probe }
        weight: 1
    hints:
      - "Split the path into hops and test each one from client: does the name resolve, does the Service IP answer, does a Pod IP answer? kubectl -n ${Q2_NS} get svc,endpointslices,pods -o wide gives you the addresses."
      - "kubectl -n ${Q2_NS} describe svc ${Q2_APP} and kubectl -n ${Q2_NS} get endpointslices: an empty or not-ready endpoint list sends you to the Pods; a healthy one sends you further along the path."
      - "Compare what the Service selects and forwards to with what the Pods really carry and listen on: kubectl -n ${Q2_NS} get pods --show-labels and kubectl -n ${Q2_NS} get deployment ${Q2_APP} -o yaml."
      - "When the namespace looks right, look at what sits between the client and the Pods: NetworkPolicies, and the node component that turns Service IPs into Pod IPs (kubectl -n kube-system get ds,pods)."
  - id: q3
    title: Pod ${Q3_CLAIM}-app stuck
    recipe: { category: storage }
    points: 5
    setup:
      - node: controlplane
        script: setup/q3.sh
        timeoutSeconds: 400
        lane: q3
    checks:
      - id: q3-bound
        description: PVC ${Q3_CLAIM} is Bound to ${Q3_CLAIM}-pv
        type: kubectl
        run: kubectl -n ${Q3_NS} get pvc ${Q3_CLAIM} -o jsonpath='{.status.phase}/{.spec.volumeName}'
        expect: { equals: "Bound/${Q3_CLAIM}-pv" }
        weight: 2
        retrySeconds: 30
      - id: q3-pod-running
        description: Pod ${Q3_CLAIM}-app is Running with the claim at /data
        type: kubectl
        run: kubectl -n ${Q3_NS} get pod ${Q3_CLAIM}-app -o jsonpath='{.status.phase} {.spec.volumes[*].persistentVolumeClaim.claimName} {.spec.containers[0].volumeMounts[*].mountPath}'
        expect: { matches: "^Running ${Q3_CLAIM} .*/data" }
        weight: 2
        retrySeconds: 60
      - id: q3-pv-kept
        description: PV ${Q3_CLAIM}-pv keeps its class, capacity and access mode
        type: kubectl
        run: kubectl get pv ${Q3_CLAIM}-pv -o jsonpath='{.spec.storageClassName} {.spec.capacity.storage} {.spec.accessModes[0]}'
        expect: { equals: manual 1Gi ReadWriteOnce }
        weight: 1
    hints:
      - "kubectl -n ${Q3_NS} describe pod ${Q3_CLAIM}-app: is the Pod waiting for its claim to bind, or for a node it can run on? The Events say which."
      - "kubectl -n ${Q3_NS} describe pvc ${Q3_CLAIM} and kubectl get pv ${Q3_CLAIM}-pv -o yaml: class, access modes, size and the volume's status (and any claimRef) must all fit."
      - "A bound volume can still pin its Pod: compare the volume's node affinity with where the Pod is allowed to run (kubectl get pod ${Q3_CLAIM}-app -o yaml)."
      - "Most of a claim's spec cannot be edited: delete the Pod and the claim, then create them again."
  - id: q4
    title: ${Q4_APP} unreachable through the ingress
    recipe: { category: ingress }
    points: 7
    setup:
      - node: controlplane
        script: setup/q4.sh
        timeoutSeconds: 400
        lane: q4
    checks:
      - id: q4-ingress-serves
        description: www.${Q4_NS}.lab returns the nginx welcome page
        type: kubectl
        run: 'curl -s -m 5 -H "Host: www.${Q4_NS}.lab" http://controlplane:30080/'
        expect: { contains: Welcome to nginx }
        weight: 2
        retrySeconds: 30
      - id: q4-route-serves
        description: api.${Q4_NS}.lab returns the nginx welcome page
        type: kubectl
        run: 'curl -s -m 5 -H "Host: api.${Q4_NS}.lab" http://controlplane:30080/'
        expect: { contains: Welcome to nginx }
        weight: 2
        retrySeconds: 30
      - id: q4-spec-ingress
        description: Ingress ${Q4_APP} still serves host www.${Q4_NS}.lab
        type: kubectl
        run: kubectl -n ${Q4_NS} get ingress ${Q4_APP} -o jsonpath='{.spec.rules[0].host}'
        expect: { equals: "www.${Q4_NS}.lab" }
        weight: 1
      - id: q4-spec-route
        description: HTTPRoute ${Q4_APP} still serves host api.${Q4_NS}.lab
        type: kubectl
        run: kubectl -n ${Q4_NS} get httproute ${Q4_APP} -o jsonpath='{.spec.hostnames[0]}'
        expect: { equals: "api.${Q4_NS}.lab" }
        weight: 1
      - id: q4-spec-backend
        description: Deployment and Service ${Q4_APP} are unchanged
        type: kubectl
        run: echo $(kubectl -n ${Q4_NS} get deployment ${Q4_APP} -o jsonpath='{.spec.replicas} {.spec.template.metadata.labels.app}') $(kubectl -n ${Q4_NS} get svc ${Q4_APP} -o jsonpath='{.spec.selector.app} {.spec.ports[0].port}')
        expect: { equals: "2 ${Q4_APP} ${Q4_APP} 80" }
        weight: 1
    hints:
      - "curl -v both hosts: Traefik answers 404 when no router matches the request, and 5xx when a router matches but its backend is broken."
      - "kubectl -n ${Q4_NS} describe ingress ${Q4_APP} and kubectl -n ${Q4_NS} describe httproute ${Q4_APP}: read the Status conditions and the Events, then compare every name, host, path and port with what really exists."
      - kubectl get ingressclass,gatewayclass and kubectl get gateway -A -o yaml show which classes, Gateways and listeners exist and what they accept.
  - id: q5
    title: Unhealthy worker
    recipe: { category: nodes }
    points: 6
    setup:
      - node: controlplane
        script: setup/q5.sh
      - node: worker-1
        script: setup/q5-2.sh
      - node: worker-2
        script: setup/q5-3.sh
      - node: controlplane
        script: setup/q5-4.sh
        timeoutSeconds: 300
    setupStage: 1
    checks:
      - id: q5-all-ready
        description: every node is Ready
        type: kubectl
        run: kubectl get nodes -o jsonpath='{range .items[*]}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}' | sort -u | tr '\n' ' '
        expect: { equals: "True" }
        weight: 2
        retrySeconds: 90
      - id: q5-schedulable
        description: no worker is cordoned or carries a NoSchedule taint
        type: kubectl
        run: kubectl get nodes -l '!node-role.kubernetes.io/control-plane' -o jsonpath='{range .items[*]}{.spec.unschedulable} {range .spec.taints[*]}{.key}={.effect} {end}{"\n"}{end}' | tr ' ' '\n' | grep -vE '^$|^dedicated=' | grep -cE 'true|NoSchedule|NoExecute' || true
        expect: { equals: "0" }
        weight: 1
        retrySeconds: 30
      - id: q5-services-worker-1
        description: kubelet and containerd are running and enabled on worker-1
        type: ssh
        node: worker-1
        run: echo $(systemctl is-active kubelet containerd) $(systemctl is-enabled kubelet containerd) | tr ' ' '\n' | sort -u | tr '\n' ' '
        expect: { equals: active enabled }
        weight: 1
      - id: q5-services-worker-2
        description: kubelet and containerd are running and enabled on worker-2
        type: ssh
        node: worker-2
        run: echo $(systemctl is-active kubelet containerd) $(systemctl is-enabled kubelet containerd) | tr ' ' '\n' | sort -u | tr '\n' ' '
        expect: { equals: active enabled }
        weight: 1
      - id: q5-probe
        description: node-probe has a ready Pod on every worker
        type: kubectl
        run: kubectl -n ${Q5_NS} get daemonset node-probe -o jsonpath='{.status.numberReady}/{.status.desiredNumberScheduled}/{.status.updatedNumberScheduled}'
        expect: { equals: 2/2/2 }
        weight: 1
        retrySeconds: 90
    hints:
      - "kubectl get nodes, then kubectl describe node <node>: Conditions, Taints and Unschedulable tell you whether the node is down or only refuses Pods."
      - kubectl -n ${Q5_NS} get pods -o wide shows which worker is missing its probe Pod.
      - "On a NotReady node: systemctl status kubelet containerd, then journalctl -u kubelet -n 50 (and -u containerd). Fix one error, restart, and read the log again."
      - systemctl cat kubelet shows the unit, its drop-ins and the files the kubelet reads. Compare paths and settings with what exists on the node and with a healthy worker.
      - systemctl is-enabled tells you whether a service comes back after a reboot.
  - id: q6
    title: Control plane after maintenance
    recipe: { category: controlplane }
    points: 8
    setup:
      - node: controlplane
        script: setup/q6.sh
        timeoutSeconds: 400
    setupStage: 2
    checks:
      - id: q6-api-ready
        description: the API server reports ready
        type: kubectl
        run: kubectl get --raw /readyz
        expect: { equals: ok }
        weight: 2
        retrySeconds: 120
      - id: q6-components
        description: node controlplane and its etcd, kube-apiserver, kube-controller-manager and kube-scheduler are Ready
        type: kubectl
        run: "{ kubectl get node controlplane -o jsonpath='controlplane={.status.conditions[?(@.type==\"Ready\")].status}{\"\\n\"}'; kubectl -n kube-system get pods -l tier=control-plane -o jsonpath='{range .items[*]}{.metadata.name}={.status.conditions[?(@.type==\"Ready\")].status}{\"\\n\"}{end}' | sort; } | xargs"
        expect: { equals: controlplane=True etcd-controlplane=True kube-apiserver-controlplane=True kube-controller-manager-controlplane=True kube-scheduler-controlplane=True }
        weight: 2
        retrySeconds: 120
      - id: q6-nodes-ready
        description: every node is Ready
        type: kubectl
        run: kubectl get nodes -o jsonpath='{range .items[*]}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}' | sort -u | xargs
        expect: { equals: "True" }
        weight: 1
        retrySeconds: 90
      - id: q6-web-ready
        description: web runs 2 ready replicas
        type: kubectl
        run: kubectl -n ${Q6_NS} get deployment web -o jsonpath='{.spec.replicas}/{.status.readyReplicas}'
        expect: { equals: 2/2 }
        weight: 2
        retrySeconds: 120
      - id: q6-manifests
        description: /etc/kubernetes/manifests holds only the four control plane manifests
        type: ssh
        node: controlplane
        run: ls /etc/kubernetes/manifests | sort | xargs
        expect: { equals: etcd.yaml kube-apiserver.yaml kube-controller-manager.yaml kube-scheduler.yaml }
        weight: 1
    hints:
      - "Start with the symptom: does kubectl answer at all? If it does, kubectl get nodes and kubectl -n kube-system get pods show which component is unhealthy; Pending or missing Pods point at the scheduler or the controller manager."
      - "Without the API, on controlplane: crictl ps -a, then crictl logs <container-id> shows why a static Pod keeps exiting. journalctl -u kubelet shows Pods the kubelet cannot even start."
      - Static Pod manifests live in /etc/kubernetes/manifests; the kubelet restarts a component when its manifest changes. Check every flag, path and image against what exists (ls /etc/kubernetes/pki, crictl images).
      - "If no control plane container runs at all, or controlplane itself is NotReady: systemctl status kubelet, journalctl -u kubelet -n 50, and the paths in /etc/kubernetes/kubelet.conf and /var/lib/kubelet/config.yaml."
