  - id: q8
    title: DaemonSet ${Q8_DS} is not running everywhere
    points: 8
    context: k8s-web
    setup:
      - node: controlplane
        script: setup/q8.sh
        timeoutSeconds: 400
        lane: q8
    checks:
      - id: q8-everywhere
        description: ${Q8_DS} has a ready Pod on every node, controlplane included
        type: kubectl
        run: n=$(kubectl get nodes --no-headers | wc -l | tr -d ' '); s=$(kubectl -n ${Q8_NS} get daemonset ${Q8_DS} -o jsonpath='{.status.desiredNumberScheduled}/{.status.numberReady}'); [ "$s" = "$n/$n" ] && echo everywhere || echo "$s of $n nodes"
        expect: { equals: everywhere }
        weight: 3
        retrySeconds: 90
      - id: q8-current
        description: every Pod of ${Q8_DS} runs its current template, and template changes roll out on their own
        type: kubectl
        run: kubectl -n ${Q8_NS} get daemonset ${Q8_DS} -o jsonpath='{.spec.updateStrategy.type} {.status.updatedNumberScheduled}/{.status.desiredNumberScheduled}'
        expect: { matches: "^RollingUpdate ([1-9][0-9]*)/\\1$" }
        weight: 1
        retrySeconds: 60
      - id: q8-spec
        description: ${Q8_DS} keeps image nginx:1.27-alpine, its resource requests and a readiness probe
        type: kubectl
        run: c='{.spec.template.spec.containers[0]'; echo "$(kubectl -n ${Q8_NS} get daemonset ${Q8_DS} -o jsonpath="$c.image} $c.resources.requests.cpu} $c.resources.requests.memory}") $([ -n "$(kubectl -n ${Q8_NS} get daemonset ${Q8_DS} -o jsonpath="$c.readinessProbe}")" ] && echo readiness)"
        expect: { equals: nginx:1.27-alpine 10m 16Mi readiness }
        weight: 1
      - id: q8-control-plane-taint
        description: controlplane keeps its NoSchedule taint
        type: kubectl
        run: kubectl get node controlplane -o jsonpath='{.spec.taints[?(@.key=="node-role.kubernetes.io/control-plane")].effect}'
        expect: { equals: NoSchedule }
        weight: 1
      - id: q8-others
        description: every other DaemonSet of ${Q8_NS} still runs all its Pods
        type: kubectl
        run: ok=yes; for d in $(cat /var/tmp/cka-q8.others); do r=$(kubectl -n ${Q8_NS} get daemonset "$d" -o jsonpath='{.status.numberReady}' 2>/dev/null); w=$(kubectl -n ${Q8_NS} get daemonset "$d" -o jsonpath='{.status.desiredNumberScheduled}' 2>/dev/null); [ -n "$w" ] && [ "$r" = "$w" ] || ok=no; done; echo $ok
        expect: { equals: yes }
        weight: 1
        retrySeconds: 60
      - id: q8-same-daemonset
        description: ${Q8_DS} was not deleted or recreated
        type: kubectl
        run: "[ \"$(kubectl -n ${Q8_NS} get daemonset ${Q8_DS} -o jsonpath='{.metadata.uid}')\" = \"$(cat /var/tmp/cka-q8.uid)\" ] && echo same || echo recreated"
        expect: { equals: same }
        weight: 1
    hints:
      - "kubectl -n ${Q8_NS} get daemonset ${Q8_DS}: compare DESIRED with the number of nodes, and READY and UP-TO-DATE with DESIRED."
      - kubectl -n ${Q8_NS} get pods -l app=${Q8_DS} -o wide shows which nodes have a Pod; kubectl -n ${Q8_NS} describe pod <pod> says why one is Pending, not ready or failing.
      - "kubectl describe node <node> | grep Taints, then kubectl -n ${Q8_NS} get daemonset ${Q8_DS} -o yaml: tolerations, affinity, ports and the update strategy decide where Pods may run and when they are replaced."
      - kubectl -n ${Q8_NS} rollout status daemonset/${Q8_DS} and kubectl -n ${Q8_NS} rollout history daemonset/${Q8_DS} show whether the Pods run the current template.
    recipe: { category: daemonsets }
  - id: q9
    title: Unhealthy Deployment ${Q9_APP}
    points: 8
    context: k8s-west
    setup:
      - node: controlplane
        script: setup/q9.sh
        timeoutSeconds: 800
        lane: q9
    checks:
      - id: q9-ready
        description: ${Q9_APP} has 2 ready replicas
        type: kubectl
        run: kubectl -n ${Q9_NS} get deployment ${Q9_APP} -o jsonpath='{.status.readyReplicas}/{.status.updatedReplicas}/{.status.replicas}'
        expect: { equals: 2/2/2 }
        weight: 2
        retrySeconds: 60
      - id: q9-stable
        description: ${Q9_APP}'s Pods do not restart over 20 seconds
        type: kubectl
        run: r() { kubectl -n ${Q9_NS} get pods -l app=${Q9_APP} --field-selector=status.phase=Running -o jsonpath='{range .items[*]}{.metadata.name}={.status.containerStatuses[0].restartCount} {end}'; }; a=$(r); sleep 20; b=$(r); [ -n "$a" ] && [ "$a" = "$b" ] && echo stable || echo restarting
        expect: { equals: stable }
        weight: 1
        retrySeconds: 60
      - id: q9-serves
        description: ${Q9_APP} serves HTTP on port 80
        type: kubectl
        run: kubectl -n ${Q9_NS} exec deployment/${Q9_APP} -- wget -qO- -T 3 http://localhost:80/
        expect: { contains: nginx }
        weight: 1
      - id: q9-spec-resources
        description: ${Q9_APP} keeps its image, and requests and limits for CPU and memory
        type: kubectl
        run: kubectl -n ${Q9_NS} get deployment ${Q9_APP} -o jsonpath='{.spec.template.spec.containers[0].image} {.spec.template.spec.containers[0].resources.requests.cpu} {.spec.template.spec.containers[0].resources.requests.memory} {.spec.template.spec.containers[0].resources.limits.cpu} {.spec.template.spec.containers[0].resources.limits.memory}'
        expect: { matches: ^nginx:1\.27-alpine \S+ \S+ \S+ \S+$ }
        weight: 1
      - id: q9-spec-probes
        description: ${Q9_APP} keeps a readiness and a liveness probe
        type: kubectl
        run: c='{.spec.template.spec.containers[0]'; r=$(kubectl -n ${Q9_NS} get deployment ${Q9_APP} -o jsonpath="$c.readinessProbe}"); l=$(kubectl -n ${Q9_NS} get deployment ${Q9_APP} -o jsonpath="$c.livenessProbe}"); echo "$([ -n "$r" ] && echo readiness) $([ -n "$l" ] && echo liveness)"
        expect: { equals: readiness liveness }
        weight: 1
      - id: q9-spec-config
        description: the running Pods read APP_MODE=production from ConfigMap ${Q9_APP}-config
        type: kubectl
        run: echo "$(kubectl -n ${Q9_NS} get deployment ${Q9_APP} -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="APP_MODE")].valueFrom.configMapKeyRef.name}') $(kubectl -n ${Q9_NS} exec deployment/${Q9_APP} -- printenv APP_MODE 2>/dev/null)"
        expect: { equals: "${Q9_APP}-config production" }
        weight: 1
        retrySeconds: 30
      - id: q9-same-deployment
        description: ${Q9_APP} was not deleted or recreated
        type: kubectl
        run: "[ \"$(kubectl -n ${Q9_NS} get deployment ${Q9_APP} -o jsonpath='{.metadata.uid}')\" = \"$(cat /var/tmp/cka-q9.uid)\" ] && echo same || echo recreated"
        expect: { equals: same }
        weight: 1
    hints:
      - "kubectl -n ${Q9_NS} get deployment,replicaset,pods -l app=${Q9_APP} -o wide: are Pods missing, Pending, crashing, running but not ready, or is an old and a new ReplicaSet stuck side by side?"
      - "kubectl -n ${Q9_NS} describe pod <pod>: the container state, the last termination reason and the Events usually name the problem."
      - kubectl -n ${Q9_NS} logs <pod> --previous shows why a crashed container exited; kubectl -n ${Q9_NS} rollout status deployment/${Q9_APP} shows whether a rollout is progressing.
      - "kubectl -n ${Q9_NS} get deployment ${Q9_APP} -o yaml: read the strategy, the Pod template and its references (images, probes, resources, ConfigMap keys) critically."
    recipe: { category: pods }
