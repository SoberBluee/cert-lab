  Q4_FAULT: { oneOf: [ selector-mismatch, target-port, named-port, network-policy, not-ready, selector-extra-label, service-port, service-protocol, kube-proxy-kubeconfig, selector-cleared, readiness-https, readiness-port-number, egress-network-policy, service-externalname, kube-proxy-config-mode ], hidden: true }
  Q5_NS: { oneOf: [ cache-ns, data, scratch, build, artifacts, uploads, queue, media, search, feeds ] }
