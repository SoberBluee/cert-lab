  Q6_NS: { oneOf: [ apps, jobs, sandbox, workloads, demo, lab, temp, scratch, tools, debug ] }
  Q6_NAME: { oneOf: [ worker, logger, toolbox, frontend, backend, database, cache, queue, scheduler, monitor, gateway, proxy, client, agent, runner ] }
  Q6_IMAGE: { oneOf: [ busybox:1.36, busybox:1.37, nginx:1.28-alpine, httpd:2.4-alpine, alpine:3.20 ] }
  Q6_SEC_USER: { oneOf: [ 1000, 2000, 3000, 1001, 1500, 2500, 4000, 5000 ] }
  Q6_PROBE_PERIOD: { oneOf: [ 5, 10, 15 ] }
  Q6_ENV_OBJ: { oneOf: [ app-config, app-settings, runtime-env, feature-flags, app-secrets, env-store, service-config, workload-env, runtime-flags, app-params ] }
  Q6_ENV_KEY: { oneOf: [ LOG_LEVEL, MODE, REGION, APP_ENV, CLUSTER, STAGE, FEATURE_FLAG, TZ, ROLE, COLOR ] }
  Q6_ENV_VALUE: { oneOf: [ debug, info, warn, error, prod, staging, canary, eu-west, us-east, primary ] }
  Q6_LABEL_KEY: { oneOf: [ tier, team, env, app, role, zone, stage, component, version, owner ] }
  Q6_LABEL_VALUE: { oneOf: [ backend, blue, prod, frontend, green, staging, canary, worker, api, batch ] }
  Q7_NS: { oneOf: [ web, shop, team-a, frontend, store, apps, services, prod-web, edge, portal ] }
  Q7_NAME: { oneOf: [ frontend, api, catalog, backend, gateway, cart, search, auth, payments, inventory ] }
  Q7_IMAGE: { oneOf: [ nginx:1.26-alpine, nginx:1.27-alpine ] }
  Q7_REPLICAS: { oneOf: [ 2, 3, 4 ] }
  Q7_PRIO_CLASS: { oneOf: [ high-priority, critical-apps, batch-low, system-critical, platform-high, user-medium, best-effort, guaranteed, latency-sensitive, background ] }
  Q7_PRIO_VALUE: { oneOf: [ 1000, 10000, 100000 ] }
  Q7_SCALE_REPLICAS: { oneOf: [ 5, 6 ] }
  Q8_NS: { oneOf: [ agents, observability, telemetry, monitoring, logging, security, edge-agents, platform-ops, node-svc, collectors ] }
  Q8_DS: { oneOf: [ log-shipper, node-monitor, net-agent, disk-watch, metrics-relay, trace-collector, audit-forwarder, sec-scanner, cache-warmer, dns-probe ] }
  Q8_FAULT: { oneOf: [ image-typo, readiness-port, cp-toleration-typo, hostname-affinity, hostport-conflict, ondelete-stale ], hidden: true }
  Q8_WORKER: { oneOf: &a1 [ worker-1, worker-2 ], hidden: true }
  Q9_NS: { oneOf: [ retail, media, portal, shop, catalog, orders, content, store, frontend, apps ] }
  Q9_APP: { oneOf: [ storefront, ledger, checkout, cart, catalog, inventory, payments, search, recommend, notify ] }
  Q9_FAULT: { oneOf: [ image-pull, bad-command, no-bash, configmap-key, exits-cleanly ], hidden: true }
  Q9_FAULT_2: { oneOf: [ requests-too-large, node-selector ], hidden: true }
  Q10_NS: { oneOf: [ assets, thumbnails, exports, imports, archive-ns, renders, logs-ns, mail, images, staging-data ] }
  Q10_CLAIM: { oneOf: [ assets, renders, exports, store, blobs, cache, spool, drafts, outbox, vault ] }
  Q10_FAULT: { oneOf: [ provisioner-typo, provisioner-down, no-class, rwop-taken, hostpath-missing, claim-elsewhere, pod-unschedulable ], hidden: true }
  Q11_APP: { oneOf: [ shop, billing, ledger, portal, search, notify, catalog, reports, gateway, profile ] }
  Q12_NS: { oneOf: [ perf, telemetry, insights, observe, usage, capacity, watchtower, signals, probe-ns, stats ] }
  Q13_NS: { oneOf: [ shop, orders, billing, inventory, crm, ledger, payments, sales, reports, catalog ] }
  Q14_NS: { oneOf: [ maintain, fleet, ops, upgrade, rolling, cluster-ops, node-ops, infra, platform, sre ] }
  Q14_APP: { oneOf: [ checkout, cart, orders, payments, inventory, shipping, notify, search, catalog, loyalty ] }
  Q14_FAULT: { oneOf: [ pdb-min-available, pdb-max-unavailable-0 ], hidden: true }
  Q14_FAULT_2: { oneOf: [ bare-pod, emptydir-pod ], hidden: true }
  Q14_NODE: { oneOf: *a1, hidden: true }
  Q15_BACKUP: { oneOf: [ /opt/backups/etcd.db, /srv/etcd/snapshot.db, /root/etcd-backup.db, /var/backups/etcd-snap.db, /opt/etcd/backup.db, /mnt/backups/etcd.db, /home/ubuntu/etcd.db, /var/lib/etcd-backups/snap.db ] }
  Q15_MARKER: { oneOf: [ backup-marker, pre-backup, audit-mark, snap-token, etcd-check, restore-proof, cluster-stamp, backup-id, snap-label, verify-cm ] }
  Q15_STATUS_FILE: { oneOf: [ /opt/backups/etcd-status.txt, /root/etcd-status.txt, /srv/etcd/status.txt ] }
  Q16_NS: { oneOf: [ shop, storefront, media, scale, traffic, web-tier, frontend, api-tier, loadtest, elastic ] }
  Q16_APP: { oneOf: [ web, api, frontend, gateway, catalog, search, checkout, cdn, proxy, edge ] }
  Q16_FAULT: { oneOf: [ no-cpu-request, target-name, target-kind, max-one, metrics-server-down, metrics-apiservice, metrics-kubelet-tls ], hidden: true }
  Q17_NS: { oneOf: [ lookup, resolver, names, dns-lab, records, zones, directory, catalog, registry, gateway-ns ] }
  Q17_DOMAIN: { oneOf: [ cka.lab, exam.lab, corp.lab, k8s.lab ] }
  Q17_ZONE: { oneOf: [ corp.internal, office.internal, hq.internal, branch.internal ] }
  Q17_HOST: { oneOf: [ legacy-db.internal, old-erp.internal, mainframe.internal, billing-db.internal ] }
  Q17_IP: { oneOf: [ 198.51.100.20, 198.51.100.37, 198.51.100.54, 198.51.100.71 ] }
setup:
  - node: controlplane
    script: setup/contexts.sh
solution:
  - node: controlplane
    script: setup/q1-solution.sh
    timeoutSeconds: 900
  - node: controlplane
    script: solution.sh
    timeoutSeconds: 1800
tasks:
  - id: q1
    title: kubectl stopped working
    points: 8
    context: k8s-lab
    setup:
      - node: controlplane
        script: setup/q1.sh
        timeoutSeconds: 800
    setupStage: 4
    checks:
      - id: q1-api-ready
        description: the API server reports ready
        type: kubectl
        run: kubectl get --raw /readyz
        expect: { equals: ok }
        weight: 2
        retrySeconds: 120
      - id: q1-user-kubectl
        description: kubectl works with /root/.kube/config and /home/ubuntu/.kube/config
        type: kubectl
        run: "{ kubectl --kubeconfig /root/.kube/config get --raw /readyz 2>/dev/null || echo fail; echo; sudo -u ubuntu -H kubectl --kubeconfig /home/ubuntu/.kube/config get --raw /readyz 2>/dev/null || echo fail; echo; } | xargs"
        expect: { equals: ok ok }
        weight: 2
        retrySeconds: 60
      - id: q1-components
        description: node controlplane and its etcd, kube-apiserver, kube-controller-manager and kube-scheduler are Ready
        type: kubectl
        run: "{ kubectl get node controlplane -o jsonpath='controlplane={.status.conditions[?(@.type==\"Ready\")].status}{\"\\n\"}'; kubectl -n kube-system get pods -l tier=control-plane -o jsonpath='{range .items[*]}{.metadata.name}={.status.conditions[?(@.type==\"Ready\")].status}{\"\\n\"}{end}' | sort; } | xargs"
        expect: { equals: controlplane=True etcd-controlplane=True kube-apiserver-controlplane=True kube-controller-manager-controlplane=True kube-scheduler-controlplane=True }
        weight: 2
        retrySeconds: 120
      - id: q1-web-ready
        description: web runs 2 ready replicas
        type: kubectl
        run: kubectl -n ${Q1_NS} get deployment web -o jsonpath='{.spec.replicas}/{.status.readyReplicas}'
        expect: { equals: 2/2 }
        weight: 1
        retrySeconds: 120
      - id: q1-manifests
        description: /etc/kubernetes/manifests holds only the four control plane manifests
        type: ssh
        node: controlplane
        run: ls /etc/kubernetes/manifests | sort | xargs
        expect: { equals: etcd.yaml kube-apiserver.yaml kube-controller-manager.yaml kube-scheduler.yaml }
        weight: 1
    hints:
      - 'Read the exact kubectl error: "connection refused", "x509: certificate signed by unknown authority" and a hang point at different places.'
      - Is the API server up at all? curl -k https://127.0.0.1:6443/readyz, ss -ltnp | grep 6443, and crictl ps -a | grep kube-apiserver (as root).
      - "If the kube-apiserver container is missing or keeps exiting: crictl logs <container-id>, journalctl -u kubelet | grep -i apiserver, and compare the flags in /etc/kubernetes/manifests/kube-apiserver.yaml with the files in /etc/kubernetes/pki."
      - "If the API server is healthy, the kubeconfig is wrong: compare the server and certificate-authority-data in ~/.kube/config with /etc/kubernetes/admin.conf (kubectl config view --raw)."
    recipe: { category: apiaccess }
  - id: q2
    title: Name resolution broken
    points: 7
    context: k8s-blue
    setup:
      - node: controlplane
        script: setup/q2.sh
        timeoutSeconds: 400
    setupStage: 1
    checks:
      - id: q2-short-name
        description: ${Q2_CLIENT} gets the nginx page from http://web
        type: kubectl
        run: kubectl -n ${Q2_NS} exec ${Q2_CLIENT} -- wget -qO- -T 3 http://web
        expect: { contains: nginx }
        weight: 2
        retrySeconds: 60
      - id: q2-fqdn
        description: ${Q2_CLIENT} resolves web.${Q2_NS}.svc.cluster.local to the Service IP
        type: kubectl
        run: ip=$(kubectl -n ${Q2_NS} get svc web -o jsonpath='{.spec.clusterIP}'); kubectl -n ${Q2_NS} exec ${Q2_CLIENT} -- nslookup -type=a web.${Q2_NS}.svc.cluster.local 2>/dev/null | grep -qw "$ip" && echo resolves || echo fails
        expect: { equals: resolves }
        weight: 2
        retrySeconds: 60
      - id: q2-coredns-ready
        description: CoreDNS runs 2 ready replicas
        type: kubectl
        run: kubectl -n kube-system get deployment coredns -o jsonpath='{.status.readyReplicas}'
        expect: { equals: "2" }
        weight: 1
        retrySeconds: 60
      - id: q2-corefile
        description: The Corefile serves cluster.local and forwards to /etc/resolv.conf
        type: kubectl
        run: kubectl -n kube-system get configmap coredns -o jsonpath='{.data.Corefile}' | grep -cE 'kubernetes cluster\.local |forward \. /etc/resolv\.conf'
        expect: { equals: "2" }
        weight: 1
      - id: q2-kube-dns-service
        description: Service kube-dns selects the CoreDNS Pods
        type: kubectl
        run: kubectl -n kube-system get svc kube-dns -o jsonpath='{.spec.selector.k8s-app}'
        expect: { equals: kube-dns }
        weight: 1
    hints:
      - "Is it DNS at all? From ${Q2_CLIENT}, compare nslookup web with nslookup web.${Q2_NS}.svc.cluster.local, and both with a lookup sent straight to a CoreDNS Pod IP: nslookup <name> <pod-ip>."
      - "Work outwards from the client: kubectl -n ${Q2_NS} exec ${Q2_CLIENT} -- cat /etc/resolv.conf, then kubectl -n kube-system get svc,endpointslices -l k8s-app=kube-dns, then the CoreDNS Pods."
      - "CoreDNS Pods that are missing, crashing or never ready say why: kubectl -n kube-system get deploy,pods -l k8s-app=kube-dns, then describe and logs."
      - CoreDNS reads its configuration from a ConfigMap and needs permission to watch the cluster; both are in kube-system.
    recipe: { category: dns }
  - id: q3
    title: Helm release ${Q3_REL}
    points: 4
    context: k8s-green
    setup:
      - node: controlplane
        script: setup/q3.sh
        lane: q3
    checks:
      - type: kubectl
        id: q3-release
        description: release ${Q3_REL} is deployed from chart webapp-${Q3_VERSION}
        run: helm -n ${Q3_NS} list -o json | jq -r '.[] | select(.name == "${Q3_REL}") | .status + "/" + .chart'
        expect: { equals: "deployed/webapp-${Q3_VERSION}" }
        weight: 2
      - type: kubectl
        id: q3-ready
        description: 1 replica of ${Q3_REL} is ready
        run: kubectl -n ${Q3_NS} get deployment -l app.kubernetes.io/instance=${Q3_REL} -o jsonpath='{.items[0].status.readyReplicas}'
        expect: { equals: "1" }
        weight: 1
        retrySeconds: 90
      - id: q3-manifest
        description: /opt/course/helm/${Q3_REL}-manifest.yaml holds the release's Deployment
        type: ssh
        node: controlplane
        run: "grep -q 'kind: Deployment' \"/opt/course/helm/${Q3_REL}-manifest.yaml\" 2>/dev/null && grep -q 'app.kubernetes.io/instance: ${Q3_REL}' \"/opt/course/helm/${Q3_REL}-manifest.yaml\" && echo ok || echo missing"
        expect: { equals: ok }
        weight: 1
    hints:
      - helm repo add lab http://controlplane:8879, then helm search repo lab/webapp --versions.
      - helm install <release> <chart> --version <v> -n <namespace>
      - helm get manifest <release> prints what Helm applied for the current revision.
    recipe: { builder: helm, parts: [ manifest ] }
  - id: q4
    title: Service ${Q4_APP} unreachable
    points: 6
    context: k8s-infra
    setup:
      - node: controlplane
        script: setup/q4.sh
        timeoutSeconds: 400
    setupStage: 1
    checks:
      - id: q4-reachable
        description: ${Q4_CLIENT} gets the nginx page from http://${Q4_APP}
        type: kubectl
        run: kubectl -n ${Q4_NS} exec ${Q4_CLIENT} -- wget -qO- -T 3 http://${Q4_APP}
        expect: { contains: nginx }
        weight: 3
        retrySeconds: 30
      - id: q4-endpoints
        description: Service ${Q4_APP} has 2 ready endpoints
        type: kubectl
        run: kubectl -n ${Q4_NS} get endpointslices -l kubernetes.io/service-name=${Q4_APP} -o jsonpath='{range .items[*].endpoints[*]}{.conditions.ready}{"\n"}{end}' | grep -c true
        expect: { equals: "2" }
        weight: 1
        retrySeconds: 30
      - id: q4-spec-service
        description: Service ${Q4_APP} is a ClusterIP Service on port 80
        type: kubectl
        run: kubectl -n ${Q4_NS} get svc ${Q4_APP} -o jsonpath='{.spec.type} {.spec.ports[0].port}'
        expect: { equals: ClusterIP 80 }
        weight: 1
      - id: q4-spec-deployment
        description: Deployment ${Q4_APP} is the original one, with 2 replicas, its image and a readiness probe
        type: kubectl
        run: "[ ! -f /var/tmp/cka-q4.uid ] || [ \"$(kubectl -n ${Q4_NS} get deployment ${Q4_APP} -o jsonpath='{.metadata.uid}')\" = \"$(cat /var/tmp/cka-q4.uid)\" ] || { echo recreated; exit 0; }; echo \"$(kubectl -n ${Q4_NS} get deployment ${Q4_APP} -o jsonpath='{.spec.replicas} {.spec.template.spec.containers[0].image}') $([ -n \"$(kubectl -n ${Q4_NS} get deployment ${Q4_APP} -o jsonpath='{.spec.template.spec.containers[0].readinessProbe}')\" ] && echo probe || echo none)\""
        expect: { equals: 2 nginx:1.27-alpine probe }
        weight: 1
    hints:
      - "Split the path into hops and test each one from ${Q4_CLIENT}: does the name resolve, does the Service IP answer, does a Pod IP answer? kubectl -n ${Q4_NS} get svc,endpointslices,pods -o wide gives you the addresses."
      - "kubectl -n ${Q4_NS} describe svc ${Q4_APP} and kubectl -n ${Q4_NS} get endpointslices: an empty or not-ready endpoint list sends you to the Pods; a healthy one sends you further along the path."
      - "Compare what the Service selects and forwards to with what the Pods really carry and listen on: kubectl -n ${Q4_NS} get pods --show-labels and kubectl -n ${Q4_NS} get deployment ${Q4_APP} -o yaml."
      - "When the namespace looks right, look at what sits between the client and the Pods: NetworkPolicies, and the node component that turns Service IPs into Pod IPs (kubectl -n kube-system get ds,pods)."
    recipe: { category: services }
  - id: q5
    title: Default StorageClass with local-path
    points: 6
    context: k8s-data
    setup:
      - node: controlplane
        script: setup/q5.sh
        lane: q5
    checks:
      - id: q5-class
        description: StorageClass ${Q5_SC} uses rancher.io/local-path, WaitForFirstConsumer and reclaim Delete
        type: kubectl
        run: kubectl get storageclass ${Q5_SC} -o jsonpath='{.provisioner} {.volumeBindingMode} {.reclaimPolicy}'
        expect: { equals: rancher.io/local-path WaitForFirstConsumer Delete }
        weight: 2
      - id: q5-only-default
        description: ${Q5_SC} is the only default StorageClass
        type: kubectl
        run: kubectl get storageclass -o jsonpath='{range .items[?(@.metadata.annotations.storageclass\.kubernetes\.io/is-default-class=="true")]}{.metadata.name}{"\n"}{end}' | xargs
        expect: { equals: "${Q5_SC}" }
        weight: 1
      - id: q5-claim
        description: PVC cache in ${Q5_NS} is Bound through ${Q5_SC}
        type: kubectl
        run: kubectl -n ${Q5_NS} get pvc cache -o jsonpath='{.status.phase} {.spec.storageClassName}'
        expect: { equals: "Bound ${Q5_SC}" }
        weight: 1
        retrySeconds: 60
      - id: q5-pod
        description: Pod cache-app runs with the claim at /cache
        type: kubectl
        run: kubectl -n ${Q5_NS} get pod cache-app -o jsonpath='{.status.phase} {.spec.volumes[*].persistentVolumeClaim.claimName} {.spec.containers[0].volumeMounts[*].mountPath}'
        expect: { matches: ^Running cache .*/cache }
        weight: 1
        retrySeconds: 60
      - id: q5-local
        description: the volume was provisioned on the node the Pod runs on
        type: kubectl
        run: pv=$(kubectl -n ${Q5_NS} get pvc cache -o jsonpath='{.spec.volumeName}'); [ -n "$pv" ] && [ "$(kubectl get pv "$pv" -o jsonpath='{.spec.nodeAffinity.required.nodeSelectorTerms[0].matchExpressions[0].values[0]}')" = "$(kubectl -n ${Q5_NS} get pod cache-app -o jsonpath='{.spec.nodeName}')" ] && echo local || echo elsewhere
        expect: { equals: local }
        weight: 1
        retrySeconds: 60
    hints:
      - kubectl get storageclass marks the default class with (default); the annotation storageclass.kubernetes.io/is-default-class decides it.
      - "A claim without storageClassName gets the default class when it is created, not later: make the class the default first."
      - With WaitForFirstConsumer a claim stays Pending until a Pod that uses it is scheduled; then the volume is created for that Pod's node.
    recipe: { builder: dynamic-storage, parts: [] }
  - id: q6
    title: Pod ${Q6_NAME}
    points: 10
    context: k8s-edge
    setup:
      - node: controlplane
        script: setup/q6.sh
        lane: q6
    checks:
      - id: q6-running
        description: Pod ${Q6_NAME} is Running and ready
        type: kubectl
        run: kubectl -n ${Q6_NS} get pod ${Q6_NAME} -o jsonpath='{.status.phase}/{.status.conditions[?(@.type=="Ready")].status}'
        expect: { equals: Running/True }
        weight: 2
        retrySeconds: 30
      - id: q6-image
        description: main runs ${Q6_IMAGE}
        type: kubectl
        run: kubectl -n ${Q6_NS} get pod/${Q6_NAME} -o jsonpath='{.spec.containers[0].name}/{.spec.containers[0].image}'
        expect: { equals: "main/${Q6_IMAGE}" }
        weight: 1
      - id: q6-sec-user
        description: the container runs as uid ${Q6_SEC_USER}
        type: kubectl
        run: kubectl -n ${Q6_NS} exec pod/${Q6_NAME} -- id -u
        expect: { equals: "${Q6_SEC_USER}" }
        weight: 1
        retrySeconds: 20
      - id: q6-sec-readonly
        description: root filesystem is read-only and escalation is off
        type: kubectl
        run: kubectl -n ${Q6_NS} get pod/${Q6_NAME} -o jsonpath='{.spec.containers[0].securityContext.readOnlyRootFilesystem}/{.spec.containers[0].securityContext.allowPrivilegeEscalation}'
        expect: { equals: true/false }
        weight: 1
      - id: q6-probe
        description: liveness probe runs ls / every ${Q6_PROBE_PERIOD}s
        type: kubectl
        run: kubectl -n ${Q6_NS} get pod/${Q6_NAME} -o jsonpath='{.spec.containers[0].livenessProbe.exec.command[*]}/{.spec.containers[0].livenessProbe.periodSeconds}'
        expect: { equals: "ls //${Q6_PROBE_PERIOD}" }
        weight: 1
      - id: q6-env-source
        description: Secret ${Q6_ENV_OBJ} has ${Q6_ENV_KEY}=${Q6_ENV_VALUE}
        type: kubectl
        run: kubectl -n ${Q6_NS} get secret ${Q6_ENV_OBJ} -o jsonpath='{.data.${Q6_ENV_KEY}}' | base64 -d
        expect: { equals: "${Q6_ENV_VALUE}" }
        weight: 1
      - id: q6-env-value
        description: ${Q6_ENV_KEY} is ${Q6_ENV_VALUE} inside the container
        type: kubectl
