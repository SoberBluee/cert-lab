        description: ${Q16_APP} has at least 2 ready replicas
        type: kubectl
        run: kubectl -n ${Q16_NS} get deployment ${Q16_APP} -o jsonpath='{.status.readyReplicas}'
        expect: { gte: 2 }
        weight: 1
        retrySeconds: 60
      - id: q16-spec
        description: ${Q16_APP} keeps its image and has a CPU request
        type: kubectl
        run: kubectl -n ${Q16_NS} get deployment ${Q16_APP} -o jsonpath='{.spec.template.spec.containers[0].image} {.spec.template.spec.containers[0].resources.requests.cpu}'
        expect: { matches: ^nginx:1\.27-alpine \S+$ }
        weight: 1
      - id: q16-same-deployment
        description: ${Q16_APP} was not deleted or recreated
        type: kubectl
        run: "[ \"$(kubectl -n ${Q16_NS} get deployment ${Q16_APP} -o jsonpath='{.metadata.uid}')\" = \"$(cat /var/tmp/cka-q16.uid)\" ] && echo same || echo recreated"
        expect: { equals: same }
        weight: 1
    hints:
      - "kubectl -n ${Q16_NS} get hpa ${Q16_APP}: TARGETS shows <unknown> when the autoscaler cannot read metrics; MINPODS and MAXPODS show its range."
      - "kubectl -n ${Q16_NS} describe hpa ${Q16_APP}: the Conditions and Events say why it cannot scale."
      - "kubectl top pods -n ${Q16_NS}: when this fails, the problem is the metrics pipeline (kubectl get apiservice, then the Deployment and Service behind it), not the autoscaler."
    recipe: { category: hpa }
  - id: q17
    title: Change the upstream DNS server
    points: 6
    context: k8s-gamma
    setup:
      - node: controlplane
        script: setup/q17.sh
        timeoutSeconds: 600
        lane: q17
    checks:
      - id: q17-upstream
        description: intranet.${Q17_ZONE} resolves to ${Q17_IP} through the company server
        type: kubectl
        run: kubectl -n ${Q17_NS} exec dns-test -- nslookup intranet.${Q17_ZONE} 2>/dev/null | grep -qw '${Q17_IP}' && echo resolved || echo unresolved
        expect: { equals: resolved }
        weight: 3
        retrySeconds: 90
      - id: q17-cluster-local
        description: web.${Q17_NS}.svc.cluster.local still resolves to the ClusterIP of web
        type: kubectl
        run: ip=$(kubectl -n ${Q17_NS} get service web -o jsonpath='{.spec.clusterIP}'); [ -n "$ip" ] && kubectl -n ${Q17_NS} exec dns-test -- nslookup web.${Q17_NS}.svc.cluster.local 2>/dev/null | grep -qw "$ip" && echo resolved || echo unresolved
        expect: { equals: resolved }
        weight: 1
        retrySeconds: 90
      - id: q17-forward
        description: CoreDNS forwards to the company server and no longer to /etc/resolv.conf
        type: kubectl
        run: ip=$(kubectl -n corp-dns get service resolver -o jsonpath='{.spec.clusterIP}'); c=$(kubectl -n kube-system get configmap coredns -o jsonpath='{.data.Corefile}'); [ -n "$ip" ] && grep -E '^ *forward \. ' <<< "$c" | grep -qw "$ip" && ! grep -qE 'forward \. /etc/resolv\.conf' <<< "$c" && echo yes || echo no
        expect: { equals: yes }
        weight: 1
      - id: q17-coredns
        description: CoreDNS runs 2 ready replicas
        type: kubectl
        run: kubectl -n kube-system get deployment coredns -o jsonpath='{.status.readyReplicas}'
        expect: { equals: "2" }
        weight: 1
        retrySeconds: 60
    hints:
      - "In the .:53 server block, the forward plugin says where names outside the cluster go: forward . /etc/resolv.conf asks the node's resolvers."
      - "kubectl -n corp-dns get service resolver gives the address to forward to: the forward plugin takes IP addresses, not names."
      - CoreDNS reloads a changed Corefile after a while; kubectl -n kube-system rollout restart deployment/coredns applies it at once, and kubectl -n kube-system logs deploy/coredns shows a Corefile that does not parse.
    recipe: { builder: coredns, parts: [] }
