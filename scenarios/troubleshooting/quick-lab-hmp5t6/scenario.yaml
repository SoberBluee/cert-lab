      - id: q6-label
        description: ${Q6_NAME} has the label ${Q6_LABEL_KEY}=${Q6_LABEL_VALUE}
        type: kubectl
        run: kubectl -n ${Q6_NS} get pod ${Q6_NAME} -o jsonpath='{.metadata.labels.${Q6_LABEL_KEY}}'
        expect: { equals: "${Q6_LABEL_VALUE}" }
        weight: 1
    hints:
      - kubectl -n ${Q6_NS} run ${Q6_NAME} --image=${Q6_IMAGE} --dry-run=client -o yaml -- sleep 1d gives you a manifest to start from.
      - "securityContext on the container: runAsUser, readOnlyRootFilesystem, allowPrivilegeEscalation."
