      - "kubectl -n ${Q6_NS} create secret generic ${Q6_ENV_OBJ} --from-literal=${Q6_ENV_KEY}=${Q6_ENV_VALUE}; then env: [{name: ${Q6_ENV_KEY}, valueFrom: {secretKeyRef: {name: ${Q6_ENV_OBJ}, key: ${Q6_ENV_KEY}}}}]"
