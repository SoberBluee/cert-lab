id: kk2-pvc-too-large
title: PVC stays Pending
domain: troubleshooting
difficulty: 1
estimatedMinutes: 6
points: 5
tags: [troubleshooting, pvc, pv, storage]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 30
variables:
  NS: { oneOf: [ data, storage, files ] }
  NAME: { oneOf: [ orange, lemon, mango ] }
setup:
  - node: controlplane
    script: setup/break.sh
checks:
  - id: bound
    description: PVC ${NAME}-pvc is Bound to ${NAME}-pv
    type: kubectl
    run: kubectl -n ${NS} get pvc ${NAME}-pvc -o jsonpath='{.status.phase}/{.spec.volumeName}'
    expect: { equals: "Bound/${NAME}-pv" }
    weight: 3
    retrySeconds: 60
  - id: size
    description: the claim requests at most 100Mi
    type: kubectl
    run: kubectl -n ${NS} get pvc ${NAME}-pvc -o jsonpath='{.spec.resources.requests.storage}'
    expect: { equals: "100Mi" }
    weight: 1
  - id: pv
    description: PV ${NAME}-pv capacity is still 100Mi
    type: kubectl
    run: kubectl get pv ${NAME}-pv -o jsonpath='{.spec.capacity.storage}'
    expect: { equals: "100Mi" }
    weight: 1
hints:
  - "kubectl describe pvc shows VolumeMismatch when the claim asks for more than the PV capacity."
  - "Most PVC fields cannot be patched: delete and recreate the claim with a matching size."
