id: memory-pressure-kubelet-flag
title: Memory pressure with a clean kubelet config
domain: troubleshooting
difficulty: 3
estimatedMinutes: 16
points: 14
tags: [ troubleshooting, kubelet, eviction, memorypressure, memory-pressure, qos ]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 60
variables:
  Q1_NS: { oneOf: [ ledger, settlements, core-banking ] }
  Q1_APP: { oneOf: [ ledger-api, settle-api, balance-api ] }
  Q2_NS: { oneOf: [ fleet, edge, infra ] }
  Q2_NODE: { node: workers }
solution:
  - node: controlplane
    script: solution.sh
  - node: ${Q2_NODE}
    script: solution-node.sh
tasks:
  - id: q1
    title: Make ${Q1_APP} the last to be evicted
    points: 6
    tags: [ qos ]
    setup:
      - node: controlplane
        script: setup/q1.sh
        timeoutSeconds: 300
    checks:
      - id: q1-ready
        description: ${Q1_APP} has 2 ready, updated replicas
        type: kubectl
        run: kubectl -n ${Q1_NS} get deployment ${Q1_APP} -o jsonpath='{.status.readyReplicas}/{.status.updatedReplicas}/{.status.replicas}'
        expect: { equals: 2/2/2 }
        weight: 1
        retrySeconds: 120
      - id: q1-qos
        description: the running Pods of ${Q1_APP} have QoS class Guaranteed
        type: kubectl
        run: kubectl -n ${Q1_NS} get pods -l app=${Q1_APP} --field-selector=status.phase=Running -o jsonpath='{range .items[*]}{.status.qosClass}{"\n"}{end}' | sort -u | xargs
        expect: { equals: Guaranteed }
        weight: 3
        retrySeconds: 120
      - id: q1-requests
        description: the requests are the ones the task names
        type: kubectl
        run: >-
          kubectl -n ${Q1_NS} get deployment ${Q1_APP} -o jsonpath='{.spec.template.spec.containers[?(@.name=="api")].resources.requests.cpu}/{.spec.template.spec.containers[?(@.name=="api")].resources.requests.memory} {.spec.template.spec.containers[?(@.name=="shipper")].resources.requests.cpu}/{.spec.template.spec.containers[?(@.name=="shipper")].resources.requests.memory} {.spec.template.spec.initContainers[?(@.name=="prepare")].resources.requests.cpu}/{.spec.template.spec.initContainers[?(@.name=="prepare")].resources.requests.memory}'
        expect: { equals: 100m/128Mi 50m/32Mi 20m/16Mi }
        weight: 1
      - id: q1-same
        description: ${Q1_APP} was not deleted or recreated
        type: kubectl
        run: >-
          [ "$(kubectl -n ${Q1_NS} get deployment ${Q1_APP} -o jsonpath='{.metadata.uid}')" = "$(cat /var/tmp/cka-q1.uid)" ] && echo same || echo recreated
        expect: { equals: same }
        weight: 1
    hints:
      - kubectl -n ${Q1_NS} get pod <pod> -o jsonpath='{.status.qosClass}' shows the class the Pod has now.
      - "Guaranteed is about every container of the Pod, init containers too: each needs CPU and memory limits equal to its requests."
  - id: q2
    title: A worker keeps evicting Pods
    points: 8
    tags: [ troubleshooting, kubelet, eviction, memorypressure ]
    setupStage: 1
    setup:
      - node: controlplane
        script: setup/q2-agent.sh
        timeoutSeconds: 300
      - node: ${Q2_NODE}
        script: setup/q2-break.sh
      - node: controlplane
        script: setup/q2-wait.sh
        timeoutSeconds: 240
    checks:
      - id: q2-all-ready
        description: every node is Ready
        type: kubectl
        run: kubectl get nodes -o jsonpath='{range .items[*]}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}' | sort -u | xargs
        expect: { equals: "True" }
        weight: 1
        retrySeconds: 120
      - id: q2-no-pressure
        description: no node is under MemoryPressure
        type: kubectl
        run: kubectl get nodes -o jsonpath='{range .items[*]}{.status.conditions[?(@.type=="MemoryPressure")].status}{"\n"}{end}' | sort -u | xargs
        expect: { equals: "False" }
        weight: 4
        retrySeconds: 120
      - id: q2-agent
        description: node-agent has a ready Pod on every worker
        type: kubectl
        run: kubectl -n ${Q2_NS} get daemonset node-agent -o jsonpath='{.status.numberReady}/{.status.desiredNumberScheduled}'
        expect: { equals: 2/2 }
        weight: 1
        retrySeconds: 120
      - id: q2-kubelet
        description: the kubelet is active and enabled on the worker
        type: ssh
        node: ${Q2_NODE}
        run: echo $(systemctl is-active kubelet) $(systemctl is-enabled kubelet)
        expect: { equals: active enabled }
        weight: 1
      - id: q2-config
        description: /var/lib/kubelet/config.yaml was not changed
        type: ssh
        node: ${Q2_NODE}
        run: sha256sum -c /var/tmp/cka-q2.config --status && echo same || echo changed
        expect: { equals: same }
        weight: 1
    hints:
      - "kubectl get nodes -o custom-columns=NAME:.metadata.name,PRESSURE:'.status.conditions[?(@.type==\"MemoryPressure\")].status', then free -m on that node: is the memory really gone?"
      - "If the node has plenty of memory, the threshold is what is wrong. The file you were told is correct is not the only way to set one: compare the running process (ps -o args= -C kubelet) on both workers."
      - systemctl cat kubelet lists every file the kubelet's flags come from.
