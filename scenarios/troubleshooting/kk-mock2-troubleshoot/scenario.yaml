id: kk-mock2-troubleshoot
title: "Mock 2 practice: troubleshooting"
domain: troubleshooting
difficulty: 3
estimatedMinutes: 55
points: 34
tags:
  [
    troubleshooting,
    probes,
    kube-apiserver,
    etcd,
    static-pod,
    configmap,
    volumes,
    pvc,
    pv,
    crashloop,
    service,
    endpoints,
    nodeport,
  ]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 60
variables:
  Q1_POD: { oneOf: [ red-probe, amber-probe, health-probe ] }
  Q3_NS: { oneOf: [ web, shop, site ] }
  Q3_APP: { oneOf: [ nginx-site, static-web, brochure ] }
  Q3_NODEPORT: { oneOf: [ 30082, 30092, 30102 ] }
  Q4_NS: { oneOf: [ data, storage, files ] }
  Q4_NAME: { oneOf: [ orange, lemon, mango ] }
  Q5_POD: { oneOf: [ check-time, tick-clock, time-writer ] }
  Q6_NS: { oneOf: [ default, apps, demo ] }
  Q6_APP: { oneOf: [ curlme, echo-app, hello ] }
solution:
  - node: controlplane
    script: setup/q2-solution.sh
    timeoutSeconds: 900
  - node: controlplane
    script: solution.sh
    timeoutSeconds: 600
tasks:
  - id: q1
    title: Fix and apply the ${Q1_POD} template
    tags: [ probes, liveness, pod ]
    points: 5
    setup:
      - node: controlplane
        script: setup/q1.sh
        lane: q1
    checks:
      - id: q1-running
        description: Pod ${Q1_POD} is Running with 0 restarts
        type: kubectl
        run: kubectl get pod ${Q1_POD} -o jsonpath='{.status.phase}/{.status.containerStatuses[0].restartCount}'
        expect: { equals: "Running/0" }
        weight: 2
        retrySeconds: 90
      - id: q1-probe-exec
        description: the liveness probe is exec (not httpGet)
        type: kubectl
        run: kubectl get pod ${Q1_POD} -o jsonpath='{.spec.containers[0].livenessProbe.exec.command[0]}/{.spec.containers[0].livenessProbe.httpGet}'
        expect: { equals: "cat/" }
        weight: 1
      - id: q1-delay
        description: initialDelaySeconds is at least 5
        type: kubectl
        run: kubectl get pod ${Q1_POD} -o jsonpath='{.spec.containers[0].livenessProbe.initialDelaySeconds}'
        expect: { gte: 5 }
        weight: 1
      - id: q1-args
        description: the container args were not changed
        type: kubectl
        run: kubectl get pod ${Q1_POD} -o jsonpath='{.spec.containers[0].args[*]}'
        expect: { equals: "-c sleep 3 ; touch /healthcheck; sleep 30; sleep 30000" }
        weight: 1
    hints:
      - "kubectl apply -f /opt/course/${Q1_POD}.yaml shows the validation error; fix the probe type first."
      - "After the Pod starts, watch restarts and kubectl describe pod / get events for Unhealthy liveness failures."
      - "Do not change the args: section. Raise initialDelaySeconds so the probe runs after /healthcheck exists."

  - id: q2
    title: kubectl fails on the control plane
    tags: [ kube-apiserver, etcd, static-pod ]
    points: 8
    setupStage: 1
    setup:
      - node: controlplane
        script: setup/q2.sh
        timeoutSeconds: 300

    checks:
      - id: q2-api-ready
        description: the API server reports ready
        type: kubectl
        run: kubectl get --raw /readyz
        expect: { equals: "ok" }
        weight: 3
        retrySeconds: 180
      - id: q2-components
        description: control-plane static Pods are Ready
        type: kubectl
        run: kubectl -n kube-system get pods -l tier=control-plane -o jsonpath='{range .items[*]}{.metadata.name}={.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}' | sort | xargs
        expect: { equals: "etcd-controlplane=True kube-apiserver-controlplane=True kube-controller-manager-controlplane=True kube-scheduler-controlplane=True" }
        weight: 2
        retrySeconds: 180
      - id: q2-etcd-flags
        description: apiserver talks to etcd with https and the etcd CA
        type: ssh
        node: controlplane
        run: |
          m=/etc/kubernetes/manifests/kube-apiserver.yaml
          grep -qE -- '- --etcd-servers=https://127.0.0.1:2379$' $m \
            && grep -qE -- '- --etcd-cafile=/etc/kubernetes/pki/etcd/ca.crt$' $m && echo ok || echo wrong
        expect: { equals: "ok" }
        weight: 3
    hints:
      - "kubectl fails, so work on controlplane: sudo crictl ps -a | grep kube-apiserver, then sudo crictl logs <id>."
      - "Compare /etc/kubernetes/manifests/kube-apiserver.yaml with etcd.yaml: flag name --etcd-servers (plural), https, and --etcd-cafile under pki/etcd/."

  - id: q3
    title: NodePort site ${Q3_APP} is down
    tags: [ configmap, volumes, nodeport ]
    points: 5
    setup:
      - node: controlplane
        script: setup/q3.sh
        timeoutSeconds: 300
        lane: q3
    checks:
      - id: q3-ready
        description: Deployment ${Q3_APP} has 1 ready replica
        type: kubectl
        run: kubectl -n ${Q3_NS} get deployment ${Q3_APP} -o jsonpath='{.status.readyReplicas}'
        expect: { equals: "1" }
        weight: 2
        retrySeconds: 90
      - id: q3-curl
        description: curl http://controlplane:${Q3_NODEPORT}/ returns the page
        type: kubectl
        run: curl -s -m 5 http://controlplane:${Q3_NODEPORT}/
        expect: { contains: "${Q3_APP} is up" }
        weight: 2
        retrySeconds: 60
      - id: q3-cm
        description: the Pod mounts ConfigMap ${Q3_APP}-config
        type: kubectl
        run: kubectl -n ${Q3_NS} get deployment ${Q3_APP} -o jsonpath='{.spec.template.spec.volumes[?(@.name=="nginx-config-volume")].configMap.name}'
        expect: { equals: "${Q3_APP}-config" }
        weight: 1
    hints:
      - "kubectl -n ${Q3_NS} describe pod <pod> Events: FailedMount usually names a missing ConfigMap."
      - "Compare the volume configMap.name with kubectl -n ${Q3_NS} get configmap."

  - id: q4
    title: PVC ${Q4_NAME}-pvc is Pending
    tags: [ pvc, pv, storage ]
    points: 5
    setup:
      - node: controlplane
        script: setup/q4.sh
        lane: q4
    checks:
      - id: q4-bound
        description: PVC ${Q4_NAME}-pvc is Bound to ${Q4_NAME}-pv
        type: kubectl
        run: kubectl -n ${Q4_NS} get pvc ${Q4_NAME}-pvc -o jsonpath='{.status.phase}/{.spec.volumeName}'
        expect: { equals: "Bound/${Q4_NAME}-pv" }
        weight: 3
        retrySeconds: 60
      - id: q4-size
        description: the claim requests at most 100Mi
        type: kubectl
        run: kubectl -n ${Q4_NS} get pvc ${Q4_NAME}-pvc -o jsonpath='{.spec.resources.requests.storage}'
        expect: { equals: "100Mi" }
        weight: 1
      - id: q4-pv
        description: PV ${Q4_NAME}-pv capacity is still 100Mi
        type: kubectl
        run: kubectl get pv ${Q4_NAME}-pv -o jsonpath='{.spec.capacity.storage}'
        expect: { equals: "100Mi" }
        weight: 1
    hints:
      - "kubectl describe pvc shows VolumeMismatch when the claim asks for more than the PV capacity."
      - "Most PVC fields cannot be patched: delete and recreate the claim with a matching size."

  - id: q5
    title: Pod ${Q5_POD} keeps crashing
    tags: [ crashloop, command ]
    points: 5
    setup:
      - node: controlplane
        script: setup/q5.sh
        lane: q5
    checks:
      - id: q5-running
        description: Pod ${Q5_POD} is Running
        type: kubectl
        run: kubectl get pod ${Q5_POD} -o jsonpath='{.status.phase}'
        expect: { equals: "Running" }
        weight: 2
        retrySeconds: 60
      - id: q5-shell
        description: the command uses /bin/sh
        type: kubectl
        run: kubectl get pod ${Q5_POD} -o jsonpath='{.spec.containers[0].command[0]}'
        expect: { equals: "/bin/sh" }
        weight: 2
      - id: q5-writes
        description: the Pod keeps writing timestamps to /tmp/now.txt
        type: kubectl
        run: kubectl exec ${Q5_POD} -- sh -c 'test -s /tmp/now.txt && wc -l </tmp/now.txt'
        expect: { gte: 1 }
        weight: 1
        retrySeconds: 30
    hints:
      - "kubectl describe pod / get events: look for exec: \"/bin/bash\": no such file."
      - "busybox images have /bin/sh, not /bin/bash. Recreate the Pod after editing the command."

  - id: q6
    title: Service ${Q6_APP}-svc is unreachable
    tags: [ service, endpoints, selector ]
    points: 6
    setup:
      - node: controlplane
        script: setup/q6.sh
        timeoutSeconds: 300
        lane: q6
    checks:
      - id: q6-curl
        description: curlpod reaches http://${Q6_APP}-svc
        type: kubectl
        run: kubectl -n ${Q6_NS} exec curlpod -- wget -qO- -T 5 http://${Q6_APP}-svc
        expect: { contains: nginx }
        weight: 3
        retrySeconds: 60
      - id: q6-selector
        description: Service selector matches the Pod label run=${Q6_APP}
        type: kubectl
        run: kubectl -n ${Q6_NS} get svc ${Q6_APP}-svc -o jsonpath='{.spec.selector.run}'
        expect: { equals: "${Q6_APP}" }
        weight: 2
      - id: q6-port
        description: Service still listens on port 80
        type: kubectl
        run: kubectl -n ${Q6_NS} get svc ${Q6_APP}-svc -o jsonpath='{.spec.ports[0].port}/{.spec.ports[0].targetPort}'
        expect: { equals: "80/80" }
        weight: 1
    hints:
      - "kubectl describe svc: Endpoints empty means the selector does not match any Pod."
      - "Compare the selector with kubectl get pods --show-labels; a single wrong character is enough."
      - "You may delete and recreate the Service, but keep name, port and type the same."
