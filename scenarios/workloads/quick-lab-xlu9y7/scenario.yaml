id: quick-lab-xlu9y7
title: "Quick lab: Pod"
domain: workloads
difficulty: 2
estimatedMinutes: 13
points: 12
tags: [ pod, exec-probe, config-volume, env, annotate, label ]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 30
draft: true
variables:
  Q1_NS: { oneOf: [ apps, jobs, sandbox, workloads, demo, lab, temp, scratch, tools, debug ] }
  Q1_NAME: { oneOf: [ worker, logger, toolbox, frontend, backend, database, cache, queue, scheduler, monitor, gateway, proxy, client, agent, runner ] }
  Q1_IMAGE: { oneOf: [ busybox:1.36, busybox:1.37, nginx:1.28-alpine, httpd:2.4-alpine, alpine:3.20 ] }
  Q1_PROBE_PERIOD: { oneOf: [ 5, 10, 15 ] }
  Q1_FILES_OBJ: { oneOf: [ app-files, web-conf, tool-settings, runtime-config, app-secrets, env-files, nginx-conf, app-certs, feature-flags, credentials ] }
  Q1_FILES_FILE: { oneOf: [ app.conf, settings.ini, motd, config.yaml, nginx.conf, app.env, limits.conf, hosts.extra, banner.txt, defaults.cfg ] }
  Q1_FILES_VALUE: { oneOf: [ enabled, v2, hello, "true", production, debug, canary, on, active, ready ] }
  Q1_ENV_OBJ: { oneOf: [ app-config, app-settings, runtime-env, feature-flags, app-secrets, env-store, service-config, workload-env, runtime-flags, app-params ] }
  Q1_ENV_KEY: { oneOf: [ LOG_LEVEL, MODE, REGION, APP_ENV, CLUSTER, STAGE, FEATURE_FLAG, TZ, ROLE, COLOR ] }
  Q1_ENV_VALUE: { oneOf: [ debug, info, warn, error, prod, staging, canary, eu-west, us-east, primary ] }
  Q1_NOTE_KEY: { oneOf: [ owner, contact, ticket, description, managed-by, team, cost-center, runbook, slack, pager ] }
  Q1_NOTE_VALUE: { oneOf: [ platform, ops-team, cka-42, sre, devops, oncall, infra, product, security, finance ] }
  Q1_LABEL_KEY: { oneOf: [ tier, team, env, app, role, zone, stage, component, version, owner ] }
  Q1_LABEL_VALUE: { oneOf: [ backend, blue, prod, frontend, green, staging, canary, worker, api, batch ] }
tasks:
  - id: q1
    title: Pod ${Q1_NAME}
    points: 12
    setup:
      - node: controlplane
        script: setup/q1.sh
        lane: q1
    checks:
      - id: q1-running
        description: Pod ${Q1_NAME} is Running and ready
        type: kubectl
        run: kubectl -n ${Q1_NS} get pod ${Q1_NAME} -o jsonpath='{.status.phase}/{.status.conditions[?(@.type=="Ready")].status}'
        expect: { equals: Running/True }
        weight: 2
        retrySeconds: 30
      - id: q1-image
        description: main runs ${Q1_IMAGE}
        type: kubectl
        run: kubectl -n ${Q1_NS} get pod/${Q1_NAME} -o jsonpath='{.spec.containers[0].name}/{.spec.containers[0].image}'
        expect: { equals: "main/${Q1_IMAGE}" }
        weight: 1
      - id: q1-probe
        description: liveness probe runs ls / every ${Q1_PROBE_PERIOD}s
        type: kubectl
        run: kubectl -n ${Q1_NS} get pod/${Q1_NAME} -o jsonpath='{.spec.containers[0].livenessProbe.exec.command[*]}/{.spec.containers[0].livenessProbe.periodSeconds}'
        expect: { equals: "ls //${Q1_PROBE_PERIOD}" }
        weight: 1
      - id: q1-files-source
        description: Secret ${Q1_FILES_OBJ} has ${Q1_FILES_FILE}=${Q1_FILES_VALUE}
        type: kubectl
        run: kubectl -n ${Q1_NS} get secret ${Q1_FILES_OBJ} -o go-template='{{index .data "${Q1_FILES_FILE}" | base64decode}}'
        expect: { equals: "${Q1_FILES_VALUE}" }
        weight: 1
      - id: q1-files-mounted
        description: /etc/app/${Q1_FILES_FILE} holds ${Q1_FILES_VALUE}
        type: kubectl
        run: kubectl -n ${Q1_NS} exec pod/${Q1_NAME} -- cat /etc/app/${Q1_FILES_FILE}
        expect: { equals: "${Q1_FILES_VALUE}" }
        weight: 2
        retrySeconds: 30
      - id: q1-env-source
        description: ConfigMap ${Q1_ENV_OBJ} has ${Q1_ENV_KEY}=${Q1_ENV_VALUE}
        type: kubectl
        run: kubectl -n ${Q1_NS} get configmap ${Q1_ENV_OBJ} -o jsonpath='{.data.${Q1_ENV_KEY}}'
        expect: { equals: "${Q1_ENV_VALUE}" }
        weight: 1
      - id: q1-env-value
        description: ${Q1_ENV_KEY} is ${Q1_ENV_VALUE} inside the container
        type: kubectl
        run: kubectl -n ${Q1_NS} exec pod/${Q1_NAME} -- printenv ${Q1_ENV_KEY}
        expect: { equals: "${Q1_ENV_VALUE}" }
        weight: 2
        retrySeconds: 30
      - id: q1-annotate
        description: ${Q1_NAME} has the annotation ${Q1_NOTE_KEY}=${Q1_NOTE_VALUE}
        type: kubectl
        run: kubectl -n ${Q1_NS} get pod ${Q1_NAME} -o jsonpath='{.metadata.annotations.${Q1_NOTE_KEY}}'
        expect: { equals: "${Q1_NOTE_VALUE}" }
        weight: 1
      - id: q1-label
        description: ${Q1_NAME} has the label ${Q1_LABEL_KEY}=${Q1_LABEL_VALUE}
        type: kubectl
        run: kubectl -n ${Q1_NS} get pod ${Q1_NAME} -o jsonpath='{.metadata.labels.${Q1_LABEL_KEY}}'
        expect: { equals: "${Q1_LABEL_VALUE}" }
        weight: 1
    hints:
      - kubectl -n ${Q1_NS} run ${Q1_NAME} --image=${Q1_IMAGE} --dry-run=client -o yaml -- sleep 1d gives you a manifest to start from.
      - "livenessProbe: {exec: {command: [ls, /]}, periodSeconds: N}"
      - "kubectl -n ${Q1_NS} create secret generic ${Q1_FILES_OBJ} --from-literal=${Q1_FILES_FILE}=${Q1_FILES_VALUE}; then a secret volume (secretName: ${Q1_FILES_OBJ})."
      - "kubectl -n ${Q1_NS} create configmap ${Q1_ENV_OBJ} --from-literal=${Q1_ENV_KEY}=${Q1_ENV_VALUE}; then env: [{name: ${Q1_ENV_KEY}, valueFrom: {configMapKeyRef: {name: ${Q1_ENV_OBJ}, key: ${Q1_ENV_KEY}}}}]"
      - kubectl annotate --help
      - kubectl label --help
    recipe: { builder: pod, parts: [ exec-probe, config-volume, env, annotate, label ] }
