id: quick-lab-xzcp61
title: "Quick lab: Troubleshoot"
domain: workloads
difficulty: 3
estimatedMinutes: 17
points: 13
tags: [ troubleshooting, configmap, secret, volumes, security-context, networkpolicy, dns ]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 30
variables:
  Q1_NS: { oneOf: [ brochure, docs, landing ] }
  Q1_APP: { oneOf: [ site, welcome, promo ] }
  Q1_FAULT: { oneOf: [ configmap-volume-missing, secret-items-key, mount-path, run-as-non-root, readonly-root ], hidden: true }
  Q2_NS: { oneOf: [ secure, payments, vault ] }
  Q2_APP: { oneOf: [ api, ledger, billing ] }
  Q2_FAULT: { oneOf: [ dns-egress-port, dns-namespace-selector, ingress-port, ingress-from-label, egress-to-label, egress-port, ingress-namespace-and, ingress-pod-selector ], hidden: true }
tasks:
  - id: q1
    title: Deployment ${Q1_APP} does not serve its page
    recipe: { category: podconfig }
    points: 6
    setup:
      - node: controlplane
        script: setup/q1.sh
        timeoutSeconds: 400
        lane: q1
    checks:
      - id: q1-ready
        description: ${Q1_APP} has 2 ready replicas
        type: kubectl
        run: kubectl -n ${Q1_NS} get deployment ${Q1_APP} -o jsonpath='{.status.readyReplicas}/{.status.updatedReplicas}/{.status.replicas}'
        expect: { equals: 2/2/2 }
        weight: 2
        retrySeconds: 60
      - id: q1-page
        description: ${Q1_APP} serves the page from ${Q1_APP}-content
        type: kubectl
        run: kubectl -n ${Q1_NS} exec deployment/${Q1_APP} -- wget -qO- -T 3 http://localhost:80/
        expect: { contains: "${Q1_APP} is up" }
        weight: 2
        retrySeconds: 30
      - id: q1-token
        description: the token from ${Q1_APP}-secret is readable at /etc/${Q1_APP}/token
        type: kubectl
        run: kubectl -n ${Q1_NS} exec deployment/${Q1_APP} -- cat /etc/${Q1_APP}/token
        expect: { equals: "s3cr3t-${Q1_APP}" }
        weight: 1
        retrySeconds: 30
      - id: q1-spec-volumes
        description: the volumes still come from a ConfigMap and the Secret
        type: kubectl
        run: kubectl -n ${Q1_NS} get deployment ${Q1_APP} -o jsonpath='{.spec.template.spec.containers[0].image} {.spec.template.spec.volumes[?(@.configMap)].configMap.name} {.spec.template.spec.volumes[?(@.secret)].secret.secretName}'
        expect: { matches: "^nginx:1.27-alpine \\S+ ${Q1_APP}-secret$" }
        weight: 1
    hints:
      - "kubectl -n ${Q1_NS} get pods -l app=${Q1_APP}: are the Pods Pending, ContainerCreating, crashing, or running but not ready?"
      - "kubectl -n ${Q1_NS} describe pod <pod>: the Events name mount and container start errors."
      - kubectl -n ${Q1_NS} logs <pod> (or --previous) shows why nginx exits; kubectl -n ${Q1_NS} exec deploy/${Q1_APP} -- ls -l /usr/share/nginx/html /etc/${Q1_APP} shows what a running container really sees.
      - Compare the volumes and volumeMounts of the Deployment with the ConfigMaps and Secrets that exist and the keys they hold; check the ConfigMap content too, not only its name.
  - id: q2
    title: Frontend cannot reach ${Q2_APP}
    recipe: { category: netpol }
    points: 7
    setup:
      - node: controlplane
        script: setup/q2.sh
        timeoutSeconds: 400
        lane: q2
    checks:
      - id: q2-reachable
        description: client gets the nginx page from http://${Q2_APP}
        type: kubectl
        run: kubectl -n ${Q2_NS} exec client -- wget -qO- -T 3 http://${Q2_APP}
        expect: { contains: nginx }
        weight: 3
        retrySeconds: 30
      - id: q2-stranger-blocked
        description: stranger still cannot reach ${Q2_APP}
        type: kubectl
        run: kubectl -n ${Q2_NS} exec stranger -- wget -qO- -T 3 http://${Q2_APP} >/dev/null 2>&1 && echo open || echo blocked
        expect: { equals: blocked }
        weight: 2
      - id: q2-default-deny
        description: default-deny still selects every Pod for ingress and egress
        type: kubectl
        run: kubectl -n ${Q2_NS} get networkpolicy default-deny -o jsonpath='{.spec.podSelector.matchLabels}|{.spec.policyTypes[*]}|{.spec.ingress}{.spec.egress}'
        expect: { equals: "|Ingress Egress|" }
        weight: 1
      - id: q2-ingress-rule
        description: ${Q2_APP}-ingress allows role=frontend on port 80
        type: kubectl
        run: kubectl -n ${Q2_NS} get networkpolicy ${Q2_APP}-ingress -o jsonpath='{.spec.ingress[0].from[0].podSelector.matchLabels.role} {.spec.ingress[0].ports[0].port}'
        expect: { equals: frontend 80 }
        weight: 1
    hints:
      - "kubectl -n ${Q2_NS} get networkpolicy, then kubectl -n ${Q2_NS} describe networkpolicy <name> for each: which Pods does it select, and what does it let in or out?"
      - "Separate name resolution from the connection: kubectl -n ${Q2_NS} exec client -- nslookup ${Q2_APP}, then wget the Service IP and a Pod IP directly."
      - A connection needs egress allowed at the client and ingress allowed at the server, on the port the Pod listens on. Check both ends.
      - "Compare every selector with the real labels: kubectl get pods -A --show-labels and kubectl get ns --show-labels."
