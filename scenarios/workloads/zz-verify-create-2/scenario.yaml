id: zz-verify-create-2
title: Verify Create 2
domain: workloads
difficulty: 2
estimatedMinutes: 108
points: 95
tags: [ deployment, expose, probes, env, init-content, spread, service-account, priority-class, revision-settings, update-image, scale, strategy, rollback, change-cause, set-env, restart, set-resources, autoscale, pod, command, sidecar, security, resources, pvc, init-container, config-volume, capabilities, exec-probe, placement, label, annotate, resize, save-logs, copy-out, pv, volume-name, consumer-pod, delete-keep-data, rebind, node-affinity, labels, reserve, storageclass, enable-expansion, make-default, change-binding ]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 30
draft: true
variables:
  Q1_NS: { oneOf: [ web, shop, team-a ] }
  Q1_NAME: { oneOf: [ frontend, api, catalog ] }
  Q1_IMAGE: { oneOf: [ nginx:1.26-alpine, nginx:1.27-alpine ] }
  Q1_REPLICAS: { oneOf: [ 2, 3, 4 ] }
  Q1_EXPOSE_PORT: { oneOf: [ 80, 8080, 3000 ] }
  Q1_EXPOSE_TYPE: { oneOf: [ ClusterIP, NodePort ] }
  Q1_PROBES_PERIOD: { oneOf: [ 5, 10, 15 ] }
  Q1_ENV_OBJ: { oneOf: [ app-config, app-settings, runtime-env ] }
  Q1_ENV_KEY: { oneOf: [ LOG_LEVEL, MODE, REGION ] }
  Q1_ENV_VALUE: { oneOf: [ debug, info, warn ] }
  Q1_INIT_TEXT: { oneOf: [ welcome-shop, hello-cka, v1-ready ] }
  Q1_SA_SA: { oneOf: [ web-runner, app-identity, deploy-bot ] }
  Q1_PRIO_CLASS: { oneOf: [ high-priority, critical-apps, batch-low ] }
  Q1_PRIO_VALUE: { oneOf: [ 1000, 10000, 100000 ] }
  Q1_REV_HISTORY: { oneOf: [ 2, 5, 10 ] }
  Q1_REV_MINREADY: { oneOf: [ 5, 10 ] }
  Q1_UPDATE_IMAGE: { oneOf: [ nginx:1.28-alpine, httpd:2.4-alpine ] }
  Q1_SCALE_REPLICAS: { oneOf: [ 5, 6 ] }
  Q1_STRATEGY_SURGE: { oneOf: [ "1", "2", 50% ] }
  Q1_STRATEGY_UNAVAILABLE: { oneOf: [ "0", "1" ] }
  Q1_CAUSE_CAUSE: { oneOf: [ upgrade-nginx, security-patch, cve-fix ] }
  Q1_SETENV_KEY: { oneOf: [ APP_COLOR, FEATURE_FLAG, TZ ] }
  Q1_SETENV_VALUE: { oneOf: [ blue, on, UTC ] }
  Q1_SETRES_CPU: { oneOf: [ 75m, 125m ] }
  Q1_SETRES_MEMORY: { oneOf: [ 96Mi, 192Mi ] }
  Q1_HPA_MIN: { oneOf: [ 1, 2 ] }
  Q1_HPA_MAX: { oneOf: [ 8, 10 ] }
  Q1_HPA_CPU: { oneOf: [ 50, 70, 80 ] }
  Q2_NS: { oneOf: [ apps, jobs, sandbox ] }
  Q2_NAME: { oneOf: [ worker, logger, toolbox, frontend, backend, database, cache, queue, scheduler, monitor, gateway ] }
  Q2_IMAGE: { oneOf: [ busybox:1.36, busybox:1.37, nginx:1.28-alpine, httpd:2.4-alpine, alpine:3.20 ] }
  Q2_ENV_OBJ: { oneOf: [ app-config, app-settings, runtime-env ] }
  Q2_ENV_KEY: { oneOf: [ LOG_LEVEL, MODE, REGION ] }
  Q2_ENV_VALUE: { oneOf: [ debug, info, warn ] }
  Q2_SEC_USER: { oneOf: [ 1000, 2000, 3000 ] }
  Q2_RES_CPU: { oneOf: [ 50m, 100m, 150m ] }
  Q2_RES_MEMORY: { oneOf: [ 128Mi, 256Mi, 512Mi ] }
  Q2_PVC_CLAIM: { oneOf: [ uploads, scratch, shared-data ] }
  Q2_PVC_SIZE: { oneOf: [ 100Mi, 500Mi, 1Gi ] }
  Q2_PVC_MOUNT: { oneOf: [ /var/lib/app, /srv/files, /mnt/store ] }
  Q2_INIT_TEXT: { oneOf: [ ready, warmed-up, seeded ] }
  Q2_FILES_OBJ: { oneOf: [ app-files, web-conf, tool-settings ] }
  Q2_FILES_FILE: { oneOf: [ app.conf, settings.ini, motd ] }
  Q2_FILES_VALUE: { oneOf: [ enabled, v2, hello ] }
  Q2_CAPS_CAP: { oneOf: [ NET_BIND_SERVICE, NET_ADMIN, SYS_TIME ] }
  Q2_PROBE_PERIOD: { oneOf: [ 5, 10, 15 ] }
  Q2_PLACE_NODE: { oneOf: [ worker-1, worker-2 ] }
  Q2_LABEL_KEY: { oneOf: [ tier, team, env ] }
  Q2_LABEL_VALUE: { oneOf: [ backend, blue, prod ] }
  Q2_NOTE_KEY: { oneOf: [ owner, contact, ticket ] }
  Q2_NOTE_VALUE: { oneOf: [ platform, ops-team, cka-42 ] }
  Q2_UPDATE_IMAGE: { oneOf: [ busybox:1.36.1, alpine:3.21 ] }
  Q2_RESIZE_CPU: { oneOf: [ 200m, 250m ] }
  Q3_NS: { oneOf: [ billing, orders-app, photo-lib ] }
  Q3_NAME: { oneOf: [ orders, invoices, photos ] }
  Q3_SIZE: { oneOf: [ 100Mi, 500Mi, 1Gi ] }
  Q3_ACCESS: { oneOf: [ ReadWriteOnce, ReadWriteMany ] }
  Q3_POD_MOUNT: { oneOf: [ /data, /srv/app, /var/lib/app ] }
  Q4_NAME: { oneOf: [ data-pv, logs-pv, media-pv ] }
  Q4_CAPACITY: { oneOf: [ 1Gi, 2Gi, 5Gi ] }
  Q4_ACCESS: { oneOf: [ ReadWriteOnce, ReadWriteMany, ReadOnlyMany ] }
  Q4_RECLAIM: { oneOf: [ Retain, Delete ] }
  Q4_AFFINITY_NODE: { oneOf: [ worker-1, worker-2 ] }
  Q4_LABEL_TIER: { oneOf: [ premium, standard, archive ] }
  Q4_RESIZE_CAPACITY: { oneOf: [ 3Gi, 10Gi ] }
  Q4_RESERVE_NS: { oneOf: [ inventory, payroll, catalogue ] }
  Q4_RESERVE_CLAIM: { oneOf: [ future-claim, reserved-app, next-db ] }
  Q5_NAME: { oneOf: [ gold, silver, bronze ] }
  Q5_RECLAIM: { oneOf: [ Retain, Delete ] }
  Q5_BINDING: { oneOf: [ Immediate, WaitForFirstConsumer ] }
setup:
  - node: controlplane
    script: setup/q1.sh
  - node: controlplane
    script: setup/q2.sh
  - node: controlplane
    script: setup/q3.sh
tasks:
  - id: q1
    title: Deployment ${Q1_NAME}
    points: 38
    checks:
      - id: q1-expose-service
        description: Service ${Q1_NAME} is a ${Q1_EXPOSE_TYPE} mapping port ${Q1_EXPOSE_PORT} to 80
        type: kubectl
        run: kubectl -n ${Q1_NS} get svc ${Q1_NAME} -o jsonpath='{.spec.type}/{.spec.ports[0].port}/{.spec.ports[0].targetPort}'
        expect: { equals: "${Q1_EXPOSE_TYPE}/${Q1_EXPOSE_PORT}/80" }
        weight: 1
      - id: q1-expose-reachable
        description: Service ${Q1_NAME} answers HTTP 200 on port ${Q1_EXPOSE_PORT}
        type: kubectl
        run: curl -s -m 5 -o /dev/null -w '%{http_code}' "http://$(kubectl -n ${Q1_NS} get svc ${Q1_NAME} -o jsonpath='{.spec.clusterIP}'):${Q1_EXPOSE_PORT}/"
        expect: { equals: "200" }
        weight: 2
        retrySeconds: 30
      - id: q1-probes-readiness
        description: "readiness probe: HTTP GET / on port 80 every ${Q1_PROBES_PERIOD}s"
        type: kubectl
        run: kubectl -n ${Q1_NS} get deployment/${Q1_NAME} -o jsonpath='{.spec.template.spec.containers[0].readinessProbe.httpGet.path}/{.spec.template.spec.containers[0].readinessProbe.httpGet.port}/{.spec.template.spec.containers[0].readinessProbe.periodSeconds}'
        expect: { equals: "//80/${Q1_PROBES_PERIOD}" }
        weight: 1
      - id: q1-probes-liveness
        description: "liveness probe: TCP port 80 every ${Q1_PROBES_PERIOD}s"
        type: kubectl
        run: kubectl -n ${Q1_NS} get deployment/${Q1_NAME} -o jsonpath='{.spec.template.spec.containers[0].livenessProbe.tcpSocket.port}/{.spec.template.spec.containers[0].livenessProbe.periodSeconds}'
        expect: { equals: "80/${Q1_PROBES_PERIOD}" }
        weight: 1
      - id: q1-env-source
        description: ConfigMap ${Q1_ENV_OBJ} has ${Q1_ENV_KEY}=${Q1_ENV_VALUE}
        type: kubectl
        run: kubectl -n ${Q1_NS} get configmap ${Q1_ENV_OBJ} -o jsonpath='{.data.${Q1_ENV_KEY}}'
        expect: { equals: "${Q1_ENV_VALUE}" }
        weight: 1
      - id: q1-env-value
        description: ${Q1_ENV_KEY} is ${Q1_ENV_VALUE} inside the container
        type: kubectl
        run: kubectl -n ${Q1_NS} exec deployment/${Q1_NAME} -- printenv ${Q1_ENV_KEY}
        expect: { equals: "${Q1_ENV_VALUE}" }
        weight: 2
        retrySeconds: 30
      - id: q1-init-container
        description: init container content runs busybox:1.36
        type: kubectl
        run: kubectl -n ${Q1_NS} get deployment/${Q1_NAME} -o jsonpath='{.spec.template.spec.initContainers[?(@.name=="content")].image}'
        expect: { equals: busybox:1.36 }
        weight: 1
      - id: q1-html-content
        description: the Pods hold /usr/share/nginx/html/index.html with "${Q1_INIT_TEXT}"
        type: kubectl
        run: kubectl -n ${Q1_NS} exec deployment/${Q1_NAME} -- cat /usr/share/nginx/html/index.html
        expect: { equals: "${Q1_INIT_TEXT}" }
        weight: 2
        retrySeconds: 30
      - id: q1-spread-spec
        description: a hard spread constraint on kubernetes.io/hostname with maxSkew 1
        type: kubectl
        run: kubectl -n ${Q1_NS} get deployment/${Q1_NAME} -o jsonpath='{.spec.template.spec.topologySpreadConstraints[0].topologyKey}/{.spec.template.spec.topologySpreadConstraints[0].maxSkew}/{.spec.template.spec.topologySpreadConstraints[0].whenUnsatisfiable}'
        expect: { equals: kubernetes.io/hostname/1/DoNotSchedule }
        weight: 1
      - id: q1-spread-nodes
        description: the Pods run on both workers
        type: kubectl
        run: kubectl -n ${Q1_NS} get pods -l app=${Q1_NAME} --field-selector=status.phase=Running -o jsonpath='{range .items[*]}{.spec.nodeName}{"\n"}{end}' | sort -u | tr '\n' ' '
        expect: { equals: worker-1 worker-2 }
        weight: 2
        retrySeconds: 30
      - id: q1-sa-spec
        description: the Pods use ${Q1_SA_SA} with automountServiceAccountToken false
        type: kubectl
        run: kubectl -n ${Q1_NS} get deployment/${Q1_NAME} -o jsonpath='{.spec.template.spec.serviceAccountName}/{.spec.template.spec.automountServiceAccountToken}'
        expect: { equals: "${Q1_SA_SA}/false" }
        weight: 1
      - id: q1-sa-no-token
        description: no token is mounted in the Pods
        type: kubectl
        run: kubectl -n ${Q1_NS} exec deployment/${Q1_NAME} -- sh -c 'ls /var/run/secrets/kubernetes.io/serviceaccount 2>/dev/null | wc -l'
        expect: { equals: "0" }
        weight: 1
        retrySeconds: 30
      - id: q1-prio-class
        description: PriorityClass ${Q1_PRIO_CLASS} has value ${Q1_PRIO_VALUE}
        type: kubectl
        run: kubectl get priorityclass ${Q1_PRIO_CLASS} -o jsonpath='{.value}/{.globalDefault}'
        expect: { matches: "^${Q1_PRIO_VALUE}/(false)?$" }
        weight: 1
      - id: q1-prio-pods
        description: the Pods run with priority ${Q1_PRIO_VALUE}
        type: kubectl
        run: kubectl -n ${Q1_NS} get pods -l app=${Q1_NAME} -o jsonpath='{.items[0].spec.priorityClassName}/{.items[0].spec.priority}'
        expect: { equals: "${Q1_PRIO_CLASS}/${Q1_PRIO_VALUE}" }
        weight: 1
        retrySeconds: 30
      - id: q1-rev-settings
        description: revisionHistoryLimit ${Q1_REV_HISTORY} and minReadySeconds ${Q1_REV_MINREADY}
        type: kubectl
        run: kubectl -n ${Q1_NS} get deployment ${Q1_NAME} -o jsonpath='{.spec.revisionHistoryLimit}/{.spec.minReadySeconds}'
        expect: { equals: "${Q1_REV_HISTORY}/${Q1_REV_MINREADY}" }
        weight: 2
      - id: q1-scale-spec
        description: ${Q1_NAME} asks for ${Q1_SCALE_REPLICAS} replicas
        type: kubectl
        run: kubectl -n ${Q1_NS} get deployment ${Q1_NAME} -o jsonpath='{.spec.replicas}'
        expect: { equals: "${Q1_SCALE_REPLICAS}" }
        weight: 1
      - id: q1-scale-ready
        description: ${Q1_NAME} has ${Q1_SCALE_REPLICAS} ready replicas
        type: kubectl
        run: kubectl -n ${Q1_NS} get deployment ${Q1_NAME} -o jsonpath='{.status.readyReplicas}'
        expect: { equals: "${Q1_SCALE_REPLICAS}" }
        weight: 2
        retrySeconds: 30
      - id: q1-strategy
        description: ${Q1_NAME} rolls out with maxSurge ${Q1_STRATEGY_SURGE} and maxUnavailable ${Q1_STRATEGY_UNAVAILABLE}
        type: kubectl
        run: kubectl -n ${Q1_NS} get deployment ${Q1_NAME} -o jsonpath='{.spec.strategy.type}/{.spec.strategy.rollingUpdate.maxSurge}/{.spec.strategy.rollingUpdate.maxUnavailable}'
        expect: { equals: "RollingUpdate/${Q1_STRATEGY_SURGE}/${Q1_STRATEGY_UNAVAILABLE}" }
        weight: 2
      - id: q1-rollback-image
        description: ${Q1_NAME} is back on ${Q1_IMAGE}
        type: kubectl
        run: kubectl -n ${Q1_NS} get deployment/${Q1_NAME} -o jsonpath='{.spec.template.spec.containers[0].image}'
        expect: { equals: "${Q1_IMAGE}" }
        weight: 2
      - id: q1-rollback-revision
        description: ${Q1_NAME} was rolled back in place (revision 3 or later)
        type: kubectl
        run: kubectl -n ${Q1_NS} get deployment ${Q1_NAME} -o jsonpath='{.metadata.annotations.deployment\.kubernetes\.io/revision}'
        expect: { gte: 3 }
        weight: 1
      - id: q1-cause-annotation
        description: ${Q1_NAME} has the change cause ${Q1_CAUSE_CAUSE}
        type: kubectl
        run: kubectl -n ${Q1_NS} get deployment ${Q1_NAME} -o jsonpath='{.metadata.annotations.kubernetes\.io/change-cause}'
        expect: { equals: "${Q1_CAUSE_CAUSE}" }
        weight: 1
      - id: q1-cause-history
        description: kubectl rollout history shows ${Q1_CAUSE_CAUSE}
        type: kubectl
        run: kubectl -n ${Q1_NS} rollout history deployment/${Q1_NAME}
        expect: { contains: "${Q1_CAUSE_CAUSE}" }
        weight: 1
        retrySeconds: 20
      - id: q1-set-env-spec
        description: ${Q1_SETENV_KEY}=${Q1_SETENV_VALUE} is in the Pod template
        type: kubectl
        run: kubectl -n ${Q1_NS} get deployment/${Q1_NAME} -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="${Q1_SETENV_KEY}")].value}'
        expect: { equals: "${Q1_SETENV_VALUE}" }
        weight: 1
      - id: q1-set-env-live
        description: ${Q1_SETENV_KEY} is ${Q1_SETENV_VALUE} inside the container
        type: kubectl
        run: kubectl -n ${Q1_NS} exec deployment/${Q1_NAME} -- printenv ${Q1_SETENV_KEY}
        expect: { equals: "${Q1_SETENV_VALUE}" }
        weight: 1
        retrySeconds: 30
      - id: q1-restart-annotation
        description: ${Q1_NAME} was restarted with kubectl rollout restart
        type: kubectl
        run: kubectl -n ${Q1_NS} get deployment ${Q1_NAME} -o jsonpath='{.spec.template.metadata.annotations.kubectl\.kubernetes\.io/restartedAt}'
        expect: { notEmpty: true }
        weight: 1
      - id: q1-restart-revision
        description: ${Q1_NAME} rolled out a new revision
        type: kubectl
        run: kubectl -n ${Q1_NS} get deployment ${Q1_NAME} -o jsonpath='{.metadata.annotations.deployment\.kubernetes\.io/revision}'
        expect: { gte: 2 }
        weight: 1
      - id: q1-set-resources
        description: request ${Q1_SETRES_CPU} CPU, limit ${Q1_SETRES_MEMORY} memory
        type: kubectl
        run: kubectl -n ${Q1_NS} get deployment/${Q1_NAME} -o jsonpath='{.spec.template.spec.containers[0].resources.requests.cpu}/{.spec.template.spec.containers[0].resources.limits.memory}'
        expect: { equals: "${Q1_SETRES_CPU}/${Q1_SETRES_MEMORY}" }
        weight: 2
      - id: q1-hpa
        description: an autoscaler drives ${Q1_NAME} between ${Q1_HPA_MIN} and ${Q1_HPA_MAX} replicas at ${Q1_HPA_CPU}% CPU
        type: kubectl
        run: kubectl -n ${Q1_NS} get hpa -o jsonpath='{range .items[?(@.spec.scaleTargetRef.name=="${Q1_NAME}")]}{.spec.minReplicas}/{.spec.maxReplicas}/{.spec.metrics[0].resource.target.averageUtilization}{end}'
        expect: { equals: "${Q1_HPA_MIN}/${Q1_HPA_MAX}/${Q1_HPA_CPU}" }
        weight: 2
    hints:
      - kubectl -n ${Q1_NS} create deployment ${Q1_NAME} --image=${Q1_IMAGE} --replicas=${Q1_REPLICAS} --dry-run=client -o yaml gives you a manifest to start from.
      - kubectl -n ${Q1_NS} expose deployment ${Q1_NAME} --type=${Q1_EXPOSE_TYPE} --port=${Q1_EXPOSE_PORT} --target-port=80
      - "readinessProbe: {httpGet: {path: /, port: 80}, periodSeconds: N} and livenessProbe: {tcpSocket: {port: 80}, periodSeconds: N}"
      - "kubectl -n ${Q1_NS} create configmap ${Q1_ENV_OBJ} --from-literal=${Q1_ENV_KEY}=${Q1_ENV_VALUE}; then env: [{name: ${Q1_ENV_KEY}, valueFrom: {configMapKeyRef: {name: ${Q1_ENV_OBJ}, key: ${Q1_ENV_KEY}}}}]"
      - initContainers run to completion before the app starts; both mount the same emptyDir.
      - "Without nodeTaintsPolicy: Honor the tainted control plane counts as an empty domain and some replicas stay Pending."
      - "kubectl -n ${Q1_NS} create serviceaccount ${Q1_SA_SA}; then serviceAccountName and automountServiceAccountToken: false in the Pod spec."
      - kubectl create priorityclass ${Q1_PRIO_CLASS} --value=${Q1_PRIO_VALUE}; then priorityClassName in the Pod spec.
      - Both are fields of the Deployment spec, next to replicas.
      - kubectl -n ${Q1_NS} set image deployment/${Q1_NAME} <container>=${Q1_UPDATE_IMAGE}, then kubectl rollout status.
      - kubectl -n ${Q1_NS} scale deployment ${Q1_NAME} --replicas=${Q1_SCALE_REPLICAS}
      - "kubectl -n ${Q1_NS} edit deployment ${Q1_NAME}: spec.strategy.rollingUpdate."
      - kubectl -n ${Q1_NS} rollout history deployment ${Q1_NAME}, then kubectl rollout undo.
      - kubectl -n ${Q1_NS} annotate deployment/${Q1_NAME} kubernetes.io/change-cause=${Q1_CAUSE_CAUSE}
      - kubectl -n ${Q1_NS} set env deployment/${Q1_NAME} ${Q1_SETENV_KEY}=${Q1_SETENV_VALUE}
      - kubectl -n ${Q1_NS} rollout restart deployment/${Q1_NAME}
      - kubectl -n ${Q1_NS} set resources deployment/${Q1_NAME} --requests=cpu=${Q1_SETRES_CPU} --limits=memory=${Q1_SETRES_MEMORY}
      - kubectl -n ${Q1_NS} autoscale deployment ${Q1_NAME} --min=${Q1_HPA_MIN} --max=${Q1_HPA_MAX} with a CPU target (see kubectl autoscale --help).
  - id: q2
    title: Pod ${Q2_NAME}
    points: 35
    checks:
      - id: q2-running
        description: Pod ${Q2_NAME} is Running and ready
        type: kubectl
        run: kubectl -n ${Q2_NS} get pod ${Q2_NAME} -o jsonpath='{.status.phase}/{.status.conditions[?(@.type=="Ready")].status}'
        expect: { equals: Running/True }
        weight: 2
        retrySeconds: 30
      - id: q2-cmd-output
        weight: 2
        retrySeconds: 30
        description: /data/out.log keeps growing
        type: kubectl
        run: kubectl -n ${Q2_NS} exec pod/${Q2_NAME} -- sh -c 'a=$(wc -l < /data/out.log); sleep 6; b=$(wc -l < /data/out.log); [ "$b" -gt "$a" ] && echo growing'
        expect: { equals: growing }
      - id: q2-sidecar
        weight: 2
        retrySeconds: 30
        description: container tailer prints the log
        type: kubectl
        run: kubectl -n ${Q2_NS} logs pod/${Q2_NAME} -c tailer --tail=5
        expect: { notEmpty: true }
      - id: q2-env-source
        description: ConfigMap ${Q2_ENV_OBJ} has ${Q2_ENV_KEY}=${Q2_ENV_VALUE}
        type: kubectl
        run: kubectl -n ${Q2_NS} get configmap ${Q2_ENV_OBJ} -o jsonpath='{.data.${Q2_ENV_KEY}}'
        expect: { equals: "${Q2_ENV_VALUE}" }
        weight: 1
      - id: q2-env-value
        description: ${Q2_ENV_KEY} is ${Q2_ENV_VALUE} inside the container
        type: kubectl
        run: kubectl -n ${Q2_NS} exec pod/${Q2_NAME} -- printenv ${Q2_ENV_KEY}
        expect: { equals: "${Q2_ENV_VALUE}" }
        weight: 2
        retrySeconds: 30
      - id: q2-sec-user
        description: the container runs as uid ${Q2_SEC_USER}
        type: kubectl
        run: kubectl -n ${Q2_NS} exec pod/${Q2_NAME} -- id -u
        expect: { equals: "${Q2_SEC_USER}" }
        weight: 1
        retrySeconds: 20
      - id: q2-sec-readonly
        description: root filesystem is read-only and escalation is off
        type: kubectl
        run: kubectl -n ${Q2_NS} get pod/${Q2_NAME} -o jsonpath='{.spec.containers[0].securityContext.readOnlyRootFilesystem}/{.spec.containers[0].securityContext.allowPrivilegeEscalation}'
        expect: { equals: true/false }
        weight: 1
      - id: q2-res-limits
        description: limits are 1 CPU and ${Q2_RES_MEMORY} memory
        type: kubectl
        run: kubectl -n ${Q2_NS} get pod/${Q2_NAME} -o jsonpath='{.spec.containers[0].resources.limits.cpu}/{.spec.containers[0].resources.limits.memory}'
        expect: { equals: "1/${Q2_RES_MEMORY}" }
        weight: 1
      - id: q2-pvc-bound
        description: PVC ${Q2_PVC_CLAIM} is Bound to ${Q2_PVC_CLAIM}-pv
        type: kubectl
        run: kubectl -n ${Q2_NS} get pvc ${Q2_PVC_CLAIM} -o jsonpath='{.status.phase}/{.spec.volumeName}'
        expect: { equals: "Bound/${Q2_PVC_CLAIM}-pv" }
        weight: 2
      - id: q2-pvc-mounted
        description: the claim is mounted at ${Q2_PVC_MOUNT}
        type: kubectl
        run: kubectl -n ${Q2_NS} get pod/${Q2_NAME} -o jsonpath='{.spec.containers[0].volumeMounts[*].mountPath}'
        expect: { contains: "${Q2_PVC_MOUNT}" }
        weight: 1
      - id: q2-init-ready
        description: main reads "${Q2_INIT_TEXT}" from /init/ready
        type: kubectl
        run: kubectl -n ${Q2_NS} exec pod/${Q2_NAME} -- cat /init/ready
        expect: { equals: "${Q2_INIT_TEXT}" }
        weight: 2
        retrySeconds: 30
      - id: q2-files-source
        description: ConfigMap ${Q2_FILES_OBJ} has ${Q2_FILES_FILE}=${Q2_FILES_VALUE}
        type: kubectl
        run: kubectl -n ${Q2_NS} get configmap ${Q2_FILES_OBJ} -o go-template='{{index .data "${Q2_FILES_FILE}"}}'
        expect: { equals: "${Q2_FILES_VALUE}" }
        weight: 1
      - id: q2-files-mounted
        description: /etc/app/${Q2_FILES_FILE} holds ${Q2_FILES_VALUE}
        type: kubectl
        run: kubectl -n ${Q2_NS} exec pod/${Q2_NAME} -- cat /etc/app/${Q2_FILES_FILE}
        expect: { equals: "${Q2_FILES_VALUE}" }
        weight: 2
        retrySeconds: 30
      - id: q2-caps
        description: "capabilities: drop ALL, add ${Q2_CAPS_CAP}"
        type: kubectl
        run: kubectl -n ${Q2_NS} get pod/${Q2_NAME} -o jsonpath='{.spec.containers[0].securityContext.capabilities.drop[*]}/{.spec.containers[0].securityContext.capabilities.add[*]}'
        expect: { equals: "ALL/${Q2_CAPS_CAP}" }
        weight: 2
      - id: q2-probe
        description: liveness probe runs ls / every ${Q2_PROBE_PERIOD}s
        type: kubectl
        run: kubectl -n ${Q2_NS} get pod/${Q2_NAME} -o jsonpath='{.spec.containers[0].livenessProbe.exec.command[*]}/{.spec.containers[0].livenessProbe.periodSeconds}'
        expect: { equals: "ls //${Q2_PROBE_PERIOD}" }
        weight: 1
      - id: q2-place-node
        description: the Pod runs on ${Q2_PLACE_NODE}
        type: kubectl
        run: kubectl -n ${Q2_NS} get pod/${Q2_NAME} -o jsonpath='{.spec.nodeName}'
        expect: { equals: "${Q2_PLACE_NODE}" }
        weight: 1
        retrySeconds: 20
      - id: q2-place-how
        description: no nodeSelector or affinity is used
        type: kubectl
        run: kubectl -n ${Q2_NS} get pod/${Q2_NAME} -o jsonpath='{.spec.nodeSelector}{.spec.affinity}'
        expect: { notEmpty: false }
        weight: 1
      - id: q2-label
        description: ${Q2_NAME} has the label ${Q2_LABEL_KEY}=${Q2_LABEL_VALUE}
        type: kubectl
        run: kubectl -n ${Q2_NS} get pod ${Q2_NAME} -o jsonpath='{.metadata.labels.${Q2_LABEL_KEY}}'
        expect: { equals: "${Q2_LABEL_VALUE}" }
        weight: 1
      - id: q2-annotate
        description: ${Q2_NAME} has the annotation ${Q2_NOTE_KEY}=${Q2_NOTE_VALUE}
        type: kubectl
        run: kubectl -n ${Q2_NS} get pod ${Q2_NAME} -o jsonpath='{.metadata.annotations.${Q2_NOTE_KEY}}'
        expect: { equals: "${Q2_NOTE_VALUE}" }
        weight: 1
      - id: q2-update-image
        description: main runs ${Q2_UPDATE_IMAGE}
        type: kubectl
        run: kubectl -n ${Q2_NS} get pod/${Q2_NAME} -o jsonpath='{.spec.containers[?(@.name=="main")].image}'
        expect: { equals: "${Q2_UPDATE_IMAGE}" }
        weight: 1
      - id: q2-update-restarted
        description: ${Q2_NAME} was updated in place (main restarted)
        type: kubectl
        run: kubectl -n ${Q2_NS} get pod/${Q2_NAME} -o jsonpath='{.status.containerStatuses[?(@.name=="main")].restartCount}'
        expect: { gte: 1 }
        weight: 1
        retrySeconds: 30
      - id: q2-resize-spec
        description: main requests ${Q2_RESIZE_CPU} CPU
        type: kubectl
        run: kubectl -n ${Q2_NS} get pod/${Q2_NAME} -o jsonpath='{.spec.containers[?(@.name=="main")].resources.requests.cpu}'
        expect: { equals: "${Q2_RESIZE_CPU}" }
        weight: 1
      - id: q2-resize-applied
        description: the kubelet applied ${Q2_RESIZE_CPU} CPU to the running container
        type: kubectl
        run: kubectl -n ${Q2_NS} get pod/${Q2_NAME} -o jsonpath='{.status.containerStatuses[?(@.name=="main")].resources.requests.cpu}'
        expect: { equals: "${Q2_RESIZE_CPU}" }
        weight: 1
        retrySeconds: 30
      - id: q2-logs-file
        description: /opt/${Q2_NAME}.log holds the logs of main
        type: ssh
        node: controlplane
        run: '[ -s /opt/${Q2_NAME}.log ] && [ "$(head -n 1 /opt/${Q2_NAME}.log)" = "$(kubectl -n ${Q2_NS} logs ${Q2_NAME} -c main | head -n 1)" ] && echo ok'
        expect: { equals: ok }
        weight: 2
      - id: q2-copy-file
        description: /opt/${Q2_NAME}-out.log is a copy of /data/out.log
        type: ssh
        node: controlplane
        run: '[ -s /opt/${Q2_NAME}-out.log ] && [ "$(head -n 1 /opt/${Q2_NAME}-out.log)" = "$(kubectl -n ${Q2_NS} exec ${Q2_NAME} -c main -- head -n 1 /data/out.log)" ] && echo ok'
        expect: { equals: ok }
        weight: 2
    hints:
      - kubectl -n ${Q2_NS} run ${Q2_NAME} --image=${Q2_IMAGE} --dry-run=client -o yaml -- sleep 1d gives you a manifest to start from.
      - "command: [\"sh\", \"-c\", \"...\"] replaces the image's entrypoint. Try the loop with kubectl exec first."
      - "Containers in one Pod share volumes: mount the same emptyDir in both."
      - "kubectl -n ${Q2_NS} create configmap ${Q2_ENV_OBJ} --from-literal=${Q2_ENV_KEY}=${Q2_ENV_VALUE}; then env: [{name: ${Q2_ENV_KEY}, valueFrom: {configMapKeyRef: {name: ${Q2_ENV_OBJ}, key: ${Q2_ENV_KEY}}}}]"
      - "securityContext on the container: runAsUser, readOnlyRootFilesystem, allowPrivilegeEscalation."
      - "resources: {requests: {cpu: ..., memory: ...}, limits: {cpu: ..., memory: ...}} goes on the container."
      - kubectl get pv ${Q2_PVC_CLAIM}-pv shows the StorageClass and access mode the claim must match.
      - initContainers run to completion before the containers start; share the file through an emptyDir mounted in both.
      - kubectl -n ${Q2_NS} create configmap ${Q2_FILES_OBJ} --from-literal=${Q2_FILES_FILE}=${Q2_FILES_VALUE}; then a configMap volume.
      - "securityContext.capabilities: {drop: [ALL], add: [...]} on the container (names without the CAP_ prefix)."
      - "livenessProbe: {exec: {command: [ls, /]}, periodSeconds: N}"
      - spec.nodeName skips the scheduler entirely.
      - kubectl label --help
      - kubectl annotate --help
      - "kubectl -n ${Q2_NS} set image pod/${Q2_NAME} main=${Q2_UPDATE_IMAGE}: the image is one of the few mutable Pod fields."
      - "kubectl patch pod ${Q2_NAME} --subresource resize -p '{\"spec\": {\"containers\": [...]}}' changes resources without a restart."
      - kubectl -n ${Q2_NS} logs ${Q2_NAME} -c main | sudo tee /opt/${Q2_NAME}.log
      - kubectl -n ${Q2_NS} cp ${Q2_NAME}:/data/out.log ./out.log -c main, then move it into place with sudo.
  - id: q3
    title: PersistentVolumeClaim ${Q3_NAME}
    points: 6
    checks:
      - id: q3-decoy-free
        description: ${Q3_NAME}-pv-old is still Available
        type: kubectl
        run: kubectl get pv ${Q3_NAME}-pv-old -o jsonpath='{.status.phase}'
        expect: { equals: Available }
        weight: 1
      - id: q3-deleted
        description: PVC ${Q3_NAME} is deleted
        type: kubectl
        run: kubectl -n ${Q3_NS} get pvc ${Q3_NAME} --ignore-not-found -o name
        expect: { notEmpty: false }
        weight: 2
      - id: q3-rebind-bound
        description: PVC ${Q3_NAME}-v2 is Bound to ${Q3_NAME}-pv
        type: kubectl
        run: kubectl -n ${Q3_NS} get pvc ${Q3_NAME}-v2 -o jsonpath='{.status.phase}/{.spec.volumeName}'
        expect: { equals: "Bound/${Q3_NAME}-pv" }
        weight: 2
        retrySeconds: 30
      - id: q3-rebind-spec
        description: PVC ${Q3_NAME}-v2 requests ${Q3_SIZE} with ${Q3_ACCESS}
        type: kubectl
        run: kubectl -n ${Q3_NS} get pvc ${Q3_NAME}-v2 -o jsonpath='{.spec.resources.requests.storage}/{.spec.accessModes[0]}'
        expect: { equals: "${Q3_SIZE}/${Q3_ACCESS}" }
        weight: 1
    hints:
      - kubectl get pv ${Q3_NAME}-pv shows the class, access modes and capacity the claim must fit.
      - spec.volumeName on the claim binds it to one named PV.
      - "volumes: [{name: data, persistentVolumeClaim: {claimName: ${Q3_NAME}}}], then a volumeMount."
      - A claim in use by a Pod stays Terminating until the Pod is gone. With reclaim policy Retain the PV becomes Released.
      - "A Released PV still points at the old claim: remove spec.claimRef from ${Q3_NAME}-pv, then claim it by volumeName."
  - id: q4
    title: PersistentVolume ${Q4_NAME}
    points: 10
    checks:
      - id: q4-spec
        description: ${Q4_NAME} is ${Q4_ACCESS}, class manual, at /srv/${Q4_NAME}
        type: kubectl
        run: kubectl get pv ${Q4_NAME} -o jsonpath='{.spec.accessModes[0]}/{.spec.storageClassName}/{.spec.hostPath.path}'
        expect: { equals: "${Q4_ACCESS}/manual//srv/${Q4_NAME}" }
        weight: 1
      - id: q4-reclaim
        description: ${Q4_NAME} has reclaim policy ${Q4_RECLAIM}
        type: kubectl
        run: kubectl get pv ${Q4_NAME} -o jsonpath='{.spec.persistentVolumeReclaimPolicy}'
        expect: { equals: "${Q4_RECLAIM}" }
        weight: 1
      - id: q4-phase
        description: ${Q4_NAME} is Available
        type: kubectl
        run: kubectl get pv ${Q4_NAME} -o jsonpath='{.status.phase}'
        expect: { equals: Available }
        weight: 1
        retrySeconds: 20
      - id: q4-affinity
        description: ${Q4_NAME} is pinned to ${Q4_AFFINITY_NODE}
        type: kubectl
        run: kubectl get pv ${Q4_NAME} -o jsonpath='{.spec.nodeAffinity.required.nodeSelectorTerms[0].matchExpressions[0].key}={.spec.nodeAffinity.required.nodeSelectorTerms[0].matchExpressions[0].values[0]}'
        expect: { equals: "kubernetes.io/hostname=${Q4_AFFINITY_NODE}" }
        weight: 2
      - id: q4-label
        description: ${Q4_NAME} is labelled tier=${Q4_LABEL_TIER}
        type: kubectl
        run: kubectl get pv ${Q4_NAME} -o jsonpath='{.metadata.labels.tier}'
        expect: { equals: "${Q4_LABEL_TIER}" }
        weight: 1
      - id: q4-resize
        description: ${Q4_NAME} holds ${Q4_RESIZE_CAPACITY}
        type: kubectl
        run: kubectl get pv ${Q4_NAME} -o jsonpath='{.spec.capacity.storage}'
        expect: { equals: "${Q4_RESIZE_CAPACITY}" }
        weight: 2
      - id: q4-reserve
        description: ${Q4_NAME} is reserved for ${Q4_RESERVE_NS}/${Q4_RESERVE_CLAIM}
        type: kubectl
        run: kubectl get pv ${Q4_NAME} -o jsonpath='{.spec.claimRef.namespace}/{.spec.claimRef.name}'
        expect: { equals: "${Q4_RESERVE_NS}/${Q4_RESERVE_CLAIM}" }
        weight: 2
    hints:
      - "There is no kubectl create pv: copy a PersistentVolume example from the docs (hostPath) and adjust it."
      - spec.nodeAffinity.required.nodeSelectorTerms[].matchExpressions[] with key kubernetes.io/hostname, operator In.
      - kubectl label pv ${Q4_NAME} tier=${Q4_LABEL_TIER} works too.
      - "kubectl edit pv ${Q4_NAME}: spec.capacity.storage."
      - spec.claimRef with a namespace and name pre-binds a PV.
  - id: q5
    title: StorageClass ${Q5_NAME}
    points: 6
    checks:
      - id: q5-provisioner
        description: ${Q5_NAME} uses kubernetes.io/no-provisioner
        type: kubectl
        run: kubectl get storageclass ${Q5_NAME} -o jsonpath='{.provisioner}'
        expect: { equals: kubernetes.io/no-provisioner }
        weight: 1
      - id: q5-reclaim
        description: ${Q5_NAME} has reclaim policy ${Q5_RECLAIM}
        type: kubectl
        run: kubectl get storageclass ${Q5_NAME} -o jsonpath='{.reclaimPolicy}'
        expect: { equals: "${Q5_RECLAIM}" }
        weight: 1
      - id: q5-enable-expansion
        description: ${Q5_NAME} allows volume expansion
        type: kubectl
        run: kubectl get storageclass ${Q5_NAME} -o jsonpath='{.allowVolumeExpansion}'
        expect: { equals: "true" }
        weight: 1
      - id: q5-make-default
        description: ${Q5_NAME} is the default StorageClass
        type: kubectl
        run: kubectl get storageclass ${Q5_NAME} -o jsonpath='{.metadata.annotations.storageclass\.kubernetes\.io/is-default-class}'
        expect: { equals: "true" }
        weight: 1
      - id: q5-change-binding
        description: ${Q5_NAME} no longer binds with ${Q5_BINDING}
        type: kubectl
        run: kubectl get storageclass ${Q5_NAME} -o jsonpath='{.volumeBindingMode}'
        expect: { matches: ^(Immediate|WaitForFirstConsumer)$, notContains: "${Q5_BINDING}" }
        weight: 2
    hints:
      - kubectl explain storageclass lists the fields; there is no kubectl create storageclass, so write the YAML.
      - "kubectl patch storageclass ${Q5_NAME} -p '{\"allowVolumeExpansion\": true}'"
      - kubectl annotate storageclass ${Q5_NAME} storageclass.kubernetes.io/is-default-class=true
      - "The field cannot be edited: kubectl get storageclass ${Q5_NAME} -o yaml > sc.yaml, change it, then kubectl replace --force -f sc.yaml."
