id: quick-lab-t0dyi2
title: "Quick lab: CronJob"
domain: workloads
difficulty: 2
estimatedMinutes: 9
points: 7
tags: [ cronjob, job, limits, run-now ]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 30
variables:
  Q1_NS: { oneOf: [ batch, reports, nightly, jobs, cron, scheduled, etl, ops-jobs, maintenance, automation ] }
  Q1_NAME: { oneOf: [ report, cleanup, backup, export, rotate, sync, digest, purge, archive, reconcile ] }
  Q1_SCHEDULE: { oneOf: [ "*/5 * * * *", "*/15 * * * *", 0 * * * *, 30 2 * * * ] }
  Q1_COMPLETIONS: { oneOf: [ 1, 2, 3 ] }
  Q1_LIMITS_BACKOFF: { oneOf: [ 2, 3, 4 ] }
  Q1_LIMITS_DEADLINE: { oneOf: [ 60, 120, 300 ] }
tasks:
  - id: q1
    title: CronJob ${Q1_NAME}
    points: 7
    setup:
      - node: controlplane
        script: setup/q1.sh
        lane: q1
    checks:
      - id: q1-schedule
        description: ${Q1_NAME} runs on ${Q1_SCHEDULE}
        type: kubectl
        run: kubectl -n ${Q1_NS} get cronjob ${Q1_NAME} -o jsonpath='{.spec.schedule}'
        expect: { equals: "${Q1_SCHEDULE}" }
        weight: 1
      - id: q1-completions
        description: each Job runs ${Q1_COMPLETIONS} completion(s)
        type: kubectl
        run: kubectl -n ${Q1_NS} get cronjob ${Q1_NAME} -o jsonpath='{.spec.jobTemplate.spec.completions}'
        expect: { equals: "${Q1_COMPLETIONS}" }
        weight: 1
      - id: q1-image
        description: the Jobs run busybox:1.36
        type: kubectl
        run: kubectl -n ${Q1_NS} get cronjob/${Q1_NAME} -o jsonpath='{.spec.jobTemplate.spec.template.spec.containers[0].image}'
        expect: { equals: busybox:1.36 }
        weight: 1
      - id: q1-limits
        description: Jobs have backoffLimit ${Q1_LIMITS_BACKOFF} and activeDeadlineSeconds ${Q1_LIMITS_DEADLINE}
        type: kubectl
        run: kubectl -n ${Q1_NS} get cronjob ${Q1_NAME} -o jsonpath='{.spec.jobTemplate.spec.backoffLimit}/{.spec.jobTemplate.spec.activeDeadlineSeconds}'
        expect: { equals: "${Q1_LIMITS_BACKOFF}/${Q1_LIMITS_DEADLINE}" }
        weight: 2
      - id: q1-run-now
        description: Job ${Q1_NAME}-manual completed ${Q1_COMPLETIONS} times
        type: kubectl
        run: kubectl -n ${Q1_NS} get job ${Q1_NAME}-manual -o jsonpath='{.status.succeeded}'
        expect: { equals: "${Q1_COMPLETIONS}" }
        weight: 2
        retrySeconds: 60
    hints:
      - kubectl -n ${Q1_NS} create cronjob ${Q1_NAME} --image=busybox:1.36 --schedule='${Q1_SCHEDULE}' --dry-run=client -o yaml -- sh -c 'date; echo done'
      - backoffLimit and activeDeadlineSeconds belong to the Job spec, under spec.jobTemplate.spec.
      - "kubectl create job --help: look at --from."
    recipe: { builder: cronjob, parts: [ limits, run-now ] }
