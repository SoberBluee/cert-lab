id: kk2-native-sidecar-emptydir
title: Shared emptyDir with native sidecar
domain: workloads
difficulty: 2
estimatedMinutes: 8
points: 6
tags: [workloads, sidecar, emptyDir, native-sidecar]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 30
variables:
  POD: { oneOf: [ grape-pod, berry-pod, melon-pod ] }
  VOL: { oneOf: [ grape-vol, berry-vol, melon-vol ] }
checks:
  - id: running
    description: Pod ${POD} is Running
    type: kubectl
    run: kubectl get pod ${POD} -o jsonpath='{.status.phase}'
    expect: { equals: "Running" }
    weight: 2
    retrySeconds: 90
  - id: nginx-mount
    description: nginx mounts ${VOL} at /var/log/nginx
    type: kubectl
    run: kubectl get pod ${POD} -o jsonpath='{.spec.containers[?(@.name=="nginx")].volumeMounts[?(@.name=="${VOL}")].mountPath}'
    expect: { equals: "/var/log/nginx" }
    weight: 1
  - id: sidecar-mount
    description: busybox-sidecar mounts ${VOL} at /usr/src
    type: kubectl
    run: kubectl get pod ${POD} -o jsonpath='{.spec.initContainers[?(@.name=="busybox-sidecar")].volumeMounts[?(@.name=="${VOL}")].mountPath}/{.spec.initContainers[?(@.name=="busybox-sidecar")].restartPolicy}'
    expect: { equals: "/usr/src/Always" }
    weight: 2
  - id: emptydir
    description: volume ${VOL} is emptyDir
    type: kubectl
    run: kubectl get pod ${POD} -o jsonpath='{.spec.volumes[?(@.name=="${VOL}")].emptyDir}'
    expect: { notEmpty: true }
    weight: 1
hints:
  - "A native sidecar is an initContainer with restartPolicy: Always (kubectl explain pod.spec.initContainers.restartPolicy)."
  - "Both containers mount the same emptyDir volume under different paths."
