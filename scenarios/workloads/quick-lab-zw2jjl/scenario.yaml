id: quick-lab-zw2jjl
title: "Quick lab: Pod"
domain: workloads
difficulty: 1
estimatedMinutes: 3
points: 3
tags: [ pod ]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 30
draft: true
variables:
  Q1_NS: { oneOf: [ apps, jobs, sandbox, workloads, demo, lab, temp, scratch, tools, debug ] }
  Q1_NAME: { oneOf: [ worker, logger, toolbox, frontend, backend, database, cache, queue, scheduler, monitor, gateway, proxy, client, agent, runner ] }
  Q1_IMAGE: { oneOf: [ busybox:1.36, busybox:1.37, nginx:1.28-alpine, httpd:2.4-alpine, alpine:3.20 ] }
tasks:
  - id: q1
    title: Pod ${Q1_NAME}
    points: 3
    setup:
      - node: controlplane
        script: setup/q1.sh
        lane: q1
    checks:
      - id: q1-running
        description: Pod ${Q1_NAME} is Running and ready
        type: kubectl
        run: kubectl -n ${Q1_NS} get pod ${Q1_NAME} -o jsonpath='{.status.phase}/{.status.conditions[?(@.type=="Ready")].status}'
        expect: { equals: Running/True }
        weight: 2
        retrySeconds: 30
      - id: q1-image
        description: main runs ${Q1_IMAGE}
        type: kubectl
        run: kubectl -n ${Q1_NS} get pod/${Q1_NAME} -o jsonpath='{.spec.containers[0].name}/{.spec.containers[0].image}'
        expect: { equals: "main/${Q1_IMAGE}" }
        weight: 1
    hints:
      - kubectl -n ${Q1_NS} run ${Q1_NAME} --image=${Q1_IMAGE} --dry-run=client -o yaml -- sleep 1d gives you a manifest to start from.
    recipe: { builder: pod, parts: [] }
