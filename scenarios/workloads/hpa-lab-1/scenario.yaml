id: hpa-lab-1
title: Autoscale a Deployment with a tuned HPA
domain: workloads
difficulty: 3
estimatedMinutes: 11
points: 7
tags: [ hpa, autoscaling, metrics-server, scale-down-window, memory-target, change-range ]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 30
variables:
  Q1_NS: { oneOf: [ shop, frontend, web-tier ] }
  Q1_NAME: { oneOf: [ web, api, catalog ] }
  Q1_CPU: { oneOf: [ 50, 60, 70 ] }
  Q1_DOWN_WINDOW: { oneOf: [ 60, 120, 300 ] }
  Q1_MEM_VALUE: { oneOf: [ 64Mi, 100Mi, 128Mi ] }
  Q1_RANGE_MAX: { oneOf: [ 12, 15 ] }
tasks:
  - id: q1
    title: Autoscale ${Q1_NAME}
    recipe: { builder: hpa, parts: [ memory-target, scale-down-window, change-range ] }
    points: 7
    setup:
      - node: controlplane
        script: setup/q1.sh
        lane: q1
    checks:
      - id: q1-hpa-cpu
        description: it targets ${Q1_CPU}% average CPU utilization
        type: kubectl
        run: kubectl -n ${Q1_NS} get hpa ${Q1_NAME} -o jsonpath='{.spec.metrics[?(@.resource.name=="cpu")].resource.target.averageUtilization}'
        expect: { equals: "${Q1_CPU}" }
        weight: 1
      - id: q1-hpa-active
        description: the autoscaler reads current metrics (ScalingActive)
        type: kubectl
        run: kubectl -n ${Q1_NS} get hpa ${Q1_NAME} -o jsonpath='{.status.conditions[?(@.type=="ScalingActive")].status}'
        expect: { equals: "True" }
        weight: 1
        retrySeconds: 120
      - id: q1-hpa-window
        description: scale-down stabilization window is ${Q1_DOWN_WINDOW}s
        type: kubectl
        run: kubectl -n ${Q1_NS} get hpa ${Q1_NAME} -o jsonpath='{.spec.behavior.scaleDown.stabilizationWindowSeconds}'
        expect: { equals: "${Q1_DOWN_WINDOW}" }
        weight: 1
      - id: q1-hpa-memory
        description: the autoscaler targets ${Q1_MEM_VALUE} average memory
        type: kubectl
        run: kubectl -n ${Q1_NS} get hpa ${Q1_NAME} -o jsonpath='{.spec.metrics[?(@.resource.name=="memory")].resource.target.averageValue}'
        expect: { equals: "${Q1_MEM_VALUE}" }
        weight: 1
      - id: q1-range-spec
        description: the autoscaler targets Deployment ${Q1_NAME} between 1 and ${Q1_RANGE_MAX} replicas
        type: kubectl
        run: kubectl -n ${Q1_NS} get hpa ${Q1_NAME} -o jsonpath='{.spec.scaleTargetRef.kind}/{.spec.scaleTargetRef.name}/{.spec.minReplicas}/{.spec.maxReplicas}'
        expect: { equals: "Deployment/${Q1_NAME}/1/${Q1_RANGE_MAX}" }
        weight: 3
    hints:
      - kubectl -n ${Q1_NS} autoscale deployment ${Q1_NAME} --min=1 --max=5 with a CPU target (kubectl autoscale --help); for behavior or extra metrics write autoscaling/v2 YAML.
      - kubectl -n ${Q1_NS} describe hpa ${Q1_NAME} shows its conditions and current metrics; kubectl top pods -n ${Q1_NS} confirms metrics-server works.
      - spec.behavior.scaleDown.stabilizationWindowSeconds (kubectl explain hpa.spec.behavior).
      - "A second entry in spec.metrics: type Resource, resource name memory, target type AverageValue."
      - kubectl -n ${Q1_NS} patch hpa ${Q1_NAME} -p '{"spec":{"maxReplicas":<n>}}', or kubectl edit hpa.
