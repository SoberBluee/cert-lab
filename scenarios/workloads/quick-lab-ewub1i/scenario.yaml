id: quick-lab-ewub1i
title: "Quick lab: Pod"
domain: workloads
difficulty: 2
estimatedMinutes: 13
points: 13
tags: [ pod, init-container, secret-types, security, update-image, annotate ]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 30
draft: true
variables:
  Q1_NS: { oneOf: [ apps, jobs, sandbox, workloads, demo, lab, temp, scratch, tools, debug ] }
  Q1_NAME: { oneOf: [ worker, logger, toolbox, frontend, backend, database, cache, queue, scheduler, monitor, gateway, proxy, client, agent, runner ] }
  Q1_IMAGE: { oneOf: [ busybox:1.36, busybox:1.37, nginx:1.28-alpine, httpd:2.4-alpine, alpine:3.20 ] }
  Q1_INIT_TEXT: { oneOf: [ ready, warmed-up, seeded, initialized, bootstrapped, prepared, loaded, synced, ok, done ] }
  Q1_SECRETS_REGISTRY: { oneOf: [ registry.lab.internal:5000, harbor.lab.internal, images.lab.internal:5000, docker.lab.internal:8443 ] }
  Q1_SECRETS_USER: { oneOf: [ ci-puller, deploy-bot, image-reader, release-bot, robot-pull ] }
  Q1_SECRETS_PASSWORD: { oneOf: [ pull-7f3a91, reg-91bc04, img-4d2e77, harb-0c6f3e, robot-58aa12 ] }
  Q1_SEC_USER: { oneOf: [ 1000, 2000, 3000, 1001, 1500, 2500, 4000, 5000 ] }
  Q1_UPDATE_IMAGE: { oneOf: [ busybox:1.36.1, alpine:3.21 ] }
  Q1_NOTE_KEY: { oneOf: [ owner, contact, ticket, description, managed-by, team, cost-center, runbook, slack, pager ] }
  Q1_NOTE_VALUE: { oneOf: [ platform, ops-team, cka-42, sre, devops, oncall, infra, product, security, finance ] }
tasks:
  - id: q1
    title: Pod ${Q1_NAME}
    points: 13
    setup:
      - node: controlplane
        script: setup/q1.sh
        lane: q1
    checks:
      - id: q1-running
        description: Pod ${Q1_NAME} is Running and ready
        type: kubectl
        run: kubectl -n ${Q1_NS} get pod ${Q1_NAME} -o jsonpath='{.status.phase}/{.status.conditions[?(@.type=="Ready")].status}'
        expect: { equals: Running/True }
        weight: 2
        retrySeconds: 30
      - id: q1-init-ready
        description: main reads "${Q1_INIT_TEXT}" from /init/ready
        type: kubectl
        run: kubectl -n ${Q1_NS} exec pod/${Q1_NAME} -- cat /init/ready
        expect: { equals: "${Q1_INIT_TEXT}" }
        weight: 2
        retrySeconds: 30
      - id: q1-tls-secret
        description: ${Q1_NAME}-tls is a TLS Secret holding the certificate from /opt/course/certs/${Q1_NAME}
        type: kubectl
        run: "[ \"$(kubectl -n ${Q1_NS} get secret ${Q1_NAME}-tls -o jsonpath='{.type}')\" = kubernetes.io/tls ] && [ \"$(kubectl -n ${Q1_NS} get secret ${Q1_NAME}-tls -o jsonpath='{.data.tls\\.crt}' | base64 -d | openssl x509 -noout -fingerprint -sha256 2>/dev/null)\" = \"$(openssl x509 -in /opt/course/certs/${Q1_NAME}/tls.crt -noout -fingerprint -sha256)\" ] && echo match || echo differs"
        expect: { equals: match }
        weight: 1
      - id: q1-tls-mounted
        description: /etc/tls/tls.crt in the container is the certificate for ${Q1_NAME}.${Q1_NS}.svc
        type: kubectl
        run: kubectl -n ${Q1_NS} exec pod/${Q1_NAME} -- cat /etc/tls/tls.crt | openssl x509 -noout -subject 2>/dev/null
        expect: { contains: "${Q1_NAME}.${Q1_NS}.svc" }
        weight: 1
        retrySeconds: 30
      - id: q1-pull-secret
        description: ${Q1_NAME}-pull is a docker-registry Secret for ${Q1_SECRETS_REGISTRY} with the given user and password
        type: kubectl
        run: echo "$(kubectl -n ${Q1_NS} get secret ${Q1_NAME}-pull -o jsonpath='{.type}') $(kubectl -n ${Q1_NS} get secret ${Q1_NAME}-pull -o jsonpath='{.data.\.dockerconfigjson}' | base64 -d | jq -r '.auths["${Q1_SECRETS_REGISTRY}"] | "\(.username):\(.password)"')"
        expect: { equals: "kubernetes.io/dockerconfigjson ${Q1_SECRETS_USER}:${Q1_SECRETS_PASSWORD}" }
        weight: 1
      - id: q1-pull-used
        description: the Pod pulls its images with ${Q1_NAME}-pull
        type: kubectl
        run: kubectl -n ${Q1_NS} get pod/${Q1_NAME} -o jsonpath='{.spec.imagePullSecrets[*].name}'
        expect: { contains: "${Q1_NAME}-pull" }
        weight: 1
      - id: q1-sec-user
        description: the container runs as uid ${Q1_SEC_USER}
        type: kubectl
        run: kubectl -n ${Q1_NS} exec pod/${Q1_NAME} -- id -u
        expect: { equals: "${Q1_SEC_USER}" }
        weight: 1
        retrySeconds: 20
      - id: q1-sec-readonly
        description: root filesystem is read-only and escalation is off
        type: kubectl
        run: kubectl -n ${Q1_NS} get pod/${Q1_NAME} -o jsonpath='{.spec.containers[0].securityContext.readOnlyRootFilesystem}/{.spec.containers[0].securityContext.allowPrivilegeEscalation}'
        expect: { equals: true/false }
        weight: 1
      - id: q1-update-image
        description: main runs ${Q1_UPDATE_IMAGE}
        type: kubectl
        run: kubectl -n ${Q1_NS} get pod/${Q1_NAME} -o jsonpath='{.spec.containers[?(@.name=="main")].image}'
        expect: { equals: "${Q1_UPDATE_IMAGE}" }
        weight: 1
      - id: q1-update-restarted
        description: ${Q1_NAME} was updated in place (main restarted)
        type: kubectl
        run: kubectl -n ${Q1_NS} get pod/${Q1_NAME} -o jsonpath='{.status.containerStatuses[?(@.name=="main")].restartCount}'
        expect: { gte: 1 }
        weight: 1
        retrySeconds: 30
      - id: q1-annotate
        description: ${Q1_NAME} has the annotation ${Q1_NOTE_KEY}=${Q1_NOTE_VALUE}
        type: kubectl
        run: kubectl -n ${Q1_NS} get pod ${Q1_NAME} -o jsonpath='{.metadata.annotations.${Q1_NOTE_KEY}}'
        expect: { equals: "${Q1_NOTE_VALUE}" }
        weight: 1
    hints:
      - kubectl -n ${Q1_NS} run ${Q1_NAME} --image=${Q1_IMAGE} --dry-run=client -o yaml -- sleep 1d gives you a manifest to start from.
      - initContainers run to completion before the containers start; share the file through an emptyDir mounted in both.
      - kubectl -n ${Q1_NS} create secret tls ${Q1_NAME}-tls --cert=... --key=...; mount it with a secret volume.
      - "kubectl -n ${Q1_NS} create secret docker-registry ${Q1_NAME}-pull --docker-server=... --docker-username=... --docker-password=...; then spec.imagePullSecrets: [{name: ${Q1_NAME}-pull}]."
      - "securityContext on the container: runAsUser, readOnlyRootFilesystem, allowPrivilegeEscalation."
      - "kubectl -n ${Q1_NS} set image pod/${Q1_NAME} main=${Q1_UPDATE_IMAGE}: the image is one of the few mutable Pod fields."
      - kubectl annotate --help
    recipe: { builder: pod, parts: [ init-container, secret-types, security, update-image, annotate ] }
