id: kk2-logging-sidecar
title: Add a logging sidecar
domain: workloads
difficulty: 2
estimatedMinutes: 10
points: 7
tags: [workloads, sidecar, logging, emptyDir]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 30
variables:
  POD: { oneOf: [ elastic-app, log-app, writer-app ] }
setup:
  - node: controlplane
    script: setup/break.sh
checks:
  - id: running
    description: Pod ${POD} is Running with elastic-app and busybox containers
    type: kubectl
    run: kubectl get pod ${POD} -o jsonpath='{.status.phase}/{.spec.containers[0].name}/{.spec.containers[1].name}'
    expect: { equals: "Running/elastic-app/busybox" }
    weight: 2
    retrySeconds: 90
  - id: tail
    description: busybox tails /var/log/elastic-app.log
    type: kubectl
    run: kubectl get pod ${POD} -o jsonpath='{.spec.containers[?(@.name=="busybox")].args[*]}'
    expect: { contains: "tail -f /var/log/elastic-app.log" }
    weight: 2
  - id: share
    description: both containers mount the same emptyDir at /var/log
    type: kubectl
    run: |
      a=$(kubectl get pod ${POD} -o jsonpath='{.spec.containers[0].volumeMounts[?(@.mountPath=="/var/log")].name}')
      b=$(kubectl get pod ${POD} -o jsonpath='{.spec.containers[1].volumeMounts[?(@.mountPath=="/var/log")].name}')
      t=$(kubectl get pod ${POD} -o jsonpath="{.spec.volumes[?(@.name==\"$a\")].emptyDir}")
      [[ -n "$a" && "$a" == "$b" && -n "$t" ]] && echo ok || echo bad
    expect: { equals: "ok" }
    weight: 2
  - id: logs
    description: kubectl logs -c busybox shows log lines
    type: kubectl
    run: kubectl logs ${POD} -c busybox --tail=5
    expect: { contains: "INFO" }
    weight: 1
    retrySeconds: 30
hints:
  - "Edit /opt/course/${POD}.yaml: add a second container and a shared emptyDir for /var/log."
  - "kubectl replace -f ... --force recreates an immutable Pod."
