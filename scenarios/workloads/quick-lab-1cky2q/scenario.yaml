id: quick-lab-1cky2q
title: "Quick lab: Workload patterns"
domain: workloads
difficulty: 2
estimatedMinutes: 8
points: 6
tags: [ anti-affinity, readinessprobe, tolerations, multi-container, downward-api, static-pod, nodeport, kubectl-debug, ephemeral-containers ]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 30
draft: true
variables:
  Q1_NS: { oneOf: [ cdn, gateway-ns, storefront, partners, sandbox, tooling, internal, mobile, portal, staging ] }
  Q1_NODE: { oneOf: [ worker-1, worker-2 ] }
tasks:
  - id: q1
    title: Debug a Pod that has no shell
    points: 6
    setup:
      - node: controlplane
        script: setup/q1.sh
        lane: q1
    checks:
      - id: q1-ephemeral
        description: debugger is an ephemeral container with busybox:1.36 that targets app
        type: kubectl
        run: kubectl -n ${Q1_NS} get pod legacy-api -o jsonpath='{.spec.ephemeralContainers[?(@.name=="debugger")].image} {.spec.ephemeralContainers[?(@.name=="debugger")].targetContainerName}'
        expect: { equals: busybox:1.36 app }
        weight: 3
      - type: ssh
        node: controlplane
        id: q1-ps
        description: ps.txt shows the process of container app
        run: grep -q '/pause' /opt/course/debug/ps.txt 2>/dev/null && echo seen || echo missing
        expect: { equals: seen }
        weight: 2
      - type: ssh
        node: controlplane
        id: q1-same-pod
        description: legacy-api was not replaced or restarted
        run: "[ \"$(kubectl -n ${Q1_NS} get pod legacy-api -o jsonpath='{.metadata.uid} {.status.containerStatuses[0].restartCount}')\" = \"$(cat /root/.cka-debug-uid-${Q1_NS}) 0\" ] && echo same || echo replaced"
        expect: { equals: same }
        weight: 1
    hints:
      - kubectl debug <pod> adds an ephemeral container to a running Pod without restarting it. kubectl debug --help lists its flags.
      - --target=<container> makes the new container share that container's process namespace. Without it, ps shows only its own processes.
      - The command after -- can be ps itself. kubectl logs <pod> -c <container> reads an ephemeral container like any other.
    recipe: { builder: workload-patterns, parts: [] }
