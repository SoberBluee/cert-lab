id: kk2-hpa-scaledown-window
title: HPA with scale-down window
domain: workloads
difficulty: 2
estimatedMinutes: 8
points: 7
tags: [workloads, hpa, autoscaling]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 30
variables:
  NS: { oneOf: [ shop, web, apps ] }
  APP: { oneOf: [ webapp, storefront, catalog ] }
setup:
  - node: controlplane
    script: setup/break.sh
checks:
  - id: target
    description: HPA targets Deployment ${APP}
    type: kubectl
    run: kubectl -n ${NS} get hpa ${APP}-hpa -o jsonpath='{.spec.scaleTargetRef.kind}/{.spec.scaleTargetRef.name}'
    expect: { equals: "Deployment/${APP}" }
    weight: 1
  - id: cpu
    description: CPU target is 50%
    type: kubectl
    run: kubectl -n ${NS} get hpa ${APP}-hpa -o jsonpath='{.spec.metrics[?(@.resource.name=="cpu")].resource.target.averageUtilization}'
    expect: { equals: "50" }
    weight: 2
  - id: range
    description: min 1 max 3 replicas
    type: kubectl
    run: kubectl -n ${NS} get hpa ${APP}-hpa -o jsonpath='{.spec.minReplicas}/{.spec.maxReplicas}'
    expect: { equals: "1/3" }
    weight: 2
  - id: window
    description: scaleDown stabilizationWindowSeconds is 300
    type: kubectl
    run: kubectl -n ${NS} get hpa ${APP}-hpa -o jsonpath='{.spec.behavior.scaleDown.stabilizationWindowSeconds}'
    expect: { equals: "300" }
    weight: 2
hints:
  - "Use autoscaling/v2 HorizontalPodAutoscaler YAML for behavior.scaleDown.stabilizationWindowSeconds."
  - "kubectl explain hpa.spec.behavior"
