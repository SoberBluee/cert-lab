id: quick-lab-5ldv27
title: "Quick lab: VerticalPodAutoscaler"
domain: workloads
difficulty: 3
estimatedMinutes: 11
points: 7
tags: [ vpa, autoscaling, resources, requests-only, exclude-sidecar, switch-mode ]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 30
variables:
  Q1_NS: { oneOf: [ shop, billing, reports, rightsizing, finops, workloads, compute, media, batch, services ] }
  Q1_NAME: { oneOf: [ web, api, worker, renderer, encoder, processor, analyzer, indexer, compiler, transformer ] }
  Q1_MODE: { oneOf: [ Off, Initial, Recreate ] }
tasks:
  - id: q1
    title: Right-size ${Q1_NAME}
    points: 7
    setup:
      - node: controlplane
        script: setup/q1.sh
        lane: q1
    checks:
      - id: q1-vpa-recommends
        description: it recommends resources for container web
        type: kubectl
        run: kubectl -n ${Q1_NS} get vpa ${Q1_NAME}-vpa -o jsonpath='{.status.recommendation.containerRecommendations[?(@.containerName=="web")].target.cpu}' | grep -q . && echo yes || echo no
        expect: { equals: yes }
        weight: 2
        retrySeconds: 180
      - id: q1-vpa-requests-only
        description: only requests are controlled for web
        type: kubectl
        run: kubectl -n ${Q1_NS} get vpa ${Q1_NAME}-vpa -o jsonpath='{.spec.resourcePolicy.containerPolicies[?(@.containerName=="web")].controlledValues}'
        expect: { equals: RequestsOnly }
        weight: 1
      - id: q1-vpa-sidecar
        description: log-agent is excluded
        type: kubectl
        run: kubectl -n ${Q1_NS} get vpa ${Q1_NAME}-vpa -o jsonpath='{.spec.resourcePolicy.containerPolicies[?(@.containerName=="log-agent")].mode}'
        expect: { equals: Off }
        weight: 1
      - id: q1-vpa-mode
        description: ${Q1_NAME}-vpa targets Deployment ${Q1_NAME} and switched away from mode ${Q1_MODE}
        type: kubectl
        run: kubectl -n ${Q1_NS} get vpa ${Q1_NAME}-vpa -o jsonpath='{.spec.targetRef.kind}/{.spec.targetRef.name}/{.spec.updatePolicy.updateMode}'
        expect: { matches: "^Deployment/${Q1_NAME}/(Recreate|Initial)$", notContains: "/${Q1_MODE}" }
        weight: 3
    hints:
      - "There is no kubectl create for it: write apiVersion autoscaling.k8s.io/v1, kind VerticalPodAutoscaler, with spec.targetRef and spec.updatePolicy.updateMode (kubectl explain vpa.spec)."
      - kubectl -n ${Q1_NS} describe vpa ${Q1_NAME}-vpa shows the recommendation once the recommender has run (about a minute).
      - "controlledValues: RequestsOnly in the container policy (the default is RequestsAndLimits)."
      - 'A container policy {containerName: log-agent, mode: "Off"} excludes one container.'
      - kubectl -n ${Q1_NS} patch vpa ${Q1_NAME}-vpa --type=merge -p '{"spec":{"updatePolicy":{"updateMode":"..."}}}', or kubectl edit vpa.
    recipe: { builder: vpa, parts: [ requests-only, exclude-sidecar, switch-mode ] }
