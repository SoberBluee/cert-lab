id: quick-lab-fq00px
title: "Quick lab: Pod"
domain: workloads
difficulty: 2
estimatedMinutes: 9
points: 8
tags: [ pod, security, init-container, annotate ]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 30
draft: true
variables:
  Q1_NS: { oneOf: [ apps, jobs, sandbox, workloads, demo, lab, temp, scratch, tools, debug ] }
  Q1_NAME: { oneOf: [ worker, logger, toolbox, frontend, backend, database, cache, queue, scheduler, monitor, gateway, proxy, client, agent, runner ] }
  Q1_IMAGE: { oneOf: [ busybox:1.36, busybox:1.37, nginx:1.28-alpine, httpd:2.4-alpine, alpine:3.20 ] }
  Q1_SEC_USER: { oneOf: [ 1000, 2000, 3000, 1001, 1500, 2500, 4000, 5000 ] }
  Q1_INIT_TEXT: { oneOf: [ ready, warmed-up, seeded, initialized, bootstrapped, prepared, loaded, synced, ok, done ] }
  Q1_NOTE_KEY: { oneOf: [ owner, contact, ticket, description, managed-by, team, cost-center, runbook, slack, pager ] }
  Q1_NOTE_VALUE: { oneOf: [ platform, ops-team, cka-42, sre, devops, oncall, infra, product, security, finance ] }
tasks:
  - id: q1
    title: Pod ${Q1_NAME}
    points: 8
    setup:
      - node: controlplane
        script: setup/q1.sh
        lane: q1
    checks:
      - id: q1-running
        description: Pod ${Q1_NAME} is Running and ready
        type: kubectl
        run: kubectl -n ${Q1_NS} get pod ${Q1_NAME} -o jsonpath='{.status.phase}/{.status.conditions[?(@.type=="Ready")].status}'
        expect: { equals: Running/True }
        weight: 2
        retrySeconds: 30
      - id: q1-image
        description: main runs ${Q1_IMAGE}
        type: kubectl
        run: kubectl -n ${Q1_NS} get pod/${Q1_NAME} -o jsonpath='{.spec.containers[0].name}/{.spec.containers[0].image}'
        expect: { equals: "main/${Q1_IMAGE}" }
        weight: 1
      - id: q1-sec-user
        description: the container runs as uid ${Q1_SEC_USER}
        type: kubectl
        run: kubectl -n ${Q1_NS} exec pod/${Q1_NAME} -- id -u
        expect: { equals: "${Q1_SEC_USER}" }
        weight: 1
        retrySeconds: 20
      - id: q1-sec-readonly
        description: root filesystem is read-only and escalation is off
        type: kubectl
        run: kubectl -n ${Q1_NS} get pod/${Q1_NAME} -o jsonpath='{.spec.containers[0].securityContext.readOnlyRootFilesystem}/{.spec.containers[0].securityContext.allowPrivilegeEscalation}'
        expect: { equals: true/false }
        weight: 1
      - id: q1-init-ready
        description: main reads "${Q1_INIT_TEXT}" from /init/ready
        type: kubectl
        run: kubectl -n ${Q1_NS} exec pod/${Q1_NAME} -- cat /init/ready
        expect: { equals: "${Q1_INIT_TEXT}" }
        weight: 2
        retrySeconds: 30
      - id: q1-annotate
        description: ${Q1_NAME} has the annotation ${Q1_NOTE_KEY}=${Q1_NOTE_VALUE}
        type: kubectl
        run: kubectl -n ${Q1_NS} get pod ${Q1_NAME} -o jsonpath='{.metadata.annotations.${Q1_NOTE_KEY}}'
        expect: { equals: "${Q1_NOTE_VALUE}" }
        weight: 1
    hints:
      - kubectl -n ${Q1_NS} run ${Q1_NAME} --image=${Q1_IMAGE} --dry-run=client -o yaml -- sleep 1d gives you a manifest to start from.
      - "securityContext on the container: runAsUser, readOnlyRootFilesystem, allowPrivilegeEscalation."
      - initContainers run to completion before the containers start; share the file through an emptyDir mounted in both.
      - kubectl annotate --help
    recipe: { builder: pod, parts: [ security, init-container, annotate ] }
