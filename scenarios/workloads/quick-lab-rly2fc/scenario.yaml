id: quick-lab-rly2fc
title: "Quick lab: Scheduling and placement"
domain: workloads
difficulty: 1
estimatedMinutes: 6
points: 6
tags: [ deployment, toleration ]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 30
draft: true
variables:
  Q1_NS: { oneOf: [ web, shop, team-a, frontend, store, apps, services, prod-web, edge, portal ] }
  Q1_NAME: { oneOf: [ frontend, api, catalog, backend, gateway, cart, search, auth, payments, inventory ] }
  Q1_IMAGE: { oneOf: [ nginx:1.26-alpine, nginx:1.27-alpine ] }
  Q1_REPLICAS: { oneOf: [ 2, 3, 4 ] }
  Q1_TAINT_TEAM: { oneOf: [ web, payments, search, batch, gpu, ml, database, frontend, backend, analytics ] }
  Q1_TAINT_NODE: { oneOf: [ worker-1, worker-2 ] }
tasks:
  - id: q1
    title: Deployment ${Q1_NAME}
    points: 6
    setup:
      - node: controlplane
        script: setup/q1.sh
        lane: q1
    checks:
      - id: q1-ready
        description: Deployment ${Q1_NAME} has ${Q1_REPLICAS} ready replicas
        type: kubectl
        run: kubectl -n ${Q1_NS} get deployment ${Q1_NAME} -o jsonpath='{.status.readyReplicas}'
        expect: { equals: "${Q1_REPLICAS}" }
        weight: 2
        retrySeconds: 30
      - id: q1-image
        description: ${Q1_NAME} runs ${Q1_IMAGE}
        type: kubectl
        run: kubectl -n ${Q1_NS} get deployment/${Q1_NAME} -o jsonpath='{.spec.template.spec.containers[0].image}'
        expect: { equals: "${Q1_IMAGE}" }
        weight: 1
      - id: q1-taint-toleration
        description: the Pods tolerate dedicated=${Q1_TAINT_TEAM}:NoSchedule
        type: kubectl
        run: kubectl -n ${Q1_NS} get deployment/${Q1_NAME} -o jsonpath='{.spec.template.spec.tolerations[?(@.key=="dedicated")].value}'
        expect: { contains: "${Q1_TAINT_TEAM}" }
        weight: 1
      - id: q1-taint-nodes
        description: every Pod runs on ${Q1_TAINT_NODE}
        type: kubectl
        run: kubectl -n ${Q1_NS} get pods -l app=${Q1_NAME} --field-selector=status.phase=Running -o jsonpath='{range .items[*]}{.spec.nodeName}{"\n"}{end}' | sort -u | tr '\n' ' '
        expect: { equals: "${Q1_TAINT_NODE}" }
        weight: 1
      - id: q1-taint-kept
        description: ${Q1_TAINT_NODE} keeps its taint
        type: kubectl
        run: kubectl get node ${Q1_TAINT_NODE} -o jsonpath='{.spec.taints[?(@.key=="dedicated")].value}'
        expect: { equals: "${Q1_TAINT_TEAM}" }
        weight: 1
    hints:
      - kubectl -n ${Q1_NS} create deployment ${Q1_NAME} --image=${Q1_IMAGE} --replicas=${Q1_REPLICAS} --dry-run=client -o yaml gives you a manifest to start from.
      - A toleration lets Pods onto the node; a nodeSelector (or node affinity) on kubernetes.io/hostname keeps them there.
    recipe: { builder: deployment, parts: [ toleration ] }
