id: quick-lab-0x9o85
title: "Quick lab: Pod"
domain: workloads
difficulty: 2
estimatedMinutes: 12
points: 9
tags: [ pod, update-image, annotate, label ]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 30
draft: true
variables:
  Q1_NS: { oneOf: [ apps, jobs, sandbox, workloads, demo, lab, temp, scratch, tools, debug ] }
  Q1_NAME: { oneOf: [ worker, logger, toolbox, frontend, backend, database, cache, queue, scheduler, monitor, gateway, proxy, client, agent, runner ] }
  Q1_IMAGE: { oneOf: [ busybox:1.36, busybox:1.37, nginx:1.28-alpine, httpd:2.4-alpine, alpine:3.20 ] }
  Q1_UPDATE_IMAGE: { oneOf: [ busybox:1.36.1, alpine:3.21 ] }
  Q2_NS: { oneOf: [ apps, jobs, sandbox, workloads, demo, lab, temp, scratch, tools, debug ] }
  Q2_NAME: { oneOf: [ worker, logger, toolbox, frontend, backend, database, cache, queue, scheduler, monitor, gateway, proxy, client, agent, runner ] }
  Q2_IMAGE: { oneOf: [ busybox:1.36, busybox:1.37, nginx:1.28-alpine, httpd:2.4-alpine, alpine:3.20 ] }
  Q2_NOTE_KEY: { oneOf: [ owner, contact, ticket, description, managed-by, team, cost-center, runbook, slack, pager ] }
  Q2_NOTE_VALUE: { oneOf: [ platform, ops-team, cka-42, sre, devops, oncall, infra, product, security, finance ] }
  Q2_LABEL_KEY: { oneOf: [ tier, team, env, app, role, zone, stage, component, version, owner ] }
  Q2_LABEL_VALUE: { oneOf: [ backend, blue, prod, frontend, green, staging, canary, worker, api, batch ] }
tasks:
  - id: q1
    title: Pod ${Q1_NAME}
    points: 4
    setup:
      - node: controlplane
        script: setup/q1.sh
        lane: q1
    checks:
      - id: q1-running
        description: Pod ${Q1_NAME} is Running and ready
        type: kubectl
        run: kubectl -n ${Q1_NS} get pod ${Q1_NAME} -o jsonpath='{.status.phase}/{.status.conditions[?(@.type=="Ready")].status}'
        expect: { equals: Running/True }
        weight: 2
        retrySeconds: 30
      - id: q1-update-image
        description: main runs ${Q1_UPDATE_IMAGE}
        type: kubectl
        run: kubectl -n ${Q1_NS} get pod/${Q1_NAME} -o jsonpath='{.spec.containers[?(@.name=="main")].image}'
        expect: { equals: "${Q1_UPDATE_IMAGE}" }
        weight: 1
      - id: q1-update-restarted
        description: ${Q1_NAME} was updated in place (main restarted)
        type: kubectl
        run: kubectl -n ${Q1_NS} get pod/${Q1_NAME} -o jsonpath='{.status.containerStatuses[?(@.name=="main")].restartCount}'
        expect: { gte: 1 }
        weight: 1
        retrySeconds: 30
    hints:
      - kubectl -n ${Q1_NS} run ${Q1_NAME} --image=${Q1_IMAGE} --dry-run=client -o yaml -- sleep 1d gives you a manifest to start from.
      - "kubectl -n ${Q1_NS} set image pod/${Q1_NAME} main=${Q1_UPDATE_IMAGE}: the image is one of the few mutable Pod fields."
    recipe: { builder: pod, parts: [ update-image ] }
  - id: q2
    title: Pod ${Q2_NAME}
    points: 5
    setup:
      - node: controlplane
        script: setup/q2.sh
        lane: q2
    checks:
      - id: q2-running
        description: Pod ${Q2_NAME} is Running and ready
        type: kubectl
        run: kubectl -n ${Q2_NS} get pod ${Q2_NAME} -o jsonpath='{.status.phase}/{.status.conditions[?(@.type=="Ready")].status}'
        expect: { equals: Running/True }
        weight: 2
        retrySeconds: 30
      - id: q2-image
        description: main runs ${Q2_IMAGE}
        type: kubectl
        run: kubectl -n ${Q2_NS} get pod/${Q2_NAME} -o jsonpath='{.spec.containers[0].name}/{.spec.containers[0].image}'
        expect: { equals: "main/${Q2_IMAGE}" }
        weight: 1
      - id: q2-annotate
        description: ${Q2_NAME} has the annotation ${Q2_NOTE_KEY}=${Q2_NOTE_VALUE}
        type: kubectl
        run: kubectl -n ${Q2_NS} get pod ${Q2_NAME} -o jsonpath='{.metadata.annotations.${Q2_NOTE_KEY}}'
        expect: { equals: "${Q2_NOTE_VALUE}" }
        weight: 1
      - id: q2-label
        description: ${Q2_NAME} has the label ${Q2_LABEL_KEY}=${Q2_LABEL_VALUE}
        type: kubectl
        run: kubectl -n ${Q2_NS} get pod ${Q2_NAME} -o jsonpath='{.metadata.labels.${Q2_LABEL_KEY}}'
        expect: { equals: "${Q2_LABEL_VALUE}" }
        weight: 1
    hints:
      - kubectl -n ${Q2_NS} run ${Q2_NAME} --image=${Q2_IMAGE} --dry-run=client -o yaml -- sleep 1d gives you a manifest to start from.
      - kubectl annotate --help
      - kubectl label --help
    recipe: { builder: pod, parts: [ annotate, label ] }
