id: quick-lab-mya54w
title: "Quick lab: Vertical Pod Autoscaling"
domain: workloads
difficulty: 3
estimatedMinutes: 10
points: 14
tags: [ troubleshooting, vpa, autoscaling, resources ]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 20
variables:
  Q1_NS: { oneOf: [ billing, reports, media, rightsizing, capacity, finops, workloads, compute, apps, services ] }
  Q1_APP: { oneOf: [ api, worker, renderer, batch, processor, encoder, analyzer, compiler, indexer, transformer ] }
  Q1_FAULT: { oneOf: [ recommender-down, admission-down, target-name, mode-off, container-off, recommender-rbac ], hidden: true }
tasks:
  - id: q1
    title: VPA for ${Q1_APP} not working
    points: 14
    setup:
      - node: controlplane
        script: setup/q1.sh
        timeoutSeconds: 400
        lane: q1
    checks:
      - id: q1-vpa-spec
        description: ${Q1_APP}-vpa targets Deployment ${Q1_APP} and is allowed to update its Pods
        type: kubectl
        run: kubectl -n ${Q1_NS} get vpa ${Q1_APP}-vpa -o jsonpath='{.spec.targetRef.kind}/{.spec.targetRef.name}/{.spec.updatePolicy.updateMode}'
        expect: { matches: "^Deployment/${Q1_APP}/(Recreate|Auto|InPlaceOrRecreate)$" }
        weight: 1
      - id: q1-vpa-manages-web
        description: container web is not excluded
        type: kubectl
        run: kubectl -n ${Q1_NS} get vpa ${Q1_APP}-vpa -o jsonpath='{.spec.resourcePolicy.containerPolicies[?(@.containerName=="web")].mode}{.spec.resourcePolicy.containerPolicies[?(@.containerName=="*")].mode}' | grep -q Off && echo excluded || echo managed
        expect: { equals: managed }
        weight: 1
      - id: q1-vpa-recommends
        description: it recommends resources for container web
        type: kubectl
        run: kubectl -n ${Q1_NS} get vpa ${Q1_APP}-vpa -o jsonpath='{.status.recommendation.containerRecommendations[?(@.containerName=="web")].target.cpu}' | grep -q . && echo yes || echo no
        expect: { equals: yes }
        weight: 2
        retrySeconds: 180
      - id: q1-vpa-components
        description: recommender, updater and admission controller are ready in namespace vpa
        type: kubectl
        run: kubectl -n vpa get deploy vpa-recommender vpa-updater vpa-admission-controller -o jsonpath='{range .items[*]}{.status.readyReplicas}{" "}{end}' | xargs
        expect: { equals: "1 1 1" }
        weight: 2
        retrySeconds: 120
      - id: q1-vpa-applied
        description: running Pods of ${Q1_APP} got their requests from the VPA
        type: kubectl
        run: kubectl -n ${Q1_NS} get pods -l app=${Q1_APP} --field-selector=status.phase=Running -o jsonpath='{range .items[*]}{.metadata.annotations.vpaUpdates}{"\n"}{end}' | grep -c 'updated by' || true
        expect: { gte: 2 }
        weight: 6
        retrySeconds: 120
      - id: q1-ready
        description: ${Q1_APP} has at least 2 ready replicas
        type: kubectl
        run: kubectl -n ${Q1_NS} get deployment ${Q1_APP} -o jsonpath='{.status.readyReplicas}'
        expect: { gte: 2 }
        weight: 1
        retrySeconds: 60
      - id: q1-same-deployment
        description: ${Q1_APP} was not deleted or recreated
        type: kubectl
        run: "[ \"$(kubectl -n ${Q1_NS} get deployment ${Q1_APP} -o jsonpath='{.metadata.uid}')\" = \"$(cat /var/tmp/cka-q1.uid)\" ] && echo same || echo recreated"
        expect: { equals: same }
        weight: 1
    hints:
      - "kubectl -n ${Q1_NS} describe vpa ${Q1_APP}-vpa: is there a Recommendation, and what do its Conditions say?"
      - "kubectl -n vpa get deploy,pods: the recommender computes recommendations, the admission controller writes them into new Pods, the updater evicts Pods that are far off. Which part of that chain is missing?"
      - "kubectl -n ${Q1_NS} get pod <pod> -o yaml: Pods the VPA changed carry a vpaUpdates annotation. Existing Pods only change when they are recreated."
      - "kubectl -n vpa logs deploy/<component>: errors there point at what a component cannot do."
    recipe: { category: vpa }
