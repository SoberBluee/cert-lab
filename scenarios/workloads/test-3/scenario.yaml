id: test-3
title: "Mixed exam: workloads, DNS, control plane and StorageClass"
domain: workloads
difficulty: 3
estimatedMinutes: 45
points: 33
tags: [ troubleshooting, scheduling, resourcequota, limitrange, affinity, deployment, expose, autoscale, dns, coredns, service, control-plane, static-pod, etcd, kubelet, storageclass, allow-expansion, make-default ]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 60
variables:
  Q1_NS: { oneOf: [ batch, reports, analytics ] }
  Q1_APP: { oneOf: [ worker, renderer, indexer ] }
  Q1_FAULT: { oneOf: [ quota-pods, quota-limits, limitrange-max, node-affinity, priority-class ], hidden: true }
  Q2_NS: { oneOf: [ web, shop, team-a ] }
  Q2_NAME: { oneOf: [ frontend, api, catalog ] }
  Q2_EXPOSE_PORT: { oneOf: [ 80, 8080, 3000 ] }
  Q2_EXPOSE_TYPE: { oneOf: [ ClusterIP, NodePort ] }
  Q2_HPA_CPU: { oneOf: [ 50, 70, 80 ] }
  Q3_NS: { oneOf: [ shop, intranet, search ] }
  Q3_FAULT: { oneOf: [ corefile-typo, scaled-to-zero, cluster-domain, kube-dns-selector, client-dns-policy ], hidden: true }
  Q4_NS: { oneOf: [ ops, core, platform ] }
  Q4_FAULT: { oneOf: [ apiserver-etcd-port, apiserver-etcd-certfile, etcd-cert-path, scheduler-command, controller-manager-kubeconfig, kubelet-client-cert ], hidden: true }
  Q5_NAME: { oneOf: [ gold, silver, bronze ] }
  Q5_RECLAIM: { oneOf: [ Retain, Delete ] }
  Q5_BINDING: { oneOf: [ Immediate, WaitForFirstConsumer ] }
solution:
  - node: controlplane
    script: setup/q4-solution.sh
    timeoutSeconds: 900
  - node: controlplane
    script: solution.sh
tasks:
  - id: q1
    title: Deployment ${Q1_APP} not running
    points: 5
    setup:
      - node: controlplane
        script: setup/q1.sh
        timeoutSeconds: 400
        lane: q1
    checks:
      - id: q1-ready
        description: ${Q1_APP} has 2 ready replicas
        type: kubectl
        run: kubectl -n ${Q1_NS} get deployment ${Q1_APP} -o jsonpath='{.status.readyReplicas}/{.status.updatedReplicas}/{.status.replicas}'
        expect: { equals: 2/2/2 }
        weight: 3
        retrySeconds: 60
      - id: q1-spec
        description: replicas, image and requests match the spec
        type: kubectl
        run: kubectl -n ${Q1_NS} get deployment ${Q1_APP} -o jsonpath='{.spec.replicas} {.spec.template.spec.containers[0].image} {.spec.template.spec.containers[0].resources.requests.cpu} {.spec.template.spec.containers[0].resources.requests.memory}'
        expect: { equals: 2 nginx:1.27-alpine 100m 64Mi }
        weight: 1
      - id: q1-same-deployment
        description: ${Q1_APP} was not deleted or recreated
        type: kubectl
        run: "[ \"$(kubectl -n ${Q1_NS} get deployment ${Q1_APP} -o jsonpath='{.metadata.uid}')\" = \"$(cat /var/tmp/cka-q1.uid)\" ] && echo same || echo recreated"
        expect: { equals: same }
        weight: 1
    hints:
      - "kubectl -n ${Q1_NS} get deployment,replicaset,pods -o wide: are Pods missing altogether, or do they exist and stay Pending?"
      - "Missing Pods were refused when the ReplicaSet tried to create them: kubectl -n ${Q1_NS} describe replicaset -l app=${Q1_APP} shows the FailedCreate reason."
      - "Pending Pods were never placed: kubectl -n ${Q1_NS} describe pod <pod> shows the scheduler's reason under Events."
      - What does the namespace enforce, and what does the Pod template ask for? kubectl -n ${Q1_NS} get all,resourcequota,limitrange and kubectl -n ${Q1_NS} get deployment ${Q1_APP} -o yaml.
  - id: q2
    title: Deployment ${Q2_NAME}
    points: 8
    setup:
      - node: controlplane
        script: setup/q2.sh
        lane: q2
    checks:
      - id: q2-ready
        description: Deployment ${Q2_NAME} has 3 ready replicas
        type: kubectl
        run: kubectl -n ${Q2_NS} get deployment ${Q2_NAME} -o jsonpath='{.status.readyReplicas}'
        expect: { equals: "3" }
        weight: 2
        retrySeconds: 30
      - id: q2-image
        description: ${Q2_NAME} runs nginx:1.26-alpine
        type: kubectl
        run: kubectl -n ${Q2_NS} get deployment/${Q2_NAME} -o jsonpath='{.spec.template.spec.containers[0].image}'
        expect: { equals: nginx:1.26-alpine }
        weight: 1
      - id: q2-expose-service
        description: Service ${Q2_NAME} is a ${Q2_EXPOSE_TYPE} mapping port ${Q2_EXPOSE_PORT} to 80
        type: kubectl
        run: kubectl -n ${Q2_NS} get svc ${Q2_NAME} -o jsonpath='{.spec.type}/{.spec.ports[0].port}/{.spec.ports[0].targetPort}'
        expect: { equals: "${Q2_EXPOSE_TYPE}/${Q2_EXPOSE_PORT}/80" }
        weight: 1
      - id: q2-expose-reachable
        description: Service ${Q2_NAME} answers HTTP 200 on port ${Q2_EXPOSE_PORT}
        type: kubectl
        run: curl -s -m 5 -o /dev/null -w '%{http_code}' "http://$(kubectl -n ${Q2_NS} get svc ${Q2_NAME} -o jsonpath='{.spec.clusterIP}'):${Q2_EXPOSE_PORT}/"
        expect: { equals: "200" }
        weight: 2
        retrySeconds: 30
      - id: q2-hpa
        description: an autoscaler drives ${Q2_NAME} between 1 and 8 replicas at ${Q2_HPA_CPU}% CPU
        type: kubectl
        run: kubectl -n ${Q2_NS} get hpa -o jsonpath='{range .items[?(@.spec.scaleTargetRef.name=="${Q2_NAME}")]}{.spec.minReplicas}/{.spec.maxReplicas}/{.spec.metrics[0].resource.target.averageUtilization}{end}'
        expect: { equals: "1/8/${Q2_HPA_CPU}" }
        weight: 2
    hints:
      - kubectl -n ${Q2_NS} create deployment ${Q2_NAME} --image=nginx:1.26-alpine --replicas=3 --dry-run=client -o yaml gives you a manifest to start from.
      - kubectl -n ${Q2_NS} expose deployment ${Q2_NAME} --type=${Q2_EXPOSE_TYPE} --port=${Q2_EXPOSE_PORT} --target-port=80
      - kubectl -n ${Q2_NS} autoscale deployment ${Q2_NAME} --min=1 --max=8 with a CPU target (see kubectl autoscale --help).
  - id: q3
    title: Name resolution broken
    points: 7
    setup:
      - node: controlplane
        script: setup/q3.sh
        timeoutSeconds: 400
    setupStage: 1
    checks:
      - id: q3-short-name
        description: client gets the nginx page from http://web
        type: kubectl
        run: kubectl -n ${Q3_NS} exec client -- wget -qO- -T 3 http://web
        expect: { contains: nginx }
        weight: 2
        retrySeconds: 60
      - id: q3-fqdn
        description: client resolves web.${Q3_NS}.svc.cluster.local to the Service IP
        type: kubectl
        run: ip=$(kubectl -n ${Q3_NS} get svc web -o jsonpath='{.spec.clusterIP}'); kubectl -n ${Q3_NS} exec client -- nslookup -type=a web.${Q3_NS}.svc.cluster.local 2>/dev/null | grep -qw "$ip" && echo resolves || echo fails
        expect: { equals: resolves }
        weight: 2
        retrySeconds: 60
      - id: q3-coredns-ready
        description: CoreDNS runs 2 ready replicas
        type: kubectl
        run: kubectl -n kube-system get deployment coredns -o jsonpath='{.status.readyReplicas}'
        expect: { equals: "2" }
        weight: 1
        retrySeconds: 60
      - id: q3-corefile
        description: The Corefile serves cluster.local and forwards to /etc/resolv.conf
        type: kubectl
        run: kubectl -n kube-system get configmap coredns -o jsonpath='{.data.Corefile}' | grep -cE 'kubernetes cluster\.local |forward \. /etc/resolv\.conf'
        expect: { equals: "2" }
        weight: 1
      - id: q3-kube-dns-service
        description: Service kube-dns selects the CoreDNS Pods
        type: kubectl
        run: kubectl -n kube-system get svc kube-dns -o jsonpath='{.spec.selector.k8s-app}'
        expect: { equals: kube-dns }
        weight: 1
    hints:
      - "Is it DNS at all? From client, compare nslookup web with nslookup web.${Q3_NS}.svc.cluster.local, and both with a lookup sent straight to a CoreDNS Pod IP: nslookup <name> <pod-ip>."
      - "Work outwards from the client: kubectl -n ${Q3_NS} exec client -- cat /etc/resolv.conf, then kubectl -n kube-system get svc,endpointslices -l k8s-app=kube-dns, then the CoreDNS Pods."
      - "CoreDNS Pods that are missing, crashing or never ready say why: kubectl -n kube-system get deploy,pods -l k8s-app=kube-dns, then describe and logs."
      - CoreDNS reads its configuration from a ConfigMap and needs permission to watch the cluster; both are in kube-system.
  - id: q4
    title: Control plane after maintenance
    points: 8
    setup:
      - node: controlplane
        script: setup/q4.sh
        timeoutSeconds: 400
    setupStage: 2
    checks:
      - id: q4-api-ready
        description: the API server reports ready
        type: kubectl
        run: kubectl get --raw /readyz
        expect: { equals: ok }
        weight: 2
        retrySeconds: 120
      - id: q4-components
        description: node controlplane and its etcd, kube-apiserver, kube-controller-manager and kube-scheduler are Ready
        type: kubectl
        run: "{ kubectl get node controlplane -o jsonpath='controlplane={.status.conditions[?(@.type==\"Ready\")].status}{\"\\n\"}'; kubectl -n kube-system get pods -l tier=control-plane -o jsonpath='{range .items[*]}{.metadata.name}={.status.conditions[?(@.type==\"Ready\")].status}{\"\\n\"}{end}' | sort; } | xargs"
        expect: { equals: controlplane=True etcd-controlplane=True kube-apiserver-controlplane=True kube-controller-manager-controlplane=True kube-scheduler-controlplane=True }
        weight: 2
        retrySeconds: 120
      - id: q4-nodes-ready
        description: every node is Ready
        type: kubectl
        run: kubectl get nodes -o jsonpath='{range .items[*]}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}' | sort -u | xargs
        expect: { equals: "True" }
        weight: 1
        retrySeconds: 90
      - id: q4-web-ready
        description: web runs 2 ready replicas
        type: kubectl
        run: kubectl -n ${Q4_NS} get deployment web -o jsonpath='{.spec.replicas}/{.status.readyReplicas}'
        expect: { equals: 2/2 }
        weight: 2
        retrySeconds: 120
      - id: q4-manifests
        description: /etc/kubernetes/manifests holds only the four control plane manifests
        type: ssh
        node: controlplane
        run: ls /etc/kubernetes/manifests | sort | xargs
        expect: { equals: etcd.yaml kube-apiserver.yaml kube-controller-manager.yaml kube-scheduler.yaml }
        weight: 1
    hints:
      - "Start with the symptom: does kubectl answer at all? If it does, kubectl get nodes and kubectl -n kube-system get pods show which component is unhealthy; Pending or missing Pods point at the scheduler or the controller manager."
      - "Without the API, on controlplane: crictl ps -a, then crictl logs <container-id> shows why a static Pod keeps exiting. journalctl -u kubelet shows Pods the kubelet cannot even start."
      - Static Pod manifests live in /etc/kubernetes/manifests; the kubelet restarts a component when its manifest changes. Check every flag, path and image against what exists (ls /etc/kubernetes/pki, crictl images).
      - "If no control plane container runs at all, or controlplane itself is NotReady: systemctl status kubelet, journalctl -u kubelet -n 50, and the paths in /etc/kubernetes/kubelet.conf and /var/lib/kubelet/config.yaml."
  - id: q5
    title: StorageClass ${Q5_NAME}
    points: 5
    checks:
      - id: q5-provisioner
        description: ${Q5_NAME} uses kubernetes.io/no-provisioner
        type: kubectl
        run: kubectl get storageclass ${Q5_NAME} -o jsonpath='{.provisioner}'
        expect: { equals: kubernetes.io/no-provisioner }
        weight: 1
      - id: q5-reclaim
        description: ${Q5_NAME} has reclaim policy ${Q5_RECLAIM}
        type: kubectl
        run: kubectl get storageclass ${Q5_NAME} -o jsonpath='{.reclaimPolicy}'
        expect: { equals: "${Q5_RECLAIM}" }
        weight: 1
      - id: q5-binding
        description: ${Q5_NAME} binds with ${Q5_BINDING}
        type: kubectl
        run: kubectl get storageclass ${Q5_NAME} -o jsonpath='{.volumeBindingMode}'
        expect: { equals: "${Q5_BINDING}" }
        weight: 1
      - id: q5-expand
        description: ${Q5_NAME} allows volume expansion
        type: kubectl
        run: kubectl get storageclass ${Q5_NAME} -o jsonpath='{.allowVolumeExpansion}'
        expect: { equals: "true" }
        weight: 1
      - id: q5-make-default
        description: ${Q5_NAME} is the default StorageClass
        type: kubectl
        run: kubectl get storageclass ${Q5_NAME} -o jsonpath='{.metadata.annotations.storageclass\.kubernetes\.io/is-default-class}'
        expect: { equals: "true" }
        weight: 1
    hints:
      - kubectl explain storageclass lists the fields; there is no kubectl create storageclass, so write the YAML.
      - "allowVolumeExpansion: true is a top-level field of the StorageClass."
      - kubectl annotate storageclass ${Q5_NAME} storageclass.kubernetes.io/is-default-class=true
