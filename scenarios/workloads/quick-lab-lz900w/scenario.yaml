id: quick-lab-lz900w
title: "Quick lab: StatefulSets and DaemonSets"
domain: workloads
difficulty: 2
estimatedMinutes: 7
points: 6
tags: [ statefulset, daemonset, headless, dns, tolerations ]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 30
draft: true
variables:
  Q1_NS: { oneOf: [ stateful, data-tier, quorum, records, kv-store, agents, fleet, node-ops, cluster-svc, storage-ops ] }
  Q1_STS: { oneOf: [ web, db, cache, kv, queue, ledger, search, session ] }
  Q1_DS: { oneOf: [ node-probe, log-agent, net-watch, disk-agent, metrics-agent, trace-agent, node-exporter, audit-agent ] }
tasks:
  - id: q1
    title: DaemonSet ${Q1_DS} on every node
    points: 6
    setup:
      - node: controlplane
        script: setup/q1.sh
        lane: q1
    checks:
      - id: q1-spec
        description: ${Q1_DS} runs httpd:2.4-alpine with label app=${Q1_DS}, requesting 10m CPU and 10Mi memory
        type: kubectl
        run: kubectl -n ${Q1_NS} get daemonset ${Q1_DS} -o jsonpath='{.spec.template.metadata.labels.app} {.spec.template.spec.containers[0].image} {.spec.template.spec.containers[0].resources.requests.cpu} {.spec.template.spec.containers[0].resources.requests.memory}'
        expect: { equals: "${Q1_DS} httpd:2.4-alpine 10m 10Mi" }
        weight: 2
      - id: q1-everywhere
        description: a ready Pod of ${Q1_DS} runs on every node, controlplane included
        type: kubectl
        run: "nodes=$(kubectl get nodes -o name | wc -l); ready=$(kubectl -n ${Q1_NS} get daemonset ${Q1_DS} -o jsonpath='{.status.numberReady}'); cp=$(kubectl -n ${Q1_NS} get pods -l app=${Q1_DS} --field-selector spec.nodeName=controlplane,status.phase=Running -o name | wc -l); [ \"$ready\" = \"$nodes\" ] && [ \"$cp\" -ge 1 ] && echo everywhere || echo \"ready=$ready of $nodes, on controlplane: $cp\""
        expect: { equals: everywhere }
        weight: 3
        retrySeconds: 60
      - id: q1-taint
        description: controlplane keeps its NoSchedule taint
        type: kubectl
        run: kubectl get node controlplane -o jsonpath='{.spec.taints[?(@.key=="node-role.kubernetes.io/control-plane")].effect}'
        expect: { equals: NoSchedule }
        weight: 1
    hints:
      - "kubectl create deployment <name> --image=... --dry-run=client -o yaml gives a start: change the kind to DaemonSet and drop replicas and strategy."
      - kubectl describe node controlplane | grep Taints shows why Pods do not land there.
      - A toleration for node-role.kubernetes.io/control-plane:NoSchedule in the Pod template lets the DaemonSet run on the control plane too.
    recipe: { builder: workload-controllers, parts: [] }
