id: troubleshoot-1
title: Troubleshooting workloads and DNS
domain: workloads
difficulty: 2
estimatedMinutes: 33
points: 26
tags: [ troubleshooting, scheduling, resourcequota, limitrange, affinity, pods, deployment, dns, coredns, service, configmap, secret, volumes, security-context ]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 30
variables:
  Q1_NS: { oneOf: [ batch, reports, analytics ] }
  Q1_APP: { oneOf: [ worker, renderer, indexer ] }
  Q1_FAULT: { oneOf: [ quota-pods, quota-limits, limitrange-max, node-affinity, priority-class ], hidden: true }
  Q2_NS: { oneOf: [ retail, media, portal ] }
  Q2_APP: { oneOf: [ storefront, ledger, checkout ] }
  Q2_FAULT: { oneOf: [ oom-killed, image-pull, bad-command, configmap-key, liveness-port, readiness-path, requests-too-large, node-selector ], hidden: true }
  Q3_NS: { oneOf: [ shop, intranet, search ] }
  Q3_FAULT: { oneOf: [ corefile-typo, scaled-to-zero, cluster-domain, kube-dns-selector, client-dns-policy ], hidden: true }
  Q4_NS: { oneOf: [ brochure, docs, landing ] }
  Q4_APP: { oneOf: [ site, welcome, promo ] }
  Q4_FAULT: { oneOf: [ configmap-volume-missing, secret-items-key, mount-path, run-as-non-root, readonly-root ], hidden: true }
tasks:
  - id: q1
    title: Deployment ${Q1_APP} not running
    points: 5
    setup:
      - node: controlplane
        script: setup/q1.sh
        timeoutSeconds: 400
        lane: q1
    checks:
      - id: q1-ready
        description: ${Q1_APP} has 2 ready replicas
        type: kubectl
        run: kubectl -n ${Q1_NS} get deployment ${Q1_APP} -o jsonpath='{.status.readyReplicas}/{.status.updatedReplicas}/{.status.replicas}'
        expect: { equals: 2/2/2 }
        weight: 3
        retrySeconds: 60
      - id: q1-spec
        description: replicas, image and requests match the spec
        type: kubectl
        run: kubectl -n ${Q1_NS} get deployment ${Q1_APP} -o jsonpath='{.spec.replicas} {.spec.template.spec.containers[0].image} {.spec.template.spec.containers[0].resources.requests.cpu} {.spec.template.spec.containers[0].resources.requests.memory}'
        expect: { equals: 2 nginx:1.27-alpine 100m 64Mi }
        weight: 1
      - id: q1-same-deployment
        description: ${Q1_APP} was not deleted or recreated
        type: kubectl
        run: "[ \"$(kubectl -n ${Q1_NS} get deployment ${Q1_APP} -o jsonpath='{.metadata.uid}')\" = \"$(cat /var/tmp/cka-q1.uid)\" ] && echo same || echo recreated"
        expect: { equals: same }
        weight: 1
    hints:
      - "kubectl -n ${Q1_NS} get deployment,replicaset,pods -o wide: are Pods missing altogether, or do they exist and stay Pending?"
      - "Missing Pods were refused when the ReplicaSet tried to create them: kubectl -n ${Q1_NS} describe replicaset -l app=${Q1_APP} shows the FailedCreate reason."
      - "Pending Pods were never placed: kubectl -n ${Q1_NS} describe pod <pod> shows the scheduler's reason under Events."
      - What does the namespace enforce, and what does the Pod template ask for? kubectl -n ${Q1_NS} get all,resourcequota,limitrange and kubectl -n ${Q1_NS} get deployment ${Q1_APP} -o yaml.
  - id: q2
    title: Unhealthy Deployment ${Q2_APP}
    points: 8
    setup:
      - node: controlplane
        script: setup/q2.sh
        timeoutSeconds: 400
        lane: q2
    checks:
      - id: q2-ready
        description: ${Q2_APP} has 2 ready replicas
        type: kubectl
        run: kubectl -n ${Q2_NS} get deployment ${Q2_APP} -o jsonpath='{.status.readyReplicas}/{.status.updatedReplicas}/{.status.replicas}'
        expect: { equals: 2/2/2 }
        weight: 2
        retrySeconds: 60
      - id: q2-stable
        description: ${Q2_APP}'s Pods do not restart over 20 seconds
        type: kubectl
        run: r() { kubectl -n ${Q2_NS} get pods -l app=${Q2_APP} --field-selector=status.phase=Running -o jsonpath='{range .items[*]}{.metadata.name}={.status.containerStatuses[0].restartCount} {end}'; }; a=$(r); sleep 20; b=$(r); [ -n "$a" ] && [ "$a" = "$b" ] && echo stable || echo restarting
        expect: { equals: stable }
        weight: 1
        retrySeconds: 60
      - id: q2-serves
        description: ${Q2_APP} serves HTTP on port 80
        type: kubectl
        run: kubectl -n ${Q2_NS} exec deployment/${Q2_APP} -- wget -qO- -T 3 http://localhost:80/
        expect: { contains: nginx }
        weight: 1
      - id: q2-spec-resources
        description: ${Q2_APP} keeps its image, and requests and limits for CPU and memory
        type: kubectl
        run: kubectl -n ${Q2_NS} get deployment ${Q2_APP} -o jsonpath='{.spec.template.spec.containers[0].image} {.spec.template.spec.containers[0].resources.requests.cpu} {.spec.template.spec.containers[0].resources.requests.memory} {.spec.template.spec.containers[0].resources.limits.cpu} {.spec.template.spec.containers[0].resources.limits.memory}'
        expect: { matches: ^nginx:1\.27-alpine \S+ \S+ \S+ \S+$ }
        weight: 1
      - id: q2-spec-probes
        description: ${Q2_APP} keeps a readiness and a liveness probe
        type: kubectl
        run: c='{.spec.template.spec.containers[0]'; r=$(kubectl -n ${Q2_NS} get deployment ${Q2_APP} -o jsonpath="$c.readinessProbe}"); l=$(kubectl -n ${Q2_NS} get deployment ${Q2_APP} -o jsonpath="$c.livenessProbe}"); echo "$([ -n "$r" ] && echo readiness) $([ -n "$l" ] && echo liveness)"
        expect: { equals: readiness liveness }
        weight: 1
      - id: q2-spec-config
        description: the running Pods read APP_MODE=production from ConfigMap ${Q2_APP}-config
        type: kubectl
        run: echo "$(kubectl -n ${Q2_NS} get deployment ${Q2_APP} -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="APP_MODE")].valueFrom.configMapKeyRef.name}') $(kubectl -n ${Q2_NS} exec deployment/${Q2_APP} -- printenv APP_MODE 2>/dev/null)"
        expect: { equals: "${Q2_APP}-config production" }
        weight: 1
        retrySeconds: 30
      - id: q2-same-deployment
        description: ${Q2_APP} was not deleted or recreated
        type: kubectl
        run: "[ \"$(kubectl -n ${Q2_NS} get deployment ${Q2_APP} -o jsonpath='{.metadata.uid}')\" = \"$(cat /var/tmp/cka-q2.uid)\" ] && echo same || echo recreated"
        expect: { equals: same }
        weight: 1
    hints:
      - "kubectl -n ${Q2_NS} get deployment,replicaset,pods -l app=${Q2_APP} -o wide: are Pods missing, Pending, crashing, running but not ready, or is an old and a new ReplicaSet stuck side by side?"
      - "kubectl -n ${Q2_NS} describe pod <pod>: the container state, the last termination reason and the Events usually name the problem."
      - kubectl -n ${Q2_NS} logs <pod> --previous shows why a crashed container exited; kubectl -n ${Q2_NS} rollout status deployment/${Q2_APP} shows whether a rollout is progressing.
      - "kubectl -n ${Q2_NS} get deployment ${Q2_APP} -o yaml: read the strategy, the Pod template and its references (images, probes, resources, ConfigMap keys) critically."
  - id: q3
    title: Name resolution broken
    points: 7
    setup:
      - node: controlplane
        script: setup/q3.sh
        timeoutSeconds: 400
    setupStage: 1
    checks:
      - id: q3-short-name
        description: client gets the nginx page from http://web
        type: kubectl
        run: kubectl -n ${Q3_NS} exec client -- wget -qO- -T 3 http://web
        expect: { contains: nginx }
        weight: 2
        retrySeconds: 60
      - id: q3-fqdn
        description: client resolves web.${Q3_NS}.svc.cluster.local to the Service IP
        type: kubectl
        run: ip=$(kubectl -n ${Q3_NS} get svc web -o jsonpath='{.spec.clusterIP}'); kubectl -n ${Q3_NS} exec client -- nslookup -type=a web.${Q3_NS}.svc.cluster.local 2>/dev/null | grep -qw "$ip" && echo resolves || echo fails
        expect: { equals: resolves }
        weight: 2
        retrySeconds: 60
      - id: q3-coredns-ready
        description: CoreDNS runs 2 ready replicas
        type: kubectl
        run: kubectl -n kube-system get deployment coredns -o jsonpath='{.status.readyReplicas}'
        expect: { equals: "2" }
        weight: 1
        retrySeconds: 60
      - id: q3-corefile
        description: The Corefile serves cluster.local and forwards to /etc/resolv.conf
        type: kubectl
        run: kubectl -n kube-system get configmap coredns -o jsonpath='{.data.Corefile}' | grep -cE 'kubernetes cluster\.local |forward \. /etc/resolv\.conf'
        expect: { equals: "2" }
        weight: 1
      - id: q3-kube-dns-service
        description: Service kube-dns selects the CoreDNS Pods
        type: kubectl
        run: kubectl -n kube-system get svc kube-dns -o jsonpath='{.spec.selector.k8s-app}'
        expect: { equals: kube-dns }
        weight: 1
    hints:
      - "Is it DNS at all? From client, compare nslookup web with nslookup web.${Q3_NS}.svc.cluster.local, and both with a lookup sent straight to a CoreDNS Pod IP: nslookup <name> <pod-ip>."
      - "Work outwards from the client: kubectl -n ${Q3_NS} exec client -- cat /etc/resolv.conf, then kubectl -n kube-system get svc,endpointslices -l k8s-app=kube-dns, then the CoreDNS Pods."
      - "CoreDNS Pods that are missing, crashing or never ready say why: kubectl -n kube-system get deploy,pods -l k8s-app=kube-dns, then describe and logs."
      - CoreDNS reads its configuration from a ConfigMap and needs permission to watch the cluster; both are in kube-system.
  - id: q4
    title: Deployment ${Q4_APP} does not serve its page
    points: 6
    setup:
      - node: controlplane
        script: setup/q4.sh
        timeoutSeconds: 400
        lane: q4
    checks:
      - id: q4-ready
        description: ${Q4_APP} has 2 ready replicas
        type: kubectl
        run: kubectl -n ${Q4_NS} get deployment ${Q4_APP} -o jsonpath='{.status.readyReplicas}/{.status.updatedReplicas}/{.status.replicas}'
        expect: { equals: 2/2/2 }
        weight: 2
        retrySeconds: 60
      - id: q4-page
        description: ${Q4_APP} serves the page from ${Q4_APP}-content
        type: kubectl
        run: kubectl -n ${Q4_NS} exec deployment/${Q4_APP} -- wget -qO- -T 3 http://localhost:80/
        expect: { contains: "${Q4_APP} is up" }
        weight: 2
        retrySeconds: 30
      - id: q4-token
        description: the token from ${Q4_APP}-secret is readable at /etc/${Q4_APP}/token
        type: kubectl
        run: kubectl -n ${Q4_NS} exec deployment/${Q4_APP} -- cat /etc/${Q4_APP}/token
        expect: { equals: "s3cr3t-${Q4_APP}" }
        weight: 1
        retrySeconds: 30
      - id: q4-spec-volumes
        description: the volumes still come from a ConfigMap and the Secret
        type: kubectl
        run: kubectl -n ${Q4_NS} get deployment ${Q4_APP} -o jsonpath='{.spec.template.spec.containers[0].image} {.spec.template.spec.volumes[?(@.configMap)].configMap.name} {.spec.template.spec.volumes[?(@.secret)].secret.secretName}'
        expect: { matches: "^nginx:1.27-alpine \\S+ ${Q4_APP}-secret$" }
        weight: 1
    hints:
      - "kubectl -n ${Q4_NS} get pods -l app=${Q4_APP}: are the Pods Pending, ContainerCreating, crashing, or running but not ready?"
      - "kubectl -n ${Q4_NS} describe pod <pod>: the Events name mount and container start errors."
      - kubectl -n ${Q4_NS} logs <pod> (or --previous) shows why nginx exits; kubectl -n ${Q4_NS} exec deploy/${Q4_APP} -- ls -l /usr/share/nginx/html /etc/${Q4_APP} shows what a running container really sees.
      - Compare the volumes and volumeMounts of the Deployment with the ConfigMaps and Secrets that exist and the keys they hold; check the ConfigMap content too, not only its name.
