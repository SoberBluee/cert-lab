      - node: controlplane
        script: setup/q14.sh
        lane: q14
    checks:
      - id: q14-deployment
        description: Deployment ${Q14_APP} runs 2 ready replicas in ${Q14_APP}-dev, as the patch asks
        type: kubectl
        run: kubectl -n ${Q14_APP}-dev get deployment ${Q14_APP} -o jsonpath='{.status.readyReplicas}'
        expect: { equals: "2" }
        weight: 2
        retrySeconds: 90
      - id: q14-configmap
        description: ConfigMap ${Q14_APP}-settings exists in ${Q14_APP}-dev
        type: kubectl
        run: kubectl -n ${Q14_APP}-dev get configmap ${Q14_APP}-settings -o jsonpath='{.data.MODE}'
        expect: { equals: dev }
        weight: 1
      - type: ssh
        node: controlplane
        id: q14-builds
        description: kubectl kustomize /opt/course/kustomize/${Q14_APP}-app builds
        run: kubectl kustomize /opt/course/kustomize/${Q14_APP}-app >/dev/null 2>&1 && echo builds || echo broken
        expect: { equals: builds }
        weight: 2
      - type: ssh
        node: controlplane
        id: q14-files-kept
        description: only kustomization.yaml was changed
        run: sha256sum --quiet -c /root/.cka-kustomize-${Q14_APP}-app.sums >/dev/null 2>&1 && echo unchanged || echo changed
        expect: { equals: unchanged }
