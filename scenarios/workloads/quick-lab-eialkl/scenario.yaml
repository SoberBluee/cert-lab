      - "Split the path into hops and test each one from ${Q9_CLIENT}: does the name resolve, does the Service IP answer, does a Pod IP answer? kubectl -n ${Q9_NS} get svc,endpointslices,pods -o wide gives you the addresses."
      - "kubectl -n ${Q9_NS} describe svc ${Q9_APP} and kubectl -n ${Q9_NS} get endpointslices: an empty or not-ready endpoint list sends you to the Pods; a healthy one sends you further along the path."
      - "Compare what the Service selects and forwards to with what the Pods really carry and listen on: kubectl -n ${Q9_NS} get pods --show-labels and kubectl -n ${Q9_NS} get deployment ${Q9_APP} -o yaml."
      - "When the namespace looks right, look at what sits between the client and the Pods: NetworkPolicies, and the node component that turns Service IPs into Pod IPs (kubectl -n kube-system get ds,pods)."
