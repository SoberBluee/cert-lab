        retrySeconds: 180
      - id: q17-vpa-bounds
        description: web is bounded to at least ${Q17_BOUNDS_MINCPU} CPU and at most ${Q17_BOUNDS_MAXMEM} memory
        type: kubectl
        run: kubectl -n ${Q17_NS} get vpa ${Q17_NAME}-vpa -o jsonpath='{.spec.resourcePolicy.containerPolicies[?(@.containerName=="web")].minAllowed.cpu}/{.spec.resourcePolicy.containerPolicies[?(@.containerName=="web")].maxAllowed.memory}'
        expect: { equals: "${Q17_BOUNDS_MINCPU}/${Q17_BOUNDS_MAXMEM}" }
        weight: 1
      - id: q17-vpa-mode
        description: ${Q17_NAME}-vpa targets Deployment ${Q17_NAME} and switched away from mode ${Q17_MODE}
        type: kubectl
        run: kubectl -n ${Q17_NS} get vpa ${Q17_NAME}-vpa -o jsonpath='{.spec.targetRef.kind}/{.spec.targetRef.name}/{.spec.updatePolicy.updateMode}'
        expect: { matches: "^Deployment/${Q17_NAME}/(Recreate|Initial)$", notContains: "/${Q17_MODE}" }
