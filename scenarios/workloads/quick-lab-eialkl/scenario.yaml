    setupStage: 2
    checks:
      - id: q8-cordoned
        description: exactly one worker is cordoned
        type: kubectl
        run: kubectl get nodes -l '!node-role.kubernetes.io/control-plane' -o jsonpath='{range .items[*]}{.spec.unschedulable}{"\n"}{end}' | grep -c '^true$' || true
        expect: { equals: "1" }
        weight: 2
      - id: q8-right-node
        description: the cordoned worker is the one labelled maintenance=due
        type: kubectl
        run: kubectl get nodes -l maintenance=due -o jsonpath='{range .items[*]}{.spec.unschedulable}{end}'
        expect: { equals: "true" }
        weight: 2
      - id: q8-empty
        description: no Pod of ${Q8_NS} remains on a cordoned worker
        type: kubectl
        run: kubectl -n ${Q8_NS} get pods -o jsonpath='{range .items[*]}{.spec.nodeName}{"\n"}{end}' | sort -u | xargs -I{} kubectl get node {} -o jsonpath='{.spec.unschedulable}{"\n"}' | grep -c '^true$' || true
        expect: { equals: "0" }
        weight: 2
        retrySeconds: 60
      - id: q8-ready
        description: ${Q8_APP} still has 2 ready replicas
        type: kubectl
        run: kubectl -n ${Q8_NS} get deployment ${Q8_APP} -o jsonpath='{.status.readyReplicas}'
        expect: { equals: "2" }
        weight: 2
        retrySeconds: 120
    hints:
      - kubectl get nodes -l maintenance=due names the worker; kubectl -n ${Q8_NS} get pods -o wide shows what runs on it.
      - "kubectl drain <node> --ignore-daemonsets reports every Pod it will not evict, and why: read each line. Some blockers only need a flag; others need a change."
      - "Evictions respect PodDisruptionBudgets: kubectl -n ${Q8_NS} get pdb shows ALLOWED DISRUPTIONS."
      - "An evicted Pod is recreated by its controller: if a replacement stays Pending, kubectl -n ${Q8_NS} describe pod says what keeps it off the other nodes."
