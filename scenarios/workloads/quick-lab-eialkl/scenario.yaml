      - "kubectl -n ${Q15_NS} create secret generic ${Q15_ENV_OBJ} --from-literal=${Q15_ENV_KEY}=${Q15_ENV_VALUE}; then env: [{name: ${Q15_ENV_KEY}, valueFrom: {secretKeyRef: {name: ${Q15_ENV_OBJ}, key: ${Q15_ENV_KEY}}}}]"
