id: quick-lab-eialkl
title: Full mock exam
domain: workloads
difficulty: 3
estimatedMinutes: 120
points: 111
tags: [ troubleshooting, admission, resourcequota, limitrange, pod-security, webhook, pods, deployment, layered, pv, labels, claim, node-affinity, rbac, serviceaccount, role, rolebinding, kubeconfig, contexts, certificates, cidr, kube-proxy, cni, static-pod, scheduling, node, taints, kubelet, crd, operator, kubectl-explain, helm, drain, pdb, disruption, service, endpoints, networkpolicy, control-plane, kube-scheduler, kube-controller-manager, loadbalancer, endpointslice, kubectl-top, logs, sort-by, metrics-server, qos, crictl, events, api-resources, pvc, consumer-pod, delete-keep-data, kustomize, overlays, patches, pod, env, resources, placement, coredns, dns, corefile, vpa, autoscaling, bounds, switch-mode ]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 60
variables:
  Q1_NS: { oneOf: [ batch, tenant-a, tenant-b, sandbox, staging, analytics, reports, ingest, team-blue, team-red ] }
  Q1_APP: { oneOf: [ worker, ingest, reporter, indexer, exporter, crawler, mailer, resizer, uploader, digest ] }
  Q1_FAULT: { oneOf: [ quota-pods, quota-limits, limitrange-max, limitrange-min, pod-security, webhook, mutating-webhook, webhook-object-selector ], hidden: true }
  Q2_NS: { oneOf: [ retail, media, portal, shop, catalog, orders, content, store, frontend, apps ] }
  Q2_APP: { oneOf: [ storefront, ledger, checkout, cart, catalog, inventory, payments, search, recommend, notify ] }
  Q2_FAULT: { oneOf: [ init-container-stuck, readiness-path ], hidden: true }
  Q2_FAULT_2: { oneOf: [ requests-too-large, node-selector ], hidden: true }
  Q3_NAME: { oneOf: [ data-pv, logs-pv, media-pv, cache-pv, backup-pv, assets-pv, db-pv, scratch-pv, shared-pv, archive-pv ] }
  Q3_CAPACITY: { oneOf: [ 1Gi, 2Gi, 5Gi ] }
  Q3_ACCESS: { oneOf: [ ReadWriteOnce, ReadWriteMany, ReadOnlyMany ] }
  Q3_RECLAIM: { oneOf: [ Retain, Delete ] }
  Q3_LABEL_TIER: { oneOf: [ premium, standard, archive, gold, silver, bronze, fast, cold, hot, backup ] }
  Q3_CLAIM_NS: { oneOf: [ vault, records, ledger, storage, volumes, persist, data-lab, files, archive-ns, claims ] }
  Q3_AFFINITY_NODE: { oneOf: [ worker-1, worker-2 ] }
  Q4_NS: { oneOf: [ monitoring, audit, reports, observe, security, compliance, metrics, logging, ops, sre ] }
  Q4_APP: { oneOf: [ inventory, watcher, auditor, scanner, collector, reporter, agent, probe, sentinel, inspector ] }
  Q4_FAULT: { oneOf: [ role-verb, role-resource, role-api-group, binding-subject-ns, binding-role-ref, binding-subject-user, wrong-sa, automount-off, pod-automount-off ], hidden: true }
  Q5_USER: { oneOf: [ auditor, ops-lead, sre-oncall, release-mgr, qa-lead, sec-review, billing-ops, data-eng ] }
  Q6_NS: { oneOf: [ spread, ha, replicas, zones, fleet-apps, placement, balance, workers-ns, rack, edge ] }
  Q6_FAULT: { oneOf: [ cordoned, taint-noschedule, taint-noexecute, label-removed, max-pods ], hidden: true }
  Q6_NODE: { oneOf: &a1 [ worker-1, worker-2 ], hidden: true }
  Q7_NS: { oneOf: [ shop, orders, billing, inventory, crm, ledger, payments, sales, reports, catalog ] }
  Q8_NS: { oneOf: [ maintain, fleet, ops, upgrade, rolling, cluster-ops, node-ops, infra, platform, sre ] }
  Q8_APP: { oneOf: [ checkout, cart, orders, payments, inventory, shipping, notify, search, catalog, loyalty ] }
  Q8_FAULT: { oneOf: [ pdb-min-available, pdb-max-unavailable-0, pinned-node-selector, replica-anti-affinity, bare-pod, emptydir-pod ], hidden: true }
  Q8_NODE: { oneOf: *a1, hidden: true }
  Q9_NS: { oneOf: [ store, edge, api, shop, retail, checkout, cdn, mesh, traffic, front ] }
  Q9_APP: { oneOf: [ web, backend, gateway, api, cart, catalog, auth, proxy, orders, payments ] }
  Q9_CLIENT: { oneOf: [ client, shell, toolbox, tester, debugger, checker, caller, consumer, runner, probe ] }
  Q9_FAULT: { oneOf: [ selector-mismatch, target-port, named-port, network-policy, not-ready, selector-extra-label, service-port, service-protocol, kube-proxy-kubeconfig, selector-cleared, readiness-https, readiness-port-number, egress-network-policy, service-externalname, kube-proxy-config-mode ], hidden: true }
  Q10_NS: { oneOf: [ ops, core, platform, controlplane, etcd-lab, apiserver, scheduler, controller, cluster, mgmt ] }
  Q10_FAULT: { oneOf: [ scheduler-missing-file, controller-manager-missing-file, scheduler-command, scheduler-image-tag, scheduler-manifest-removed, scheduler-manifest-yaml, controller-manager-command ], hidden: true }
  Q10_SCHEDULER_FILE: { oneOf: [ kubeconfig, config ], hidden: true }
  Q10_CM_FILE: { oneOf: [ kubeconfig, service-account-private-key-file ], hidden: true }
  Q11_NS: { oneOf: [ edge, legacy, bridge, gateway-ns, ingress-ns, public, partner, external, hybrid, dmz ] }
  Q11_NODEPORT: { oneOf: [ 31555, 31080, 30999, 32010, 30777, 31234 ] }
  Q12_NS: { oneOf: [ perf, telemetry, insights, observe, usage, capacity, watchtower, signals, probe-ns, stats ] }
  Q13_NS: { oneOf: [ billing, orders-app, photo-lib, storage, data-lab, persist, media, files, volumes, claims ] }
  Q13_NAME: { oneOf: [ orders, invoices, photos, uploads, archive, assets, db-data, cache, logs, scratch ] }
  Q13_SIZE: { oneOf: [ 100Mi, 500Mi, 1Gi ] }
  Q13_ACCESS: { oneOf: [ ReadWriteOnce, ReadWriteMany ] }
  Q13_POD_MOUNT: { oneOf: [ /data, /srv/app, /var/lib/app, /mnt/data, /opt/app/data, /var/storage, /home/app/data, /storage, /var/lib/data, /mnt/vol ] }
  Q14_APP: { oneOf: [ shop, billing, ledger, portal, search, notify, catalog, reports, gateway, profile ] }
  Q15_NS: { oneOf: [ apps, jobs, sandbox, workloads, demo, lab, temp, scratch, tools, debug ] }
  Q15_NAME: { oneOf: [ worker, logger, toolbox, frontend, backend, database, cache, queue, scheduler, monitor, gateway, proxy, client, agent, runner ] }
  Q15_IMAGE: { oneOf: [ busybox:1.36, busybox:1.37, nginx:1.28-alpine, httpd:2.4-alpine, alpine:3.20 ] }
  Q15_ENV_OBJ: { oneOf: [ app-config, app-settings, runtime-env, feature-flags, app-secrets, env-store, service-config, workload-env, runtime-flags, app-params ] }
  Q15_ENV_KEY: { oneOf: [ LOG_LEVEL, MODE, REGION, APP_ENV, CLUSTER, STAGE, FEATURE_FLAG, TZ, ROLE, COLOR ] }
  Q15_ENV_VALUE: { oneOf: [ debug, info, warn, error, prod, staging, canary, eu-west, us-east, primary ] }
  Q15_RES_CPU: { oneOf: [ 50m, 100m, 150m ] }
  Q15_RES_MEMORY: { oneOf: [ 128Mi, 256Mi, 512Mi ] }
  Q15_PLACE_NODE: { oneOf: [ worker-1, worker-2 ] }
  Q16_NS: { oneOf: [ lookup, resolver, names, dns-lab, records, zones, directory, catalog, registry, gateway-ns ] }
  Q16_DOMAIN: { oneOf: [ cka.lab, exam.lab, corp.lab, k8s.lab ] }
  Q16_ZONE: { oneOf: [ corp.internal, office.internal, hq.internal, branch.internal ] }
  Q16_HOST: { oneOf: [ legacy-db.internal, old-erp.internal, mainframe.internal, billing-db.internal ] }
  Q16_IP: { oneOf: [ 198.51.100.20, 198.51.100.37, 198.51.100.54, 198.51.100.71 ] }
  Q17_NS: { oneOf: [ shop, billing, reports, rightsizing, finops, workloads, compute, media, batch, services ] }
  Q17_NAME: { oneOf: [ web, api, worker, renderer, encoder, processor, analyzer, indexer, compiler, transformer ] }
  Q17_MODE: { oneOf: [ Off, Initial, Recreate ] }
  Q17_BOUNDS_MINCPU: { oneOf: [ 25m, 50m ] }
  Q17_BOUNDS_MAXMEM: { oneOf: [ 256Mi, 512Mi ] }
setup:
  - node: controlplane
    script: setup/contexts.sh
solution:
  - node: worker-1
    script: setup/q6-solution.sh
  - node: worker-2
    script: setup/q6-solution-2.sh
  - node: controlplane
    script: solution.sh
    timeoutSeconds: 1800
tasks:
  - id: q1
    title: New Pods rejected in ${Q1_NS}
    points: 5
    context: k8s-data
    setup:
      - node: controlplane
        script: setup/q1.sh
        timeoutSeconds: 400
        lane: q1
    checks:
      - id: q1-ready
        description: ${Q1_APP} runs 2 ready replicas
        type: kubectl
        run: kubectl -n ${Q1_NS} get deployment ${Q1_APP} -o jsonpath='{.status.readyReplicas}/{.status.replicas}'
        expect: { equals: 2/2 }
        weight: 4
        retrySeconds: 90
      - id: q1-unchanged
        description: Deployment ${Q1_APP} was not changed or recreated
        type: kubectl
        run: "[ \"$(kubectl -n ${Q1_NS} get deployment ${Q1_APP} -o jsonpath='{.metadata.uid} {.spec.replicas} {.spec.template.spec}')\" = \"$(cat /var/tmp/cka-q1.deploy)\" ] && echo unchanged || echo changed"
        expect: { equals: unchanged }
        weight: 1
    hints:
      - "kubectl -n ${Q1_NS} get deployment,replicaset,pods: no Pods at all, or fewer than wanted, means they were refused before they existed."
      - "kubectl -n ${Q1_NS} describe replicaset -l app=${Q1_APP}: the FailedCreate event quotes the refusal word for word."
      - That message names whatever refused the Pod. Find that object, whether it lives in the namespace, on the namespace or cluster-wide, and read what it enforces.
      - "Admission webhooks are cluster-scoped: kubectl get validatingwebhookconfiguration,mutatingwebhookconfiguration, then -o yaml to see which namespaces and objects each one selects, which Service it calls, and what happens when that call fails."
    recipe: { category: admission }
  - id: q2
    title: Unhealthy Deployment ${Q2_APP}
    points: 8
    context: k8s-gamma
    setup:
      - node: controlplane
        script: setup/q2.sh
        timeoutSeconds: 800
        lane: q2
    checks:
      - id: q2-ready
        description: ${Q2_APP} has 2 ready replicas
        type: kubectl
        run: kubectl -n ${Q2_NS} get deployment ${Q2_APP} -o jsonpath='{.status.readyReplicas}/{.status.updatedReplicas}/{.status.replicas}'
        expect: { equals: 2/2/2 }
        weight: 2
        retrySeconds: 60
      - id: q2-stable
        description: ${Q2_APP}'s Pods do not restart over 20 seconds
        type: kubectl
        run: r() { kubectl -n ${Q2_NS} get pods -l app=${Q2_APP} --field-selector=status.phase=Running -o jsonpath='{range .items[*]}{.metadata.name}={.status.containerStatuses[0].restartCount} {end}'; }; a=$(r); sleep 20; b=$(r); [ -n "$a" ] && [ "$a" = "$b" ] && echo stable || echo restarting
        expect: { equals: stable }
        weight: 1
        retrySeconds: 60
      - id: q2-serves
        description: ${Q2_APP} serves HTTP on port 80
        type: kubectl
        run: kubectl -n ${Q2_NS} exec deployment/${Q2_APP} -- wget -qO- -T 3 http://localhost:80/
        expect: { contains: nginx }
        weight: 1
      - id: q2-spec-resources
        description: ${Q2_APP} keeps its image, and requests and limits for CPU and memory
        type: kubectl
        run: kubectl -n ${Q2_NS} get deployment ${Q2_APP} -o jsonpath='{.spec.template.spec.containers[0].image} {.spec.template.spec.containers[0].resources.requests.cpu} {.spec.template.spec.containers[0].resources.requests.memory} {.spec.template.spec.containers[0].resources.limits.cpu} {.spec.template.spec.containers[0].resources.limits.memory}'
        expect: { matches: ^nginx:1\.27-alpine \S+ \S+ \S+ \S+$ }
        weight: 1
      - id: q2-spec-probes
        description: ${Q2_APP} keeps a readiness and a liveness probe
        type: kubectl
        run: c='{.spec.template.spec.containers[0]'; r=$(kubectl -n ${Q2_NS} get deployment ${Q2_APP} -o jsonpath="$c.readinessProbe}"); l=$(kubectl -n ${Q2_NS} get deployment ${Q2_APP} -o jsonpath="$c.livenessProbe}"); echo "$([ -n "$r" ] && echo readiness) $([ -n "$l" ] && echo liveness)"
        expect: { equals: readiness liveness }
        weight: 1
      - id: q2-spec-config
        description: the running Pods read APP_MODE=production from ConfigMap ${Q2_APP}-config
        type: kubectl
        run: echo "$(kubectl -n ${Q2_NS} get deployment ${Q2_APP} -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="APP_MODE")].valueFrom.configMapKeyRef.name}') $(kubectl -n ${Q2_NS} exec deployment/${Q2_APP} -- printenv APP_MODE 2>/dev/null)"
        expect: { equals: "${Q2_APP}-config production" }
        weight: 1
        retrySeconds: 30
      - id: q2-same-deployment
        description: ${Q2_APP} was not deleted or recreated
        type: kubectl
        run: "[ \"$(kubectl -n ${Q2_NS} get deployment ${Q2_APP} -o jsonpath='{.metadata.uid}')\" = \"$(cat /var/tmp/cka-q2.uid)\" ] && echo same || echo recreated"
        expect: { equals: same }
        weight: 1
    hints:
      - "kubectl -n ${Q2_NS} get deployment,replicaset,pods -l app=${Q2_APP} -o wide: are Pods missing, Pending, crashing, running but not ready, or is an old and a new ReplicaSet stuck side by side?"
      - "kubectl -n ${Q2_NS} describe pod <pod>: the container state, the last termination reason and the Events usually name the problem."
      - kubectl -n ${Q2_NS} logs <pod> --previous shows why a crashed container exited; kubectl -n ${Q2_NS} rollout status deployment/${Q2_APP} shows whether a rollout is progressing.
      - "kubectl -n ${Q2_NS} get deployment ${Q2_APP} -o yaml: read the strategy, the Pod template and its references (images, probes, resources, ConfigMap keys) critically."
    recipe: { category: pods }
  - id: q3
    title: PersistentVolume ${Q3_NAME}
    points: 8
    context: k8s-delta
    setup:
      - node: controlplane
        script: setup/q3.sh
        lane: q3
    checks:
      - id: q3-capacity
        description: ${Q3_NAME} holds ${Q3_CAPACITY}
        type: kubectl
        run: kubectl get pv ${Q3_NAME} -o jsonpath='{.spec.capacity.storage}'
        expect: { equals: "${Q3_CAPACITY}" }
        weight: 1
      - id: q3-spec
        description: ${Q3_NAME} is ${Q3_ACCESS}, class manual, at /srv/${Q3_NAME}
        type: kubectl
        run: kubectl get pv ${Q3_NAME} -o jsonpath='{.spec.accessModes[0]}/{.spec.storageClassName}/{.spec.hostPath.path}'
        expect: { equals: "${Q3_ACCESS}/manual//srv/${Q3_NAME}" }
        weight: 1
      - id: q3-reclaim
        description: ${Q3_NAME} has reclaim policy ${Q3_RECLAIM}
        type: kubectl
        run: kubectl get pv ${Q3_NAME} -o jsonpath='{.spec.persistentVolumeReclaimPolicy}'
        expect: { equals: "${Q3_RECLAIM}" }
        weight: 1
      - id: q3-label
        description: ${Q3_NAME} is labelled tier=${Q3_LABEL_TIER}
        type: kubectl
        run: kubectl get pv ${Q3_NAME} -o jsonpath='{.metadata.labels.tier}'
        expect: { equals: "${Q3_LABEL_TIER}" }
        weight: 1
      - id: q3-claim-bound
        description: PVC ${Q3_NAME}-claim is Bound to ${Q3_NAME}
        type: kubectl
        run: kubectl -n ${Q3_CLAIM_NS} get pvc ${Q3_NAME}-claim -o jsonpath='{.status.phase}/{.spec.volumeName}'
        expect: { equals: "Bound/${Q3_NAME}" }
        weight: 2
        retrySeconds: 30
      - id: q3-affinity
        description: ${Q3_NAME} is pinned to ${Q3_AFFINITY_NODE}
        type: kubectl
        run: kubectl get pv ${Q3_NAME} -o jsonpath='{.spec.nodeAffinity.required.nodeSelectorTerms[0].matchExpressions[0].key}={.spec.nodeAffinity.required.nodeSelectorTerms[0].matchExpressions[0].values[0]}'
        expect: { equals: "kubernetes.io/hostname=${Q3_AFFINITY_NODE}" }
        weight: 2
    hints:
      - "There is no kubectl create pv: copy a PersistentVolume example from the docs (hostPath) and adjust it."
      - kubectl label pv ${Q3_NAME} tier=${Q3_LABEL_TIER} works too.
      - spec.volumeName on the claim binds it to one named PV. Class, access mode and size must still fit.
      - spec.nodeAffinity.required.nodeSelectorTerms[].matchExpressions[] with key kubernetes.io/hostname, operator In.
    recipe: { builder: pv, parts: [ labels, claim, node-affinity ] }
  - id: q4
    title: ${Q4_APP} cannot list Pods
    points: 6
    context: k8s-dev
    setup:
      - node: controlplane
        script: setup/q4.sh
        timeoutSeconds: 400
        lane: q4
    checks:
      - id: q4-can-list
        description: ${Q4_APP}-sa may list Pods in ${Q4_NS}
        type: kubectl
        run: kubectl auth can-i list pods -n ${Q4_NS} --as=system:serviceaccount:${Q4_NS}:${Q4_APP}-sa
        expect: { equals: yes }
        weight: 2
      - id: q4-logs-200
        description: ${Q4_APP}'s latest call returned 200
        type: kubectl
        run: kubectl -n ${Q4_NS} logs deployment/${Q4_APP} --tail=1
        expect: { equals: "200" }
        weight: 2
        retrySeconds: 60
      - id: q4-spec
        description: ${Q4_APP} runs as ${Q4_APP}-sa, and RoleBinding ${Q4_APP}-reader grants Role ${Q4_APP}-reader to it
        type: kubectl
        run: echo "$(kubectl -n ${Q4_NS} get deployment ${Q4_APP} -o jsonpath='{.spec.template.spec.serviceAccountName}') $(kubectl -n ${Q4_NS} get rolebinding ${Q4_APP}-reader -o jsonpath='{.roleRef.kind}/{.roleRef.name} {.subjects[*].namespace}/{.subjects[*].name}')"
        expect: { equals: "${Q4_APP}-sa Role/${Q4_APP}-reader ${Q4_NS}/${Q4_APP}-sa" }
        weight: 1
      - id: q4-least-privilege
        description: ${Q4_APP}-sa cannot delete Pods or read Secrets
        type: kubectl
        run: echo "$(kubectl auth can-i delete pods -n ${Q4_NS} --as=system:serviceaccount:${Q4_NS}:${Q4_APP}-sa) $(kubectl auth can-i get secrets -n ${Q4_NS} --as=system:serviceaccount:${Q4_NS}:${Q4_APP}-sa)"
        expect: { equals: no no }
        weight: 1
    hints:
      - "kubectl -n ${Q4_NS} logs deployment/${Q4_APP}: a 401, a 403 and a missing token point at different problems. A 403 names the account the API saw."
      - kubectl auth can-i list pods -n ${Q4_NS} --as=system:serviceaccount:${Q4_NS}:<account> answers for any account, without the Pod.
      - "Follow the chain from the Pod to the permission: which ServiceAccount the Pod runs as, which RoleBinding names that exact account, which Role the binding points at, and what that Role allows."
    recipe: { category: rbac }
  - id: q5
    title: Cluster network facts
    points: 6
    context: k8s-lab
    setup:
      - node: controlplane
        script: setup/q5.sh
        lane: q5
    checks:
      - type: ssh
        node: controlplane
        id: q5-pod-cidr
        description: pod-cidr holds the cluster CIDR of the controller manager
        run: want=$(grep -oE -- '--cluster-cidr=[^ "]+' /etc/kubernetes/manifests/kube-controller-manager.yaml | cut -d= -f2); [ -n "$want" ] && [ "$(tr -d '[:space:]' < /opt/course/facts/pod-cidr 2>/dev/null)" = "$want" ] && echo ok || echo "want $want"
        expect: { equals: ok }
        weight: 1
      - type: ssh
        node: controlplane
        id: q5-service-cidr
        description: service-cidr holds the Service range of the API server
        run: want=$(grep -oE -- '--service-cluster-ip-range=[^ "]+' /etc/kubernetes/manifests/kube-apiserver.yaml | cut -d= -f2); [ -n "$want" ] && [ "$(tr -d '[:space:]' < /opt/course/facts/service-cidr 2>/dev/null)" = "$want" ] && echo ok || echo "want $want"
        expect: { equals: ok }
        weight: 1
      - type: ssh
        node: controlplane
        id: q5-dns-ip
        description: dns-ip holds the ClusterIP of kube-dns
        run: want=$(kubectl -n kube-system get service kube-dns -o jsonpath='{.spec.clusterIP}'); [ -n "$want" ] && [ "$(tr -d '[:space:]' < /opt/course/facts/dns-ip 2>/dev/null)" = "$want" ] && echo ok || echo "want $want"
        expect: { equals: ok }
        weight: 1
      - type: ssh
        node: controlplane
        id: q5-proxy-mode
        description: proxy-mode holds the mode kube-proxy reports
        run: want=$(curl -s -m 3 http://127.0.0.1:10249/proxyMode); [ -n "$want" ] && [ "$(tr -d '[:space:]' < /opt/course/facts/proxy-mode 2>/dev/null)" = "$want" ] && echo ok || echo "want $want"
        expect: { equals: ok }
        weight: 1
      - type: ssh
        node: controlplane
        id: q5-cni
        description: cni names the CNI plugin
        run: want=$(jq -r '.plugins[0].type // .type' "/etc/cni/net.d/$(ls /etc/cni/net.d/ | grep -E '\.(conf|conflist|json)$' | sort | head -1)"); [ -n "$want" ] && grep -qiw "$want" /opt/course/facts/cni 2>/dev/null && echo ok || echo "want $want"
        expect: { equals: ok }
        weight: 1
      - type: ssh
        node: controlplane
        id: q5-cni-config
        description: cni-config holds the path of the CNI configuration the runtime loads
        run: want="/etc/cni/net.d/$(ls /etc/cni/net.d/ | grep -E '\.(conf|conflist|json)$' | sort | head -1)"; [ -n "$want" ] && [ "$(tr -d '[:space:]' < /opt/course/facts/cni-config 2>/dev/null)" = "$want" ] && echo ok || echo "want $want"
        expect: { equals: ok }
        weight: 1
    hints:
      - "The control plane components run as static Pods: their flags are in /etc/kubernetes/manifests. kube-controller-manager has --cluster-cidr, kube-apiserver --service-cluster-ip-range."
      - "kube-proxy reports its mode on its metrics port: curl localhost:10249/proxyMode. Its ConfigMap kube-system/kube-proxy has the configured mode, empty meaning the default."
      - The container runtime loads the first file, in lexical order, of /etc/cni/net.d; the plugin type is inside it.
    recipe: { builder: cluster-info, parts: [] }
  - id: q6
    title: One worker takes no Pods
    points: 6
    context: k8s-east
    setup:
      - node: controlplane
        script: setup/q6.sh
      - node: worker-1
        script: setup/q6-2.sh
      - node: worker-2
        script: setup/q6-3.sh
      - node: controlplane
        script: setup/q6-4.sh
        timeoutSeconds: 300
    setupStage: 2
    checks:
      - id: q6-spread
        description: spread runs 2 ready replicas on two different workers
        type: kubectl
        run: echo "$(kubectl -n ${Q6_NS} get deployment spread -o jsonpath='{.status.readyReplicas}') $(kubectl -n ${Q6_NS} get pods -l app=spread --field-selector=status.phase=Running -o jsonpath='{range .items[*]}{.spec.nodeName}{"\n"}{end}' | sort -u | grep -c worker)"
        expect: { equals: 2 2 }
        weight: 3
        retrySeconds: 90
      - id: q6-schedulable
        description: no worker is cordoned or carries a NoSchedule or NoExecute taint
        type: kubectl
        run: kubectl get nodes -l '!node-role.kubernetes.io/control-plane' -o jsonpath='{range .items[*]}{.spec.unschedulable} {range .spec.taints[*]}{.effect} {end}{"\n"}{end}' | grep -cE 'true|NoSchedule|NoExecute' || true
        expect: { equals: "0" }
        weight: 1
        retrySeconds: 30
      - id: q6-capacity
        description: every worker accepts at least 100 Pods
        type: kubectl
        run: kubectl get nodes -l '!node-role.kubernetes.io/control-plane' -o jsonpath='{range .items[*]}{.status.allocatable.pods}{"\n"}{end}' | sort -n | head -1
        expect: { gte: 100 }
        weight: 1
        retrySeconds: 60
      - id: q6-unchanged
        description: Deployment spread was not changed or recreated
        type: kubectl
        run: "[ \"$(kubectl -n ${Q6_NS} get deployment spread -o jsonpath='{.metadata.uid} {.spec.template.spec}')\" = \"$(cat /var/tmp/cka-q6.deploy)\" ] && echo unchanged || echo changed"
        expect: { equals: unchanged }
        weight: 1
    hints:
      - "kubectl -n ${Q6_NS} describe pod <pending-pod>: the scheduler's message counts the nodes and gives the reason it rejected each of them."
      - "kubectl describe node <node> for both workers: Taints, Unschedulable, Labels and Allocatable (including pods) are what the scheduler looks at. Compare the two."
      - kubectl -n ${Q6_NS} get deployment spread -o yaml shows what the Pods require from a node.
      - "Some of what a node offers is set by its kubelet: systemctl cat kubelet shows which configuration file it reads."
