  - id: q16
    title: Forward ${Q16_ZONE} to the company DNS
    points: 6
    context: k8s-prod
    setup:
      - node: controlplane
        script: setup/q16.sh
        timeoutSeconds: 600
        lane: q16
    checks:
      - id: q16-zone
        description: intranet.${Q16_ZONE} resolves to ${Q16_IP}, the company server's answer
        type: kubectl
        run: kubectl -n ${Q16_NS} exec dns-test -- nslookup intranet.${Q16_ZONE} 2>/dev/null | grep -qw '${Q16_IP}' && echo resolved || echo unresolved
        expect: { equals: resolved }
        weight: 3
        retrySeconds: 90
      - id: q16-cluster-local
        description: web.${Q16_NS}.svc.cluster.local still resolves to the ClusterIP of web
        type: kubectl
        run: ip=$(kubectl -n ${Q16_NS} get service web -o jsonpath='{.spec.clusterIP}'); [ -n "$ip" ] && kubectl -n ${Q16_NS} exec dns-test -- nslookup web.${Q16_NS}.svc.cluster.local 2>/dev/null | grep -qw "$ip" && echo resolved || echo unresolved
        expect: { equals: resolved }
        weight: 1
        retrySeconds: 90
      - id: q16-upstream-kept
        description: other names still go to the nodes' resolvers
        type: kubectl
        run: kubectl -n kube-system get configmap coredns -o jsonpath='{.data.Corefile}' | grep -qE '^ *forward \. /etc/resolv\.conf' && echo kept || echo changed
        expect: { equals: kept }
        weight: 1
      - id: q16-coredns
        description: CoreDNS runs 2 ready replicas
        type: kubectl
        run: kubectl -n kube-system get deployment coredns -o jsonpath='{.status.readyReplicas}'
        expect: { equals: "2" }
        weight: 1
        retrySeconds: 60
    hints:
      - "kubectl -n corp-dns get service resolver gives the server's address: the forward plugin takes IP addresses, not names."
      - "A Corefile can hold one server block per zone: <zone>:53 { forward . <ip> } next to the .:53 block, which keeps answering everything else."
      - CoreDNS reloads a changed Corefile after a while; kubectl -n kube-system rollout restart deployment/coredns applies it at once, and kubectl -n kube-system logs deploy/coredns shows a Corefile that does not parse.
    recipe: { builder: coredns, parts: [] }
  - id: q17
    title: Right-size ${Q17_NAME}
    points: 6
    context: k8s-batch
    setup:
      - node: controlplane
        script: setup/q17.sh
        lane: q17
    checks:
      - id: q17-vpa-recommends
        description: it recommends resources for container web
        type: kubectl
        run: kubectl -n ${Q17_NS} get vpa ${Q17_NAME}-vpa -o jsonpath='{.status.recommendation.containerRecommendations[?(@.containerName=="web")].target.cpu}' | grep -q . && echo yes || echo no
        expect: { equals: yes }
