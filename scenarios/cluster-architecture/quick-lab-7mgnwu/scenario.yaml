id: quick-lab-7mgnwu
title: "Quick lab: etcd restore"
domain: cluster-architecture
difficulty: 3
estimatedMinutes: 12
points: 7
tags: [ etcd, restore, static-pod ]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 60
draft: true
variables:
  Q1_NS: { oneOf: [ ledger, records, archive, finance, history, audit, vault, snapshots, recovery, state ] }
  Q1_SNAPSHOT: { oneOf: [ /opt/backups/etcd-snapshot.db, /var/backups/etcd.db, /srv/etcd/backup.db, /opt/etcd/restore-snap.db, /mnt/backups/etcd-snap.db, /root/etcd-snapshot.db, /var/lib/etcd-backups/cluster.db, /home/ubuntu/etcd-snap.db ] }
  Q1_DATADIR: { oneOf: [ /var/lib/etcd-restore, /var/lib/etcd-from-backup, /var/lib/etcd-new, /var/lib/etcd-recovered, /var/lib/etcd-rolled-back, /var/lib/etcd-snap, /data/etcd-restore, /opt/etcd-data ] }
solution:
  - node: controlplane
    script: setup/q1-solution.sh
    timeoutSeconds: 900
tasks:
  - id: q1
    title: Restore etcd
    points: 7
    setup:
      - node: controlplane
        script: setup/q1.sh
    checks:
      - id: q1-api
        description: The API server answers
        type: kubectl
        run: kubectl get --raw /readyz
        expect: { equals: ok }
        weight: 1
        retrySeconds: 180
      - id: q1-control-plane
        description: node controlplane is Ready, and etcd, kube-apiserver, kube-controller-manager and kube-scheduler run Ready on it
        type: kubectl
        run: "{ kubectl get node controlplane -o jsonpath='controlplane={.status.conditions[?(@.type==\"Ready\")].status}{\"\\n\"}'; kubectl -n kube-system get pods -l tier=control-plane -o jsonpath='{range .items[*]}{.metadata.name}={.status.conditions[?(@.type==\"Ready\")].status}{\"\\n\"}{end}' | sort; } | xargs"
        expect: { equals: controlplane=True etcd-controlplane=True kube-apiserver-controlplane=True kube-controller-manager-controlplane=True kube-scheduler-controlplane=True }
        weight: 1
        retrySeconds: 180
      - id: q1-rolled-back
        description: Namespace ${Q1_NS} holds before-backup but no longer after-backup
        type: kubectl
        run: kubectl -n "${Q1_NS}" get configmaps -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' | grep -v kube-root-ca.crt | sort | xargs
        expect: { equals: before-backup }
        weight: 3
        retrySeconds: 120
      - type: ssh
        node: controlplane
        id: q1-data-dir
        description: etcd runs from ${Q1_DATADIR}
        run: test -d "${Q1_DATADIR}/member" && grep -q -- "${Q1_DATADIR}" /etc/kubernetes/manifests/etcd.yaml && echo restored || echo missing
        expect: { equals: restored }
        weight: 2
    hints:
      - etcdutl snapshot restore <file> --data-dir <dir> writes a new data directory; it does not need the endpoint or certificates.
      - In /etc/kubernetes/manifests/etcd.yaml, change the hostPath of the etcd-data volume. The kubelet recreates the Pod, and the API server can take a minute or two to answer again.
      - "The API server caches what it read from etcd and does not notice a restore: lists stay stale until it restarts. Once etcd runs from the new directory, crictl stop its container and the kubelet starts a fresh one."
    recipe: { builder: etcd-restore, parts: [] }
