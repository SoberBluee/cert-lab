id: rbac-binding-role-ref
title: RBAC (Binding Role Ref)
domain: cluster-architecture
difficulty: 2
estimatedMinutes: 8
points: 6
tags: [ troubleshooting, rbac, serviceaccount, role, rolebinding ]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 30
variables:
  Q1_NS: { oneOf: [ monitoring, audit, reports, observe, security, compliance, metrics, logging, ops, sre ] }
  Q1_APP: { oneOf: [ inventory, watcher, auditor, scanner, collector, reporter, agent, probe, sentinel, inspector ] }
  Q1_FAULT: { oneOf: [ binding-role-ref ], hidden: true }
tasks:
  - id: q1
    title: ${Q1_APP} cannot list Pods
    recipe: { category: rbac }
    points: 6
    setup:
      - node: controlplane
        script: setup/q1.sh
        timeoutSeconds: 400
        lane: q1
    checks:
      - id: q1-can-list
        description: ${Q1_APP}-sa may list Pods in ${Q1_NS}
        type: kubectl
        run: kubectl auth can-i list pods -n ${Q1_NS} --as=system:serviceaccount:${Q1_NS}:${Q1_APP}-sa
        expect: { equals: yes }
        weight: 2
      - id: q1-logs-200
        description: ${Q1_APP}'s latest call returned 200
        type: kubectl
        run: kubectl -n ${Q1_NS} logs deployment/${Q1_APP} --tail=1
        expect: { equals: "200" }
        weight: 2
        retrySeconds: 60
      - id: q1-spec
        description: ${Q1_APP} runs as ${Q1_APP}-sa, and RoleBinding ${Q1_APP}-reader grants Role ${Q1_APP}-reader to it
        type: kubectl
        run: echo "$(kubectl -n ${Q1_NS} get deployment ${Q1_APP} -o jsonpath='{.spec.template.spec.serviceAccountName}') $(kubectl -n ${Q1_NS} get rolebinding ${Q1_APP}-reader -o jsonpath='{.roleRef.kind}/{.roleRef.name} {.subjects[*].namespace}/{.subjects[*].name}')"
        expect: { equals: "${Q1_APP}-sa Role/${Q1_APP}-reader ${Q1_NS}/${Q1_APP}-sa" }
        weight: 1
      - id: q1-least-privilege
        description: ${Q1_APP}-sa cannot delete Pods or read Secrets
        type: kubectl
        run: echo "$(kubectl auth can-i delete pods -n ${Q1_NS} --as=system:serviceaccount:${Q1_NS}:${Q1_APP}-sa) $(kubectl auth can-i get secrets -n ${Q1_NS} --as=system:serviceaccount:${Q1_NS}:${Q1_APP}-sa)"
        expect: { equals: no no }
        weight: 1
    hints:
      - "kubectl -n ${Q1_NS} logs deployment/${Q1_APP}: 401, 403 or a missing token point at different problems."
      - kubectl auth can-i list pods -n ${Q1_NS} --as=system:serviceaccount:${Q1_NS}:${Q1_APP}-sa tells you whether RBAC allows the call at all.
      - "kubectl -n ${Q1_NS} get role,rolebinding -o yaml: check the verbs, the resource names, the roleRef and the subject's namespace."
      - kubectl -n ${Q1_NS} get pod -l app=${Q1_APP} -o yaml | grep -i serviceaccount, and kubectl -n ${Q1_NS} get sa ${Q1_APP}-sa -o yaml.
