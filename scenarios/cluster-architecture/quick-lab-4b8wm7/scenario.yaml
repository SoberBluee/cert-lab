id: quick-lab-4b8wm7
title: "Quick lab: Cluster upgrade"
domain: cluster-architecture
difficulty: 3
estimatedMinutes: 20
points: 8
tags: [ kubeadm, upgrade, drain ]
base: bare
nodes: { controlPlane: 1, workers: 2 }
settleSeconds: 60
draft: true
solution:
  - node: controlplane
    script: setup/q1-solution.sh
    timeoutSeconds: 900
tasks:
  - id: q1
    title: Upgrade a worker
    points: 8
    setup:
      - node: controlplane
        script: setup/q1.sh
        timeoutSeconds: 1200
    checks:
      - id: q1-kubelet
        description: the kubelet on worker-1 runs 1.37.1
        type: kubectl
        run: kubectl get node worker-1 -o jsonpath='{.status.nodeInfo.kubeletVersion}'
        expect: { equals: v1.37.1 }
        weight: 3
        retrySeconds: 120
      - id: q1-tools
        description: kubeadm on worker-1 is 1.37.1
        type: ssh
        node: worker-1
        run: kubeadm version -o short
        expect: { equals: v1.37.1 }
        weight: 1
      - id: q1-schedulable
        description: worker-1 is not cordoned
        type: kubectl
        run: kubectl get node worker-1 -o jsonpath='{.spec.unschedulable}'
        expect: { notContains: "true" }
        weight: 2
        retrySeconds: 60
      - id: q1-worker-2-kept
        description: worker-2 still runs 1.36
        type: kubectl
        run: kubectl get node worker-2 -o jsonpath='{.status.nodeInfo.kubeletVersion}'
        expect: { matches: ^v1\.36\.\d+$ }
        weight: 1
      - id: q1-nodes-ready
        description: every node is Ready
        type: kubectl
        run: kubectl get nodes -o jsonpath='{range .items[*]}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}' | sort -u | xargs
        expect: { equals: "True" }
        weight: 1
        retrySeconds: 180
    hints:
      - On a worker the kubeadm step is kubeadm upgrade node, not kubeadm upgrade apply.
      - Drain from controlplane (kubectl drain worker-1 --ignore-daemonsets), upgrade on the worker (ssh worker-1, then sudo), uncordon from controlplane.
      - "apt-cache madison kubeadm lists the versions apt can install. The packages are held: apt-mark unhold them first."
    recipe: { builder: upgrade, parts: [] }
