id: kk2-helm-repo-url
title: Record the lab Helm repository URL
domain: cluster-architecture
difficulty: 1
estimatedMinutes: 4
points: 3
tags: [helm, chartrepo]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 15
setup:
  - node: controlplane
    script: setup/chartrepo.sh
    timeoutSeconds: 300
  - node: controlplane
    script: setup/break.sh
checks:
  - id: url
    description: /opt/course/nginx-helm-url.txt holds http://controlplane:8879
    type: ssh
    node: controlplane
    run: tr -d '[:space:]' </opt/course/nginx-helm-url.txt 2>/dev/null || true
    expect: { equals: "http://controlplane:8879" }
    weight: 3
hints:
  - "helm repo list (as ubuntu) shows the lab chart repository URL."
  - "Write only the URL into /opt/course/nginx-helm-url.txt."
