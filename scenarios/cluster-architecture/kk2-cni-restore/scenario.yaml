id: kk2-cni-restore
title: Restore CNI on a worker
domain: cluster-architecture
difficulty: 2
estimatedMinutes: 10
points: 6
tags: [cni, calico, containerd, kubelet]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 60
variables:
  NODE: { node: workers }
setup:
  - node: worker-1
    script: setup/break.sh
    lane: w1
  - node: worker-2
    script: setup/break.sh
    lane: w2
solution:
  - node: worker-1
    script: solution-node.sh
  - node: worker-2
    script: solution-node.sh
  - node: controlplane
    script: solution.sh
checks:
  - id: node
    description: ${NODE} is Ready
    type: kubectl
    run: kubectl get node ${NODE} -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
    expect: { equals: "True" }
    weight: 2
    retrySeconds: 180
  - id: cni
    description: CNI conflist is back under /etc/cni/net.d on ${NODE}
    type: ssh
    node: ${NODE}
    run: ls /etc/cni/net.d/*.conflist >/dev/null 2>&1 && echo ok || echo missing
    expect: { equals: "ok" }
    weight: 2
  - id: pod
    description: a probe Pod can run on ${NODE}
    type: script
    node: controlplane
    script: checks/probe.sh
    expect: { equals: "ok" }
    weight: 2
    retrySeconds: 180
hints:
  - "kubectl describe node <node>: the Ready condition names the network plugin problem."
  - "ls /etc/cni/net.d on both workers. Calico writes that file itself from its calico-node Pod; a copy from the healthy worker works too once its node name is changed."
