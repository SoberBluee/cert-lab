id: helm-release-cleanup
title: "Killer-style: Helm release housekeeping"
domain: cluster-architecture
difficulty: 2
estimatedMinutes: 10
points: 10
tags: [killer-style, helm, helm-uninstall, helm-upgrade, helm-install, pending-install, re-rollable]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 30
variables:
  NS: { oneOf: [apps, tools, platform-apps] }
  OLD: { oneOf: [legacy-api, old-portal, retired-web] }
  UPG: { oneOf: [shop-ui, admin-ui, docs-ui] }
  NEW: { oneOf: [status-page, help-desk, wiki-ui] }
  STUCK: { oneOf: [preview, trial, sandbox], hidden: true }
  STUCK_KIND: { oneOf: [pending-install, pending-upgrade, failed], hidden: true }
setup:
  - node: controlplane
    script: setup/chartrepo.sh
    timeoutSeconds: 180
  - node: controlplane
    script: setup/releases.sh
    timeoutSeconds: 360
checks:
  - id: old-deleted
    description: release ${OLD} and its Deployment are gone
    type: kubectl
    run: |
      r=$(helm -n ${NS} list -q | grep -cx '${OLD}' || true)
      d=$(kubectl -n ${NS} get deployment -l app.kubernetes.io/instance=${OLD} -o name | wc -l)
      echo "$r/$d"
    expect: { equals: "0/0" }
    weight: 2
  - id: upgraded
    description: release ${UPG} is deployed from the newest webapp chart (2.0.0)
    type: kubectl
    run: helm -n ${NS} list -o json | jq -r '.[] | select(.name == "${UPG}") | .status + "/" + .chart'
    expect: { equals: "deployed/webapp-2.0.0" }
    weight: 2
  - id: installed
    description: release ${NEW} is deployed from webapp-1.0.0 with 2 ready replicas
    type: kubectl
    run: |
      c=$(helm -n ${NS} list -o json | jq -r '.[] | select(.name == "${NEW}") | .status + "/" + .chart')
      r=$(kubectl -n ${NS} get deployment -l app.kubernetes.io/instance=${NEW} -o jsonpath='{.items[0].status.readyReplicas}')
      echo "$c/$r"
    expect: { equals: "deployed/webapp-1.0.0/2" }
    weight: 2
    retrySeconds: 90
  - id: no-pending
    description: no release in ${NS} is stuck (pending or failed), and the stuck releases are gone
    type: kubectl
    run: |
      p=$(helm -n ${NS} list --pending -q | wc -l)
      s=$(helm -n ${NS} list -o json | jq '[.[] | select(.status | test("^pending|^failed$"))] | length')
      a=$(helm -n ${NS} list -q | wc -l)
      echo "$p/$s/$a"
    expect: { equals: "0/0/2" }
    weight: 3
  - id: others-untouched
    description: releases outside ${NS} (traefik and the other cluster add-ons) are still deployed
    type: kubectl
    run: |
      bad=$(helm list -A -o json | jq '[.[] | select(.namespace != "${NS}" and .status != "deployed")] | length')
      t=$(helm -n traefik list -o json | jq -r '.[] | select(.name == "traefik") | .status')
      echo "$bad/$t"
    expect: { equals: "0/deployed" }
    weight: 1
hints:
  - "helm -n ${NS} list shows releases in every status; read the STATUS column. helm list --help: --pending and --failed filter by status."
  - "helm search repo lab/webapp --versions tells you which version is the newest; helm upgrade without --version takes it."
  - "A release stuck in pending-install, pending-upgrade or failed is still a release: helm uninstall removes it like any other."
