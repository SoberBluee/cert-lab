id: ks-mock-cluster-ops
title: "Killer-style mock: cluster operations"
domain: cluster-architecture
difficulty: 3
estimatedMinutes: 40
points: 28
tags: [killer-style, multi-task, kubeconfig, certificates, openssl, rbac, serviceaccount, etcd, drain, taints, pdb, context-switch, re-rollable]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 30
variables:
  Q1_KIND: { oneOf: [contexts-cert, cluster-servers, new-context] }
  Q1_USER: { oneOf: [auditor, ops-lead, sre-oncall] }
  Q2_KIND: { oneOf: [deployer, configmap-editor, job-runner] }
  Q2_NS: { oneOf: [ci, pipelines, builds] }
  Q2_SA: { oneOf: [deployer, release-bot, ci-runner] }
  Q3_KIND: { oneOf: [snapshot, restore, member-health] }
  Q4_KIND: { oneOf: [apiserver-kubelet, etcd-server, front-proxy] }
  Q4_NODE: { node: workers }
  Q5_KIND: { oneOf: [drain-dedicate, noexecute-evict, cordon-move] }
  Q5_NODE: { node: workers }
  Q5_NS: { oneOf: [payments, inventory, ledger] }
  Q5_APP: { oneOf: [api, worker, processor] }
  Q5_TAINT: { oneOf: [gpu, batch, storage] }
  Q5_POD: { oneOf: [maintenance, node-debug, dedicated-job] }
setup:
  - node: controlplane
    script: setup/common.sh
tasks:
  - id: q1
    title: Kubeconfig forensics
    points: 5
    setup:
      - node: controlplane
        script: setup/q1.sh
        lane: q1
    variant: Q1_KIND
    variants:
      contexts-cert:
        title: "Kubeconfig forensics: contexts and a client certificate"
        checks:
          - id: q1-contexts
            description: /opt/course/q1/contexts lists every context of the ubuntu kubeconfig, one per line
            type: ssh
            node: controlplane
            run: diff <(sort /opt/course/q1/contexts 2>/dev/null | sed '/^\s*$/d') <(KUBECONFIG=/home/ubuntu/.kube/config kubectl config get-contexts -o name | sort) >/dev/null && echo same || echo different
            expect: { equals: "same" }
            weight: 1
          - id: q1-current-script
            description: /opt/course/q1/current-context.sh prints the current context without using kubectl
            type: ssh
            node: controlplane
            run: |
              f=/opt/course/q1/current-context.sh
              if [ ! -s "$f" ] || grep -q kubectl "$f"; then echo invalid; exit 0; fi
              want=$(awk '/^current-context:/ {print $2}' /home/ubuntu/.kube/config | tr -d '"')
              have=$(sudo -u ubuntu -H bash "$f" 2>/dev/null | tr -d '[:space:]')
              [ -n "$want" ] && [ "$have" = "$want" ] && echo ok || echo "have=$have want=$want"
            expect: { equals: "ok" }
            weight: 2
          - id: q1-cert
            description: /opt/course/q1/${Q1_USER}.crt is the decoded client certificate of user ${Q1_USER}
            type: ssh
            node: controlplane
            run: openssl x509 -in /opt/course/q1/${Q1_USER}.crt -noout -subject 2>/dev/null || echo invalid
            expect: { matches: "CN ?= ?${Q1_USER}" }
            weight: 2
        hints:
          - "kubectl config get-contexts -o name prints only the names."
          - "The kubeconfig is plain YAML: grep or awk the current-context line of ~/.kube/config."
          - "kubectl config view --raw -o jsonpath='{.users[?(@.name==\"${Q1_USER}\")].user.client-certificate-data}' | base64 -d > /opt/course/q1/${Q1_USER}.crt"
      cluster-servers:
        title: "Kubeconfig forensics: clusters, servers and the CA"
        setup:
          - node: controlplane
            script: setup/q1-clusters.sh
            lane: q1
        checks:
          - id: q1-servers
            description: /opt/course/q1/servers maps every context of the ubuntu kubeconfig to its API server URL
            type: ssh
            node: controlplane
            run: |
              cfg=/home/ubuntu/.kube/config
              want=$(for c in $(kubectl --kubeconfig $cfg config get-contexts -o name); do
                cl=$(kubectl --kubeconfig $cfg config view -o jsonpath="{.contexts[?(@.name==\"$c\")].context.cluster}")
                echo "$c $(kubectl --kubeconfig $cfg config view -o jsonpath="{.clusters[?(@.name==\"$cl\")].cluster.server}")"
              done | sort)
              have=$(sed -E 's/[[:space:]]+/ /g; s/ $//; /^$/d' /opt/course/q1/servers 2>/dev/null | sort)
              [ -n "$have" ] && [ "$have" = "$want" ] && echo same || echo different
            expect: { equals: "same" }
            weight: 2
          - id: q1-ca
            description: /opt/course/q1/ca.crt is the decoded CA certificate of cluster kubernetes
            type: ssh
            node: controlplane
            run: |
              a=$(openssl x509 -in /opt/course/q1/ca.crt -noout -fingerprint -sha256 2>/dev/null)
              b=$(openssl x509 -in /etc/kubernetes/pki/ca.crt -noout -fingerprint -sha256)
              [ -n "$a" ] && [ "$a" = "$b" ] && echo same || echo different
            expect: { equals: "same" }
            weight: 2
          - id: q1-ca-expiry
            description: /opt/course/q1/ca-expiry holds the expiry date of that CA certificate
            type: ssh
            node: controlplane
            run: |
              want=$(openssl x509 -in /etc/kubernetes/pki/ca.crt -noout -enddate | cut -d= -f2)
              grep -qF "$want" /opt/course/q1/ca-expiry 2>/dev/null && echo ok || echo "missing $want"
            expect: { equals: "ok" }
            weight: 1
        hints:
          - "A context only names a cluster; the server URL lives in the clusters list. kubectl config view -o jsonpath='{.contexts[*].context.cluster}' and '{.clusters[*].cluster.server}'."
          - "kubectl config get-contexts shows the CLUSTER column next to each context name."
          - "kubectl config view --raw -o jsonpath='{.clusters[?(@.name==\"kubernetes\")].cluster.certificate-authority-data}' | base64 -d > /opt/course/q1/ca.crt; then openssl x509 -noout -enddate."
      new-context:
        title: "Kubeconfig: a working context for an existing user"
        setup:
          - node: controlplane
            run: kubectl delete namespace team-${Q1_USER} --ignore-not-found --wait=true
            lane: q1
        checks:
          - id: q1-new-context
            description: context ${Q1_USER}-team in the ubuntu kubeconfig uses user ${Q1_USER}, cluster kubernetes and namespace team-${Q1_USER}
            type: ssh
            node: controlplane
            run: KUBECONFIG=/home/ubuntu/.kube/config kubectl config view -o jsonpath='{.contexts[?(@.name=="${Q1_USER}-team")].context.user}/{.contexts[?(@.name=="${Q1_USER}-team")].context.cluster}/{.contexts[?(@.name=="${Q1_USER}-team")].context.namespace}'
            expect: { equals: "${Q1_USER}/kubernetes/team-${Q1_USER}" }
            weight: 2
          - id: q1-user-rbac
            description: user ${Q1_USER} can manage Deployments in team-${Q1_USER}, and nothing in default
            type: kubectl
            run: echo "$(kubectl auth can-i create deployments.apps -n team-${Q1_USER} --as=${Q1_USER}) $(kubectl auth can-i list pods -n default --as=${Q1_USER})"
            expect: { equals: "yes no" }
            weight: 2
          - id: q1-context-works
            description: as ubuntu, kubectl --context ${Q1_USER}-team get pods works, and the current context is unchanged
            type: ssh
            node: controlplane
            run: |
              sudo -u ubuntu -H kubectl --context ${Q1_USER}-team get pods >/dev/null 2>&1 || { echo denied; exit 0; }
              awk '/^current-context:/ {print $2}' /home/ubuntu/.kube/config | tr -d '"'
            expect: { equals: "kubernetes-admin@kubernetes" }
            weight: 1
        hints:
          - "kubectl config set-context <name> --cluster=... --user=... --namespace=... only edits the kubeconfig; it does not switch to the new context."
          - "The certificate alone authenticates ${Q1_USER}; it still needs RBAC. ClusterRole edit bound with a RoleBinding in one namespace grants rights only there."
          - "kubectl create namespace team-${Q1_USER}; kubectl -n team-${Q1_USER} create rolebinding ${Q1_USER}-edit --clusterrole=edit --user=${Q1_USER}"

  - id: q2
    title: Least-privilege ServiceAccount
    points: 7
    setup:
      - node: controlplane
        run: kubectl delete namespace ${Q2_NS} --ignore-not-found --wait=true && kubectl create namespace ${Q2_NS}
        lane: q2
    variant: Q2_KIND
    variants:
      deployer:
        title: "Least-privilege ServiceAccount: deployment pipeline"
        checks:
          - id: q2-deploy-rights
            description: ${Q2_SA} can create and patch Deployments in ${Q2_NS}
            type: kubectl
            run: echo "$(kubectl auth can-i create deployments.apps -n ${Q2_NS} --as=system:serviceaccount:${Q2_NS}:${Q2_SA}) $(kubectl auth can-i patch deployments.apps -n ${Q2_NS} --as=system:serviceaccount:${Q2_NS}:${Q2_SA})"
            expect: { equals: "yes yes" }
            weight: 2
          - id: q2-nodes
            description: ${Q2_SA} can list nodes cluster-wide
            type: kubectl
            run: kubectl auth can-i list nodes --as=system:serviceaccount:${Q2_NS}:${Q2_SA}
            expect: { equals: "yes" }
            weight: 1
          - id: q2-no-delete
            description: ${Q2_SA} cannot delete Deployments
            type: kubectl
            run: kubectl -n ${Q2_NS} get serviceaccount ${Q2_SA} -o name >/dev/null && kubectl auth can-i delete deployments.apps -n ${Q2_NS} --as=system:serviceaccount:${Q2_NS}:${Q2_SA}
            expect: { equals: "no" }
            weight: 1
          - id: q2-namespaced
            description: ${Q2_SA} cannot create Deployments outside ${Q2_NS}
            type: kubectl
            run: kubectl -n ${Q2_NS} get serviceaccount ${Q2_SA} -o name >/dev/null && kubectl auth can-i create deployments.apps -n default --as=system:serviceaccount:${Q2_NS}:${Q2_SA}
            expect: { equals: "no" }
            weight: 1
          - id: q2-no-secrets
            description: ${Q2_SA} cannot read Secrets
            type: kubectl
            run: kubectl -n ${Q2_NS} get serviceaccount ${Q2_SA} -o name >/dev/null && kubectl auth can-i get secrets -n ${Q2_NS} --as=system:serviceaccount:${Q2_NS}:${Q2_SA}
            expect: { equals: "no" }
            weight: 1
          - id: q2-probe
            description: Deployment ${Q2_SA}-probe runs one ready Pod as ServiceAccount ${Q2_SA}
            type: kubectl
            run: kubectl -n ${Q2_NS} get deployment ${Q2_SA}-probe -o jsonpath='{.spec.template.spec.serviceAccountName}/{.status.readyReplicas}'
            expect: { equals: "${Q2_SA}/1" }
            weight: 1
            retrySeconds: 60
        hints:
          - "Namespaced rights need a Role and RoleBinding; nodes are cluster-scoped, so they need a ClusterRole and ClusterRoleBinding."
          - "Binding the deployment rights with a ClusterRoleBinding would grant them in every namespace."
          - "kubectl -n ${Q2_NS} create role ${Q2_SA}-role --verb=get,list,watch,create,update,patch --resource=deployments.apps,pods; kubectl create clusterrole ${Q2_SA}-nodes --verb=get,list --resource=nodes"
      configmap-editor:
        title: "Least-privilege ServiceAccount: reusable ClusterRole, namespaced binding"
        checks:
          - id: q2c-cm-rights
            description: ${Q2_SA} can create and delete ConfigMaps in ${Q2_NS}
            type: kubectl
            run: echo "$(kubectl auth can-i create configmaps -n ${Q2_NS} --as=system:serviceaccount:${Q2_NS}:${Q2_SA}) $(kubectl auth can-i delete configmaps -n ${Q2_NS} --as=system:serviceaccount:${Q2_NS}:${Q2_SA})"
            expect: { equals: "yes yes" }
            weight: 2
          - id: q2c-clusterrole-binding
            description: the rights come from ClusterRole ${Q2_SA}-config, bound by a RoleBinding in ${Q2_NS}
            type: kubectl
            run: |
              kubectl get clusterrole ${Q2_SA}-config -o name >/dev/null || { echo no-clusterrole; exit 0; }
              kubectl -n ${Q2_NS} get rolebindings -o json | jq -r '[.items[] | select(.roleRef.kind == "ClusterRole" and .roleRef.name == "${Q2_SA}-config")
                | .subjects[]? | select(.kind == "ServiceAccount" and .name == "${Q2_SA}" and (.namespace // "${Q2_NS}") == "${Q2_NS}")] | length > 0'
            expect: { equals: "true" }
            weight: 2
          - id: q2c-namespaced
            description: ${Q2_SA} cannot touch ConfigMaps outside ${Q2_NS}, and no ClusterRoleBinding names it
            type: kubectl
            run: |
              kubectl -n ${Q2_NS} get serviceaccount ${Q2_SA} -o name >/dev/null || { echo missing; exit 0; }
              crb=$(kubectl get clusterrolebindings -o json | jq '[.items[] | .subjects[]? | select(.kind == "ServiceAccount" and .name == "${Q2_SA}" and .namespace == "${Q2_NS}")] | length')
              echo "$(kubectl auth can-i create configmaps -n default --as=system:serviceaccount:${Q2_NS}:${Q2_SA})/$crb"
            expect: { equals: "no/0" }
            weight: 1
          - id: q2c-no-secrets
            description: ${Q2_SA} cannot read Secrets in ${Q2_NS}
            type: kubectl
            run: kubectl -n ${Q2_NS} get serviceaccount ${Q2_SA} -o name >/dev/null && kubectl auth can-i get secrets -n ${Q2_NS} --as=system:serviceaccount:${Q2_NS}:${Q2_SA}
            expect: { equals: "no" }
            weight: 1
          - id: q2c-probe
            description: Deployment ${Q2_SA}-probe runs one ready Pod as ServiceAccount ${Q2_SA}
            type: kubectl
            run: kubectl -n ${Q2_NS} get deployment ${Q2_SA}-probe -o jsonpath='{.spec.template.spec.serviceAccountName}/{.status.readyReplicas}'
            expect: { equals: "${Q2_SA}/1" }
            weight: 1
            retrySeconds: 60
        hints:
          - "A ClusterRole is only a set of rules. Bound with a RoleBinding, it grants those rules in the RoleBinding's namespace only."
          - "kubectl create clusterrole ${Q2_SA}-config --verb=get,list,watch,create,update,patch,delete --resource=configmaps"
          - "kubectl -n ${Q2_NS} create rolebinding ${Q2_SA}-config --clusterrole=${Q2_SA}-config --serviceaccount=${Q2_NS}:${Q2_SA}"
      job-runner:
        title: "Least-privilege ServiceAccount: batch job runner"
        checks:
          - id: q2j-jobs
            description: ${Q2_SA} can create and delete Jobs in ${Q2_NS}
            type: kubectl
            run: echo "$(kubectl auth can-i create jobs.batch -n ${Q2_NS} --as=system:serviceaccount:${Q2_NS}:${Q2_SA}) $(kubectl auth can-i delete jobs.batch -n ${Q2_NS} --as=system:serviceaccount:${Q2_NS}:${Q2_SA})"
            expect: { equals: "yes yes" }
            weight: 2
          - id: q2j-logs
            description: ${Q2_SA} can read Pod logs in ${Q2_NS} and list nodes cluster-wide
            type: kubectl
            run: echo "$(kubectl auth can-i get pods --subresource=log -n ${Q2_NS} --as=system:serviceaccount:${Q2_NS}:${Q2_SA}) $(kubectl auth can-i list nodes --as=system:serviceaccount:${Q2_NS}:${Q2_SA})"
            expect: { equals: "yes yes" }
            weight: 1
          - id: q2j-no-exec
            description: ${Q2_SA} cannot exec into Pods
            type: kubectl
            run: kubectl -n ${Q2_NS} get serviceaccount ${Q2_SA} -o name >/dev/null && kubectl auth can-i create pods --subresource=exec -n ${Q2_NS} --as=system:serviceaccount:${Q2_NS}:${Q2_SA}
            expect: { equals: "no" }
            weight: 1
          - id: q2j-no-deploy
            description: ${Q2_SA} cannot create Deployments, and cannot create Jobs outside ${Q2_NS}
            type: kubectl
            run: kubectl -n ${Q2_NS} get serviceaccount ${Q2_SA} -o name >/dev/null && echo "$(kubectl auth can-i create deployments.apps -n ${Q2_NS} --as=system:serviceaccount:${Q2_NS}:${Q2_SA}) $(kubectl auth can-i create jobs.batch -n default --as=system:serviceaccount:${Q2_NS}:${Q2_SA})"
            expect: { equals: "no no" }
            weight: 1
          - id: q2j-run
            description: Job ${Q2_SA}-probe completed once as ServiceAccount ${Q2_SA}
            type: kubectl
            run: kubectl -n ${Q2_NS} get job ${Q2_SA}-probe -o jsonpath='{.spec.template.spec.serviceAccountName}/{.status.succeeded}'
            expect: { equals: "${Q2_SA}/1" }
            weight: 2
            retrySeconds: 60
        hints:
          - "Logs and exec are subresources: pods/log and pods/exec. Granting pods does not grant them, and granting pods/log does not grant pods/exec."
          - "kubectl -n ${Q2_NS} create role ${Q2_SA}-role --verb=get,list,watch,create,delete --resource=jobs.batch, then add rules for pods (get, list, watch) and pods/log (get)."
          - "kubectl -n ${Q2_NS} create job ${Q2_SA}-probe --image=busybox:1.36 --dry-run=client -o yaml -- echo ok, then add serviceAccountName under spec.template.spec."

  - id: q3
    title: etcd operations
    points: 4
    setup:
      - node: controlplane
        script: setup/q3.sh
        lane: q3
    variant: Q3_KIND
    variants:
      snapshot:
        title: "etcd: snapshot and status"
        checks:
          - id: q3-valid
            description: /opt/course/q3/etcd-snapshot.db is a valid etcd snapshot
            type: ssh
            node: controlplane
            run: ETCDCTL_API=3 etcdctl snapshot status /opt/course/q3/etcd-snapshot.db -w json 2>/dev/null | jq -r '.totalKey > 0'
            expect: { equals: "true" }
            weight: 2
          - id: q3-fresh
            description: the snapshot was taken after the lab started
            type: ssh
            node: controlplane
            run: |
              rev=$(ETCDCTL_API=3 etcdctl snapshot status /opt/course/q3/etcd-snapshot.db -w json 2>/dev/null | jq -r .revision)
              [ -n "$rev" ] && [ "$rev" -ge "$(cat /root/.cka/q3-etcd-rev)" ] && echo fresh || echo stale
            expect: { equals: "fresh" }
            weight: 1
          - id: q3-status
            description: /opt/course/q3/snapshot-status.txt holds the status of that snapshot
            type: ssh
            node: controlplane
            run: |
              rev=$(ETCDCTL_API=3 etcdctl snapshot status /opt/course/q3/etcd-snapshot.db -w json 2>/dev/null | jq -r .revision)
              [ -n "$rev" ] && grep -qw "$rev" /opt/course/q3/snapshot-status.txt 2>/dev/null && echo ok || echo missing
            expect: { equals: "ok" }
            weight: 1
        hints:
          - "The etcd static Pod manifest shows the endpoint and certificate files."
          - "sudo ETCDCTL_API=3 etcdctl --endpoints=https://127.0.0.1:2379 --cacert=/etc/kubernetes/pki/etcd/ca.crt --cert=/etc/kubernetes/pki/etcd/server.crt --key=/etc/kubernetes/pki/etcd/server.key snapshot save /opt/course/q3/etcd-snapshot.db"
          - "etcdctl snapshot status <file> -w table (or etcdutl) prints hash, revision, keys and size."
      restore:
        title: "etcd: snapshot and a test restore"
        setup:
          - node: controlplane
            run: rm -rf /var/lib/etcd-restore-test
            lane: q3
        checks:
          - id: q3r-valid
            description: /opt/course/q3/etcd-snapshot.db is a valid etcd snapshot taken after the lab started
            type: ssh
            node: controlplane
            run: |
              rev=$(ETCDCTL_API=3 etcdctl snapshot status /opt/course/q3/etcd-snapshot.db -w json 2>/dev/null | jq -r .revision)
              [ -n "$rev" ] && [ "$rev" -ge "$(cat /root/.cka/q3-etcd-rev)" ] && echo fresh || echo stale
            expect: { equals: "fresh" }
            weight: 1
          - id: q3r-restored
            description: /var/lib/etcd-restore-test holds an etcd member restored from that snapshot
            type: ssh
            node: controlplane
            run: test -s /var/lib/etcd-restore-test/member/snap/db && test -d /var/lib/etcd-restore-test/member/wal && echo restored || echo missing
            expect: { equals: "restored" }
            weight: 2
          - id: q3r-live-untouched
            description: the running etcd still uses /var/lib/etcd and the API server is healthy
            type: ssh
            node: controlplane
            run: |
              grep -Eq 'path: /var/lib/etcd/?$' /etc/kubernetes/manifests/etcd.yaml || { echo moved; exit 0; }
              kubectl --kubeconfig /etc/kubernetes/admin.conf get --raw /readyz 2>/dev/null
            expect: { equals: "ok" }
            weight: 1
        hints:
          - "Take the snapshot with etcdctl (it needs the endpoint and the certificates from the etcd manifest)."
          - "Restoring only reads the file: sudo etcdutl snapshot restore <file> --data-dir <dir>. The data dir must not exist yet."
          - "Do not edit /etc/kubernetes/manifests/etcd.yaml. A test restore never touches the running member."
      member-health:
        title: "etcd: members, health and version"
        checks:
          - id: q3m-members
            description: /opt/course/q3/members.txt lists the etcd members with their IDs
            type: ssh
            node: controlplane
            run: |
              id=$(ETCDCTL_API=3 etcdctl --endpoints=https://127.0.0.1:2379 --cacert=/etc/kubernetes/pki/etcd/ca.crt --cert=/etc/kubernetes/pki/etcd/server.crt --key=/etc/kubernetes/pki/etcd/server.key member list | head -1 | cut -d, -f1)
              [ -n "$id" ] && grep -qiF "$id" /opt/course/q3/members.txt 2>/dev/null && grep -q controlplane /opt/course/q3/members.txt && echo ok || echo missing
            expect: { equals: "ok" }
            weight: 2
          - id: q3m-health
            description: /opt/course/q3/health.txt holds the endpoint health of etcd
            type: ssh
            node: controlplane
            run: grep -q 'is healthy' /opt/course/q3/health.txt 2>/dev/null && echo ok || echo missing
            expect: { equals: "ok" }
            weight: 1
          - id: q3m-version
            description: /opt/course/q3/version.txt holds the etcd server version
            type: ssh
            node: controlplane
            run: |
              v=$(ETCDCTL_API=3 etcdctl --endpoints=https://127.0.0.1:2379 --cacert=/etc/kubernetes/pki/etcd/ca.crt --cert=/etc/kubernetes/pki/etcd/server.crt --key=/etc/kubernetes/pki/etcd/server.key endpoint status -w json | jq -r '.[0].Status.version')
              grep -qF "$v" /opt/course/q3/version.txt 2>/dev/null && echo ok || echo "missing $v"
            expect: { equals: "ok" }
            weight: 1
        hints:
          - "Every etcdctl call against the live cluster needs --endpoints, --cacert, --cert and --key; read them from the etcd static Pod manifest."
          - "etcdctl member list -w table, etcdctl endpoint health, etcdctl endpoint status -w table."
          - "endpoint status prints the server version in its VERSION column; etcdctl version prints only the client version."

  - id: q4
    title: Certificate investigation
    points: 4
    variant: Q4_KIND
    variants:
      apiserver-kubelet:
        title: "Certificates: API server and kubelet"
        checks:
          - id: q4-apiserver-expiry
            description: /opt/course/q4/apiserver-expiry holds the expiry date of the API server certificate
            type: ssh
            node: controlplane
            run: |
              want=$(openssl x509 -in /etc/kubernetes/pki/apiserver.crt -noout -enddate | cut -d= -f2)
              grep -qF "$want" /opt/course/q4/apiserver-expiry 2>/dev/null && echo ok || echo "missing $want"
            expect: { equals: "ok" }
            weight: 1
          - id: q4-renew
            description: /opt/course/q4/renew.sh holds the kubeadm command that renews only the API server certificate
            type: ssh
            node: controlplane
            run: grep -Eq 'kubeadm +certs +renew +apiserver( |$)' /opt/course/q4/renew.sh 2>/dev/null && echo ok || echo missing
            expect: { equals: "ok" }
            weight: 1
          - id: q4-kubelet-client
            description: /opt/course/q4/kubelet-certs names issuer and usage of ${Q4_NODE}'s kubelet client certificate
            type: ssh
            node: controlplane
            run: grep -q 'CN *= *kubernetes' /opt/course/q4/kubelet-certs 2>/dev/null && grep -q 'TLS Web Client Authentication' /opt/course/q4/kubelet-certs && echo ok || echo missing
            expect: { equals: "ok" }
            weight: 1
          - id: q4-kubelet-server
            description: /opt/course/q4/kubelet-certs names issuer and usage of ${Q4_NODE}'s kubelet serving certificate
            type: ssh
            node: controlplane
            run: grep -q -- '${Q4_NODE}-ca@' /opt/course/q4/kubelet-certs 2>/dev/null && grep -q 'TLS Web Server Authentication' /opt/course/q4/kubelet-certs && echo ok || echo missing
            expect: { equals: "ok" }
            weight: 1
        hints:
          - "openssl x509 -in <file> -noout -enddate | -issuer | -ext extendedKeyUsage (or -text and read it)."
          - "The kubelet's certificates live on ${Q4_NODE} in /var/lib/kubelet/pki: kubelet-client-current.pem (client) and kubelet.crt (serving)."
          - "kubeadm certs renew --help lists the certificate names."
      etcd-server:
        title: "Certificates: etcd server SANs and expiry"
        checks:
          - id: q4e-sans
            description: /opt/course/q4/etcd-sans lists every Subject Alternative Name of etcd's server certificate
            type: ssh
            node: controlplane
            run: |
              [ -s /opt/course/q4/etcd-sans ] || { echo missing; exit 0; }
              openssl x509 -in /etc/kubernetes/pki/etcd/server.crt -noout -ext subjectAltName | tail -n +2 | tr ',' '\n' \
                | sed -E 's/^ *(DNS|IP Address)://' | while read -r san; do grep -qF "$san" /opt/course/q4/etcd-sans || echo "missing $san"; done | head -1 | grep . || echo ok
            expect: { equals: "ok" }
            weight: 2
          - id: q4e-expiry
            description: /opt/course/q4/etcd-expiry holds the expiry date of etcd's server certificate
            type: ssh
            node: controlplane
            run: |
              want=$(openssl x509 -in /etc/kubernetes/pki/etcd/server.crt -noout -enddate | cut -d= -f2)
              grep -qF "$want" /opt/course/q4/etcd-expiry 2>/dev/null && echo ok || echo "missing $want"
            expect: { equals: "ok" }
            weight: 1
          - id: q4e-renew
            description: /opt/course/q4/renew.sh holds the kubeadm command that renews only etcd's server certificate
            type: ssh
            node: controlplane
            run: grep -Eq 'kubeadm +certs +renew +etcd-server( |$)' /opt/course/q4/renew.sh 2>/dev/null && echo ok || echo missing
            expect: { equals: "ok" }
            weight: 1
        hints:
          - "The etcd static Pod manifest names the certificate files (--cert-file)."
          - "openssl x509 -in /etc/kubernetes/pki/etcd/server.crt -noout -ext subjectAltName -enddate"
          - "kubeadm certs renew --help lists the certificate names; etcd has etcd-server, etcd-peer and etcd-healthcheck-client."
      front-proxy:
        title: "Certificates: the front-proxy (aggregation layer) chain"
        checks:
          - id: q4f-issuer
            description: /opt/course/q4/front-proxy-issuer holds the issuer of the API server's front-proxy client certificate
            type: ssh
            node: controlplane
            run: grep -q 'CN *= *front-proxy-ca' /opt/course/q4/front-proxy-issuer 2>/dev/null && echo ok || echo missing
            expect: { equals: "ok" }
            weight: 1
          - id: q4f-flags
            description: /opt/course/q4/front-proxy-flags holds the kube-apiserver flags that use the front-proxy certificates
            type: ssh
            node: controlplane
            run: |
              f=/opt/course/q4/front-proxy-flags
              grep -qF -- '--requestheader-client-ca-file=/etc/kubernetes/pki/front-proxy-ca.crt' $f 2>/dev/null \
                && grep -qF -- '--proxy-client-cert-file=/etc/kubernetes/pki/front-proxy-client.crt' $f && echo ok || echo missing
            expect: { equals: "ok" }
            weight: 2
          - id: q4f-renew
            description: /opt/course/q4/renew.sh holds the kubeadm command that renews only the front-proxy client certificate
            type: ssh
            node: controlplane
            run: grep -Eq 'kubeadm +certs +renew +front-proxy-client( |$)' /opt/course/q4/renew.sh 2>/dev/null && echo ok || echo missing
            expect: { equals: "ok" }
            weight: 1
        hints:
          - "The front-proxy certificates live in /etc/kubernetes/pki next to the cluster CA: front-proxy-ca.crt and front-proxy-client.crt."
          - "grep front-proxy /etc/kubernetes/manifests/kube-apiserver.yaml shows every flag that uses them."
          - "kubeadm certs renew --help lists the certificate names."

  - id: q5
    title: Node maintenance
    points: 8
    setup:
      - node: controlplane
        script: setup/q5.sh
        timeoutSeconds: 400
        lane: q5
    variant: Q5_KIND
    variants:
      drain-dedicate:
        title: Drain a node and dedicate it
        checks:
          - id: q5-drained
            description: no Pod of ${Q5_APP} runs on ${Q5_NODE}, and all 4 replicas are ready elsewhere
            type: kubectl
            run: echo "$(kubectl -n ${Q5_NS} get pods -l app=${Q5_APP} --field-selector spec.nodeName=${Q5_NODE} -o name | wc -l)/$(kubectl -n ${Q5_NS} get deployment ${Q5_APP} -o jsonpath='{.status.readyReplicas}')"
            expect: { equals: "0/4" }
            weight: 2
            retrySeconds: 60
          - id: q5-scratch-gone
            description: the unmanaged Pod scratch is gone
            type: kubectl
            run: kubectl -n ${Q5_NS} get pod scratch --ignore-not-found -o name
            expect: { equals: "" }
            weight: 1
          - id: q5-pdb-kept
            description: ${Q5_NODE} is cordoned or tainted, and PDB ${Q5_APP}-pdb still exists unchanged
            type: kubectl
            run: kubectl get node ${Q5_NODE} -o jsonpath='{.spec.unschedulable}{.spec.taints[?(@.key=="dedicated")].key}' | grep -q . && kubectl -n ${Q5_NS} get pdb ${Q5_APP}-pdb -o jsonpath='{.spec.minAvailable}'
            expect: { equals: "3" }
            weight: 1
          - id: q5-taint
            description: ${Q5_NODE} is schedulable again and tainted dedicated=${Q5_TAINT}:NoSchedule
            type: kubectl
            run: kubectl get node ${Q5_NODE} -o jsonpath='{.spec.unschedulable}/{.spec.taints[?(@.key=="dedicated")].value}:{.spec.taints[?(@.key=="dedicated")].effect}'
            expect: { equals: "/${Q5_TAINT}:NoSchedule" }
            weight: 2
          - id: q5-pod
            description: Pod ${Q5_POD} runs on ${Q5_NODE}, pinned by nodeSelector and tolerating the taint
            type: kubectl
            run: kubectl -n ${Q5_NS} get pod ${Q5_POD} -o json | jq -r '"\(.status.phase)/\(.spec.nodeName)/\(.spec.nodeSelector["kubernetes.io/hostname"] // "")/\([.spec.tolerations[]? | select(.key == "dedicated")] | length)"'
            expect: { equals: "Running/${Q5_NODE}/${Q5_NODE}/1" }
            weight: 2
            retrySeconds: 60
        hints:
          - "kubectl drain refuses to delete unmanaged Pods and DaemonSet Pods without flags. Read its error messages."
          - "kubectl drain ${Q5_NODE} --ignore-daemonsets --force. Evictions respect the PDB, so the drain waits for replacements to become ready."
          - "kubectl taint node ${Q5_NODE} dedicated=${Q5_TAINT}:NoSchedule; kubectl uncordon ${Q5_NODE}; the Pod needs nodeSelector kubernetes.io/hostname: ${Q5_NODE} and a toleration for key dedicated."
      noexecute-evict:
        title: Evict a node with a NoExecute taint
        checks:
          - id: q5n-taint
            description: ${Q5_NODE} is schedulable and tainted dedicated=${Q5_TAINT}:NoExecute
            type: kubectl
            run: kubectl get node ${Q5_NODE} -o jsonpath='{.spec.unschedulable}/{.spec.taints[?(@.key=="dedicated")].value}:{.spec.taints[?(@.key=="dedicated")].effect}'
            expect: { equals: "/${Q5_TAINT}:NoExecute" }
            weight: 2
          - id: q5n-evicted
            description: no Pod of ${Q5_APP} runs on ${Q5_NODE}, all 4 replicas are ready elsewhere, and scratch is gone
            type: kubectl
            run: echo "$(kubectl -n ${Q5_NS} get pods -l app=${Q5_APP} --field-selector spec.nodeName=${Q5_NODE} -o name | wc -l)/$(kubectl -n ${Q5_NS} get deployment ${Q5_APP} -o jsonpath='{.status.readyReplicas}')/$(kubectl -n ${Q5_NS} get pod scratch --ignore-not-found -o name | wc -l)"
            expect: { equals: "0/4/0" }
            weight: 3
            retrySeconds: 60
          - id: q5n-pod
            description: Pod ${Q5_POD} runs on ${Q5_NODE} and tolerates the NoExecute taint for 3600 seconds
            type: kubectl
            run: |
              kubectl -n ${Q5_NS} get pod ${Q5_POD} -o json | jq -r '"\(.status.phase)/\(.spec.nodeName)/\(.spec.nodeSelector["kubernetes.io/hostname"] // "")/" +
                ([.spec.tolerations[]? | select(.key == "dedicated" and .effect == "NoExecute") | (.tolerationSeconds | tostring)] | join(","))'
            expect: { equals: "Running/${Q5_NODE}/${Q5_NODE}/3600" }
            weight: 3
            retrySeconds: 60
        hints:
          - "A NoSchedule taint only keeps new Pods away. NoExecute also evicts running Pods that do not tolerate it, unmanaged ones included."
          - "kubectl taint node ${Q5_NODE} dedicated=${Q5_TAINT}:NoExecute. Taint-based eviction does not go through the eviction API, so it ignores the PDB."
          - "tolerations: [{ key: dedicated, operator: Equal, value: ${Q5_TAINT}, effect: NoExecute, tolerationSeconds: 3600 }], plus nodeSelector kubernetes.io/hostname: ${Q5_NODE}."
      cordon-move:
        title: Cordon a node and move a workload off it
        checks:
          - id: q5c-cordoned
            description: ${Q5_NODE} is cordoned and labelled maintenance=true
            type: kubectl
            run: kubectl get node ${Q5_NODE} -o jsonpath='{.spec.unschedulable}/{.metadata.labels.maintenance}'
            expect: { equals: "true/true" }
            weight: 2
          - id: q5c-affinity
            description: Deployment ${Q5_APP} requires nodes without maintenance=true (required node affinity)
            type: kubectl
            run: |
              kubectl -n ${Q5_NS} get deployment ${Q5_APP} -o json | jq -r '[.spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[]?.matchExpressions[]?
                | select(.key == "maintenance" and ((.operator == "NotIn" and (.values | index("true"))) or .operator == "DoesNotExist"))] | length > 0'
            expect: { equals: "true" }
            weight: 2
          - id: q5c-moved
            description: no Pod of ${Q5_APP} runs on ${Q5_NODE}, and all 4 replicas are ready elsewhere
            type: kubectl
            run: echo "$(kubectl -n ${Q5_NS} get pods -l app=${Q5_APP} --field-selector spec.nodeName=${Q5_NODE} -o name | wc -l)/$(kubectl -n ${Q5_NS} get deployment ${Q5_APP} -o jsonpath='{.status.readyReplicas}')"
            expect: { equals: "0/4" }
            weight: 2
            retrySeconds: 60
          - id: q5c-kept
            description: the unmanaged Pod scratch still runs on ${Q5_NODE}, and PDB ${Q5_APP}-pdb is unchanged
            type: kubectl
            run: echo "$(kubectl -n ${Q5_NS} get pod scratch -o jsonpath='{.status.phase}/{.spec.nodeName}')/$(kubectl -n ${Q5_NS} get pdb ${Q5_APP}-pdb -o jsonpath='{.spec.minAvailable}')"
            expect: { equals: "Running/${Q5_NODE}/3" }
            weight: 2
        hints:
          - "kubectl cordon only stops new Pods from landing on the node; it moves nothing. Do not drain: scratch has to keep running."
          - "kubectl label node ${Q5_NODE} maintenance=true, then give the Deployment a required node affinity with key maintenance, operator NotIn, values [\"true\"]."
          - "Changing the Pod template starts a rollout, and the new Pods avoid ${Q5_NODE}. kubectl -n ${Q5_NS} rollout status deployment ${Q5_APP}."
