id: admission-policy-and-plugin
title: Work with admission control
domain: cluster-architecture
difficulty: 3
estimatedMinutes: 14
points: 14
tags: [ admission, validatingadmissionpolicy, kube-apiserver ]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 30
variables:
  Q1_NS: { oneOf: [ regulated, audited, compliance ] }
  Q1_APP: { oneOf: [ claims-api, kyc-api, tax-api ] }
tasks:
  - id: q1
    title: Deployment ${Q1_APP} gets no Pods
    points: 8
    tags: [ troubleshooting, admission ]
    setup:
      - node: controlplane
        script: setup/q1.sh
        timeoutSeconds: 240
    checks:
      - id: q1-ready
        description: ${Q1_APP} has 2 ready, updated replicas
        type: kubectl
        run: kubectl -n ${Q1_NS} get deployment ${Q1_APP} -o jsonpath='{.status.readyReplicas}/{.status.updatedReplicas}/{.status.replicas}'
        expect: { equals: 2/2/2 }
        weight: 5
        retrySeconds: 90
      - id: q1-enforced
        description: Pods without the required label are still refused in ${Q1_NS}
        type: kubectl
        run: kubectl -n ${Q1_NS} run admission-check --image=busybox:1.36 --dry-run=server 2>&1 || true
        expect: { contains: owner label }
        weight: 1
      - id: q1-unchanged
        description: the policy and its binding were not changed
        type: kubectl
        run: >-
          [ "$(kubectl get validatingadmissionpolicy require-owner-label -o jsonpath='{.metadata.uid}/{.metadata.generation}') $(kubectl get validatingadmissionpolicybinding require-owner-label -o jsonpath='{.metadata.uid}/{.metadata.generation}')" = "$(cat /var/tmp/cka-q1.policy)" ] && echo same || echo changed
        expect: { equals: same }
        weight: 1
      - id: q1-same
        description: ${Q1_APP} was not deleted or recreated
        type: kubectl
        run: >-
          [ "$(kubectl -n ${Q1_NS} get deployment ${Q1_APP} -o jsonpath='{.metadata.uid}')" = "$(cat /var/tmp/cka-q1.uid)" ] && echo same || echo recreated
        expect: { equals: same }
        weight: 1
    hints:
      - "No Pods at all means they were refused before they existed: kubectl -n ${Q1_NS} describe replicaset -l app=${Q1_APP} shows why."
      - kubectl get validatingadmissionpolicy,validatingadmissionpolicybinding, then read the expression of the policy with -o yaml.
      - The rule applies to Pods, so the change belongs in the Pod template, not in the Deployment's own metadata.
  - id: q2
    title: Enable AlwaysPullImages
    points: 6
    checks:
      - id: q2-active
        description: the API server rewrites imagePullPolicy to Always
        type: kubectl
        run: kubectl run admission-check --image=nginx:1.27-alpine --image-pull-policy=IfNotPresent --dry-run=server -o jsonpath='{.spec.containers[0].imagePullPolicy}' 2>&1
        expect: { equals: Always }
        weight: 4
        retrySeconds: 120
      - id: q2-kept
        description: NodeRestriction is still enabled
        type: kubectl
        run: grep -- '--enable-admission-plugins=' /etc/kubernetes/manifests/kube-apiserver.yaml
        expect: { contains: NodeRestriction }
        weight: 1
      - id: q2-healthy
        description: the API server is ready
        type: kubectl
        run: kubectl get --raw=/readyz
        expect: { equals: ok }
        weight: 1
        retrySeconds: 120
    hints:
      - "On controlplane, grep admission /etc/kubernetes/manifests/kube-apiserver.yaml. The flag takes a comma-separated list."
      - The kubelet watches that file and restarts the API server when it changes. If it never comes back, sudo crictl ps -a and the logs in /var/log/pods tell you why.
