id: kk2-ingress-to-httproute
title: Replace Ingress with HTTPRoute
domain: cluster-architecture
difficulty: 2
estimatedMinutes: 12
points: 8
tags: [gateway-api, httproute, ingress]
base: cluster
nodes: { controlPlane: 1, workers: 2 }
context: kubernetes-admin@kubernetes
settleSeconds: 60
variables:
  NS: { oneOf: [external, public, edge] }
  APP: { oneOf: [external-app, public-web, edge-api] }
setup:
  - node: controlplane
    script: setup/break.sh
    timeoutSeconds: 400
checks:
  - id: ingress-gone
    description: Ingress ${APP} is removed
    type: kubectl
    run: kubectl -n ${NS} get ingress ${APP} >/dev/null 2>&1 && echo present || echo gone
    expect: { equals: "gone" }
    weight: 1
  - id: route
    description: HTTPRoute ${APP}-route attaches to traefik-gateway
    type: kubectl
    run: kubectl -n ${NS} get httproute ${APP}-route -o jsonpath='{.spec.parentRefs[0].name}/{.spec.parentRefs[0].namespace}/{.spec.rules[0].backendRefs[0].name}'
    expect: { equals: "traefik-gateway/traefik/${APP}" }
    weight: 3
  - id: curl
    description: curl Host ${APP}.${NS}.lab on :30080 returns the page via HTTPRoute
    type: script
    node: controlplane
    script: checks/curl.sh
    expect: { equals: "ok" }
    weight: 3
    retrySeconds: 90
  - id: svc
    description: Service ${APP} still exists and HTTPRoute is in place
    type: kubectl
    run: kubectl -n ${NS} get httproute ${APP}-route >/dev/null 2>&1 && kubectl -n ${NS} get svc ${APP} -o jsonpath='{.spec.ports[0].port}' || echo missing
    expect: { equals: "80" }
    weight: 1
hints:
  - "Attach HTTPRoute parentRefs to Gateway traefik-gateway in namespace traefik (listener web)."
  - "Delete the Ingress after the route works. Test with curl -H 'Host: ...' http://controlplane:30080/"
