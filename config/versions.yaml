# Versions used by tools/build-base-images. Keep keys flat: build.sh parses this with awk.
# A two-part version (e.g. "1.36") resolves to the latest patch release at build time.
kubernetesVersion: "1.37.1"
kubernetesPreviousVersion: "1.36"
# Dynamic provisioning questions install this provisioner from the images (tools/build-base-images/node-extras.sh).
localPathProvisionerVersion: "v0.0.31"
calicoVersion: "v3.33.0"
# Ingress and Gateway API: Traefik serves both, on NodePort 30080 (HTTP) and 30443 (HTTPS).
gatewayApiVersion: "v1.6.3"
traefikChartVersion: "41.7.1"
helmVersion: "v4.3.0"
# HPA and VPA: metrics-server for the metrics API, Fairwinds chart for the Vertical Pod Autoscaler (VPA 1.7).
metricsServerChartVersion: "3.14.0"
vpaChartVersion: "5.1.0"
ubuntuRelease: "24.04"
# Must not overlap the Multipass network on macOS (192.168.64.0/24).
# tartNetwork: Tart VMs share the same vmnet subnet (192.168.64.0/24 by default), so the same rule applies.
podCidr: "10.244.0.0/16"
nodeCpus: "2"
nodeMemory: "2G"
nodeDisk: "20G"
